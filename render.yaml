# The shared testing copy, for Aigars and Ieva.
#
# Render Free, on purpose and with the consequence accepted by Ritvars on
# 25.09.2026: this phase is for validating the workflow and the screens, not for
# keeping records.
#
# FREE MEANS NO DISK. Render's own documentation: free web services cannot have a
# persistent disk, and without one "any changes you make to a service's local
# files are lost every time the service redeploys or restarts". The service also
# sleeps after 15 minutes with no traffic and takes about a minute to wake.
#
# So anything a tester types is gone on the next restart, redeploy or sleep. That
# is survivable only because the app rebuilds its own demo on an empty database -
# verified 25.09.2026 by booting against genuinely empty storage and watching 12
# people appear. The login page says so plainly, so nobody is surprised.
#
# The proper answer is PostgreSQL, and it is deliberately NOT being done now: the
# data layer is synchronous in 77 functions across 200 call sites, which is days
# of work, and it should happen after Ieva has validated the workflow rather than
# before. See docs/PRODUCTION_MIGRATION.md.
#
# DEMO DATA ONLY. This copy has one shared password, not sign-in, so the server
# refuses to start if CRM_ACCESS_PASSWORD is missing and refuses outright to load
# the real admissions export. Both refusals are tested in test/gate.test.js.
#
# Nothing secret is in this file. CRM_ACCESS_PASSWORD is marked sync:false, which
# means Render asks for it in the dashboard and never stores it in the repository.

services:
  - type: web
    name: academy-crm-test
    runtime: node
    plan: free               # no card, no disk, and no persistent storage
    region: frankfurt        # closest to Riga
    branch: v1-test          # the testing branch. master is the release line and is not deployed.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    # No disk block. Free cannot have one, and asking for it makes the deploy fail
    # rather than quietly cost money.
    envVars:
      - key: CRM_PUBLIC
        value: "1"           # turns the door on, and turns real data off
      - key: CRM_DB
        # /tmp, because it is the one path that always exists and is writable on a
        # fresh container. The repository's own data/ is gitignored and openDb does
        # not create directories, so the default path would fail on first boot.
        # This file does not survive a restart, which is the accepted trade.
        value: /tmp/crm.db
      - key: CRM_ACCESS_PASSWORD
        sync: false          # set in the Render dashboard. Never written down here.

      # --- sign-in -------------------------------------------------------
      # The shared password above is the DOOR on a published address. This is
      # who you are once you are through it, and the two are not the same thing.
      - key: CRM_AUTH
        value: "1"
      # Signs the session cookies. At least 24 characters. The server refuses to
      # start without it rather than signing with something guessable.
      - key: CRM_SESSION_SECRET
        sync: false

      # The accounts, recreated on every restart because CRM_DB above is /tmp and
      # does not survive one. src/bootstrap.js reads these at boot, creates only
      # the addresses written down in config/prototype.json, and NEVER touches an
      # account that already exists.
      #
      # ONLY THE NAMES ARE HERE. Every value is set in the Render dashboard, is
      # never logged, never rendered and never committed. If any one of them is
      # missing or too short the service REFUSES TO START and names the variable
      # - which is the point. Booting happily into a login screen that nobody can
      # get past looks healthy from outside and locks the testers out.
      - key: CRM_RITVARS_PASSWORD
        sync: false
      - key: CRM_AIGARS_PASSWORD
        sync: false
      - key: CRM_ADMISSIONS_PASSWORD
        sync: false

      - key: NODE_VERSION
        value: "24"          # node:sqlite needs a recent Node
