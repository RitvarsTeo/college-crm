// The animated sea, exactly as the kit wrote it, wrapped in a function so it runs
// when the gate is drawn rather than at load. NOTE: in a hidden browser pane rAF
// never fires, so the canvas simply stays on the gradient underneath - which is
// why the card is legible without it.
const LOGIN_SEA = () => {
  // The Client Hub sea, reused without retuning its wave parameters or colours.
  // It draws on a small canvas and lets CSS upscale it, keeping the login light.
  (() => {
    const cv = document.getElementById('login-sea');
    if (!cv?.getContext) return;
    const ctx = cv.getContext('2d', { alpha: false });
    if (!ctx) return;
  
    const TAU = Math.PI * 2;
    const OCT = [
      { ax: .9, ay: 3.3, amp: .46, spd: .24, sl: .05 },
      { ax: -2.2, ay: 6.9, amp: .40, spd: .46, sl: .28 },
      { ax: 4.1, ay: 12.7, amp: .33, spd: .76, sl: .85 },
      { ax: -7.3, ay: 22.3, amp: .23, spd: 1.14, sl: 1.20 },
      { ax: 12.9, ay: 37.1, amp: .14, spd: 1.63, sl: 1 },
      { ax: 19.7, ay: 8.3, amp: .11, spd: .62, sl: .30 },
    ];
    const AMPSUM = 1.42, REF = 1 / 420;
    let W = 0, H = 0, img, buf, quality = 1, raf = 0, last = 0, acc = 0, time = 0, cost = 0, samples = 0;
    const sA = [], cA = [], sB = [], cB = [];
    let vigX, vigY;
    const motion = matchMedia?.('(prefers-reduced-motion: reduce)');
  
    function allocate() {
      const vw = cv.clientWidth || 1, vh = cv.clientHeight || 1;
      const budget = (vw < 700 ? 105000 : 155000) * quality;
      W = Math.max(150, Math.round(Math.sqrt(budget * vw / vh)));
      H = Math.max(130, Math.round(budget / W));
      cv.width = W; cv.height = H; img = ctx.createImageData(W, H); buf = img.data;
      OCT.forEach((_, k) => { sA[k] = new Float32Array(W); cA[k] = new Float32Array(W); sB[k] = new Float32Array(H); cB[k] = new Float32Array(H); });
      vigX = new Float32Array(W); vigY = new Float32Array(H);
      for (let x = 0; x < W; x++) { const u = x / W - .5; vigX[x] = u * u * 1.35; }
      for (let y = 0; y < H; y++) { const v = y / H - .5; vigY[y] = v * v * .95; }
    }
  
    function render(t) {
      OCT.forEach((o, k) => {
        const ph = o.spd * t, kx = TAU * o.ax, ky = TAU * o.ay;
        for (let x = 0; x < W; x++) { const a = kx * x * REF + ph; sA[k][x] = Math.sin(a); cA[k][x] = Math.cos(a); }
        for (let y = 0; y < H; y++) { const b = ky * y * REF; sB[k][y] = Math.sin(b); cB[k][y] = Math.cos(b); }
      });
      let i = 0;
      for (let y = 0; y < H; y++) {
        const depth = .88 + .18 * y / H;
        for (let x = 0; x < W; x++) {
          const w = OCT.map((_, k) => sA[k][x] * cB[k][y] + cA[k][x] * sB[k][y]);
          const env = .52 + .48 * (w[0] * .5 + .5);
          const h = OCT[0].amp*w[0] + OCT[1].amp*w[1] + env*(OCT[2].amp*w[2] + OCT[3].amp*w[3] + OCT[4].amp*w[4] + OCT[5].amp*w[5]);
          let g = 0;
          OCT.forEach((o, k) => { const slope = cA[k][x]*cB[k][y] - sA[k][x]*sB[k][y]; g += o.amp*o.ay*o.sl*slope*(k < 2 ? 1 : env); });
          let p = h / AMPSUM * .5 + .5, q = p*p*(3-2*p); q = q*q*(3-2*q); p = p*.45 + q*.55;
          let r, green, blue;
          if (p < .52) { const f=p/.52; r=9+21*f; green=34+61*f; blue=68+82*f; }
          else { const f=(p-.52)/.48; r=30+102*f; green=95+108*f; blue=150+88*f; }
          if (p > .88) { let f=(p-.88)/.12; f=f*f*.9; r+=(243-r)*f; green+=(251-green)*f; blue+=(255-blue)*f; }
          let sparkle=g*.05; if (sparkle > 0) { sparkle=Math.min(1,sparkle); sparkle=sparkle*sparkle*sparkle*104; r+=sparkle; green+=sparkle*1.02; blue+=sparkle*.92; }
          const shade=depth*(1-(vigX[x]+vigY[y])*.58);
          buf[i]=Math.max(0,Math.min(255,r*shade)); buf[i+1]=Math.max(0,Math.min(255,green*shade)); buf[i+2]=Math.max(0,Math.min(255,blue*shade)); buf[i+3]=255; i+=4;
        }
      }
      ctx.putImageData(img,0,0);
    }
  
    function loop(now) {
      raf=requestAnimationFrame(loop); if (!last) { last=now; return; }
      let dt=Math.min(200,now-last); last=now; acc+=dt; if (acc < 33) return; acc=0; time+=dt/1000;
      const start=performance.now(); render(time); const spent=performance.now()-start;
      samples++; if (samples > 15) { cost+=spent; if (samples === 55) { if (cost/40 > 11 && quality > .55) { quality=.55; allocate(); } cost=0; samples=0; } }
    }
    function apply() {
      cancelAnimationFrame(raf);
      if (!cv.clientWidth || !cv.clientHeight) return;
      allocate();
      if (motion?.matches || document.hidden) render(6.2); else { last=0; acc=0; raf=requestAnimationFrame(loop); }
    }
    let resizeTimer;
    addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(apply,180)});
    document.addEventListener('visibilitychange',apply);
    motion?.addEventListener?.('change',apply);
    window.loginSeaApply=apply;
    apply();
  })();
  
};

/**
 * What the browser was told on the way back from Google, and it is deliberately
 * almost nothing: ?auth=google means a sign-in happened, ?error=not_authorised
 * means one did not. ONE sentence covers every cause - no account, wrong domain,
 * disabled, a bad token - because telling somebody which one they tripped is
 * telling them how to try again differently.
 *
 * Both are stripped from the address bar immediately, so a reload does not
 * re-show a message about something that already finished.
 */
function readReturnFromGoogle() {
  const q = new URLSearchParams(location.search);
  const error = q.get('error');
  const ok = q.get('auth') === 'google';
  if (error || ok) {
    history.replaceState(null, '', location.pathname + location.hash);
  }
  return { refused: error === 'not_authorised', signedIn: ok };
}

async function loadAuth() {
  // The server answers { auth, user }. This reads it into { on, user } - and the
  // two names not matching is exactly how the login screen silently never appeared
  // the first time this was opened, with CRM_AUTH=1 and the dropdown still there.
  try {
    const d = await (await fetch('/api/auth/me')).json();
    // The WHOLE answer is kept, with `on` added as an alias for `auth`. Listing
    // the fields by hand dropped one twice: first `auth` itself, so the login
    // never appeared, then `google`, so the button never appeared although the
    // server said it was configured. Nothing is transcribed field by field now.
    AUTH = { ...d, on: Boolean(d.auth), user: d.user || null };
  } catch { AUTH = { on: false, user: null }; }
  if (AUTH.user) ACTOR = AUTH.user.name;
  const picker = $('#actorBlock');
  const who = $('#whoBlock');
  if (AUTH.on && AUTH.user) {
    if (picker) picker.style.display = 'none';
    if (who) {
      who.style.display = '';
      $('#whoName').textContent = AUTH.user.name;
      $('#whoRole').textContent = AUTH.user.role;
    }
  } else if (picker) {
    picker.style.display = '';
    if (who) who.style.display = 'none';
  }
  const link = $('#navChannels');
  if (link) link.style.display = isAdmin() ? '' : 'none';
  return AUTH;
}

  const googleBlock = AUTH.google ? `

        ${GOOGLE_MARK}
        <span>Continue with Google</span>
      </a>
      <div class="or-divider" aria-hidden="true"><span>OR</span></div>` : '';

  box.innerHTML = `<div id="login-view">
    <canvas class="sea" id="login-sea" aria-hidden="true"></canvas>
    <div class="sea-scrim" aria-hidden="true"></div>
    <div class="gate-inner">

        <!-- Just CRM. The mark above the card already says NOVIKONTAS ACADEMY,
             so "Academy CRM" here said Academy twice on one screen. -->
        <h1>CRM</h1>
        <p class="sub">Sign in to continue</p>
        ${googleBlock}
        <div class="field email-field">
          <label for="liEmail">Email</label>
          <!-- NO type="email" ON PURPOSE, exactly as the kit has it. The field
               carries an @novikontas.org suffix, so what somebody types is their
               NAME. type="email" made the browser refuse "ritvars" as invalid and
               Sign in did nothing, which is the same fault the kit records against
               a required control it had collapsed. canonicalEmail() on the server
               completes a bare name to the company domain. -->
          <input id="liEmail" name="email" autocomplete="username" inputmode="email" required>
        </div>
        <!-- TWO STEPS, as in Client Hub (27.09.2026): the password is not presented until
             the email field is touched, so Google reads as the primary route. The kit's
             collapse: the input stays in the DOM, enabled, with no required attribute -
             revealLoginPassword() adds required only while it is visible, or a hidden
             required box makes Sign in do nothing and say nothing. -->
        <div class="field password-field" id="liPassField" aria-hidden="true">
          <div class="password-content">
            <label for="liPass">Password</label>
            <input id="liPass" name="password" type="password" autocomplete="current-password" tabindex="-1">
          </div>
        </div>
        <div id="loginErr" class="err${message ? '' : ' hidden'}" role="alert">${esc(message || '')}</div>
        <!-- THE BUTTON MUST BE LAST, and this is not a style preference.

             primary button is a WINDOW THROUGH THE CARD ONTO THE SEA. Anything
             placed after it takes the hole instead: the note sat in the window and
             the button sat on solid card, pale, with white text on it.
             The "forgotten your password" note that used to be here is gone - the
             kit does not have one on this card either. -->
        <button class="primary" type="submit" id="liGo">Sign in</button>
      </form>
    </div>
  </div>`;
  startLoginSea();
  wireLoginPassword(Boolean(message));
}

// Client Hub's rules, 27.09.2026. Focus on the email opens the password; leaving the
// email-and-password pair for anywhere else closes it again, but only while it is empty -
// a password that has something in it is never hidden, whoever put it there.
function revealLoginPassword(show) {
  const field = $('#liPassField'), pw = $('#liPass');
  if (!field || !pw) return;
  const on = Boolean(show) || pw.value !== '';
  field.classList.toggle('is-revealed', on);
  field.setAttribute('aria-hidden', on ? 'false' : 'true');
  pw.tabIndex = on ? 0 : -1;
  if (on) pw.setAttribute('required', ''); else pw.removeAttribute('required');
}
function wireLoginPassword(open) {
  const email = $('#liEmail'), pw = $('#liPass');
  if (!email || !pw) return;
  const pairHolds = (e) => e.relatedTarget === email || e.relatedTarget === pw;
  email.addEventListener('focus', () => revealLoginPassword(true));
  email.addEventListener('blur', (e) => { if (!pairHolds(e)) revealLoginPassword(false); });
  pw.addEventListener('blur', (e) => { if (!pairHolds(e)) revealLoginPassword(false); });
  pw.addEventListener('input', () => revealLoginPassword(true));
  pw.addEventListener('change', () => revealLoginPassword(true));
  // After a refused sign-in the password is wanted again, so it opens straight away.
  revealLoginPassword(open);
  // A password manager can fill the pair before any event fires.
  setTimeout(() => revealLoginPassword(false), 400);
}

async function doLogin(ev) {
  ev.preventDefault();
  const btn = $('#liGo');
  const err = $('#loginErr');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const r = await fetch('/api/auth/login', { method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: $('#liEmail').value, password: $('#liPass').value }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      err.textContent = data.error || 'That did not work.';
      err.classList.remove('hidden');
      $('#liPass').value = '';
      $('#liPass').focus();
      return false;
    }
    $('#loginScreen').remove();
    document.querySelector('.shell').style.display = '';
    const help = $('#helpBtn'); if (help) help.style.display = '';
    await loadAuth();
    // startShell, NOT route. route() alone leaves CFG empty, which is what made
    // the Admissions board render a heading above nothing after a form sign-in.
    await startShell();
  } finally { btn.disabled = false; btn.textContent = 'Sign in'; }
  return false;
}

// ---------------------------------------------------------------- routing --
async function route() {
  const hash = location.hash || '#/today';
  drawIcons();
  const here = hash.split('/').slice(0, 2).join('/');
  // Only the two renames. The technical screens are not in the navigation at all,
  // so nothing needs to light up for them.
  const ALIAS = { '#/car': '#/inbox', '#/pipeline': '#/admissions' };
  const lit = ALIAS[here] || here;
  document.querySelectorAll('nav a.item').forEach(a => a.classList.toggle('on', a.getAttribute('href') === lit));
  const [, page, arg] = hash.split('/');
  fbClose();                       // the help panel never survives a move to another screen
  try {
    // Concept C is the main UI: its router draws every screen, borrowing the classic
    // ones where C has not replaced them yet. ?ui=classic skips this entirely.
    if (UI === 'c') { markCNav(page); await routeC(page, arg); refreshBadge(); drawFeedbackBadge(); return; }
    // The names people use. The old ones still resolve so a link in a note,
    // a feedback report or somebody's bookmark does not break.
    // The Console is a separate page at /console and is deliberately unreachable
    // from here. The CRM is the product; it carries no way into our tooling.
    if (page === 'admissions' || page === 'pipeline') await viewAdmissions();
    else if (page === 'feedback') await viewFeedback();
    else if (page === 'people') await viewPeople();
    else if (page === 'inbox' || page === 'car') await viewInbox();
    else if (page === 'funnel' || page === 'metrics') await viewReports();
    else if (page === 'history') await viewHistory();
    else if (page === 'person') await viewPerson(arg);
    else if (page === 'followup') await viewFollowup();
    // Channel research, the event inspector, the raw intake screens and the privacy
    // notes are OUR tooling. They are not routed here at all: the product has no
    // path to them, by design. They live with the Console.
    else if (page === 'metrics') await viewReports();
    else if (page === 'channels') await viewChannels(arg);
    else if (page === 'privacy') await viewPrivacy();
    else if (page === 'reports') await viewReports();
    else await viewToday();
  } catch (e) {
    // 'not found' usually means the page in front of somebody is older than the
    // database behind it. Saying so is more use than the word 'failed'.
    $('#view').innerHTML = e.message === 'not found'
      ? `<h1>Not here any more</h1>
         <div class="prov">This record is not in the database any more. This page may have been
         open since before the data changed. Going back to Today will reload it.</div>
         <button class="btn" onclick="location.hash='#/today'">Back to Today</button>`
      : `<div class="err">Failed to load: ${esc(e.message)}</div>`;
  }
  refreshBadge();
  drawFeedbackBadge();
}
// The overdue count, held in one place.

// The sidebar badge showed `s.overdue.length` while the Today heading showed the
// rows in whichever tab happened to be selected. So the screen said "Today 1" in
// the sidebar and "Today - 5" in the heading at the same moment, and the heading
// changed meaning every time somebody clicked a tab. Two numbers, both unlabelled,
// neither the same thing. Both now read this.
let OVERDUE = 0;

async function refreshBadge() {
  try {
    const s = await api('/api/summary');
    OVERDUE = s.overdue.length;
    const el = $('#navOverdue');
    if (OVERDUE) { el.textContent = OVERDUE; el.style.display = ''; } else el.style.display = 'none';
  } catch {}
  try {
    const i = await api('/api/intake');
    const el = $('#navIntake');
    // The count is a nudge, and a nudge belongs to whoever owns the queue.
    // Ieva can still open CAR and look - nothing is hidden - but the intake is
    // Marketing's work and must not sit in her sidebar asking to be done.
    const ownsIntake = myRole() === (CFG.routing || {}).unclear || (CFG.admins || []).includes(ACTOR);
    if (i.counts.new && ownsIntake) {
      el.textContent = i.counts.new;
      el.className = 'pill ' + (i.counts.aged ? 'late' : 'warn');
      el.title = i.counts.aged ? `${i.counts.aged} waiting since yesterday` : 'waiting to be looked at';
      el.style.display = '';
    } else el.style.display = 'none';
  } catch {}
  drawWaiting();
}

// What to put at the top of the list. It is a SUGGESTION: the whole grouped list
// stays underneath and anything can be picked. The rules live in config, because
// the right first move is Admissions business and not a decision for this file.
function suggestNextAction(item, interest) {
  const rules = CFG.suggestedNextAction || {};
  const idOf = (id) => {
    for (const g of (CFG.nextActions || [])) for (const i of g.items) if (i.id === id) return i.label;
    return null;
  };
  const question = (item.fields || []).find(f => f.field === 'question');
  const byQ = question && (rules.byQuestion || {})[String(question.value)];
  if (byQ) return { label: idOf(byQ), why: `they asked about ${question.value}` };
  const byC = (rules.byChannel || {})[item.channel];
  if (byC) return { label: idOf(byC), why: `it came in by ${channelLabel(item.channel)}` };
  if (interest) return { label: idOf(rules.whenProgrammeKnown), why: 'we know what they want to study' };
  return { label: idOf(rules.whenNothingKnown), why: 'nobody can tell what they want yet' };
}

// The suggestion sits at the top, already chosen, above the full list.
function nextActionOptionsWithSuggestion(suggested) {
  const rest = nextActionOptions(null);
  if (!suggested || !suggested.label) return rest;
  return `<optgroup label="Suggested">
      <option value="${esc(suggested.label)}" selected>${esc(suggested.label)}</option>
    </optgroup>` + rest;
}

function nextActionOptions(selectedLabel) {
  const groups = CFG.nextActions || [];
  const opts = groups.map(g => `<optgroup label="${esc(g.group)}">` +
    g.items.map(i => `<option value="${esc(i.label)}" data-days="${i.days}" data-drives="${esc(i.drives)}"
      ${i.label === selectedLabel ? 'selected' : ''}>${esc(i.label)}</option>`).join('') + '</optgroup>').join('');
  return opts;
}
function daysForAction(label) {
  for (const g of (CFG.nextActions || [])) for (const i of g.items) if (i.label === label) return i.days;
  return 2;
}
function drivesFor(label) {
  for (const g of (CFG.nextActions || [])) for (const i of g.items) if (i.label === label) return i.drives;
  return null;
}
const DRIVES_LABEL = { visit: 'drives towards a visit', application: 'drives towards the application and documents', payment: 'drives towards payment', info: 'information' };
function onNextActionChange(selId, dateId, hintId) {
  const sel = document.querySelector('#' + selId);
  const label = sel.value;
  const d = new Date(Date.now() + daysForAction(label) * 86400000);
  const date = document.querySelector('#' + dateId);
  if (date) date.value = fmtDate(d);                 // the Riga day, like todayStr()
  const hint = document.querySelector('#' + hintId);
  if (hint) hint.textContent = DRIVES_LABEL[drivesFor(label)] || '';
}

// Today is a work queue, not a dashboard. You pick which queue you are working,
// then you go through it ONE PERSON AT A TIME. Next, previous, swipe, act.
// Nothing else is on the screen, because everything else is somewhere else.
let TODAY_ORDER = null;
let TODAY_AT = 0;      // which queue
let TODAY_ITEM = 0;    // which person inside it

function todayOrder(serverOrder) {
  if (TODAY_ORDER) return TODAY_ORDER;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('crmTodayOrder') || 'null'); } catch {}
  const ok = Array.isArray(saved) && saved.length === serverOrder.length
    && serverOrder.every(id => saved.includes(id));
  TODAY_ORDER = ok ? saved : serverOrder.slice();
  return TODAY_ORDER;
}

function todayPickQueue(i) {
  TODAY_AT = i; TODAY_ITEM = 0;
  try { localStorage.setItem('crmTodayQueue', String(i)); } catch {}
  viewToday();
}
function todayStep(delta, count) {
  if (!count) return;
  TODAY_ITEM = (TODAY_ITEM + delta + count) % count;
  viewToday();
}

// What this one person needs, said in one line, with one button that does it.
function todayCard(g, item) {
  // One queue, two reasons for being in it. The row says which, because a step we
  // planned is marked done and a message they sent is answered.
  if (g.id === 'waiting') {
    const wrote = item.why === 'reply' || item.why === 'both';
    const planned = item.why === 'step' || item.why === 'both';
    const tag = (text, title) => `<span class="why" title="${esc(title)}">${esc(text)}</span>`;
    return {
      name: item.name,
      line: (planned ? esc(item.label) : esc(String(item.subject || 'They wrote to us')))
        + ' ' + (item.why === 'both'
          ? tag('they also wrote', 'A step is due AND they have written since. Both are waiting on us.')
          : wrote ? tag('they wrote', 'They sent this and nothing has gone back yet.')
          : tag('we planned this', 'A next step somebody planned, now due.')),
      meta: planned ? dueText(item.due_at)
        : `${channelLabel(item.channel || item.source_channel)} &middot; ${fmtDateTime(item.occurred_at)}`,
      open: `#/person/${item.person_id}`,
      action: planned
        ? `<button class="btn" onclick="event.stopPropagation();openComplete(${item.taskId},'${esc(item.label)}')">Mark done</button>`
        : `<button class="btn" onclick="event.stopPropagation();openNote('${item.person_id}','note')">Write what happened</button>`,
    };
  }
  if (g.id === 'new_leads') {
    return {
      name: item.name,
      line: item.programme ? `Wants ${esc(item.programme)}` : 'Has not said what they want yet',
      meta: `${channelLabel(item.source_channel)} &middot; arrived ${fmtDate(item.created_at)}`,
      open: `#/person/${item.id}`,
      action: `<button class="btn" onclick="event.stopPropagation();openNote('${item.id}','call')">Log a call</button>`,
    };
  }
  return {
    name: item.name,
    line: 'Nobody has planned the next step',
    meta: `${esc(item.status || '')} &middot; ${channelLabel(item.source_channel)}`,
    open: `#/person/${item.id}`,
    action: `<button class="btn" onclick="event.stopPropagation();openNewTask('${item.id}')">Plan the next step</button>`,
  };
}

// Today has two views of the same queue. The table is the one people work in,
// because a manager wants the overview and not a card at a time; the card view
// is kept because it is the better shape on a phone and some people prefer it.
let TODAY_VIEW = 'table';
try { TODAY_VIEW = localStorage.getItem('crmTodayView') || 'table'; } catch {}
function setTodayView(v) {
  TODAY_VIEW = v;
  try { localStorage.setItem('crmTodayView', v); } catch {}
  viewToday();
}

// Whose day is this? Today names one person at the top, so by default it shows
// that person's work. It used to show everybody's under that heading, which is
// why the sidebar said one number and this screen said a bigger one.
let TODAY_SCOPE = 'mine';
try { TODAY_SCOPE = localStorage.getItem('crmTodayScope') || 'mine'; } catch {}
function setTodayScope(v) {
  TODAY_SCOPE = v;
  try { localStorage.setItem('crmTodayScope', v); } catch {}
  TODAY_ITEM = 0;
  viewToday();
}

async function viewToday() {
  const t = await api('/api/today' + (TODAY_SCOPE === 'all' ? '?scope=all' : ''));
  await refreshBadge();          // so the heading and the sidebar cannot disagree
  const order = todayOrder(t.order);
  const byId = Object.fromEntries(t.groups.map(g => [g.id, g]));
  const groups = order.map(id => byId[id]).filter(Boolean);

  if (TODAY_AT === 0) {
    try { const saved = Number(localStorage.getItem('crmTodayQueue')); if (saved >= 0 && saved < groups.length) TODAY_AT = saved; } catch {}
  }
  if (TODAY_AT >= groups.length) TODAY_AT = 0;
  const g = groups[TODAY_AT];
  const items = g.rows;
  if (TODAY_ITEM >= items.length) TODAY_ITEM = 0;

  const picker = groups.map((x, i) => `<button class="dot ${i === TODAY_AT ? 'on' : ''}"
    onclick="todayPickQueue(${i})"><span>${esc(x.label)}</span>${
      (t.marks || {})[x.id] ? `<span class="tabmark">${esc(t.marks[x.id])}</span>` : ''
    }${x.open ? `<b>${x.open}</b>` : ''}</button>`).join('');

  const empty = `<div class="card deck"><div class="done">
      <div class="tick-big">&#10003;</div>
      ${g.done ? `All ${g.total} done today.` : 'Nothing waiting here.'}
      <div class="sub" style="margin-top:6px">${esc(t.descriptions[g.id] || '')}</div>
    </div></div>`;

  let body;
  if (!items.length) {
    body = empty;
  } else if (TODAY_VIEW === 'table') {
    body = `<div class="card"><table class="cartable"><thead><tr>
        <th>Who</th><th>What they need</th><th>When</th><th></th></tr></thead>
      <tbody>${items.map((item) => {
        const c = todayCard(g, item);
        return `<tr class="row" tabindex="0" onclick="location.hash='${c.open}'">
          <td><b>${esc(c.name)}</b></td>
          <td>${c.line}</td>
          <td>${c.meta}</td>
          <td class="act">${c.action}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  } else {
    const item = items[TODAY_ITEM];
    const c = todayCard(g, item);
    body = `<div class="card deck" id="deck">
      <div class="deckhead">
        <button class="nav" onclick="todayStep(-1,${items.length})" title="previous" ${items.length < 2 ? 'disabled' : ''}>&#8249;</button>
        <div class="counter">${TODAY_ITEM + 1} of ${items.length}</div>
        <button class="nav" onclick="todayStep(1,${items.length})" title="next" ${items.length < 2 ? 'disabled' : ''}>&#8250;</button>
      </div>
      <div class="one" onclick="location.hash='${c.open}'">
        <h2>${esc(c.name)}</h2>
        <p class="oneline">${c.line}</p>
        <p class="onemeta">${c.meta}</p>
      </div>
      <div class="oneact">
        ${c.action}
        <a class="tilelink" href="${c.open}">Open the record &rarr;</a>
      </div>
    </div>`;
  }

  $('#view').innerHTML = `
  <div class="todayhead">
    <div><h1 style="margin:0">Today${OVERDUE ? ` &middot; ${OVERDUE} overdue` : ''}</h1></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      ${t.role ? `<div class="viewswitch" title="Whose work to show. The sidebar count follows the same choice.">
        <button class="${TODAY_SCOPE === 'mine' ? 'on' : ''}" onclick="setTodayScope('mine')">${esc(t.role)}</button>
        <button class="${TODAY_SCOPE === 'all' ? 'on' : ''}" onclick="setTodayScope('all')">Everyone</button>
      </div>` : ''}
      <button class="btn sm ghost" onclick="setTodayView('${TODAY_VIEW === 'table' ? 'card' : 'table'}')"
        title="Switch how this list is laid out">${TODAY_VIEW === 'table' ? 'One at a time' : 'Table'}</button>
    </div>
  </div>
  <div class="swipe">${picker}</div>
  ${body}`;

  const deck = document.querySelector('#deck');
  if (deck && items.length > 1) {
    let x0 = null;
    deck.addEventListener('touchstart', (e) => { x0 = e.changedTouches[0].clientX; }, { passive: true });
    deck.addEventListener('touchend', (e) => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 50) todayStep(dx < 0 ? 1 : -1, items.length);
      x0 = null;
    }, { passive: true });
  }
}

function funnelHtml(byStage) {
  const map = Object.fromEntries(byStage.map(r => [r.status, r.n]));
  const max = Math.max(1, ...byStage.map(r => r.n));
  return (CFG.stages || []).map(st => {
    const n = map[st.id] || 0;
    return `<div style="display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin-bottom:6px">
      <div style="font-size:13px">${esc(st.label)}</div>
      <div class="bar"><i style="width:${Math.round(n / max * 100)}%;background:${st.colour}"></i></div>
      <div style="font-size:13px;text-align:right">${n}</div></div>`;
  }).join('');
}

async function viewPeople() {

  // controls were announced as unlabelled - visually captioned, programmatically

      <a class="tilelink" href="#/person/${esc(r.id)}">Open the full record &rarr;</a>
      <span class="sub2" style="margin-left:auto">Saved as ${esc(ACTOR)}. Every change is written to the history.</span>

  $('#view').innerHTML = `

    <div><h1 style="margin:0">People &middot; ${data.count}</h1></div>
    <a class="tilelink" href="#/admissions">Open Admissions &rarr;</a>
  </div>
  <div class="filters">
    ${field('Search', `<input id="fq" placeholder="name, email, phone, programme, source, id" value="${esc(STATE.q)}" style="min-width:290px">`)}
    ${field('Stage', `<select id="fstatus" onchange="setFilter('status', this.value)">${opt((CFG.stages || []).map(s => s.id), STATE.status)}</select>`)}
    ${field('Next step', `<select id="fdue" onchange="setFilter('due', this.value)">
      <option value="">all</option>
      <option value="overdue" ${STATE.due === 'overdue' ? 'selected' : ''}>overdue</option>
      <option value="none" ${STATE.due === 'none' ? 'selected' : ''}>without a next step</option></select>`)}
    <div class="flab"><span></span><button class="btn ghost" onclick="setMoreFilters(${MORE_FILTERS ? 'false' : 'true'})">${
      MORE_FILTERS ? 'Fewer filters' : 'More filters' + (extraFilterCount() ? ' (' + extraFilterCount() + ')' : '')}</button></div>
    ${anyFilter() ? `<div class="flab"><span></span><button class="btn ghost" onclick="clearFilters()">Clear</button></div>` : ''}
  </div>
  ${MORE_FILTERS ? `<div class="filters">
    ${field('Programme', `<select id="fprog" onchange="setFilter('programme', this.value)">${opt(CFG.programmes || [], STATE.programme)}</select>`)}
    ${field('Nationality', `<select id="fnat" onchange="setFilter('nationality', this.value)">${opt(CFG.nationalities || [], STATE.nationality)}</select>`)}
    ${field('Owner', `<select id="fowner" onchange="setFilter('owner', this.value)">${opt(CFG.owners || [], STATE.owner)}</select>`)}
    ${field('Came from', `<select id="fsource" onchange="setFilter('source', this.value)">${
      ['<option value="">all</option>'].concat(Object.keys(CFG.channels || {}).map(v =>

    <td class="act"><button class="btn sm ghost" title="change what we know without leaving this list"
      onclick="event.stopPropagation();setQuickEdit('${esc(r.id)}')">Edit</button></td></tr>
    ${QUICK_EDIT === r.id ? quickRow(r) : ''}`).join('')}</tbody></table>`
  : '<div class="empty">No record matches the filters. <a href="#" onclick="clearFilters();return false">Clear the filters</a></div>'}
  </div>`;
  $('#fq').oninput = debounce(e => { STATE.q = e.target.value; viewPeople(); }, 250);
}

function setFilter(key, value) { STATE[key] = value; QUICK_EDIT = null; viewPeople(); }
function setQuickEdit(id) { QUICK_EDIT = QUICK_EDIT === id ? null : id; viewPeople(); }

// Saved exactly as the person page saves it, so the same field policy applies and
// the same history entries are written. Only the screen is different.
async function quickSave(id) {
  const patch = {};
  for (const [key] of EDIT_FIELDS) {
    const el = document.querySelector('#q_' + key);
    if (el) patch[key] = el.value;
  }
  const note = (document.querySelector('#q_note') || {}).value || '';
  try {
    await post(`/api/people/${id}/edit`, patch);
    if (note.trim()) await post(`/api/people/${id}/note`, { kind: 'note', body: note.trim() });
    QUICK_EDIT = null;
    viewPeople();
  } catch (err) {
    const box = document.querySelector('#qeErr');
    if (box) box.innerHTML = `<div class="err" style="margin-top:10px">${esc(err.message)}</div>`;
  }
}

function sortBy(k) { if (STATE.sort === k) STATE.dir = STATE.dir === 'asc' ? 'desc' : 'asc'; else { STATE.sort = k; STATE.dir = 'asc'; } viewPeople(); }
function clearFilters() { Object.assign(STATE, { q: '', status: '', programme: '', owner: '', source: '', nationality: '', due: '' }); QUICK_EDIT = null; MORE_FILTERS = false; viewPeople(); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function latestConsents(rows) {
  const seen = new Map();
  for (const r of rows) if (!seen.has(r.purpose)) seen.set(r.purpose, r);  // rows arrive newest first
  return [...seen.values()];
}

// ONE work queue. Aigars: "Butiba CAR sadala ir jabut tikai To look at" - the
// Inbox is leads to be processed and nothing else. There were three boards here
// (To look at, Done, Not relevant) and "Done" was a second place a person could
// sit and be forgotten, which is the fault he actually reported: "sanak es
// izdaru 2 solus bet nekas nenotiek".
//
// Nothing is lost by removing them. A qualified person is in Admissions and in
// People, where the work continues. An archived item stays in the database and
// is readable from the Console, which is our tooling and not the product.
// What replaces the Done board is LAST_RESULT below: after qualifying, the Inbox
// says where the person went and what happens next, instead of the row silently
// disappearing.
let LAST_RESULT = null;

async function viewInbox() {
  const d = await api('/api/intake?state=new');
  const val = (r, field) => {
    const f = r.fields.find(x => x.field === field);
    return f ? fieldCell(f) : '<span class="muted">-</span>';
  };

  // The whole row opens it. A single small button at the far right made people aim
  // for a target the width of two words, when the obvious thing to click is the
  // person's name.
  const row = (r) => `<tr class="row ${r.aged ? 'aged' : ''} clicky" tabindex="0"
      onclick="openQualify(${r.id})" title="Open it and decide what it is">
    <td><b>${esc(r.contact_name || r.contact_handle || 'Unknown')}</b>
      <div class="sub2">${esc(r.contact_handle || r.contact_phone || r.contact_email || '')}</div></td>
    <td>${esc(channelLabel(r.channel))}</td>
    <td title="${esc(r.suggestion_why || '')}">${val(r, 'interest')}</td>
    <td>${val(r, 'question')}</td>
    <td>${fmtDateTime(r.received_at)}
      ${r.aged ? '<div class="sub2 late" title="waiting since 09:00 yesterday">late</div>' : ''}</td>
  </tr>`;

  // What used to be the Done board. It answers the three things Aigars could not
  // see - where they went, what they want, what happens next - and then clears,
  // because it is a receipt and not a place.
  const banner = () => {
    const L = LAST_RESULT; LAST_RESULT = null;
    if (!L) return '';
    if (L.archived) {
      return `<div class="done-strip">Marked not relevant: <b>${esc(L.who)}</b>${
        L.reason ? ' &middot; ' + esc(L.reason) : ''}</div>`;
    }
    const due = L.dueAt ? fmtDate(L.dueAt) : null;
    return `<div class="done-strip ok">
      <b>${esc(L.name)}</b> is now in Admissions${L.status ? ' &middot; ' + esc(L.status) : ''}${
        L.programme ? ' &middot; ' + esc(L.programme) : ''}.
      ${L.next ? `Next: ${esc(L.next)}${due ? ' by ' + due : ''}.` : ''}
      <a href="#/person/${esc(L.id)}">Open</a></div>`;
  };

  $('#view').innerHTML = `
  <div class="todayhead">
    <div><h1 style="margin:0">Inbox${d.rows.length ? ' &middot; ' + d.rows.length : ''}</h1></div>
    <a class="tilelink" href="#/admissions">Go to Admissions &rarr;</a>
  </div>

  ${banner()}

  <div class="card">
  ${d.rows.length ? `<table class="cartable"><thead><tr>
      <th>Who</th><th>Where from</th><th>Wants to study</th><th>Asked about</th>
      <th>Arrived</th></tr></thead>
    <tbody>${d.rows.map(row).join('')}</tbody></table>`
  : '<div class="empty">Nothing waiting. This queue is clear.</div>'}
  </div>`;
}

async function doQualify(id, opts = {}) {
  const confirmFields = [...document.querySelectorAll('.qConfirm:checked')].map(c => c.value);
  const interest = (document.querySelector('#qInterest') || {}).value || '';
  const nextAction = (document.querySelector('#qNext') || {}).value || '';
  const qualification = interest ? 'lead' : 'unclear';
  const note = (document.querySelector('#qNote') || {}).value || '';
  const body = { qualification, createPerson: true, note, confirmFields, nextAction,
    stated: interest ? { interest } : {}, ...opts };
  try {
    const r = await post(`/api/intake/${id}/qualify`, body);
    closeModal();
    if (r.handoverGap) alert(`${r.handoverGap.problem}\n\n${r.handoverGap.action}`);
    LAST_RESULT = r.landed || null;      // the Inbox shows where they went
    viewInbox();
  } catch (e) {
    // a refused save keeps everything typed, and a duplicate answers with names
    if (e.detail && e.detail.duplicate) return showDuplicate(id, e.detail, { interest, nextAction, note, confirmFields });
    $('#qErr').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

// The duplicate rule, made understandable. It refuses and then shows WHO it
// thinks this already is, so the operator either opens that person, attaches the
// message to them, or says outright that it is somebody else.
function showDuplicate(id, detail, kept) {
  const row = (m) => `<div class="dupe">
    <div><b>${esc(m.name)}</b>
      <div class="sub2">${[m.email, m.phone].filter(Boolean).map(esc).join(' &middot; ') || 'no email or phone'}</div>
      <div class="sub2">${esc(m.status || '')}${m.owner ? ' &middot; ' + esc(m.owner) : ''}
        &middot; matched on ${m.matchedOn.map(esc).join(' and ')}</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn sm" onclick="doQualify(${id}, { personId: '${esc(m.id)}', createPerson: false })">
        This is them</button>
      <a class="btn sm ghost" href="#/person/${esc(m.id)}" onclick="closeModal()">Open</a>
    </div></div>`;
  $('#qErr').innerHTML = `
    <div class="warn-box" style="margin-top:12px">
      <b>${detail.strong ? 'We already have this person.' : 'This may be somebody we already have.'}</b>
      ${detail.strong ? 'The email or phone number is the same.' : 'Only the name matches, so it could be two different people.'}
      Nothing has been saved.
    </div>
    ${detail.matches.map(row).join('')}
    <div style="margin-top:10px">
      <button class="btn sm ghost" onclick="doQualify(${id}, { differentPerson: true })">
        No, this is a different person</button>
    </div>`;
}

function doExport(fmt = 'csv') {
  const picked = [...document.querySelectorAll('.xsec:checked')].map(c => c.value);
  if (!picked.length) { const e = $('#xErr'); if (e) e.innerHTML = '<div class="err">Tick at least one section.</div>'; return; }
  RPT_PICK = new Set(picked);
  const qs = new URLSearchParams();
  if (RPT.from) qs.set('from', RPT.from);
  if (RPT.to) qs.set('to', RPT.to);
  qs.set('sections', picked.join(','));
  closeModal();
  const ext = { xlsx: 'xlsx', gsheet: 'gsheet' }[fmt] || 'csv';
  if (ext === 'gsheet') { window.open('/api/report.gsheet?' + qs, '_blank', 'noopener'); return; }
  window.location.href = `/api/report.${ext}?` + qs;
}

// Periods are Riga calendar days, and the server reads them as Riga days too.
function monthStartISO(d = new Date()) { return fmtDate(d).slice(0, 7) + '-01'; }
function setPeriod(from, to) { RPT = { from, to }; viewReports(); }
async function setPeriodPreset(which) {
  const now = new Date();
  const [y, m] = todayStr().split('-').map(Number);
  if (which === 'month') return setPeriod(monthStartISO(now), '');
  if (which === 'last') {
    // calendar arithmetic on the Riga year and month; Date.UTC only does the rollover
    const s = new Date(Date.UTC(y, m - 2, 1)).toISOString().slice(0, 10);
    const e = new Date(Date.UTC(y, m - 1, 0)).toISOString().slice(0, 10);
    return setPeriod(s, e);
  }
  if (which === 'year') return setPeriod(y + '-01-01', '');
  // Everything: from the earliest date the data holds. It used to send no dates, and the
  // server reads no dates as THIS MONTH, so "Everything" showed one month (28.09.2026).
  const rows = ((await api('/api/people')) || {}).rows || [];
  const days = rows.flatMap((p) => [p.created_at, p.admitted_at]).filter(Boolean).map((d) => fmtDate(d)).filter(Boolean).sort();
  return setPeriod(days[0] || todayStr(), '');
}

async function runSim(channelId, scenario) {
  try {
    const r = await post('/api/sim/' + channelId + '/run', { scenario });
    LASTRUN[channelId] = r;
    SIM = null; SIMSEL = channelId;
    await viewIntegrations(channelId);
  } catch (e) { alert('Failed: ' + e.message); }
}

async function runOut(channelId) {
  const last = LASTRUN[channelId];
  if (!last || !last.personId) return alert('Run an inbound test first, so there is something to reply to.');
  try {
    const r = await post('/api/sim/' + channelId + '/outbound', { personId: last.personId });
    LASTRUN[channelId] = Object.assign({}, r, { personId: last.personId });
    SIM = null;
    await viewIntegrations(channelId);
  } catch (e) { alert('Failed: ' + e.message); }
}

// ------------------------------------------------------------ admin: channels --
//
// Four questions and nothing else: what channels exist, what is missing, what is
// working, what is broken.
//
// Everything on this screen comes from the server. Nothing is computed here, and
// in particular NOTHING here decides that a channel is connected - that word is
// the server's to use, and it uses it only when a provider has really arrived.
//
// No secret value is ever on this screen. The NAME of a setting is, and the word
// OK or MISSING. There is a test that greps the module's payload for the values,
// and another that greps the response the browser actually receives.

const CH_ORDER = ['ERROR', 'NOT CONFIGURED', 'CONFIGURED', 'CONNECTED'];
const chClass = (state) => 's-' + String(state).toLowerCase().replace(/[^a-z]/g, '');

function chSettings(list) {
  if (!list || !list.length) return '<span class="prov">Nothing to set up.</span>';
  return list.map(x => `<span class="setting ${x.present ? '' : 'miss'}">${esc(x.name)} ${x.present ? 'OK' : 'MISSING'}</span>`).join('');
}

const chStep = (st) => `<li>${st.ok ? '<span class="ok-tick">OK</span>' : '<span class="no-tick">FAILED</span>'}
  ${esc(st.name)} <span class="prov">${esc(st.note || '')}</span></li>`;

  const d = await api('/api/admin/channels');
  const rows = [...d.channels].sort((a, b) =>
    CH_ORDER.indexOf(a.state) - CH_ORDER.indexOf(b.state) || a.label.localeCompare(b.label));

          <td><span class="chstate ${chClass(c.state)}">${esc(c.state)}</span></td>
          <td>${c.live ? '<span class="pill ok">ON</span>' : '<span class="pill calm">off</span>'}</td>
          <td>${chSettings(c.settings)}</td>

async function runChannelCheck(id) {
  const btn = $('#chCheck');
  const out = $('#chResult');
  btn.disabled = true; btn.textContent = 'Checking...';
  try {
    const r = await post('/api/admin/channels/' + encodeURIComponent(id) + '/check');
    if (r.skipped) { out.innerHTML = `<div class="prov">${esc(r.why)}</div>`; return; }
    out.innerHTML = `
      <span class="${r.ok ? 'pill ok' : 'pill warn'}">${r.ok ? 'Every step passed' : 'It failed'}</span>
      <ul class="steps">${(r.steps || []).map(chStep).join('')}</ul>
      ${r.ok ? `<div class="footnote" style="margin-top:6px">This proves ${esc(r.proves || '')}.
        It does NOT prove ${esc(r.doesNotProve || '')}.</div>` : ''}`;
  } catch (e) {
    out.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = 'Run the check'; }
}

async function setChannelMode(id, mode) {
  const out = $('#chMode');
  if (mode !== 'off' && !confirm(
      'Switch ' + id + ' ON?\n\nIt will start accepting real events from the provider.')) return;
  try {
    await post('/api/admin/channels/' + encodeURIComponent(id) + '/mode', { mode });
    await viewChannel(id);
  } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

// Backlog 9. The locked fields are shown, greyed, with the reason - so the rule

const EDIT_FIELDS = [
  ['name', 'Full name', 'text'],
  ['email', 'Email', 'text'],
  ['phone', 'Phone', 'text'],
  ['programme', 'Programme', 'programme'],
  ['study_form', 'Study form', 'studyForm'],
  ['education', 'Education', 'education'],
  ['nationality', 'Nationality', 'nationality'],
  ['owner', 'Owner', 'owner'],
  ['notes', 'Notes', 'textarea'],
];

function selectFor(kind, value) {
  const list = kind === 'programme' ? (CFG.programmes || [])
    : kind === 'studyForm' ? (CFG.studyForms || [])
    : kind === 'education' ? (CFG.education || [])
    : kind === 'nationality' ? (CFG.nationalities || [])
    : (CFG.owners || []);
  // A value from the old sheet that is not in the list ("NOT DECIDED", "FULL TIME") is
  // kept as its own option. Left out, the select showed "-", and saving the Edit dialog
  // for ANY reason erased it - found 28.09.2026 on a copy of the real data.
  const cur = String(value || '');
  const all = cur && !list.includes(cur) ? list.concat([cur]) : list;
  return ['<option value="">-</option>'].concat(all.map(v =>
    `<option ${cur === v ? 'selected' : ''}>${esc(v)}</option>`)).join('');
}

async function openEdit(id) {
  const p = await api('/api/people/' + id);
  const policy = await api('/api/people/fields');
  const row = ([key, label, kind]) => {
    const v = p[key] == null ? '' : String(p[key]);
    const input = kind === 'textarea'
      ? `<textarea id="e_${key}" rows="2">${esc(v)}</textarea>`
      : kind === 'text'
        ? `<input id="e_${key}" value="${esc(v)}">`
        : `<select id="e_${key}">${selectFor(kind, v)}</select>`;
    return `<div><label>${esc(label)}</label>${input}</div>`;
  };
  const locked = Object.entries(policy.immutable).filter(([k]) =>
    ['source_channel', 'source_campaign', 'created_at'].includes(k));
  modal('Edit record', `
    <div class="grid2">${EDIT_FIELDS.map(row).join('')}</div>
    <div class="prov" style="margin-top:12px"><b>Locked, and not editable here:</b><br>
      ${locked.map(([k, why]) => `${esc(k)} - ${esc(why)}`).join('<br>')}<br>
      Owner decision of 23.09.2026. Every change below is written to the history with the old
      value, the new value and who made it.</div>
    <div id="eErr" class="err" style="display:none;margin-top:10px"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn" onclick="saveEdit('${p.id}')">Save</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
    </div>
    <div class="prov" style="margin-top:10px">Saving as <b>${esc(ACTOR)}</b>. ${AUTH.user
      ? 'That is the account signed in, and it is the name the history will carry.'
      : 'There is no login, so this is the name the history will carry, not a verified identity.'}</div>`);
}

async function saveEdit(id) {
  const patch = {};
  for (const [key] of EDIT_FIELDS) {
    const el = document.querySelector('#e_' + key);
    if (el) patch[key] = el.value;
  }
  try {
    const r = await post(`/api/people/${id}/edit`, patch);
    closeModal();
    if (!r.changes.length) return viewPerson(id);
    viewPerson(id);
  } catch (err) {
    const box = $('#eErr');
    if (box) { box.style.display = ''; box.textContent = err.message; }
  }
}

// ------------------------------------------------------------- pipeline -----
// The board CAR feeds into. Columns are the configured stages and nothing here
// invents a new one: the stage vocabulary is still provisional until Admissions
// has walked their real process, so this reads config and never a literal list.
//
// A drop is a real stage change. It is saved the same way the person page saves
// one, so it lands in the history with who moved it and where from.

let DRAG_ID = null;

async function viewAdmissions() {
  const data = await api('/api/people?' + new URLSearchParams({ sort: 'last_contact_at', dir: 'desc' }));
  const stages = (CFG.stages || []);
  const byStage = {};
  for (const st of stages) byStage[st.id] = [];
  for (const r of data.rows) (byStage[r.status] ||= []).push(r);

  const card = (r) => `<div class="pcard" draggable="true" data-id="${esc(r.id)}"
      ondragstart="pDragStart(event,'${esc(r.id)}')" ondragend="pDragEnd(event)"
      onclick="location.hash='#/person/${esc(r.id)}'">
    <div class="pname">${esc(r.name)}</div>
    ${r.programme ? `<div class="pmeta">${esc(r.programme)}</div>` : ''}
    ${r.next_action ? `<div class="pnext">${esc(r.next_action)} &middot; ${dueText(r.next_action_at)}</div>`
      : '<div class="pnext none">no next step</div>'}
    ${r.owner && r.owner !== CFG.admissionsOwner ? `<div class="powner">${esc(r.owner)}</div>` : ''}
  </div>`;

  const column = (st) => {
    const rows = byStage[st.id] || [];
    return `<div class="pcol" data-stage="${esc(st.id)}"
        ondragover="pDragOver(event)" ondragleave="pDragLeave(event)" ondrop="pDrop(event,'${esc(st.id)}')">
      <div class="pcolhead">
        <span class="pdot" style="background:${esc(st.colour)}"></span>
        <span class="pcolname" title="${esc(st.label)}">${esc(st.label)}</span>
        <span class="pcount">${rows.length}</span>
      </div>
      <div class="pcolbody">${rows.map(card).join('') || '<div class="pempty">empty</div>'}</div>
    </div>`;
  };

  $('#view').innerHTML = `
  <div class="todayhead">
    <div><h1 style="margin:0">Admissions &middot; ${data.count}</h1></div>
    <a class="tilelink" href="#/inbox">Back to Inbox &rarr;</a>
  </div>
  <div class="board">${stages.map(column).join('')}</div>`;
}

function pDragStart(e, id) {
  DRAG_ID = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  e.target.classList.add('dragging');
}
function pDragEnd(e) { e.target.classList.remove('dragging'); DRAG_ID = null; }
function pDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('over'); }
function pDragLeave(e) { e.currentTarget.classList.remove('over'); }

async function pDrop(e, stage) {
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  const id = DRAG_ID || e.dataTransfer.getData('text/plain');
  if (!id) return;
  const row = e.currentTarget.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (row) return;                       // dropped back where it came from
  // Stopping work on somebody still needs a reason. The board does not get to
  // skip that just because the move was a drag.
  if (stage === (CFG.stageRoles || {}).closed) {
    DRAG_ID = null;
    return openCloseReason(id);
  }
  try {
    await post(`/api/people/${id}/status`, { status: stage });
  } catch (err) {
    alert(err.message);
  }
  DRAG_ID = null;
  viewAdmissions();
}

// ------------------------------------------------------------ feedback ------
// Anybody testing the app can say what is broken or what would help, from the
// screen they are standing on, without leaving it. The screenshot is shrunk and
// re-encoded here as a courtesy to the network; the server trusts none of it.

const FB_MAX_EDGE = 1600;
const FB_TARGET_BYTES = 1200000;
// tried in order until the result fits
const FB_LADDER = [[1600, 0.85], [1600, 0.7], [1200, 0.7], [1000, 0.6]];

let FB = { open: false, view: 'menu', kind: 'BUG', shot: null, busy: false };

function fbSupportsWebp() {
  const c = document.createElement('canvas');
  c.width = c.height = 1;
  // asking for webp on a browser that has none quietly hands back a PNG, so the
  // answer has to be read off the result rather than trusted
  return c.toDataURL('image/webp').startsWith('data:image/webp');
}

function fbClose() {
  FB.open = false; FB.view = 'menu'; FB.shot = null; FB.busy = false;
  const el = document.querySelector('#helpPanel');
  if (el) el.remove();
}

function fbToggle() {
  if (FB.open) return fbClose();
  FB.open = true; FB.view = 'menu'; FB.shot = null;   // always reopens on the menu
  fbDraw();
}

function fbDraw() {
  let el = document.querySelector('#helpPanel');
  if (!el) {
    el = document.createElement('div');
    el.id = 'helpPanel';
    el.className = 'helppanel';
    document.body.appendChild(el);
  }
  el.innerHTML = FB.view === 'menu' ? fbMenuHtml() : fbFormHtml();
  if (FB.view === 'form') {
    const ta = el.querySelector('#fbText');
    if (ta) { ta.focus(); ta.oninput = fbSync; }
    fbSync();
  }
}

function fbMenuHtml() {
  return `<h4>Help</h4>
    <button class="helpitem" onclick="fbOpenForm()">Send feedback
      <span>Something broken, or an idea. Read by ${esc(fbReaders())}.</span></button>
    ${mayReadFeedback() ? `<button class="helpitem" onclick="fbClose();location.hash='#/feedback'">Feedback inbox
      <span>Everything everybody has sent.</span></button>` : ''}`;
}

function fbOpenForm() { FB.view = 'form'; fbDraw(); }
function fbSetKind(k) { FB.kind = k; fbDraw(); }

function fbFormHtml() {
  const placeholder = FB.kind === 'BUG'
    ? 'What did you expect, and what happened instead?'
    : 'What would make this easier to use?';
  const text = FB.text || '';
  return `<h4>Send feedback</h4>
    <div class="kindtoggle">
      <button class="${FB.kind === 'IDEA' ? 'on' : ''}" onclick="fbSetKind('IDEA')">An idea</button>
      <button class="${FB.kind === 'BUG' ? 'on' : ''}" onclick="fbSetKind('BUG')">Something broken</button>
    </div>
    <textarea id="fbText" rows="4" maxlength="2000" placeholder="${esc(placeholder)}">${esc(text)}</textarea>
    <div id="fbShot">${fbShotHtml()}</div>
    <div id="fbErr"></div>
    <div class="goeshint">Goes to ${esc(fbReaders())}. It stays on this machine and is never emailed.</div>
    <div class="sendrow">
      <div class="pathstamp" title="the screen this will be filed against">${esc(fbPath())}</div>
      <div style="display:flex;gap:6px">
        <button class="btn sm ghost" onclick="fbClose()">Cancel</button>
        <button class="btn sm" id="fbSend" onclick="fbSend()" disabled>Send</button>
      </div>
    </div>`;
}

function fbShotHtml() {
  if (FB.busy) return '<div class="shothint">Preparing the screenshot...</div>';
  if (!FB.shot) {
    return `<button class="btn sm ghost" onclick="document.querySelector('#fbFile').click()">Attach a screenshot</button>
      <input type="file" id="fbFile" accept="image/png,image/jpeg,image/webp" style="display:none"
        onchange="fbPick(this.files[0]); this.value='';">
      <div class="shothint">Optional. Or press Ctrl+V to paste one.</div>`;
  }
  const kb = Math.round(FB.shot.bytes / 1024);
  return `<div class="shotrow">
      <img src="${FB.shot.url}" alt="">
      <div class="shotmeta">${FB.shot.w} by ${FB.shot.h}, ${kb} KB</div>
      <button class="xbtn" title="remove" onclick="fbRemoveShot()">&times;</button>
    </div>`;
}

function fbRemoveShot() { FB.shot = null; fbRedrawShot(); }

// Only this part of the panel is redrawn, so a half-written message is never lost.
function fbRedrawShot() {
  const box = document.querySelector('#fbShot');
  if (box) box.innerHTML = fbShotHtml();
  fbSync();
}

function fbSync() {
  const ta = document.querySelector('#fbText');
  if (ta) FB.text = ta.value;
  const send = document.querySelector('#fbSend');
  if (send) send.disabled = FB.busy || FB.sending || (FB.text || '').trim().length < 4;
}

const fbPath = () => location.hash || '#/today';
// Named, not implied. Somebody about to report a problem should know who reads it.
const fbReaders = () => {
  const who = CFG.feedbackReaders || [];
  if (!who.length) return 'the people building this';
  return who.length === 1 ? who[0] : who.slice(0, -1).join(', ') + ' and ' + who[who.length - 1];
};

async function fbPick(file) {
  if (!file) return;
  const err = document.querySelector('#fbErr');
  if (err) err.innerHTML = '';
  if (!file.type || !file.type.startsWith('image/')) {
    return fbShotError('That file is not an image.');
  }
  FB.busy = true; fbRedrawShot();
  try {
    FB.shot = await fbShrink(file);
  } catch (e) {
    FB.shot = null;
    FB.busy = false;
    return fbShotError(e.message);
  }
  FB.busy = false;
  fbRedrawShot();
}

// The typed message is never touched by an image failure.
function fbShotError(message) {
  FB.busy = false;
  fbRedrawShot();
  const err = document.querySelector('#fbErr');
  if (err) err.innerHTML = `<div class="err" style="margin:10px 0 0">${esc(message)}</div>`;
}

function fbLoadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That image could not be opened.')); };
    img.src = url;
  });
}

async function fbShrink(file) {
  const img = await fbLoadImage(file);
  // WebP if the browser really makes WebP, JPEG otherwise. Never PNG: a screenshot
  // of a whole page as PNG is several megabytes for no gain.
  const type = fbSupportsWebp() ? 'image/webp' : 'image/jpeg';
  for (const [edge, quality] of FB_LADDER) {
    const scale = Math.min(1, edge / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    // a transparent PNG would come out black without this
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    // re-encoding through a canvas drops EXIF, so GPS and camera data never travel
    const url = c.toDataURL(type, quality);
    const bytes = Math.round((url.length - url.indexOf(',') - 1) * 3 / 4);
    if (bytes <= FB_TARGET_BYTES) return { url, bytes, w, h };
  }
  throw new Error('That image is too detailed, crop it to the part that matters and try again.');
}

async function fbSend() {
  fbSync();
  if (FB.sending) return;
  FB.sending = true;
  const send = document.querySelector('#fbSend');
  if (send) send.disabled = true;
  try {
    await post('/api/feedback', {
      kind: FB.kind, body: FB.text, path: fbPath(),
      screenshot: FB.shot ? FB.shot.url : null,
    });
    FB.sending = false;
    const el = document.querySelector('#helpPanel');
    if (el) el.innerHTML = '<div class="fbthanks"><div class="tick-big">&#10003;</div>Thank you.</div>';
    FB.text = '';
    drawFeedbackBadge();          // the count moves the moment something is sent
    setTimeout(fbClose, 1600);
  } catch (e) {
    FB.sending = false;
    const err = document.querySelector('#fbErr');
    if (err) err.innerHTML = `<div class="err" style="margin:10px 0 0">${esc(e.message)}</div>`;
    fbSync();
  }
}

// Paste is listened for on the document, because the focus sits inside the panel
// rather than on the textarea when somebody hits Ctrl+V straight after a capture.
document.addEventListener('paste', (e) => {
  if (!FB.open || FB.view !== 'form') return;
  const items = [...((e.clipboardData && e.clipboardData.items) || [])];
  const item = items.find(i => i.kind === 'file' && String(i.type).startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  fbPick(item.getAsFile());
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && FB.open) fbClose(); });
// mousedown, not click: a click that starts inside the panel and ends outside
// must not count as leaving it
document.addEventListener('mousedown', (e) => {
  if (!FB.open) return;
  if (e.target.closest('#helpPanel') || e.target.closest('#helpBtn')) return;
  fbClose();
});

(async () => {

  //
  // This used to load /api/config first and ask afterwards. The comment below
  // said the CRM "is not drawn at all" for somebody not signed in, and that was
  // not true: 34KB of configuration - every colleague's name, every settled
  // decision, every channel blocker - had already been pulled into the page
  // before the login screen appeared. The order is the whole control.
  const back = readReturnFromGoogle();
  await loadAuth();
  // Registered BEFORE the login check. Returning early here left no hashchange
  // listener at all, so after signing in every link in the navigation changed the
  // address bar and nothing on screen moved.
  if (UI === 'c') installCNav();
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', (e) => {
    // A clickable row is a control, so it answers Enter and Space. So is a
    // sortable column header: tabindex alone makes it focusable but not
    // activatable, which is the worse of the two states - it takes a tab stop
    // and then does nothing.
    const el = document.activeElement;
    if (!el || (e.key !== 'Enter' && e.key !== ' ')) return;
    const isRow = el.classList && el.classList.contains('row');
    const isSortHeader = el.tagName === 'TH' && el.hasAttribute('onclick');
    if (isRow || isSortHeader) { e.preventDefault(); el.click(); }
  });
  if (AUTH.on && !AUTH.user) {
    drawLogin(back.refused
      ? 'That Google account cannot sign in to the Academy CRM. Ask an admin to set an account up for you.'
      : '');
    return;
  }
  await startShell();
})();

/**
 * Everything the shell needs once somebody is known.
 *
 * CALLED FROM BOTH THE FIRST LOAD AND A SUCCESSFUL SIGN-IN, and that is the
 * whole point. Signing in used to call route() straight after loadAuth(), while
 * the configuration fetch sat in the boot block below the early return - so
 * after signing in through the form, CFG was an empty object. The Admissions
 * board builds its columns from CFG.stages, so it rendered a heading saying
 * "Admissions - 12" above an empty board. Today rendered almost nothing.
 *
 * It healed on the next reload, which is exactly why it survived a manual pass.
 */
async function startShell() {
  CFG = await api('/api/config');
  $('#ver').innerHTML = 'CRM &middot; ' + (CFG.version || 'prototype');
  drawDatasetBadge(CFG.dataset || {});
  let saved = 'light';
  try { saved = localStorage.getItem('crmTheme') || 'light'; } catch {}
  if (!['light', 'dark'].includes(saved)) saved = 'light';
  setTheme(saved);
  const themeSel = document.querySelector('#theme');
  if (themeSel) themeSel.value = saved;
  try { ACTOR = localStorage.getItem('crmActor') || ''; } catch {}
  const known = (CFG.users || []).map(u => u.name).concat(CFG.admins || []);
  if (!known.includes(ACTOR)) ACTOR = known[0] || '';
  // With sign-in ON, loadAuth already set ACTOR from the proved identity, and the
  // dropdown above is not on screen. This line only matters on a copy with
  // sign-in off, where who you are is still a setting.
  if (AUTH.user) ACTOR = AUTH.user.name;
  drawActorPicker();
  await route();
}
</script>
