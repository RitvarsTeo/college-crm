// ===== KIT PART 9, REPORT MOTION: motion.js copied verbatim from the kit (see the stylesheet note). =====
/* Part 9 - Report motion engine.
   Plays every .m-scene once, when its top reaches mid-screen, then never again.
   Refuses to move for anybody who asked for stillness (reduced motion), and leaves the page finished
   when it cannot run. Timing runs on setTimeout + performance.now, so it also finishes in hidden tabs
   and headless browsers (requestAnimationFrame stalls there).

   API (window.Motion):
     Motion.scene(name, fn)   register a custom sequence: <section class="m-scene" data-scene="name">
     Motion.count(el, opts)   count the first number in el up from 0 ({ms, delay, done})
     Motion.fire(el)          play a scene now (once only)
   Markup:
     .m-scene                 a screen that plays once
     data-count[="ms"]        number counts up; data-count-delay="ms"
     data-type                cell types itself; data-type-order="n" (optional); .m-shine gets .m-shone after
     data-stagger="selector"  gives each match --i (0,1,2...); data-stagger-var="--c" to use another variable
     climb scene              data-scene="climb": .m-climb path (pathLength="1"), .m-rider circle,
                              [data-climb-count] number, .m-flag-mark[data-x], .m-route-clip[data-w], .m-mark[data-dx], .m-after
*/
(function () {
  "use strict";
  var M = window.Motion = { on: false, hooks: {} };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !("IntersectionObserver" in window)) return;          // still page; nothing is hidden
  var root = document.documentElement;
  root.classList.add("m-on"); M.on = true;

  var tick = M.tick = function (f) { return setTimeout(function () { f(performance.now()); }, 16); };
  var ease = function (t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
  var out3 = function (t) { return 1 - Math.pow(1 - t, 3); };
  var all = function (sel, el) { return [].slice.call((el || document).querySelectorAll(sel)); };

  /* ---------- numbers ---------- */
  function firstNumberNode(el) {
    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), n;
    while ((n = w.nextNode())) if (/\d/.test(n.nodeValue)) return n;
    return null;
  }
  function parse(s) {
    var m = /^([\s\S]*?)(\d[\d,]*(?:\.\d+)?)([\s\S]*)$/.exec(s); if (!m) return null;
    var raw = m[2], plain = raw.replace(/,/g, "");
    return { pre: m[1], suf: m[3], n: parseFloat(plain), dec: (plain.split(".")[1] || "").length, comma: raw.indexOf(",") > -1 };
  }
  function fmt(v, p) {
    var s = v.toFixed(p.dec);
    if (p.comma) { var a = s.split("."); a[0] = a[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); s = a.join("."); }
    return s;
  }
  function prepCount(el) {
    if (el._m) return el._m;
    var tn = firstNumberNode(el); if (!tn) return null;
    var p = parse(tn.nodeValue); if (!p) return null;
    el._m = { tn: tn, orig: tn.nodeValue, p: p };
    tn.nodeValue = p.pre + fmt(0, p) + p.suf;
    return el._m;
  }
  M.count = function (el, o) {
    o = o || {}; var c = prepCount(el); if (!c) return;
    var ms = o.ms || 1125, delay = o.delay || 0;
    setTimeout(function () {
      var t0 = performance.now();
      (function f(t) {
        var q = Math.min(1, (t - t0) / ms);
        c.tn.nodeValue = q < 1 ? c.p.pre + fmt(c.p.n * out3(q), c.p) + c.p.suf : c.orig;   // lands on the exact original text
        if (q < 1) tick(f); else { el.classList.add("m-bumped"); if (o.done) o.done(); }
      })(performance.now());
    }, delay);
  };

  /* ---------- typewriter ---------- */
  function prepType(el) {
    if (el._t != null || el.children.length) return;           // only plain-text cells
    el._t = el.textContent;
    el.innerHTML = '<span class="m-tw"></span><span class="m-tg"></span>';
    el.lastChild.textContent = el._t;
  }
  function typeScene(sec) {
    var cells = all("[data-type]", sec).filter(function (c) { return c._t != null; });
    if (!cells.length) return;
    var gap = +(sec.getAttribute("data-type-gap") || 100), per = +(sec.getAttribute("data-type-char") || 28);
    cells.forEach(function (c, k) {
      var t = c._t, n = 0, tr = c.closest("tr");
      setTimeout(function step() {
        if (!n) { c.classList.add("m-twa"); if (tr) tr.classList.add("m-typing"); }
        n++; c.firstChild.textContent = t.slice(0, n); c.lastChild.textContent = t.slice(n);
        if (n < t.length) { setTimeout(step, per); return; }
        c.classList.add("m-twd"); if (tr) setTimeout(function () { tr.classList.remove("m-typing"); }, 150);
        if (k === cells.length - 1) setTimeout(function () { all(".m-shine", sec).forEach(function (s) { s.classList.add("m-shone"); }); }, 100);
      }, k * gap);
    });
  }

  /* ---------- climb: a rider follows the drawn path, the number climbs with it ---------- */
  M.hooks.climb = function (sec) {
    var path = sec.querySelector(".m-climb"), rider = sec.querySelector(".m-rider"); if (!path || !rider) return;
    var ms = +(sec.getAttribute("data-climb-ms") || 2500), num = sec.querySelector("[data-climb-count]");
    var flags = all(".m-flag-mark", sec), marks = all(".m-mark", sec), clip = sec.querySelector(".m-route-clip");
    var cw = clip ? +clip.getAttribute("data-w") : 0, x0 = clip ? +clip.getAttribute("x") : 0;
    var L = path.getTotalLength(), cx = +rider.getAttribute("cx"), cy = +rider.getAttribute("cy");
    var c = num ? prepCount(num) : null;
    if (clip) clip.setAttribute("width", 0);
    path.style.strokeDasharray = 1; path.style.strokeDashoffset = 1;
    function place(e) { var p = path.getPointAtLength(e * L); rider.setAttribute("transform", "translate(" + (p.x - cx).toFixed(1) + "," + (p.y - cy).toFixed(1) + ")"); return p; }
    place(0); rider.style.opacity = 1;
    var t0 = performance.now();
    (function f(t) {
      var q = Math.min(1, (t - t0) / ms), e = ease(q), p = place(e);
      path.style.strokeDashoffset = 1 - e;
      if (c) c.tn.nodeValue = q < 1 ? c.p.pre + fmt(c.p.n * e, c.p) + c.p.suf : c.orig;
      flags.forEach(function (g) { if (!g.classList.contains("m-hit") && p.x >= +g.getAttribute("data-x") - 2) g.classList.add("m-hit"); });
      if (q < 1) { tick(f); return; }
      rider.removeAttribute("transform"); rider.classList.add("m-bumped");
      all(".m-after", sec).forEach(function (a) { a.classList.add("m-shown"); });
      if (!clip) return;
      setTimeout(function () {
        var t1 = performance.now(), ms2 = +(sec.getAttribute("data-route-ms") || 1563);
        (function g(t) {
          var q2 = Math.min(1, (t - t1) / ms2), w = cw * out3(q2);
          clip.setAttribute("width", w.toFixed(1));
          marks.forEach(function (m) { if (!m.classList.contains("m-hit") && w >= +m.getAttribute("data-dx")) { m.classList.add("m-hit"); m.style.opacity = 1; m.classList.add("m-bumped"); } });
          flags.forEach(function (fl) { if (!fl.classList.contains("m-hit") && x0 + w >= +fl.getAttribute("data-x")) fl.classList.add("m-hit"); });
          if (q2 < 1) tick(g);
        })(performance.now());
      }, 313);
    })(t0);
  };

  /* ---------- scenes ---------- */
  M.scene = function (name, fn) { M.hooks[name] = fn; };
  M.fire = function (sec) {
    if (!sec || sec.classList.contains("in")) return;            // once only, ever
    sec.classList.add("in");
    all("[data-count]", sec).forEach(function (el) {
      if (el.hasAttribute("data-climb-count")) return;
      M.count(el, { ms: +el.getAttribute("data-count") || 1125, delay: +(el.getAttribute("data-count-delay") || 0) });
    });
    typeScene(sec);
    var h = sec.getAttribute("data-scene"); if (h && M.hooks[h]) M.hooks[h](sec);
  };

  function init() {
    all("[data-stagger]").forEach(function (box) {
      var v = box.getAttribute("data-stagger-var") || "--i";
      all(box.getAttribute("data-stagger"), box).forEach(function (e, i) { e.style.setProperty(v, i); });
    });
    all(".m-scene [data-count], .m-scene [data-climb-count]").forEach(prepCount);   // start from 0, not from the answer
    all(".m-scene [data-type]").forEach(prepType);
    all(".m-scene[data-scene=climb] .m-rider, .m-scene .m-mark").forEach(function (r) { r.style.opacity = 0; });
    var scenes = all(".m-scene");
    if (/[?&]motion=all\b/.test(location.search)) { scenes.forEach(M.fire); return; }   // tests and thumbnails
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { M.fire(e.target); io.unobserve(e.target); } });
    }, { rootMargin: "0px 0px -55% 0px" });
    scenes.forEach(function (s) { io.observe(s); });
    function sweep() {                                           // a hidden pane stalls the observer; scrolling still fires
      var h = window.innerHeight;
      scenes.forEach(function (s) { var r = s.getBoundingClientRect(); if (r.top < h * .45 && r.bottom > 0) M.fire(s); });
    }
    window.addEventListener("scroll", sweep, { passive: true }); setTimeout(sweep, 60);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

// HOME IS THE FIRST PAGE (the owner, 01.10.2026), and the metrics on it are Admissions'
// own ask (29.09: very good that the home page has a place for current statistics straight
// away; docs/IEVA_AIGARS_FEEDBACK_VERBATIM.md). Two screens, two jobs: Home is the visual dashboard, Today is the work.
//
// HOME IS B, TODAY FIRST (locked by the owner, 02.10.2026, "B for home"). Its job is one
// question: what needs me today? So it opens with the work waiting (Overdue, Due today, the
// Inbox), then how admissions is performing, each trend figure with its comparison and the
// basis named. "The journey now" is the way into the Journey, where the stages are compared.
// The former A (journey first) lives on as the Journey band: cJourneyBand().
// Reference: Remote's dashboard (to-do first, groups ending in "View all") and Square's
// figure-first stack with a delta row (Mobbin, free tier). Every figure is read live from
// /api/report, /api/summary, /api/people and /api/intake; a failed read says so.
async function cHomeData() {
  // THE PERIOD (Q45): the year scope, never the calendar year on its own. 'all' has no year: no target, the last
  // twelve months on the chart.
  const year = cScopeYear();   // one year, 'multi' or 'all' (Q59): a year's target only for one year
  const [rep, people, sum, intake] = await Promise.all([
    api('/api/report?' + cScopeReportQs()),
    cPeopleRows(),
    api('/api/summary').catch(() => null),
    api('/api/intake').catch(() => null),
  ]);
  const s = rep.summary || {};
  const thisMonth = cTodayIso().slice(0, 7);
  const picked = cScopeList();
  const months = (rep.trend || []).filter((m) => (picked === 'all' || picked.includes(Number(m.month.slice(0, 4)))) && m.month <= thisMonth);
  // the rows ARE the period: the Admitted among them were admitted in it (server, scopePeopleSql)
  const admitted = people.filter((p) => p.status === 'Admitted' && p.admitted_at);
  const undated = people.filter((p) => p.status === 'Admitted' && !p.admitted_at).length;
  const count = (arr, key) => { const m = new Map(); arr.forEach((p) => { const k = key(p); m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  const known = new Set(CFG.programmes || []);
  const progs = count(admitted, (p) => p.programme || '(not recorded)').map(([k, n]) => [k, n, known.has(k) ? '' : (k === '(not recorded)' ? 'no programme recorded' : 'not one of the list'), k]);
  const chans = count(admitted, (p) => p.source_channel || 'unknown').map(([k, n]) => { const [label, why] = cChannel(k); return [label, n, why, k]; });
  const stages = (CFG.stages || []).filter((st) => !C_TERMINAL.includes(st.id));
  const open = people.filter((p) => !C_TERMINAL.includes(p.status));
  const closed = people.filter((p) => p.status === 'Not proceeding');
  // NEVER A REMEMBERED FIGURE. Read live; a failed read is null and is said out loud.
  const overdueRows = sum && Array.isArray(sum.overdue) ? sum.overdue : null;
  const todayRows = sum && Array.isArray(sum.today) ? sum.today : null;
  return {
    year, s, months, people, admitted, undated, progs, chans, stages, open, closed,
    // Admissions, 30.09: cold and reject, for statistics and to aim marketing at the cold ones
    overdue: overdueRows ? new Set(overdueRows.map((t) => t.person_id)).size : null,
    dueToday: todayRows ? new Set(todayRows.map((t) => t.person_id)).size : null,
    noNext: sum && typeof sum.noNextAction === 'number' ? sum.noNextAction : null,
    inbox: intake && intake.counts && typeof intake.counts.new === 'number' ? intake.counts.new : null,
    asOf: new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: 'numeric', month: 'long' }).format(new Date()),
  };
}

// Only when the two sit side by side; stacked (a narrow window, a phone) the donut keeps its own layout.
function cFitDonut() {
  const svg = document.querySelector('#view .kpage.kb .kb-top .kchart');

  const sb = svg.getBoundingClientRect(), db = dn.getBoundingClientRect();

  dn.style.setProperty('--kplot-h', ((pb - pt) * k).toFixed(1) + 'px');

    <div class="ksh"><h2>Admissions by month</h2>
      <ul class="klegend inline"><li><i style="background:var(--v-adm)"></i><span>Admitted</span></li><li><i class="ln" style="background:var(--v-lead)"></i><span>New leads</span></li></ul>

// ---- THE YEAR'S TARGET (D-C6, the owner 05.10.2026: "Yes, Home should show that"; the bars: "Yes, keep them") --
// The figures are config (prototype.json targets[year]: admitted, officerPct, officerProgrammes), never written
// here. Officer programmes = NAV + ENG (the owner, 05.10.2026). They sit on the Admitted card as two meters.
// Blue is the admitted figure, mustard the target. Depth belongs to the frame (the meter's sunk track), never
// to the mark.
function cTarget(D) {
  // a year's target only against that one year (Q59): never against several years together
  const t = CFG.targets && CFG.targets[String(D.year)];
  if (!t || !(Number(t.admitted) > 0)) return null;
  const progs = Array.isArray(t.officerProgrammes) ? t.officerProgrammes : [];
  const pct = Number(t.officerPct);
  const off = progs.length && pct > 0 ? {
    goal: Math.round((Number(t.admitted) * pct) / 100), pct, label: progs.join(' + '),
    rows: D.admitted.filter((p) => progs.includes(p.programme)) } : null;
  return { goal: Number(t.admitted), rows: D.admitted, off };
}
// One track per figure from 0 to its target, the admitted share filled, the target its end.
function cTargetMeter(G) {
  const bar = (n, goal, label, cls) => `<div class="ktgt ${cls}" role="img" aria-label="${n} admitted${label ? ' in ' + esc(label) : ''} of the ${goal} target">
    <div class="ktgt-track"><i style="width:${Math.min(100, (n / goal) * 100).toFixed(2)}%"></i><s></s></div>
    <div class="ktgt-n">${label ? `<span class="ktgt-who">${esc(label)}</span> <strong>${n}</strong> · ` : ''}<strong>${Math.round((n / goal) * 100)}%</strong> of <strong class="ktgt-goal">${goal}</strong></div></div>`;
  return bar(G.rows.length, G.goal, '', 'all') + (G.off ? bar(G.off.rows.length, G.off.goal, G.off.label, 'off') : '');
}

// today / needs you.

// Then performance, each figure with its comparison as its own delta row and the basis
// named (Square). The comparison is the last COMPLETE month against the one before it,
// never the month in progress against a whole one.
//
// SCENE 1 (of two): the figures that need you count up. SCENE 2: the charts.
function cHomeB(D) {
  const s = D.s;
  const goal = cTarget(D);   // the year's target on the Admitted card, or null
  const now = cTodayIso().slice(0, 7);
  const done = D.months.filter((m) => m.month < now);
  const [prev, last] = done.slice(-2);
  const mo = (m) => C_MONTHS[Number(m.month.slice(5)) - 1];
  const delta = (key) => {
    if (!prev || !last) return '';
    const d = last[key] - prev[key];
    return `<span class="kdelta${d > 0 ? ' up' : d < 0 ? ' down' : ''}">${mo(last)} <b>${last[key]}</b> · vs ${mo(prev)} ${prev[key]} · ${d > 0 ? '+' : ''}${d}</span>`;
  };
  const need = (label, n, go, href, k) => `<a class="kneed" href="${href}" style="--i:${k}" ${go ? `onclick="${go};return false"` : ''}>
      <span>${esc(label)}</span><b>${cFig(n)}</b></a>`;
  // Needs you is the whole row: "The journey now" left Home on 05.10.2026 (the owner: "The journey now. Do we need it on
  // home?" - dropped; the Journey page's band has the stage counts, and the donut's Open opens the Journey).
  return `<section class="kday m-scene" aria-label="Needs you">
      <div class="kday-sheet">
        <h2>Needs you</h2>

          ${need('Overdue', D.overdue, "cGoToday('cTodayOver')", '#/due', 0)}

          ${need('In the Inbox', D.inbox, '', '#/leads', 2)}
          ${D.noNext ? need('No next step', D.noNext, "cGoPeople({ due: 'none' })", '#/due', 3) : ''}
        </div>
      </div>
    </section>
    <div class="kstrip kb-strip">
      <div class="khero"><span>Admitted</span><b>${D.admitted.length}</b><small>${esc(cScopeWord())}${D.undated ? ` · +${D.undated} undated` : ''}</small>${goal ? cTargetMeter(goal) : ''}${cSpark(D.months.map((m) => m.admitted), 'adm')}${delta('admitted')}<a class="kgo" href="#/reports" onclick="cGoReportYear('admitted');return false">Reports →</a></div>
      <div><span>Leads</span><b>${s.newLeads ?? 0}</b><small>${esc(cScopeWord())}</small>${cSpark(D.months.map((m) => m.newLeads), 'lead')}${delta('newLeads')}<a class="kgo" href="#/reports" onclick="cGoReportYear('leads');return false">Reports →</a></div>
      <div><span>Conversion</span><b>${s.conversionPct == null ? '-' : s.conversionPct + '%'}</b><small>${s.conversionA ?? 0} / ${s.conversionB ?? 0} ${esc(s.conversionWho || 'who arrived')}</small><a class="kgo" href="#/reports" onclick="cGoReportYear('conversion');return false">Reports →</a></div>
      <div><span>Median time to admission</span><b>${s.medianDaysToAdmission == null ? '-' : s.medianDaysToAdmission} <em>days</em></b><small>first contact to admission</small><a class="kgo" href="#/reports" onclick="cGoReportYear('median');return false">Reports →</a></div>
    </div>
    <div class="m-scene kb-charts">
      <div class="kb-top">
      ${cHomeMonths(D)}
        <section class="ksec"><div class="ksh"><h2>Where everyone is now</h2><span class="ksrc">click a slice</span></div>${cDonut([
          ['Open', D.open.length, 'open', 'journey'], ['Not proceeding', D.closed.length, 'np', 'Not proceeding']])}</section>
      </div>
    </div>`;
}

// A KPI'S OWN SHAPE (Mixpanel Home, seen on Mobbin 01.10.2026: every headline figure
// carries a sparkline of its own series, so a number is never a bare digit). Pattern
// only - the line is ours, drawn from the same monthly trend the month chart uses, so
// it is the real series and not an illustration.
//
// It draws nothing when there is nothing to say: fewer than two months of data, or a
// series that is flat at zero, gets no line rather than a straight one pretending to
// be a trend.
function cSpark(values, kind) {
  const v = (values || []).map((n) => Number(n) || 0);
  if (v.length < 2 || !v.some((n) => n > 0)) return '';
  const max = Math.max(...v), W = 100, H = 22;
  const pts = v.map((n, i) => [
    (i / (v.length - 1)) * W,
    H - 2 - (max ? (n / max) * (H - 4) : 0),
  ]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="kspark ${esc(kind || '')}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
    role="img" aria-label="the last ${v.length} months, ending at ${v[v.length - 1]}">
    <path d="${d}"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.2"/></svg>`;
}

function cMonthChart(months, year, fitH = 0) {
  if (!months.length) return '<p class="c-empty">No admissions recorded this year yet.</p>';
  // On a phone the chart is drawn for a phone (the review UX pass, 29.09.2026): drawn 640 wide and shrunk to
  // ~330 px, its labels came out at 5-6 px. Drawn 360 wide, they stay about the size they are written.
  const narrow = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  // WIDE: drawn WIDER, not BIGGER. The viewBox locks height to width, so letting a 640x210 chart
  // fill a 1600 px panel would make it 525 px tall. Drawing it 1100 wide at the same height keeps
  // the rendered height where it was (about 290 px) and spends the new room on the months instead.
  // The CSS cap steps at the same 1500 px, so the two never disagree.
  const wide = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(min-width:1500px)').matches;
  // TALLER WHERE THERE IS ROOM (Q46, the owner 05.10.2026 on Home's empty space under it: "can be taller"; this
  // replaces the 30.09 "wider, not bigger" lock). fitH is a taller drawing height cFitMonthChart measured for the
  // screen: the same width, so the type keeps its size and only the plot grows. A phone keeps its height.
  const W = narrow ? 360 : wide ? 1100 : 640, H = narrow ? 230 : fitH || 210, L = narrow ? 28 : 30, R = 8, T = 14, B = 26, n = months.length;
  const top = Math.max(10, ...months.map((m) => Math.max(m.admitted, m.newLeads)));
  // Gridlines on round numbers (0, 10, 20, 30), never quarters of the top (0, 8, 15, 23).
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find((s) => top / s <= 5) || Math.ceil(top / 5);
  const max = Math.ceil(top / step) * step, band = (W - L - R) / n, bw = Math.min(22, band * 0.42), y = (v) => T + (H - T - B) * (1 - v / max);
  const ticks = Array.from({ length: max / step + 1 }, (_, k) => k * step);
  const grid = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="kg"/><text x="${L - 8}" y="${y(v) + 4}" class="kt" text-anchor="end">${v}</text>`).join('');
  // READABLE ON A PHONE (the review, 29.09.2026, still open): the type was never the
  // problem - it is 12.5px on a phone already. TWELVE labels in a 324px plot area gives
  // each one a 27px band, and a month name is about 22px wide, so they crowd and touch.
  // So THIN THE LABELS, never the type: keep about six, and always keep the LAST month,
  // because "where are we now" is the one anybody looks for. Every column keeps its own
  // aria-label and its tooltip, so no month loses its name - only its printed tick.
  const every = narrow ? Math.max(1, Math.ceil(n / 6)) : 1;
  const labelled = (k) => every === 1 || k === n - 1 || (n - 1 - k) % every === 0;
  const cols = months.map((m, k) => { const cx = L + band * k + band / 2, t = y(m.admitted), mo = C_MONTHS[Number(m.month.slice(5)) - 1];
    const bar = m.admitted ? `<path d="M${cx - bw / 2},${y(0)} V${Math.min(t + 4, y(0))} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${y(0)} Z" style="fill:var(--v-adm);--i:${k}" class="m-fade"/>` : '';
    // No figure printed on any one month (the owner, 05.10.2026: "Delete that above the graph 16 admitted. It is
    // hover over info."): every month shows its figures on hover, the same for each.
    return `<g class="kcol" tabindex="0" role="button" aria-label="${mo} ${m.month.slice(0, 4)}: ${m.admitted} admitted, ${m.newLeads} new leads" data-tip="${mo} ${m.month.slice(0, 4)}|${m.admitted} admitted|${m.newLeads} new leads" data-kgo="month|${m.month}|${mo} ${m.month.slice(0, 4)}"><rect x="${cx - band / 2}" y="${T}" width="${band}" height="${H - T - B}" class="khit"/>${bar}${labelled(k) ? `<text x="${cx}" y="${H - 8}" class="kt" text-anchor="middle">${mo}</text>` : ''}</g>`; }).join('');
  const pts = months.map((m, k) => [L + band * k + band / 2, y(m.newLeads)]);
  // data-plot: where the plot runs (top gridline to the baseline) in drawing units, so Home's donut can match it (Q46)
  return `<svg viewBox="0 0 ${W} ${H}" class="kchart${narrow ? ' narrow' : ''}" data-plot="${T} ${H - B}" role="img" aria-label="Admissions and new leads per month, ${year}">${grid}${cols}<path d="M${pts.map((p) => p.join(',')).join(' L')}" class="kline m-draw" pathLength="1"/>${pts.map(([x, yy], k) => `<circle cx="${x}" cy="${yy}" r="4" class="kdot m-fade" style="--i:${k}"/>`).join('')}</svg>`;
}

// PRESENCE WITHOUT DISTORTION (the owner, 02.10.2026).
//
// The rule: 3D geometry gives the object physical presence, and depth must NEVER
// change the reader's ability to compare the underlying values. DEPTH BELONGS TO THE
// FRAME, NEVER TO THE MARK.
//
// It took two goes to get right, and both are kept in the history:
//   - 606d41b tilted the ring (ry = rx * 0.58): a segment at the side covered more
//     visual arc than the same number at the top, and only the front segments carried
//     a wall. The 3D pie-chart fault
//   - 074d141 made the top a true circle but kept a rim drawn in EACH SEGMENT'S OWN
//     colour, dropped straight down. A slice at six o'clock then showed a full wall and a
//     slice at three or nine o'clock almost none, so a slice still gained coloured ink
//     from WHERE IT SAT (found by the QA session, 02.10.2026)
//
// What this does instead:
//   - the top face is a TRUE CIRCLE. Every angle and arc length is exactly proportional
//     to its value, the same as a flat ring. Nothing is foreshortened
//   - the solid under it is ONE neutral ring, the whole annulus, in the frame token
//     --k-plinth. It belongs to the object, not to any value: no slice has a wall of its
//     own colour, so no slice can gain weight from its position
//
// Drawn plinth first, faces second. No visibility maths: the faces hide what should be
// hidden because they are painted last and are exactly the same shape.
function cDonut(rows) {
  const total = rows.reduce((a, r) => a + r[1], 0) || 1;
  const R = 54, r0 = 37, c = 70, cy = 62, gap = 0.035, DEPTH = 11;
  const live = rows.filter((r) => r[1] > 0);

  const p = (ang, rad, dy = 0) =>
    `${c + rad * Math.cos(ang)},${cy + rad * Math.sin(ang) + dy}`;

  let a = -Math.PI / 2;
  const segs = live.map(([k, n, v, go]) => {
    const sw = (n / total) * Math.PI * 2;
    const a0 = a + gap / 2, a1 = a + sw - gap / 2;
    a += sw;
    return { k, n, v, go, a0, a1, big: a1 - a0 > Math.PI ? 1 : 0 };
  });

  // one segment of the ring, as a true-circle annulus sector, optionally dropped
  const ring = (g, dy) => `M${p(g.a0, R, dy)} A${R},${R} 0 ${g.big} 1 ${p(g.a1, R, dy)}
    L${p(g.a1, r0, dy)} A${r0},${r0} 0 ${g.big} 0 ${p(g.a0, r0, dy)} Z`;

  // the plinth: the whole annulus, once, dropped by DEPTH, in a frame colour
  const plinth = `<path d="M${p(-Math.PI / 2, R, DEPTH)} A${R},${R} 0 1 1 ${p(Math.PI / 2, R, DEPTH)} A${R},${R} 0 1 1 ${p(-Math.PI / 2, R, DEPTH)}
    M${p(-Math.PI / 2, r0, DEPTH)} A${r0},${r0} 0 1 0 ${p(Math.PI / 2, r0, DEPTH)} A${r0},${r0} 0 1 0 ${p(-Math.PI / 2, r0, DEPTH)} Z"
    style="fill:var(--k-plinth)" fill-rule="evenodd" class="kwall"/>`;

  const face = (g, i) => `<path d="${ring(g, 0)}"
    style="fill:var(--v-${g.v});--i:${i}" class="kseg" tabindex="0" role="button"
    aria-label="${esc(g.k)}: ${g.n}"
    data-tip="${esc(g.k)}|${g.n} people|${Math.round((g.n / total) * 100)}% of ${total}"
    data-kgo="${g.go === 'journey' ? 'journey' : 'outcome|' + g.go}"/>`;

  return `<div class="kdonut"><svg viewBox="0 0 140 140" role="img" aria-label="Where everyone is now">
    <g class="kring">${segs.length ? plinth : ''}${segs.map(face).join('')}</g>
    <circle cx="${c}" cy="${cy}" r="${r0 - 2}" class="khole" tabindex="0" role="button" aria-label="Everybody: ${total}"
      data-tip="Everybody|${total} people|open People" data-kgo="people"/>
    <text x="${c}" y="${cy + 4}" text-anchor="middle" class="kbig">${total}</text>
    <text x="${c}" y="${cy + 22}" text-anchor="middle" class="kt">people</text></svg>
    <ul class="klegend">${rows.map(([k, n, v, go]) => `<li tabindex="0" role="button" data-tip="${esc(k)}|${n} people|${Math.round((n / total) * 100)}% of ${total}"
      data-kgo="${go === 'journey' ? 'journey' : 'outcome|' + go}"><i style="background:var(--v-${v})"></i><span>${esc(k)}</span><b>${n}</b></li>`).join('')}</ul></div>`;
}

function cBars(rows, kind) {
  if (!rows.length) return '<p class="c-empty">Nobody admitted yet.</p>';
  const max = Math.max(...rows.map((r) => r[1]));
  return `<div class="kbars">${rows.map(([label, n, why, key]) => `<div class="kbar" tabindex="0" role="button" data-tip="${esc(label)}|${n} admitted${why ? '|' + esc(why) : ''}" data-kgo="${kind}|${esc(key)}|${esc(label)}">
      <span class="kbl">${why ? `<span class="c-gap">${esc(label)}</span>` : esc(label)}</span><span class="kbt"><i style="width:${Math.max(3, (n / max) * 100)}%;background:var(--v-${why ? 'np' : 'adm'})"></i></span><b>${n}</b></div>`).join('')}</div>`;
}


let C_OUT_FILTER = null;
function cChartGo(spec) {
  const [kind, key, label] = String(spec || '').split('|');
  if (kind === 'journey') { cGoPeople({ stage: 'open' }); return; }   // the donut's Open: everyone still on the journey
  if (kind === 'people') { cGoPeople({}); return; }
  if (kind === 'stage') { cGoStage(key); return; }
  if (kind === 'inbox') { location.hash = '#/leads'; return; }
  if (kind === 'cohort') { cGoCohort(key); return; }   // a Reports figure: exactly its people (Q35)
  C_PF = C_PF_EMPTY(); C_PCOHORT = null; C_JF = C_JF_EMPTY();   // Q57: the board shows exactly what the figure counts
  if (kind === 'outcome') { C_OUTCOME = key; C_OUT_FILTER = null; C_OUT_TAG = null; C_OUT_REASON = null; if (location.hash.split('?')[0] === '#/outcomes') viewOutcomesC(); else location.hash = '#/outcomes'; return; }
  C_OUTCOME = 'Admitted';
  C_OUT_FILTER = { kind, key, label };
  if (location.hash.split('?')[0] === '#/outcomes') viewOutcomesC(); else location.hash = '#/outcomes';
}

function cWireCharts(only) {
  const page = $('.kpage'); const tip = $('.ktip');
  if (!page || !tip) return;
  const show = (el, x, y) => { const [a, b, c] = el.dataset.tip.split('|'); tip.textContent = '';
    const v = document.createElement('b'); v.textContent = b; tip.appendChild(v);
    const l = document.createElement('span'); l.textContent = a + (c ? ' · ' + c : ''); tip.appendChild(l);
    const box = page.getBoundingClientRect(); tip.style.left = (x - box.left + 14) + 'px'; tip.style.top = (y - box.top + 14) + 'px'; tip.classList.add('on'); el.classList.add('hot'); };
  (only || page).querySelectorAll('[data-tip]').forEach((el) => {
    el.addEventListener('pointermove', (e) => show(el, e.clientX, e.clientY));
    el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); });
    const hide = () => { tip.classList.remove('on'); el.classList.remove('hot'); };
    el.addEventListener('pointerleave', hide); el.addEventListener('blur', hide);
    el.addEventListener('click', () => cChartGo(el.dataset.kgo));
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cChartGo(el.dataset.kgo); } });
  });
}



// THE KIT'S SCENES IN A PAGE THAT NEVER RELOADS. Kit part 9 looks for its .m-scene sections
// once, at load, which suits a report and misses every screen this app draws later. So each
// view that carries a scene calls this after it renders: stagger is applied, then every scene
// plays once when it reaches the middle of the window, exactly as the kit does it (the same
// observer margin, the same scroll sweep). AT MOST TWO SCENES PER TAB (KB 08 P5, 02.10.2026),
// and a test counts them. With reduced motion the kit never sets html.m-on, nothing is hidden
// and this does nothing.
function cScenes(root) {
  const M = window.Motion;
  if (!M || !M.on || !root) return;
  root.querySelectorAll('[data-stagger]').forEach((box) => {
    const v = box.getAttribute('data-stagger-var') || '--i';
    box.querySelectorAll(box.getAttribute('data-stagger')).forEach((e, i) => e.style.setProperty(v, i));
  });
  const scenes = [...root.querySelectorAll('.m-scene:not(.in)')];
  if (!scenes.length) return;
  // ONE DEPARTURE FROM THE KIT, on purpose: a report scrolls a chapter into the middle of the
  // window, a dashboard OPENS with its charts already in view. At the kit's mid-screen line a
  // chart sitting at 50-60% of the height stayed an empty axis until somebody scrolled, which
  // reads as a broken chart. Here a scene plays once its top is in the upper 85% of the window.
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) { M.fire(e.target); io.unobserve(e.target); }
  }), { rootMargin: '0px 0px -15% 0px' });
  scenes.forEach((sc) => io.observe(sc));
  // a hidden pane stalls the observer, so look once now and on every scroll, as the kit does
  const sweep = () => { const h = window.innerHeight;
    scenes.forEach((sc) => { const r = sc.getBoundingClientRect(); if (r.top < h * 0.85 && r.bottom > 0) M.fire(sc); }); };
  setTimeout(sweep, 60);
  window.addEventListener('scroll', sweep, { passive: true });
}

// WHY PEOPLE STOP, AGAINST THE LIST WE ACTUALLY ENFORCE (Admissions, open since
// 29.09.2026). The reason model was never missing: config.closedReasons holds ten, the
// status route refuses a close without one of them, and the picker is built from it.

//
// This decides nothing. It shows the reasons people carry, with how many (since Q33, 05.10.2026, only the reasons
// somebody has: a list of zeros pushed the people below the fold), and each is a click to those people (Q36).
function cReasonBreakdown(np, noReason) {
  const all = CFG.closedReasons || [];
  if (!np.length) return '';
  const used = new Map();
  for (const p of np) if (p.closed_reason) used.set(p.closed_reason, (used.get(p.closed_reason) || 0) + 1);
  // Anything RECORDED that is not in the list is shown too, and marked. It means the list
  // changed under data already written, and hiding it would hide the drift.
  const extra = [...used.keys()].filter((r) => !all.includes(r));
  // only the reasons somebody has (the owner, 05.10.2026): a list of zeros pushed the people below the fold
  const rows = [...all.map((r) => [r, used.get(r) || 0, false]), ...extra.map((r) => [r, used.get(r), true])].filter((r) => r[1] > 0);
  if (!rows.length) return '';
  const top = Math.max(1, ...rows.map((r) => r[1]));
  const bars = rows.map(([label, n, odd]) => '<div class="c-reasonbar' + (C_OUT_REASON === label ? ' on' : '') + '" role="button" tabindex="0"'
    + ' data-r="' + esc(label) + '" onclick="C_OUT_REASON=this.dataset.r;cDrawJourneyPool();window.scrollTo(0,0)">'
    + '<span>' + esc(label) + (odd ? ' <em>not in the list</em>' : '') + '</span>'
    + '<i style="width:' + Math.max(2, (n / top) * 100) + '%"></i><b>' + n + '</b></div>').join('');
  return '<div class="c-reasons">'
    + '<h3>Why they stopped<b>' + (np.length - noReason) + ' of ' + np.length + ' recorded</b></h3>'
    + '<div class="c-reasonbars">' + bars + '</div>'
    + '</div>';
}

// Who has just arrived and needs understanding. One line per arrival; clicking it
// opens the SAME two questions the classic dialog asks, in place, with the same field

// person") and its rules run unchanged. Nothing about qualifying changed.
let C_LOPEN = null;
// A phone row's body is the call log, one line per call, because one number is one
// thing to look at however many times it rings. Printed raw that is three near-
// identical sentences on a queue you SCAN, which is the fault P5 names: the row must
// show what you decide on - how many times, and whether the last one was answered -
// and the full log stays in the body for whoever opens the row. One call: unchanged.
function cCallLine(body) {
  const lines = String(body || '').split('\n').filter(Boolean);
  if (lines.length < 2) return body || '';
  const last = lines[lines.length - 1];
  const when = (last.match(/(\d{2}:\d{2})/) || [])[1] || '';
  return `${lines.length} calls, last ${/missed call/i.test(last) ? 'missed' : 'answered'}${when ? ' ' + when : ''}`;
}

// THE SAME CARD, ONE LEVEL DEEPER (the owner, 05.10.2026: "The today tab can have the exactly as the home to reports

// One dropdown of the filter row: the People filters' look (c-jf), "All" first.

// The band is sticky under whatever is pinned above it (the phone's top bar); scrolled past, it folds to its row.
function cPoolWire() {

  // only a TOP bar counts (a phone); the wide screen's side menu is sticky too, but beside the page, not above it
  const box = nav ? nav.getBoundingClientRect() : null;
  const pinned = box && box.width > window.innerWidth * 0.8 && ['sticky', 'fixed'].includes(getComputedStyle(nav).position) ? box.height : 0;
  document.documentElement.style.setProperty('--p-top', Math.round(pinned) + 'px');
  if (!window.__cPoolScroll) {
    window.__cPoolScroll = 1;
    window.addEventListener('scroll', cPoolMini, { passive: true });
    window.addEventListener('resize', () => { cPoolMiniTop = null; cPoolMini(); });
  }
  cPoolMini();
}
let cPoolMiniTop = null;
function cPoolMini() {

// SEEN, FOR THE MENU'S NEW. The moment THIS USER last opened each pool; what arrived after it is new. The first visit
// marks nothing new. Q52, the owner 05.10.2026: "just new to each user count we show" - so the store is keyed by the
// signed-in user (the acting-as user when nobody is signed in), and two colleagues on one PC never clear each other's.
const cSeenWho = () => String((AUTH.user && (AUTH.user.email || AUTH.user.name)) || ACTOR || '').trim().toLowerCase();
const cSeenKey = (k) => 'crmSeen:' + cSeenWho() + ':' + k;
function cSeen(k) { try { return localStorage.getItem(cSeenKey(k)) || ''; } catch { return ''; } }
function cSeeNow(k) { try { localStorage.setItem(cSeenKey(k), new Date().toISOString()); } catch {} }
// Q52, the owner 05.10.2026 on patch 14: "Now the item count. Either we drop it or we do it properly. Lets drop it for
// now. And just new to each user count we show." - the NEW mark and the bold figure, and NOTHING when nothing is new.
// No total anywhere in the menu or the tab bar; the pools keep their own counts in their bands.
const cBadge = (fresh) => (fresh ? `<i class="nw" aria-hidden="true">NEW</i><b class="nn">${fresh}</b><span class="c-sr"> new</span>` : '');
async function cPoolCounts() {
  try {
    const [i, t, ppl] = await Promise.all([api('/api/intake'), api('/api/tasks?scope=open'), api('/api/people')]);
    const after = (k, at) => { const s = cSeen(k); return Boolean(s && at && at > s); };
    const inbox = (i.rows || []);
    const dueNow = cByPerson(cDueNow(t));
    const people = (ppl && ppl.rows) || [];
    const put = (sel, html) => { const el = document.querySelector(sel); if (el) el.innerHTML = html; };
    // Today = everyone who needs an action NOW: Overdue + Due today + No next step (MASTER CONTROL for the owner,
    // 05.10.2026), which is exactly the set Today opens on; Coming up is a click away and not counted.
    const none = people.filter((p) => !C_TERMINAL.includes(p.status) && !p.next_action_at && !cSisHolds(p));
    put('#cnLeads', cBadge(inbox.filter((r) => after('leads', r.received_at)).length));
    // a step is new on Today when its due DAY began after the last visit (it entered Today since), or it was planned
    // since; a step due later today is not new the moment Today has been opened
    const seenDay = cSeen('today') ? cDay(cSeen('today')) : '';
    const becameDue = (x) => Boolean(seenDay && cDay(x.due_at) > seenDay);
    put('#cnNext', cBadge(dueNow.filter((g) => g.some((x) => becameDue(x) || after('today', x.created_at))).length
      + none.filter((p) => after('today', p.created_at)).length));
    put('#cnJourney', cBadge(people.filter((p) => after('journey', p.created_at)).length));
  } catch {}
}
// Opening a pool marks it seen and refreshes the menu's counts; a click inside the pool is not a new opening.
const C_POOL_T = {};
function cPoolOpened(k) { const now = Date.now(); if (C_POOL_T[k] && now - C_POOL_T[k] < 4000) return; C_POOL_T[k] = now; cSeeNow(k); cNavCounts(); }

// ---- TODAY: Overdue · Due today · Coming up · No next step, one row per person
let C_TP = { col: null, programme: '', stage: '', source: '', upOpen: false, more: {}, pick: null };
let C_TPD = null;
function cTodayPick(v) { C_TP.col = C_TP.col === v ? null : v; cTodayPool(); }
function cTodayPool() {
  const D = C_TPD; if (!D) return;
  const okP = (p) => Boolean(p) && (!C_TP.programme || (p.programme || cNotSaid) === C_TP.programme) && (!C_TP.stage || p.status === C_TP.stage)
    && (!C_TP.source || (p.source_channel || cNotSaid) === C_TP.source);
  const okG = (g) => okP(D.byId.get(g[0].person_id));
  const groups = [
    { id: 'over', label: 'Overdue', rows: cByPerson(D.over).filter(okG), fn: D.pTasks, tone: 'over' },
    { id: 'today', label: 'Due today', rows: cByPerson(D.today).filter(okG), fn: D.pTasks, tone: 'today' },

    { id: 'none', label: 'No next step', rows: D.none.filter(okP), fn: D.pRow, tone: 'none' }];
  // NO CARD CHOSEN = what needs an action now: Overdue, Due today and No next step, lit together - the menu's count is
  // these people. Coming up is a click away. A card narrows to itself; a second click goes back to the three.
  const NOW = ['over', 'today', 'none'];
  const shown = C_TP.col ? groups.filter((g) => g.id === C_TP.col) : groups.filter((g) => NOW.includes(g.id));
  const open = D.people.filter((p) => !C_TERMINAL.includes(p.status));

    band: cPoolCards('Due', 'Needs you', groups.map((g) => ({ id: g.id, label: g.label, n: g.rows.length, tone: g.tone, lit: !C_TP.col && NOW.includes(g.id) })), C_TP.col, 'cTodayPick'),

      cPoolSelect('Source', C_TP.source, sources, 'C_TP.source=this.value;cTodayPool()')],   // Admissions 05.10: Source on Today too
      C_TP.programme || C_TP.stage || C_TP.source ? "C_TP.programme='';C_TP.stage='';C_TP.source='';cTodayPool()" : ''),
    body: cTodayBoard(D, groups) + (!C_TP.col || C_TP.col === 'none' ? groups.filter((g) => g.id === 'none').map((g) => `<div class="c-sheet c-nextsheet p-rows" id="p-${g.id}"><h3>${g.label}<b>${g.rows.length}</b></h3>${
      g.rows.map(g.fn).join('') || '<div class="c-empty">Nobody here.</div>'}</div>`).join('') : ''),

// THE TODAY BOARD (the owner's pick B from the A/B pictures, 06.10.2026): Overdue and Due today are columns of cards in
// the Journey board's card style, Coming up is FOLDED to its count (a click unfolds it), No next step stays the list
// below with "Choose next step". Drag a card to reschedule its step(s): onto Due today = due today; onto Coming up = a
// small date picker opens on the card. Nothing is dragged INTO Overdue (that would be a date in the past), and no stage
// moves here: the Journey board keeps those (and their back-move note).
const C_TCOL_SHOW = 7;
function cTodayBoard(D, groups) {
  if (C_TP.col === 'none') return '';

  if (!cols.length) return '';
  const folded = (g) => g.id === 'later' && !C_TP.col && !C_TP.upOpen;
  const tomorrow = new Date(Date.parse(cTodayIso() + 'T12:00:00Z') + 86400000).toISOString().slice(0, 10);
  const pick = (pid, col) => (C_TP.pick && C_TP.pick.pid === pid && C_TP.pick.from === col
    ? `<div class="t-pick" onclick="event.stopPropagation()" ondragstart="event.preventDefault()">
        <label for="tPickDate">New date</label><input id="tPickDate" type="date" min="${tomorrow}" value="${tomorrow}">
        <div class="c-row-acts"><button class="btn sm" onclick="cTodayMoveTo('${esc(pid)}', '${col}', document.getElementById('tPickDate').value)">Save</button>
        <button class="btn sm ghost" onclick="C_TP.pick=null;cTodayPool()">Cancel</button></div></div>` : '');
  const card = (ts, col) => { const t0 = ts[0]; const pid = t0.person_id;
    const w = col === 'over' ? ' is-over' : col === 'today' ? ' is-today' : '';

    return `<div class="c-jp row t-card c-rail c-rail-${rail}${w}" draggable="true" data-pid="${esc(pid)}" data-col="${col}" tabindex="0"
      onclick="location.hash='#/person/${esc(pid)}'" onkeydown="if(event.key==='Enter')location.hash='#/person/${esc(pid)}'">
      <b>${esc(t0.name)}</b><small>${esc(t0.programme || 'programme not said')} · ${esc(cStage(t0.status))}</small>
      ${ts.map((t) => `<span class="c-jnext">${cStepIcon(t.label)}<span>${esc(cTask(t.label))}</span></span>
        <div class="t-foot">${cStateLine(...cStepState(D.byId.get(pid), t))}${D.done(t)}</div>`).join('')}${pick(pid, col)}</div>`; };
  const column = (g, i) => {
    if (folded(g)) return `<div class="c-col t-col t-fold c-drop t-drop" data-col="later" role="button" tabindex="0" aria-label="Coming up: ${g.rows.length}, open"
      onclick="C_TP.upOpen=true;cTodayPool()" onkeydown="if(event.key==='Enter'){C_TP.upOpen=true;cTodayPool()}"><span class="t-foldl">Coming up</span><b>${g.rows.length}</b></div>`;
    const open = C_TP.more[g.id] || (C_TP.pick && g.rows.some((ts) => ts[0].person_id === C_TP.pick.pid));
    const shown = open ? g.rows : g.rows.slice(0, C_TCOL_SHOW);
    const rest = g.rows.length - shown.length;
    const more = rest > 0 ? `<button type="button" class="c-jmore" onclick="event.stopPropagation();C_TP.more['${g.id}']=true;cTodayPool()">${rest} more</button>`
      : C_TP.more[g.id] && g.rows.length > C_TCOL_SHOW ? `<button type="button" class="c-jmore" onclick="event.stopPropagation();C_TP.more['${g.id}']=false;cTodayPool()">Show fewer</button>` : '';
    const fold = g.id === 'later' && !C_TP.col ? `<button type="button" class="t-foldx" onclick="C_TP.upOpen=false;cTodayPool()">Fold</button>` : '';

      <div class="c-drop t-drop" data-col="${g.id}">${shown.map((ts) => card(ts, g.id)).join('') || '<div class="c-empty">Nobody here.</div>'}${more}</div></div>`;
  };
  const widths = cols.map((g) => (folded(g) ? '92px' : 'minmax(0,1fr)')).join(' ');
  return `<div class="c-cols t-board" style="grid-template-columns:${widths}">${cols.map(column).join('')}</div>`;
}
function cTodayWire() {
  document.querySelectorAll('.t-card[draggable]').forEach((c) => c.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', c.dataset.pid + '|' + c.dataset.col)));
  document.querySelectorAll('.t-drop').forEach((z) => {
    const to = z.dataset.col;
    if (to === 'over') return;   // nothing is moved into the past
    z.addEventListener('dragover', (e) => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', (e) => { e.preventDefault(); z.classList.remove('over');
      const [pid, from] = String(e.dataTransfer.getData('text/plain') || '').split('|');
      if (pid && from && from !== to) cTodayDrop(pid, from, to); });
  });
  const d = document.getElementById('tPickDate'); if (d) d.focus();
}
// Onto Due today: the step(s) are due today. Onto Coming up: the date is asked on the card first.
function cTodayDrop(pid, from, to) {
  if (to === 'today') return cTodayMoveTo(pid, from, cTodayIso());
  if (to === 'later') { C_TP.pick = { pid, from }; return cTodayPool(); }
}
async function cTodayMoveTo(pid, from, day) {
  if (!day || day < cTodayIso()) return;   // never into the past
  const D = C_TPD; if (!D) return;
  const ts = (D[from] || []).filter((t) => t.person_id === pid);
  try {
    for (const t of ts) await post(`/api/tasks/${Number(t.id)}/reschedule`, { due: day });
    C_TP.pick = null;
    await viewTodayC();
    cNavCounts();
  } catch (err) { alert(err.message); }
}

// ---- INBOX: Today · Yesterday · Earlier this week · Older, by when the message arrived (Q67: one scale, 07.10.2026)
// THE INBOX BOARD (Q62, the owner's pick A from the pictures, 06.10.2026; on the first board's columns: "Not relevant is
// not even needed there, that garbage! And what is the cohorts like new, new lead and later? thats silly. But overall
// the cards are good choice!"). Columns by arrival day, in his order "By dates first, then by channels. Then by kind of
// senders": the band's four ages are the columns, Source and Kind are the filters. One card per message, the Journey
// board's card style, the action ON the card: "Make a lead" opens the small form on it, "Set aside" is the quiet link
// (the reason dialog as before; nothing is deleted). No New lead, Not relevant or Later column. A message set aside
// is still reachable by address (#/leads?show=archived), without the actions.
let C_IP = { col: null, channel: '', kind: '', show: 'new' };
let C_IPD = null;
function cInboxPick(v) { C_IP.col = C_IP.col === v ? null : v; cInboxPool(); }
const C_IP_KIND = [['possible_student', 'Possible student'], ['current_student', 'Current student'], ['other', 'Other']];
function cInboxAge(iso) {
  const day = cDay(iso), today = cTodayIso();
  const back = (n) => new Date(Date.parse(today) - n * 86400000).toISOString().slice(0, 10);
  return day === today ? 'today' : day === back(1) ? 'yesterday' : day >= back(6) ? 'week' : 'older';
}
// how long ago, as a person says it: "10 min", "3 h", "2 d"
const cAgo = (iso) => { const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000)); return m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`; };
function cInboxPool() {
  const D = C_IPD; if (!D) return;
  const ok = (r) => (!C_IP.channel || r.channel === C_IP.channel) && (!C_IP.kind || r.senderKind === C_IP.kind);
  const rows = D.rows.filter(ok);
  const AGES = [['today', 'Today'], ['yesterday', 'Yesterday'], ['week', 'Earlier this week'], ['older', 'Older']];
  const cols = AGES.map(([id, label]) => ({ id, label, n: rows.filter((r) => cInboxAge(r.received_at) === id).length, tone: 'age-' + id }));
  const chans = [...new Set(D.rows.map((r) => r.channel))].sort().map((c) => [c, channelLabel(c)]);
  const live = C_IP.show === 'new';   // a message set aside keeps its card, without the actions
  const who = (r) => esc(r.contact_name || r.contact_handle || '') || cTelLink({ phone: r.contact_phone }) || 'Unknown';
  const card = (r) => {
    const open = C_LOPEN === r.id; const prog = D.val(r, 'interest');
    // the state line (Q66): how long the message has waited and whether that is late (Q50); a card set aside says so
    const st = !live ? 'aside' : r.aged ? 'late' : r.answerNow ? 'now' : 'new';
    const kind = r.senderKind === 'current_student' ? `<span class="ib-kind" title="${esc(r.senderKindWhy || '')}">Current student</span>` : '';
    const toggle = `C_LOPEN=${open ? 'null' : Number(r.id)};cInboxPool()`;
    return `<div class="c-jp row ib-card c-rail c-rail-${C_ST_RAIL[st]}${open ? ' is-open' : ''}" data-id="${Number(r.id)}" tabindex="0" onclick="${toggle}" onkeydown="if(event.key==='Enter'){${toggle}}">
      <div class="ib-top"><b class="c-reach">${who(r)}</b></div>
      <small class="ib-ch"><i></i>${esc(channelLabel(r.channel))}</small>
      <div class="ib-msg">${esc(r.channel === 'phone' ? cCallLine(r.body) : (r.body || D.val(r, 'question') || ''))}</div>
      ${prog || kind ? `<div class="ib-tags">${prog ? `<span class="ib-prog">${esc(prog)}</span>` : ''}${kind}</div>` : ''}
      ${cStateLine(st, cAgo(r.received_at), '', fmtDateTime(r.received_at))}
      ${!live ? '' : open ? D.form(r) : `<div class="ib-acts"><button class="btn sm" onclick="event.stopPropagation();C_LOPEN=${Number(r.id)};cInboxPool()">Make a lead</button><button type="button" class="ib-aside" onclick="event.stopPropagation();openArchive(${Number(r.id)})">Set aside</button></div>`}</div>`;
  };
  // a band click narrows the board to that day's column; a second click shows all four again
  const shownCols = cols.filter((c) => !C_IP.col || c.id === C_IP.col);
  const column = (c, i) => `<div class="c-col ib-col" style="--jt:${((i + 1) / shownCols.length).toFixed(3)}"><h3><span class="c-jn">${i + 1}</span>${esc(c.label)}<b>${c.n}</b></h3>
      <div class="c-drop">${rows.filter((r) => cInboxAge(r.received_at) === c.id).map(card).join('') || '<div class="c-empty">Nothing here.</div>'}</div></div>`;
  const board = rows.length
    ? `<div class="c-cols ib-board" style="grid-template-columns:repeat(${shownCols.length},minmax(0,1fr))">${shownCols.map(column).join('')}</div>`
    : `<div class="c-sheet"><div class="c-empty">${live ? 'Nothing waiting. This queue is clear.' : 'Nothing here.'}</div></div>`;
  $('#view').innerHTML = cPoolFrame({
    title: 'Inbox',
    band: cPoolBand('Inbox', cols, C_IP.col, 'cInboxPick'),
    filters: cPoolFilters('the inbox', [

// The People filters: the Journey's compact dropdowns (same look, same Clear), and they combine.
const C_PF_DUE = [['over', 'Overdue'], ['today', 'Today'], ['none', 'No next step']];
const C_PF_DATA = [['nocontact', 'No email or phone'], ['odd', 'Programme not in the list']];
function cPeopleMatch(p, t, f, known) {
  const open = !C_TERMINAL.includes(p.status);
  if (f.stage === 'open' && !open) return false;
  // "Not proceeding · Cold": the cold ones, for marketing (Admissions 30.09, the owner's MVP 02.10)
  if (f.stage && f.stage.startsWith('tag:')) {
    if (p.status !== ((CFG.stageRoles || {}).closed || 'Not proceeding') || p.closed_tag !== f.stage.slice(4)) return false;
  } else if (f.stage && f.stage !== 'open' && p.status !== f.stage) return false;
  if (f.due === 'none') { if (!open || t || cSisHolds(p)) return false; }
  else if (f.due && !(t && cWhenClass(t.due_at) === f.due)) return false;
  if (f.arrived && !cDay(p.created_at).startsWith(f.arrived)) return false;   // the year of first contact (Q36)

  const one = (v) => (v ? [v] : []);

async function cSavePerson(id) {
  const { people, taskOf } = C_PDATA; const p = people.find((x) => x.id === id); const t = taskOf.get(id);

  // The two refusals the server makes, asked BEFORE anything is saved, so a refused

  if (v('#pe-status') === cClosedStage() && p.status !== cClosedStage() && (CFG.closedReasonNeedsNote || []).includes(v('#pe-reason')) && !String(v('#pe-rnote') || '').trim()) return err(`"${v('#pe-reason')}" needs an explanation.`);
  try {

      const now = v(sel); if (now !== null && now !== (p[f] || '')) patch[f] = now;
    }

    const ask = st && st !== p.status && st !== cClosedStage() ? await cAskMoveNote(id, p.status, st) : { note: '' };
    if (!ask) return;

    else { const label = v('#pe-next'); if (label) await post(`/api/people/${id}/task`, { label, due: v('#pe-ndue') }); }

  // Array.isArray is not defensive dressing: a bare string passes .length AND .includes, and
  // 'over'.includes('') is true, so a filter left as a string would quietly keep the people it was
  // supposed to remove. A wrong type now filters nothing, which is visible, instead of filtering
  // wrongly, which is not.
  const kept = (k, v) => { const sel = Array.isArray(f[k]) ? f[k] : []; return !sel.length || sel.includes(v); };
  if (!kept('programme', prog)) return false;
  if (!kept('owner', owner)) return false;
  if (!kept('source', src)) return false;
  if (!kept('stage', p.status)) return false;
  // the kind of the next step. A person with none can only match when nothing is chosen.
  if (!kept('group', t ? (groupForAction(cTask(t.label)) || 'No group') : cSisHolds(p) ? null : 'No next step')) return false;
  // THE STEP ITSELF, not only its group (Admissions: the list item by item). A person with no
  // step can only match when nothing is chosen, exactly as the group filter behaves.
  if (!kept('step', t ? cTask(t.label) : cSisHolds(p) ? null : 'No next step')) return false;
  if (!kept('due', t ? cWhenClass(t.due_at) : '')) return false;
  return true;
}
function cJourneyFilters(open) {
  const distinct = (key) => [...new Set(open.map((p) => p[key] || cNotSaid))];
  const known = CFG.programmes || [];
  const progs = distinct('programme').sort((a, b) => (known.indexOf(a) + 1 || 99) - (known.indexOf(b) + 1 || 99) || a.localeCompare(b));
  // every configured owner role, even one nobody holds right now (the owner: "add coordinator also")
  const owners = [...new Set([...(CFG.owners || []), ...distinct('owner')])];
  const sources = distinct('source_channel').sort((a, b) => a.localeCompare(b));
  const name = (k, v) => (v === cNotSaid ? 'not recorded' : k === 'source' ? channelLabel(v) : v);
  const box = (k, label, values) => {
    const picked = C_JF[k] || [];
    const labelOf = (v) => (values.find(([x]) => x === v) || [, v])[1];
    const text = !picked.length ? 'All'
      : picked.length === 1 ? labelOf(picked[0])
      : labelOf(picked[0]) + ' +' + (picked.length - 1);
    const open = C_JFOPEN === k;
    return `<div class="c-jf c-jfm${picked.length ? ' on' : ''}"><span>${label}</span><button type="button" class="c-jfb"
      aria-expanded="${open}" aria-haspopup="true" aria-label="${esc(label)}"
      onclick="event.stopPropagation();cJfToggle('${k}')">${esc(text)}</button>${open
      ? `<div class="c-jfmenu" role="group" aria-label="${esc(label)}" onclick="event.stopPropagation()">${values.map(([v, t]) =>
          `<label><input type="checkbox" value="${esc(v)}"${picked.includes(v) ? ' checked' : ''}
            onchange="cJfPick('${k}', this.value, this.checked)"><span>${esc(t)}</span></label>`).join('')}</div>`
      : ''}</div>`;
  };
  const any = Object.values(C_JF).some((v) => v && v.length);
  return `<div class="c-jfilters" role="group" aria-label="Filter the Journey">
    <svg class="c-jf-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11l-4.2 5v4l-2.6 1.2V8.5z"/></svg>
    ${box('programme', 'Programme', progs.map((v) => [v, name('programme', v)]))}
    ${box('due', 'Overdue / Today', C_JF_DUE)}
    ${box('owner', 'Owner', owners.map((v) => [v, name('owner', v)]))}
    ${box('source', 'Came from', sources.map((v) => [v, name('source', v)]))}
    ${any ? '<button class="btn sm ghost c-jf-clear" onclick="cJfClear()">Clear</button>' : ''}
  </div>`;
}
// FOR MANAGEMENT (30.09.2026): where the waiting is, in two rows of bars.
// Row one is the stages, in board order. Row two is the kind of next step, which is
// the question "what is the team actually doing next", and it carries No next step as
// a real bar because that is the number worth acting on.
//
// Both rows count the SAME people the columns below are drawn from - everyone still
// open, before the filters - so a bar can never disagree with the board. Clicking a
// bar filters the board by exactly what that bar counted, and clicking it again clears
// it, so the summary is also the control.
// THE JOURNEY BAND (the owner, 02.10.2026: "B for home. Then the journey displayed like the ui
// from A", then "Dots per person is not very portraying visual. Cant count them really").
//
// THE TASK FIRST (KB 08 P5 rule 12): compare stage against stage, to see where people pile up
// and where the late work sits. Comparison is easiest on ONE baseline and ONE scale, so:
//   - one column per active stage, every column on the same baseline and the same scale
//     (the biggest stage sets it; no stage is normalised on its own)
//   - the count above the column is the only text on it
//   - overdue is the RED BASE of the column, always drawn, never hover-only. It sits on the
//     baseline too, so overdue is comparable stage to stage on the same scale as the totals
//   - the exit mark under each stage stays: who left the journey from there
// Arrived and the two outcomes are the bookends, figures and not columns: Arrived counts
// this year's new leads and the outcomes count the whole database, so putting them on the
// stages' scale would mix three different bases in one comparison.
//
// One operational surface: a column IS the stage filter the board already has (cJfPick), so
// clicking it filters the board right under it and clicking it again clears it.
// Depth is the FRAME's (the lit well, the locked gradient); every column is flat, one colour,
// no light on it, so no stage can look bigger than it counts (KB 08 P5 Depth and 3D).
function cJourneyBand(everyone, taskOf, stages, exitMark, out) {
  const on = (v) => (C_JF.stage || []).includes(v);
  const late = (p) => { const t = taskOf.get(p.id); return Boolean(t && cWhenClass(t.due_at) === 'over'); };
  const cols = stages.map((st) => {
    const ps = everyone.filter((p) => p.status === st.id);
    return { id: st.id, label: st.label || st.id, n: ps.length, over: ps.filter(late).length };
  });
  const max = Math.max(1, ...cols.map((c) => c.n));
  const pct = (n) => ((n / max) * 100).toFixed(2);
  const col = (c, i) => `<div class="jb-cell"><button type="button" class="jb-col${on(c.id) ? ' on' : ''} m-fade" style="--i:${i}"
      aria-pressed="${on(c.id)}" data-v="${esc(c.id)}" onclick="cJfPick('stage', this.dataset.v, !${on(c.id)})"
      title="${esc(c.label)}: ${c.n} ${c.n === 1 ? 'person' : 'people'}${c.over ? `, ${c.over} overdue` : ''}"
      aria-label="${esc(c.label)}: ${c.n}${c.over ? `, ${c.over} overdue` : ''}">
      <span class="jb-plot"><span class="jb-bar" style="height:${pct(c.n)}%"><b class="jb-n">${c.n}${c.over ? `<em>${c.over}</em>` : ''}</b>${
        c.over ? `<i class="jb-over" style="height:${((c.over / c.n) * 100).toFixed(2)}%"></i>` : ''}</span></span>
      <span class="jb-l"><span class="c-jn">${i + 1}</span>${esc(c.label)}</span>
    </button>${exitMark(c.id)}</div>`;
  return `<section class="kflow jband${out.play ? ' m-scene' : ''}" aria-label="The journey">
    <div class="jband-row">
      <a class="jb-end" href="#/people" onclick="cGoPeople({ arrived: '${out.year}' });return false"><span>Arrived</span><b>${out.arrived === null ? '<span class="kgapn" title="not available">—</span>' : out.arrived}</b><small>${out.year}</small></a>
      <div class="jb-cols" style="--n:${cols.length}">
        ${cols.map(col).join('')}
      </div>
      <div class="jb-outs">
        <a class="jb-end good${on(out.admLabel) ? ' on' : ''}" href="#/outcomes" aria-pressed="${on(out.admLabel)}" data-v="${esc(out.admLabel)}" onclick="C_OUTCOME='Admitted';C_OUT_FILTER=null;cJfPick('stage', this.dataset.v, !${on(out.admLabel)});return false"><span>${esc(out.admLabel)}</span><b>${out.adm}</b></a>
        <a class="jb-end${on(out.npLabel) ? ' on' : ''}" href="#/outcomes" aria-pressed="${on(out.npLabel)}" data-v="${esc(out.npLabel)}" onclick="C_OUTCOME='Not proceeding';C_OUT_TAG=null;cJfPick('stage', this.dataset.v, !${on(out.npLabel)});return false"><span>${esc(out.npLabel)}</span><b>${out.np}</b>${
          out.unrecorded ? `<small>${out.np - out.unrecorded} with a recorded stage, ${out.unrecorded} without</small>` : ''}</a>
      </div>
    </div></section>`;
}

function cJourneySummary(everyone, taskOf, stages) {
  // "WHAT COMES NEXT" IS GONE (the owner, 06.10.2026, of the two bar rows behind it: "why? What is the purpose of
  // this?", then his pick "Remove it"). It cut the same open people by the KIND of step they wait on and by the step
  // itself; on the real data it read "No group" (the default step "Get in touch" is in no configured kind) and "No next
  // step", which Today already shows. The board and its filters are unchanged.
  // ACTIVE JOURNEY above the line, OUTCOMES below it (the owner, 01.10.2026). The five
  // stages are a track somebody is still moving along. Admitted and Not proceeding are
  // what HAPPENED to that journey, not two more stages, so they sit under a rule, in
  // their own words, and neither can be mistaken for the step after Contract.
  //
  // One exit mark under every stage, because leaving is possible from ANY of them. A
  // single "Not proceeding" box at the end would say the opposite - that you only stop
  // after Contract - and the per-stage counts also make the shape of the losses
  // readable: three leaving at Contacted is a different problem from three at
  // Application.
  // The mark sits INSIDE the stage's own cell, not in a second row underneath. A parallel
  // row only lines up while the stages fit on one line: the moment the row wrapped - a
  // narrow window, or a sixth stage - every mark was still in its grid column but no
  // longer under the stage it belonged to, which is worse than not drawing it at all.
  const exits = C_JEXITS || {};
  const exitMark = (id) => {
    const n = exits.byStage ? (exits.byStage[id] || 0) : 0;
    return `<span class="c-exit${n ? '' : ' none'}" title="${n} left the journey from ${esc(id)}"><i></i>${n}</span>`;
  };

  const roles = CFG.stageRoles || {};
  // from the WHOLE database, not from `everyone`, which is the open people only
  const all = (C_JDATA && C_JDATA.people) || [];
  const adm = all.filter((p) => p.status === roles.admitted).length;
  const np = all.filter((p) => p.status === roles.closed).length;
  // The outcomes are the band's right-hand bookends (02.10.2026): each fact once.
  const band = cJourneyBand(everyone, taskOf, stages, exitMark, {
    adm, np, admLabel: roles.admitted || 'Admitted', npLabel: roles.closed || 'Not proceeding',
    unrecorded: exits.unrecorded || 0,
    arrived: C_JDATA && typeof C_JDATA.arrived === 'number' ? C_JDATA.arrived : null,
    year: C_JDATA && C_JDATA.year ? C_JDATA.year : '', play: Boolean(C_JDATA && C_JDATA.play) });

  return `<div class="c-summary">
    <h4>Active journey <small><a class="c-jcount" href="#/people" onclick="cGoPeople({ stage: 'open' });return false">${everyone.length} ${everyone.length === 1 ? 'person you are still working with' : 'people you are still working with'}</a></small></h4>
    ${band}</div>`;
}

// SCREEN 3, THE BOARD, ONE LEVEL AT A TIME (the owner, 01.10.2026: "all together is just
// tooooo much"). The summary above was re-levelled on 01.10; the five columns below still
// printed every card, so Application and Contract ran the page to about 1,460 px.
//
// Each column now opens with its C_JCOL_SHOW most urgent people and one line for the rest.
// MOST URGENT FIRST, or a cap would hide exactly the people somebody is late for:
// most days overdue, then due today, then the next date, then nobody's next step. The
// line carries its count, so opening it is a choice, not a lottery, and a column that is
// open stays open across a redraw. The person whose card is open is always shown.
const C_JCOL_SHOW = 5;
const C_JCOLOPEN = new Set();
function cJUrgency(t, p) {
  if (!t || !t.due_at) return [cSisHolds(p) ? 4 : 3, 0];   // no next step, then the people the SIS holds (Q66)
  const w = cWhenClass(t.due_at);
  return w === 'over' ? [0, -cDaysLate(t.due_at)] : w === 'today' ? [1, 0] : [2, Date.parse(cDay(t.due_at)) || 0];
}
function cJSort(ps, taskOf) {
  return ps.map((p, i) => [p, cJUrgency(taskOf.get(p.id), p), i])
    .sort((a, b) => a[1][0] - b[1][0] || a[1][1] - b[1][1] || a[2] - b[2]).map((x) => x[0]);
}
function cJColumn(stageId, ps, taskOf, sel) {
  const sorted = cJSort(ps, taskOf);
  const open = C_JCOLOPEN.has(stageId);
  let shown = open ? sorted : sorted.slice(0, C_JCOL_SHOW);
  if (!open && sel && sorted.includes(sel) && !shown.includes(sel)) shown = sorted.filter((p) => shown.includes(p) || p === sel);
  const rest = sorted.length - shown.length;
  // THE GROUPS INSIDE A COLUMN (Q66): a band heads each state's cards and counts everyone in the column in that state,
  // the people behind "N more" too. An end column has one state and no band.
  const grp = (p) => (C_TERMINAL.includes(p.status) ? 'end' : cStepGroup(p, taskOf.get(p.id)));
  const n = {}; for (const p of sorted) n[grp(p)] = (n[grp(p)] || 0) + 1;
  let last = null;
  const cards = shown.map((p) => { const g = grp(p); const band = g !== last && g !== 'end' ? cGroupBand(g, n[g], stageId) : ''; last = g;
    return band + (sel && p.id === sel.id
    ? `<div class="c-jexp" data-id="${esc(p.id)}"><button type="button" class="c-jexp-x" aria-label="Close" onclick="event.stopPropagation();cJClose()">✕</button>${C_PEDIT === p.id ? `<div class="c-card c-jedit">${cEditForm(p, taskOf.get(p.id))}</div>` : cPersonCard(p, taskOf.get(p.id))}</div>`
    : C_TERMINAL.includes(p.status) ? cJEndCard(p, sel) : cJourneyCard(p, taskOf.get(p.id), sel)); }).join('');
  const more = rest > 0
    ? `<button type="button" class="c-jmore" onclick="event.stopPropagation();cJColToggle('${esc(stageId)}')">${rest} more</button>`
    : open && sorted.length > C_JCOL_SHOW
      ? `<button type="button" class="c-jmore" onclick="event.stopPropagation();cJColToggle('${esc(stageId)}')">Show fewer</button>` : '';
  return cards + more;
}
// An end-column card (Q57) says how the journey ended - the date admitted, or the tag and the reason - never "Choose
// next step". It still opens and edits in place; it is dragged back only through a stage's own column (a note asked).
function cJEndCard(p, sel) {
  const closed = p.status === ((CFG.stageRoles || {}).closed || 'Not proceeding');
  return `<div class="c-jp row c-jend${sel && p.id === sel.id ? ' c-sel' : ''}" draggable="true" data-id="${esc(p.id)}" tabindex="0" onclick="cJOpen('${esc(p.id)}')" onkeydown="if(event.key==='Enter')cJOpen('${esc(p.id)}')"><b>${esc(p.name)}</b><small class="c-jout">${closed
    ? `${p.closed_tag ? cTagChip(p.closed_tag) : ''}${cColdWhy(p)}` : `Admitted${p.admitted_at ? ' ' + esc(fmtDate(p.admitted_at)) : ''}`}</small></div>`;
}
function cJColToggle(id) { if (C_JCOLOPEN.has(id)) C_JCOLOPEN.delete(id); else C_JCOLOPEN.add(id); cDrawJourney(); }

// THE QUICK VIEW OPENS WHERE YOU CLICKED (the owner, 02.10.2026: "it expands exactly from the spot
// you clicked it, pushed other around it away and slightly making darker the everything around
// that card"). FLIP: every card's box is measured before the redraw and after it, and each one is
// moved back to where it was and let go, so the clicked card grows out of its own spot and its
// neighbours slide out of the way. A veil darkens the rest; the veil, Escape or the cross closes it.
// This is the tab's second motion scene (the band's arrival is the first): KB 08 P5 allows two.
// Reduced motion: the card simply appears.
let C_JFLIP = null;
function cJFlipMeasure() {
  const m = new Map();
  document.querySelectorAll('.c-cols [data-id]').forEach((el) => m.set(el.dataset.id, el.getBoundingClientRect()));
  return m;
}
function cJOpen(id) { C_JFLIP = cJFlipMeasure(); C_JSEL = id; cDrawJourney(); }
function cJClose() { if (!C_JSEL) return; C_PEDIT = null; C_JFLIP = cJFlipMeasure(); C_JSEL = null; cDrawJourney(); }
function cJFlipPlay() {
  const before = C_JFLIP; C_JFLIP = null;
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!before || still) return;
  document.querySelectorAll('.c-cols [data-id]').forEach((el) => {
    const a = before.get(el.dataset.id); if (!a || !el.animate) return;
    const b = el.getBoundingClientRect(); if (!b.width || !b.height) return;
    // only the quick view itself grows out of the clicked card; every other card SLIDES, never
    // stretches, because a stretched card stretches its words (seen running, 02.10.2026)
    const grow = el.classList.contains('c-jexp');
    const dx = a.left - b.left, dy = a.top - b.top, sx = grow ? a.width / b.width : 1, sy = grow ? a.height / b.height : 1;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sx - 1) < 0.01 && Math.abs(sy - 1) < 0.01) return;
    el.animate([{ transformOrigin: '0 0', transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})` }, { transformOrigin: '0 0', transform: 'none' }],
      { duration: 563, easing: 'cubic-bezier(.22,.9,.3,1)' });   // the kit's pace, 25% slower than 450
  });
}
if (typeof document !== 'undefined' && document.addEventListener) document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && C_JSEL && !C_JFOPEN) cJClose(); });

// Q57: WHAT A WAY IN TARGETED, ON THE BOARD. Home, Reports and the Help flow send more than a column: a Reports
// figure's people (C_PCOHORT), Home's Arrived (C_PF.arrived), a Cold / Reject tag or a reason on Not proceeding, a
// month on Admitted (C_OUT_FILTER). The board narrows to exactly those people, says so in one chip each, and the
// chip's cross lets it go - so the count on arrival is the figure, as it was on the List.
function cJTargetKeep(p, taskOf) {
  const roles = CFG.stageRoles || {};
  const closed = roles.closed || 'Not proceeding', admitted = roles.admitted || 'Admitted';
  if (C_PCOHORT && !C_PCOHORT.ids.has(p.id)) return false;
  if (C_PF.arrived && !cDay(p.created_at).startsWith(C_PF.arrived)) return false;   // the year of first contact (Q36)
  if (p.status === closed && C_OUT_TAG && p.closed_tag !== C_OUT_TAG) return false;
  if (p.status === closed && C_OUT_REASON && p.closed_reason !== C_OUT_REASON) return false;
  const oF = C_OUT_FILTER;
  if (p.status === admitted && oF) {
    if ((oF.kind === 'month' || oF.kind === 'year') && !cDay(p.admitted_at).startsWith(oF.key)) return false;
    if (oF.kind === 'prog' && (p.programme || '(not recorded)') !== oF.key) return false;
    if (oF.kind === 'chan' && (p.source_channel || 'unknown') !== oF.key) return false;
  }
  return true;
}
const cJTargeted = () => Boolean(C_PCOHORT || C_PF.arrived);
function cJTargetChips() {
  const x = (label, clear) => `<div class="c-filter">${esc(label)} <button class="btn sm ghost" onclick="${clear};cDrawJourney()">Show everyone ✕</button></div>`;
  return [C_PCOHORT ? x(C_PCOHORT.label, 'C_PCOHORT=null') : '',
    C_PF.arrived ? x('Arrived in ' + C_PF.arrived, "C_PF.arrived=''") : '',
    C_OUT_FILTER ? x(C_OUT_FILTER.label || '', 'C_OUT_FILTER=null') : '',
    C_OUT_TAG ? x(cTagLabel({ closed_tag: C_OUT_TAG }) || C_OUT_TAG, 'C_OUT_TAG=null') : '',
    C_OUT_REASON ? x(C_OUT_REASON, 'C_OUT_REASON=null') : ''].join('');
}
function cDrawJourney() {
  const { taskOf } = C_JDATA;
  const people = C_JDATA.people.filter((p) => cJTargetKeep(p, taskOf));
  // THE END COLUMNS (Q57): Admitted and Not proceeding are the band's bookends, as before the 05.10 frame. A click on
  // one - or any way in that targets it - filters the board to it exactly as a stage click does, and its column is
  // drawn at the end of the board; a figure that counts finished people (a Reports cohort, Arrived) draws theirs too.
  const ends = C_TERMINAL.filter((id) => (C_JF.stage || []).includes(id) || (cJTargeted() && people.some((p) => p.status === id)));
  const stages = (CFG.stages || []).filter((s) => !C_TERMINAL.includes(s.id) || ends.includes(s.id));
  const everyone = people.filter((p) => !C_TERMINAL.includes(p.status));
  const open = people.filter((p) => !C_TERMINAL.includes(p.status) || ends.includes(p.status)).filter((p) => cJourneyMatch(p, taskOf.get(p.id), C_JF));
  const narrow = window.matchMedia && window.matchMedia('(max-width:900px)').matches;
  // NO PERSON UNTIL ONE IS CLICKED (the owner, 02.10.2026). The board used to pick the first
  // person on its own, so a random lead sat on the left like a hero and took 320px from the board.
  const sel = open.find((p) => p.id === C_JSEL) || null;
  // fetch the selected person's conversation once, then redraw with it
  // Redraw only if the answer actually arrived. Without the check, anything that
  // resolves without filling the map - a stub, a future refactor - redraws, asks again,
  // resolves, redraws, for ever.
  if (sel && !C_JTALK.has(sel.id) && !C_JTALK_BUSY.has(sel.id)) {
    cJourneyTalk(sel.id).then(() => { if (C_JTALK.has(sel.id)) cDrawJourney(); });
  }
  $('#view').innerHTML = `
    <div class="c-head"><div><h1>Journey</h1></div><div class="act">${cPoolViewSwitch()}<button class="btn" onclick="openAdd()">Add lead</button></div></div>
    ${cJourneySummary(everyone, taskOf, stages.filter((s) => !C_TERMINAL.includes(s.id)))}
    ${cJourneyFilters(everyone)}${cJTargetChips()}
    <div class="c-journey c-nosel">${sel ? '<div class="c-jveil" onclick="cJClose()"></div>' : ''}<div style="min-width:0">
      <div class="c-cols" style="grid-template-columns:${stages.map((s) => (sel && sel.status === s.id ? 'minmax(330px, 2.4fr)' : 'minmax(150px, 1fr)')).join(' ')}">${stages.map((s, i) => { const ps = open.filter((p) => p.status === s.id);
        // an end column is a place to look, not a drop target: a close needs its reason (the edit form asks it)
        if (C_TERMINAL.includes(s.id)) return `<div class="c-col c-col-end${s.id === (CFG.stageRoles || {}).admitted ? ' good' : ''}" style="--jt:1"><h3>${esc(s.label || s.id)}</h3><div class="c-endcol" data-stage="${esc(s.id)}">${cJColumn(s.id, ps, taskOf, sel) || '<div class="c-empty" style="padding:8px">empty</div>'}</div></div>`;
        return `<div class="c-col" style="--jt:${((i + 1) / stages.length).toFixed(3)}"><h3><span class="c-jn">${i + 1}</span>${esc(s.label || s.id)}</h3><div class="c-drop" data-stage="${esc(s.id)}">${cJColumn(s.id, ps, taskOf, sel) || '<div class="c-empty" style="padding:8px">empty</div>'}</div></div>`; }).join('')}</div>
    </div></div>`;
  if (C_JDATA.play) cScenes($('#view'));
  if (narrow && sel && C_JSEL === sel.id) { const card = document.querySelector('.c-jexp'); if (card && card.scrollIntoView) card.scrollIntoView({ block: 'nearest', inline: 'center' }); }
  cJFlipPlay();
