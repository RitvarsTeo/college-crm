// BY PROGRAMME, DRAWN (30.09.2026). One blue ramp, two weights: new leads light,
// admitted solid, both scaled to the largest new-leads figure so the pair can be
// compared across programmes. The numbers stay beside their own bar - a bar without
// its value is a picture of a number nobody can check.
function cProgBars(rows) {
  if (!rows.length) return '<p class="c-empty">Nothing yet.</p>';
  const top = Math.max(1, ...rows.map((x) => Number(x.newLeads) || 0));
  const w = (n) => ((Number(n) || 0) / top * 100).toFixed(1);
  return `<div class="c-progs">${rows.map((x) => `<div class="c-prog">
    <b>${esc(x.programme)}</b>
    <span class="c-pbar"><i class="lead" style="width:${w(x.newLeads)}%"></i><em>${Number(x.newLeads) || 0}</em></span>
    <span class="c-pbar"><i class="adm" style="width:${w(x.admitted)}%"></i><em>${Number(x.admitted) || 0}</em></span>
  </div>`).join('')}</div>`;
}


function cMonthChart(months, year) {
  if (!months.length) return '<p class="c-empty">No admissions recorded this year yet.</p>';
  // On a phone the chart is drawn for a phone (the review UX pass, 29.09.2026): drawn 640 wide and shrunk to
  // ~330 px, its labels came out at 5-6 px. Drawn 360 wide, they stay about the size they are written.
  const narrow = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  // WIDE: drawn WIDER, not BIGGER. The viewBox locks height to width, so letting a 640x210 chart
  // fill a 1600 px panel would make it 525 px tall. Drawing it 1100 wide at the same height keeps
  // the rendered height where it was (about 290 px) and spends the new room on the months instead.
  // The CSS cap steps at the same 1500 px, so the two never disagree.
  const wide = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(min-width:1500px)').matches;
  const W = narrow ? 360 : wide ? 1100 : 640, H = narrow ? 230 : 210, L = narrow ? 28 : 30, R = 8, T = 14, B = 26, n = months.length;
  const top = Math.max(10, ...months.map((m) => Math.max(m.admitted, m.newLeads)));
  // Gridlines on round numbers (0, 10, 20, 30), never quarters of the top (0, 8, 15, 23).
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find((s) => top / s <= 5) || Math.ceil(top / 5);
  const max = Math.ceil(top / step) * step, band = (W - L - R) / n, bw = Math.min(22, band * 0.42), y = (v) => T + (H - T - B) * (1 - v / max);
  const ticks = Array.from({ length: max / step + 1 }, (_, k) => k * step);
  const grid = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="kg"/><text x="${L - 8}" y="${y(v) + 4}" class="kt" text-anchor="end">${v}</text>`).join('');
  const cols = months.map((m, k) => { const cx = L + band * k + band / 2, t = y(m.admitted), mo = C_MONTHS[Number(m.month.slice(5)) - 1];
    const bar = m.admitted ? `<path d="M${cx - bw / 2},${y(0)} V${Math.min(t + 4, y(0))} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${y(0)} Z" style="fill:var(--v-adm)"/>` : '';
    return `<g class="kcol" tabindex="0" role="button" aria-label="${mo} ${m.month.slice(0, 4)}: ${m.admitted} admitted, ${m.newLeads} new leads" data-tip="${mo} ${m.month.slice(0, 4)}|${m.admitted} admitted|${m.newLeads} new leads" data-kgo="month|${m.month}|${mo} ${m.month.slice(0, 4)}"><rect x="${cx - band / 2}" y="${T}" width="${band}" height="${H - T - B}" class="khit"/>${bar}<text x="${cx}" y="${H - 8}" class="kt" text-anchor="middle">${mo}</text></g>`; }).join('');
  const pts = months.map((m, k) => [L + band * k + band / 2, y(m.newLeads)]);
  return `<svg viewBox="0 0 ${W} ${H}" class="kchart${narrow ? ' narrow' : ''}" role="img" aria-label="Admissions and new leads per month, ${year}">${grid}${cols}<path d="M${pts.map((p) => p.join(',')).join(' L')}" class="kline"/>${pts.map(([x, yy]) => `<circle cx="${x}" cy="${yy}" r="4" class="kdot"/>`).join('')}</svg>`;
}
function cDonut(rows) {
  const total = rows.reduce((a, r) => a + r[1], 0) || 1, R = 58, r0 = 40, c = 70, gap = 0.035;
  let a = -Math.PI / 2;
  const p = (ang, rad) => `${c + rad * Math.cos(ang)},${c + rad * Math.sin(ang)}`;
  const seg = rows.filter((r) => r[1] > 0).map(([k, n, v, go]) => { const sw = (n / total) * Math.PI * 2, a0 = a + gap / 2, a1 = a + sw - gap / 2; a += sw; const big = a1 - a0 > Math.PI ? 1 : 0;
    return `<path d="M${p(a0, R)} A${R},${R} 0 ${big} 1 ${p(a1, R)} L${p(a1, r0)} A${r0},${r0} 0 ${big} 0 ${p(a0, r0)} Z" style="fill:var(--v-${v})" class="kseg" tabindex="0" role="button" aria-label="${k}: ${n}" data-tip="${k}|${n} people|${Math.round((n / total) * 100)}% of ${total}" data-kgo="${go === 'journey' ? 'journey' : 'outcome|' + go}"/>`; }).join('');
  return `<div class="kdonut"><svg viewBox="0 0 140 140" role="img" aria-label="Where everyone is now">${seg}<text x="70" y="68" text-anchor="middle" class="kbig">${total}</text><text x="70" y="86" text-anchor="middle" class="kt">people</text></svg>
    <ul class="klegend">${rows.map(([k, n, v]) => `<li><i style="background:var(--v-${v})"></i><span>${k}</span><b>${n}</b></li>`).join('')}</ul></div>`;
}
function cBars(rows, kind) {
  if (!rows.length) return '<p class="c-empty">Nobody admitted yet.</p>';
  const max = Math.max(...rows.map((r) => r[1]));
  return `<div class="kbars">${rows.map(([label, n, why, key]) => `<div class="kbar" tabindex="0" role="button" data-tip="${esc(label)}|${n} admitted${why ? '|' + esc(why) : ''}" data-kgo="${kind}|${esc(key)}|${esc(label)}">
      <span class="kbl">${why ? `<span class="c-gap">${esc(label)}</span>` : esc(label)}</span><span class="kbt"><i style="width:${Math.max(3, (n / max) * 100)}%;background:var(--v-${why ? 'np' : 'adm'})"></i></span><b>${n}</b></div>`).join('')}</div>`;
}
function cWireCharts() {
  const page = $('.kpage'); const tip = $('.ktip');
  if (!page || !tip) return;
  const show = (el, x, y) => { const [a, b, c] = el.dataset.tip.split('|'); tip.textContent = '';
    const v = document.createElement('b'); v.textContent = b; tip.appendChild(v);
    const l = document.createElement('span'); l.textContent = a + (c ? ' · ' + c : ''); tip.appendChild(l);
    const box = page.getBoundingClientRect(); tip.style.left = (x - box.left + 14) + 'px'; tip.style.top = (y - box.top + 14) + 'px'; tip.classList.add('on'); el.classList.add('hot'); };
  page.querySelectorAll('[data-tip]').forEach((el) => {
    el.addEventListener('pointermove', (e) => show(el, e.clientX, e.clientY));
    el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); });
    const hide = () => { tip.classList.remove('on'); el.classList.remove('hot'); };
    el.addEventListener('pointerleave', hide); el.addEventListener('blur', hide);
    el.addEventListener('click', () => cChartGo(el.dataset.kgo));
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cChartGo(el.dataset.kgo); } });
  });
}
// A chart click opens exactly the people behind the number it was showing.
let C_OUT_FILTER = null;
function cChartGo(spec) {
  const [kind, key, label] = String(spec || '').split('|');
  if (kind === 'journey') { location.hash = '#/journey'; return; }
  if (kind === 'outcome') { C_OUTCOME = key; C_OUT_FILTER = null; location.hash = '#/outcomes'; return; }
  C_OUTCOME = 'Admitted';
  C_OUT_FILTER = { kind, key, label };
  if (location.hash === '#/outcomes') viewOutcomesC(); else location.hash = '#/outcomes';
}

  const sect = (title, rows, fn, tone = '') => `<div class="c-sheet c-nextsheet"><h3>${title}<b${tone && rows.length ? ` class="c-count ${tone}"` : ''}>${rows.length}</b></h3>${rows.map(fn).join('') || '<div class="c-empty">None.</div>'}</div>`;

    <div class="c-head"><div><h1>Next Steps</h1></div>
      <div class="act"><span class="c-planned"><b>${pct}%</b> planned <small>${open.length - none.length} of ${open.length} open people have a next step</small></span></div></div>

async function cSavePerson(id) {

  // save never leaves half of the changes written. The server still checks both.
  if (!String(v('#pe-name') || '').trim()) return err('A person needs a name.');
  if (v('#pe-status') === cClosedStage() && p.status !== cClosedStage() && (CFG.closedReasonNeedsNote || []).includes(v('#pe-reason')) && !String(v('#pe-rnote') || '').trim()) return err(`"${v('#pe-reason')}" needs an explanation.`);

    const st = v('#pe-status');

}

  const cls = ['c-jp', 'row', sel && p.id === sel.id ? 'c-sel' : '', w === 'over' ? 'is-over' : '', w === 'today' ? 'is-today' : ''].filter(Boolean).join(' ');
  const life = p.sis ? `<small class="c-jlife" title="In the SIS${p.sis.since ? ', by ' + esc(cDay(p.sis.since)) : ''}">SIS: ${esc(p.sis.label)}</small>`
    : cLifeFacts(p).map(([, at, short]) => `<small class="c-jlife" title="From the SIS, by ${esc(cDay(at))}">${esc(short)}</small>`).join('');
  return `<div class="${cls}" draggable="true" data-id="${esc(p.id)}" tabindex="0" onclick="C_JSEL='${esc(p.id)}';cDrawJourney()"><b>${esc(p.name)}</b>${life}${t
    ? `<span class="c-jnext">${cStepIcon(t.label)}<span>${esc(cTask(t.label))}</span></span><small class="c-jdue${w ? ' ' + w : ''}">${due}</small>`
    : '<small class="none">No next step</small>'}${cComment(p) ? `<small class="c-jnote" title="${esc(p.last_comment || p.notes)}">${esc(cComment(p))}</small>` : ''}</div>`;
}
// JOURNEY FILTERS (the review' feedback 2A, 28.09.2026: real filters, not one-choice pills). Four
// compact dropdowns - Programme, Overdue / Today, Owner, Came from - offering only the values the
// open people really carry. They combine (all must hold). A filter that is set says so: its box
// turns Navy-edged and shows the chosen value. Nothing is stored on the server.
// MULTIPLE SELECTION (29.09.2026). Each filter now holds a LIST, not one value, and an empty list
// means "all". A native <select multiple> was not an option: it is a resizing list box that needs
// ctrl-click and is unusable on a phone, so each filter is a button that opens its own tick list.
// The board redraws on every tick, so the menu that is open is recorded and re-opened afterwards -
// otherwise choosing two programmes would mean opening the same menu twice.
// This also brings back "overdue AND today", which was dropped as a third option when it could only
// be a designed choice; as two ticks it costs nothing and is the manager's own choice.
let C_JF = { programme: [], due: [], owner: [], source: [], stage: [], group: [] };
let C_JFOPEN = null;
const C_JF_EMPTY = () => ({ programme: [], due: [], owner: [], source: [], stage: [], group: [] });
function cJfToggle(k) { C_JFOPEN = C_JFOPEN === k ? null : k; cDrawJourney(); }
function cJfPick(k, value, on) {
  const set = new Set(C_JF[k] || []);
  if (on) set.add(value); else set.delete(value);
  C_JF[k] = [...set];
  cDrawJourney();
}
function cJfClear() { C_JF = C_JF_EMPTY(); C_JFOPEN = null; cDrawJourney(); }
const C_JF_DUE = [['over', 'Overdue'], ['today', 'Today']];   // "Overdue or today" was dropped: it was just the two together
const cNotSaid = '\u2014';   // stands for "no value recorded" in a filter
function cJourneyMatch(p, t, f) {
  const prog = p.programme || cNotSaid, owner = p.owner || cNotSaid, src = p.source_channel || cNotSaid;
  // An empty list means every value, so a filter nobody has touched holds nothing back.
  // Array.isArray is not defensive dressing: a bare string passes .length AND .includes, and
  // 'over'.includes('') is true, so a filter left as a string would quietly keep the people it was
  // supposed to remove. A wrong type now filters nothing, which is visible, instead of filtering
  // wrongly, which is not.
  const kept = (k, v) => { const sel = Array.isArray(f[k]) ? f[k] : []; return !sel.length || sel.includes(v); };
  if (!kept('programme', prog)) return false;
  if (!kept('owner', owner)) return false;
  if (!kept('source', src)) return false;
  if (!kept('stage', p.status)) return false;
  // the kind of the next step. A person with none can only match when nothing is chosen.
  if (!kept('group', t ? (groupForAction(cTask(t.label)) || 'No group') : 'No next step')) return false;
  if (!kept('due', t ? cWhenClass(t.due_at) : '')) return false;
  return true;
}
function cJourneyFilters(open) {
  const distinct = (key) => [...new Set(open.map((p) => p[key] || cNotSaid))];
  const known = CFG.programmes || [];
  const progs = distinct('programme').sort((a, b) => (known.indexOf(a) + 1 || 99) - (known.indexOf(b) + 1 || 99) || a.localeCompare(b));
  // every configured owner role, even one nobody holds right now (the owner: "add coordinator also")
  const owners = [...new Set([...(CFG.owners || []), ...distinct('owner')])];
  const sources = distinct('source_channel').sort((a, b) => a.localeCompare(b));
  const name = (k, v) => (v === cNotSaid ? 'not recorded' : k === 'source' ? channelLabel(v) : v);
  const box = (k, label, values) => {
    const picked = C_JF[k] || [];
    const labelOf = (v) => (values.find(([x]) => x === v) || [, v])[1];
    const text = !picked.length ? 'All'
      : picked.length === 1 ? labelOf(picked[0])
      : labelOf(picked[0]) + ' +' + (picked.length - 1);
    const open = C_JFOPEN === k;
    return `<div class="c-jf c-jfm${picked.length ? ' on' : ''}"><span>${label}</span><button type="button" class="c-jfb"
      aria-expanded="${open}" aria-haspopup="true" aria-label="${esc(label)}"
      onclick="event.stopPropagation();cJfToggle('${k}')">${esc(text)}</button>${open
      ? `<div class="c-jfmenu" role="group" aria-label="${esc(label)}" onclick="event.stopPropagation()">${values.map(([v, t]) =>
          `<label><input type="checkbox" value="${esc(v)}"${picked.includes(v) ? ' checked' : ''}
            onchange="cJfPick('${k}', this.value, this.checked)"><span>${esc(t)}</span></label>`).join('')}</div>`
      : ''}</div>`;
  };
  const any = Object.values(C_JF).some((v) => v && v.length);
  return `<div class="c-jfilters" role="group" aria-label="Filter the Journey">
    <svg class="c-jf-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11l-4.2 5v4l-2.6 1.2V8.5z"/></svg>
    ${box('programme', 'Programme', progs.map((v) => [v, name('programme', v)]))}
    ${box('due', 'Overdue / Today', C_JF_DUE)}
    ${box('owner', 'Owner', owners.map((v) => [v, name('owner', v)]))}
    ${box('source', 'Came from', sources.map((v) => [v, name('source', v)]))}
    ${any ? '<button class="btn sm ghost c-jf-clear" onclick="cJfClear()">Clear</button>' : ''}
  </div>`;
}
// FOR MANAGEMENT (30.09.2026): where the waiting is, in two rows of bars.
// Row one is the stages, in board order. Row two is the kind of next step, which is
// the question "what is the team actually doing next", and it carries No next step as
// a real bar because that is the number worth acting on.
//
// Both rows count the SAME people the columns below are drawn from - everyone still
// open, before the filters - so a bar can never disagree with the board. Clicking a
// bar filters the board by exactly what that bar counted, and clicking it again clears
// it, so the summary is also the control.
function cJourneySummary(everyone, taskOf, stages) {
  const on = (k, v) => (C_JF[k] || []).includes(v);
  const byStage = stages.map((st) => [st.id, st.label || st.id,
    everyone.filter((p) => p.status === st.id).length]);

  const groups = (CFG.nextActions || []).map((g) => g.group);
  const kindOf = (p) => { const t = taskOf.get(p.id); if (!t) return 'No next step';
    return groupForAction(cTask(t.label)) || 'No group'; };
  const byKind = [...groups, 'No group', 'No next step']
    .map((g) => [g, g, everyone.filter((p) => kindOf(p) === g).length])
    .filter(([, , n]) => n > 0);

  const row = (key, rows) => {
    const top = Math.max(1, ...rows.map((r) => r[2]));
    return `<div class="c-sumrow">${rows.map(([v, label, n]) => `<button type="button"
      class="c-sum${on(key, v) ? ' on' : ''}" aria-pressed="${on(key, v)}"
      onclick="cJfPick('${key}', this.dataset.v, !${on(key, v)})" data-v="${esc(v)}">
      <b>${n}</b><i style="height:${Math.max(3, (n / top) * 34)}px"></i><span>${esc(label)}</span>
    </button>`).join('')}</div>`;
  };
  return `<div class="c-summary">${row('stage', byStage)}${row('group', byKind)}</div>`;
}

function cDrawJourney() {
  const { people, taskOf } = C_JDATA;
  const stages = (CFG.stages || []).filter((s) => !C_TERMINAL.includes(s.id));
  const everyone = people.filter((p) => !C_TERMINAL.includes(p.status));
  const open = everyone.filter((p) => cJourneyMatch(p, taskOf.get(p.id), C_JF));
  const narrow = window.matchMedia && window.matchMedia('(max-width:900px)').matches;
  const sel = open.find((p) => p.id === C_JSEL) || (narrow ? null : open[0]);
  const roles = CFG.stageRoles || {};
  const adm = people.filter((p) => p.status === roles.admitted).length, np = people.filter((p) => p.status === roles.closed).length;
  $('#view').innerHTML = `<p class="c-crumb">People</p>
    <div class="c-head"><div><h1>Journey</h1></div></div>
    ${cJourneySummary(everyone, taskOf, stages)}
    ${cJourneyFilters(everyone)}
    <div class="c-journey">${sel ? cPersonCard(sel, taskOf.get(sel.id)) : '<div></div>'}<div style="min-width:0">
      <div class="c-cols" style="grid-template-columns:repeat(${stages.length}, minmax(150px, 1fr))">${stages.map((s, i) => { const ps = open.filter((p) => p.status === s.id);
        const over = ps.filter((p) => { const t = taskOf.get(p.id); return t && cWhenClass(t.due_at) === 'over'; }).length;
        return `<div class="c-col" style="--jt:${((i + 1) / stages.length).toFixed(3)}"><h3><span class="c-jn">${i + 1}</span>${esc(s.label || s.id)} <b>${ps.length}</b>${over ? `<em class="c-jover">${over} overdue</em>` : ''}</h3><div class="c-drop" data-stage="${esc(s.id)}">${ps.map((p) => cJourneyCard(p, taskOf.get(p.id), sel)).join('') || '<div class="c-empty" style="padding:8px">empty</div>'}</div></div>`; }).join('')}</div>
      <div class="c-folded">Finished journeys are in Outcomes: <b><span class="c-ok">✓</span>${adm} admitted</b> <b><span class="c-no">✕</span>${np} not proceeding</b> <a class="btn sm ghost" href="#/outcomes" style="margin-left:auto">Open Outcomes →</a></div>
    </div></div>`;
  if (narrow && sel && C_JSEL === sel.id) { const card = document.querySelector('.c-journey > .c-card'); if (card && card.scrollIntoView) card.scrollIntoView({ block: 'start' }); }
  // one pair of listeners for the life of the page, not one per redraw: a click anywhere outside a
  // filter closes the open tick list, and so does Escape.
  if (!window.__cJfWired) {
    window.__cJfWired = 1;
    document.addEventListener('click', () => { if (C_JFOPEN) { C_JFOPEN = null; cDrawJourney(); } });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && C_JFOPEN) { C_JFOPEN = null; cDrawJourney(); } });
  }
  document.querySelectorAll('.c-jp[draggable]').forEach((c) => c.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', c.dataset.id)));
  document.querySelectorAll('.c-drop').forEach((col) => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', async (e) => { e.preventDefault(); col.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain'); const p = C_JDATA.people.find((x) => x.id === id); if (!p || p.status === col.dataset.stage) return;
      try { await post(`/api/people/${id}/status`, { status: col.dataset.stage }); C_JSEL = id; await viewJourneyC(); cNavCounts(); } catch (err) { alert(err.message); } });
  });
}

// ----------------------------------------------------------------- PERSON PAGE
// One person, read top to bottom: who they are, what we do next, what has happened.
// The facts sit in one sheet on the side and edit in place. Every button is the
// classic one (Done, Move, Log a call, Add a note, stage, SIS handover), so every rule
// the server keeps still applies; only the arrangement changed. Nothing is hidden that
// the classic page showed, and the notes, which it only showed inside Edit, are shown.
let C_PERSON = null; let C_PERSON_EDIT = false;
// The imported history carries DATES written as "2026-01-17T00:00:00", with no time and
// no zone. Printing "00:00" would claim a time nobody recorded, so those show the date.
const cStamp = (iso) => (/T00:00:00(\.0+)?$/.test(String(iso || '')) ? fmtDate(iso) : fmtDateTime(iso));
async function viewPersonC(id) {
  if (!C_PERSON || C_PERSON.id !== id) C_PERSON_EDIT = false;
  const p = await api('/api/people/' + id);

  const t = (p.tasks || []).find((x) => !x.done_at);

  const ev = (e) => `<div class="c-evt">
      <div class="c-evt-when">${cStamp(e.occurred_at)}${e.actor ? ' · ' + esc(e.actor) : ''}${e.channel ? ' · ' + esc(channelLabel(e.channel)) : ''}${e.origin === 'automatic' ? ' · <span class="c-auto">automatic</span>' : ''}</div>
      <div class="c-evt-what">${esc(e.subject || e.kind || '')}</div>
      ${e.field ? `<div class="c-evt-diff"><s>${esc(e.old_value ?? '(empty)')}</s> → <b>${esc(e.new_value ?? '(empty)')}</b></div>` : (e.body ? `<div class="c-evt-body">${esc(e.body)}</div>` : '')}</div>`;
  const next = open

        <div class="c-row-acts"><button class="btn sm" onclick="openComplete(${Number(t.id)}, ${esc(JSON.stringify(t.label))})">Done</button><button class="btn sm ghost" onclick="openReschedule(${Number(t.id)})">Move the date</button></div></div>`
      : `<div class="c-next none"><b>Next step</b>No next step<div class="c-row-acts"><button class="btn sm" onclick="openNewTask('${esc(p.id)}')">Plan a next step</button></div></div>`)
    : `<div class="c-next c-finished"><b>Outcome</b>${p.status === (CFG.stageRoles || {}).closed ? `<span class="c-no">✕</span>${esc(cStage(p.status))}${p.closed_reason ? ' · ' + esc(p.closed_reason) : ' · <span class="c-gap">reason not recorded</span>'}${p.closed_note ? `<div class="c-evt-body">${esc(p.closed_note)}</div>` : ''}` : `<span class="c-ok">✓</span>${esc(cStage(p.status))}${p.admitted_at ? ' on ' + fmtDate(p.admitted_at) : ''}`}${t ? `
        <div class="c-still"><b>Still open</b><div class="c-next-row"><span>${esc(cTask(t.label))}</span><span class="c-when ${cWhenClass(t.due_at)}">${cWhenText(t.due_at)}</span></div>
        <div class="c-row-acts"><button class="btn sm" onclick="openComplete(${Number(t.id)}, ${esc(JSON.stringify(t.label))}, true)">Done</button><button class="btn sm ghost" onclick="openReschedule(${Number(t.id)})">Move the date</button></div></div>` : ''}</div>`;
  $('#view').innerHTML = `<p class="c-crumb"><a href="#/people">People</a></p>
    <div class="c-head"><div><h1 class="c-pname">${esc(p.name)}</h1><p>${esc(cStage(p.status))} · ${esc(p.programme || 'programme not said')}${p.study_form ? ' · ' + esc(p.study_form) : ''} · ${contact || '<span class="c-gap">no email or phone recorded</span>'}</p></div></div>
    <div class="c-pgrid">
      <div class="c-pmain">
        ${cLifeLine(p)}${next}
        <div class="c-sheet"><h3>History<b>${tl.length}</b><span class="c-h3acts"><button class="btn sm ghost" onclick="openNote('${esc(p.id)}','call')">Log a call</button><button class="btn sm ghost" onclick="openNote('${esc(p.id)}','note')">Add a note</button></span></h3>
          ${p.hiddenCorrections ? `<p class="c-ev" style="margin:10px 16px 0">${p.hiddenCorrections} ${p.hiddenCorrections === 1 ? 'correction made by a colleague is' : 'corrections made by colleagues are'} not shown. Corrections are private to whoever made them; admins see all of them.</p>` : ''}
          ${tl.map(ev).join('') || '<div class="c-empty">Nothing has happened yet.</div>'}</div>
      </div>
      <aside class="c-pside">${cPersonFacts(p)}</aside>
    </div>`;
}
function cPersonFacts(p) {

      ${row('Study form', esc(p.study_form || ''))}${row('Education', esc(p.education || ''))}${row('Nationality', esc(p.nationality || ''))}
      ${row('Came from', came ? esc(came) + (cameWhy ? ` <small class="c-gap-soft">${esc(cameWhy)}</small>` : '') + (p.source_campaign ? ' / ' + esc(p.source_campaign) : '') : '')}
      ${p.source_detail ? row('How', esc(p.source_detail)) : ''}
      ${row('First contact', p.created_at ? fmtDate(p.created_at) : '')}
      ${row('Last contact', p.last_contact_at ? fmtDate(p.last_contact_at) : '')}
      ${row('Owner', esc(p.owner || ''), 'none')}
      ${p.contract_at ? row('Contract', fmtDate(p.contract_at)) : ''}
      ${p.admitted_at ? row('Admitted', fmtDate(p.admitted_at) + (p.student_no ? ' · ' + esc(p.student_no) : '')) : ''}
    </dl>
    ${p.notes ? `<div class="c-notes${p.notes.length > 240 ? ' c-clamp' : ''}">${esc(p.notes)}</div>${p.notes.length > 240 ? `<button class="c-more" onclick="const n=this.previousElementSibling;n.classList.toggle('c-clamp');this.textContent=n.classList.contains('c-clamp')?'Show all ${p.notes.length} characters':'Show less'">Show all ${p.notes.length} characters</button>` : ''}` : ''}</div>
    <div class="c-sheet c-facts"><h3>Stage</h3><div class="c-pad">
      <select id="cStage" aria-label="Stage" onchange="changeStatus('${esc(p.id)}', this.value)">${stages.map((s) => `<option value="${esc(s.id)}" ${s.id === p.status ? 'selected' : ''}>${esc(s.label || s.id)}</option>`).join('')}</select>
      ${p.status === (CFG.stageRoles || {}).admitted ? (p.sis_handoff_at ? `<p class="c-hint">Handed to the SIS on ${fmtDate(p.sis_handoff_at)}</p>` : `<button class="btn sm ghost" onclick="doSisHandoff('${esc(p.id)}')">Hand over to SIS</button>`) : ''}
    </div></div>

    </div></div>` : ''}
    ${(p.registrations || []).length ? `<div class="c-sheet c-facts"><h3>Events</h3><div class="c-pad">${p.registrations.map((r) => `<p class="c-line2">${esc(r.title)} · ${fmtDate(r.held_on)} ${esc(r.slot || '')} · ${r.attended === 1 ? '<b>attended</b>' : r.attended === 0 ? 'did not attend' : 'not marked'}</p>`).join('')}</div></div>` : ''}
    ${(p.simEvents || []).length ? `<div class="c-sheet c-facts"><h3>Integration events</h3><div class="c-pad">${p.simEvents.map((e) => `<p class="c-line2"><a href="#/inspector/${esc(e.id)}">${esc(e.channel)} · ${esc(e.scenario)}</a> <span class="c-gap-soft">${esc(e.direction)} · ${esc(e.decision)}</span></p>`).join('')}</div></div>` : ''}`;
}
// Edit in place: the same fields, lists and route as the classic Edit record, with
// the name check asked before anything is sent.
function cPersonForm(p) {
  const field = ([key, label, kind]) => {
    const v = p[key] == null ? '' : String(p[key]);
    const input = kind === 'textarea' ? `<textarea id="pf_${key}" rows="5">${esc(v)}</textarea>`
      : kind === 'text' ? `<input id="pf_${key}" value="${esc(v)}">`
      : `<select id="pf_${key}">${selectFor(kind, v)}</select>`;
    return `<div class="${kind === 'textarea' ? 'c-wide' : ''}"><label for="pf_${key}">${esc(label)}</label>${input}</div>`;
  };
  return `<div class="c-sheet c-facts"><h3>Edit details</h3><div class="c-pad"><div class="c-form c-form1">${EDIT_FIELDS.map(field).join('')}
      <div id="pfErr" class="c-wide"></div>
      <div class="c-wide c-row-acts" style="margin-top:4px"><button class="btn" onclick="cSavePersonPage('${esc(p.id)}')">Save</button><button class="btn ghost" onclick="C_PERSON_EDIT=false;viewPersonC('${esc(p.id)}')">Cancel</button></div>
      <p class="c-hint c-wide">Where they came from and the first contact date are locked. Every change is written to the history with the old value, the new value and ${AUTH.user ? 'your name' : 'the name picked in the sidebar'}.</p></div></div></div>`;
}
async function cSavePersonPage(id) {
  const p = C_PERSON; const err = (m) => { const e = $('#pfErr'); if (e) e.innerHTML = `<div class="err">${esc(m)}</div>`; };
  const name = ($('#pf_name') || {}).value || '';
  if (!name.trim()) return err('A person needs a name.');
  const patch = {};
  for (const [key] of EDIT_FIELDS) { const el = $('#pf_' + key); if (el && el.value !== (p[key] == null ? '' : String(p[key]))) patch[key] = el.value; }
  try {
    if (Object.keys(patch).length) await post(`/api/people/${id}/edit`, patch);
    C_PERSON_EDIT = false; await viewPersonC(id);
  } catch (e) { err(e.message); }
}

// ----------------------------------------------------------------- FULL REPORT
// The on-screen report behind the management download, over a period somebody chose.
// Same /api/report, same numbers. Arranged the way Home is: the period's counts, then
// what is true right now whatever the period, then the breakdowns, each with its gaps
// said out loud. Nothing is estimated and a blank is never drawn as a zero.
let C_RPT_PRESET = 'month';
// A Google Sheets export that could not finish comes back here with ?sheet=<reason>.
// Said once, in plain words, and taken out of the address so a reload does not repeat it.
const C_SHEET_TEXT = {
  declined: 'No sheet was made: Google access was not given. Nothing was saved in Google Drive.',
  wrong_account: 'No sheet was made: Google answered for a different account than the one signed in to the CRM. Choose your own novikontas.org account.',
  drive_api_disabled: 'No sheet was made: Google Drive is not switched on for the CRM yet. An admin enables the Google Drive API once in the CRM\'s Google Cloud project. Until then, download Excel; it opens in Google Sheets too.',
  no_permission: 'No sheet was made: Google did not give the CRM permission to create the file.',
  failed: 'No sheet was made: Google Drive did not accept the file. Nothing was saved. Try again, or download Excel.',
};
function cSheetNotice() {
  let why = null;
  try { why = new URLSearchParams(location.search).get('sheet'); } catch {}
  if (!why) return '';
  try { const u = new URL(location.href); u.searchParams.delete('sheet'); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch {}
  return `<div class="c-filter">${esc(C_SHEET_TEXT[why] || C_SHEET_TEXT.failed)}</div>`;
}
function cReportPreset(which) { C_RPT_PRESET = which; return setPeriodPreset(which); }
function cReportDates(from, to) { C_RPT_PRESET = null; setPeriod(from, to); }
async function viewReportsC() {
  const qs = new URLSearchParams();
  if (RPT.from) qs.set('from', RPT.from);
  if (RPT.to) qs.set('to', RPT.to);
  const r = await api('/api/report' + (qs.toString() ? '?' + qs : ''));
  const s = r.summary || {};
  const [from, to] = String(r.period.label || '').split(' to ');
  const thisMonth = cTodayIso().slice(0, 7);
  const months = (r.trend || []).filter((m) => m.month <= thisMonth);
  const lists = { programme: CFG.programmes, studyForm: CFG.studyForms, education: CFG.education, nationality: CFG.nationalities };
  const labelOf = (key, v) => {
    if (v === '(not recorded)' || v === '(no reason recorded)') return [v.replace(/[()]/g, ''), 'gap'];
    if (key === 'source') { const [l, why] = cChannel(v); return [l, why]; }
    if (key === 'stage') return [cStage(v), ''];
    const list = lists[key];
    return [v, list && list.length && !list.includes(v) ? 'not one of the list' : ''];
  };
  const bars = (key, rows) => {
    if (!rows || !rows.length) return '<p class="c-empty" style="padding:6px 0">Nobody in this period.</p>';
    const max = Math.max(...rows.map((x) => x.count));
    const total = rows.reduce((a, x) => a + x.count, 0);
    return `<div class="kbars">${rows.map((x) => { const [l, why] = labelOf(key, x.value);
      return `<div class="kbar c-static" title="${esc(l)}: ${x.count} of ${total}${why && why !== 'gap' ? ' · ' + esc(why) : ''}"><span class="kbl">${why ? `<span class="c-gap">${esc(l)}</span>` : esc(l)}</span><span class="kbt"><i style="width:${Math.max(3, (x.count / max) * 100)}%;background:var(--v-${why ? 'np' : 'adm'})"></i></span><b>${x.count}</b></div>`; }).join('')}</div>`;
  };
  const sect = (key, title, note) => `<section class="ksec"><div class="ksh"><h2>${title}</h2>${note ? `<span class="kt2">${note}</span>` : ''}</div>${bars(key, key === 'lost' ? r.lostReasons : r.breakdowns[key])}</section>`;
  const seg = (k, l) => `<button aria-pressed="${C_RPT_PRESET === k}" onclick="cReportPreset('${k}')">${l}</button>`;
  const cov = r.coverage || {};
  $('#view').innerHTML = `<p class="c-crumb"><a href="#/outcomes">Outcomes</a></p>
    <div class="c-head"><div><h1>Full report</h1><p>${esc(from || '')} to ${esc(to || '')}</p></div>
      <div class="act"><button class="btn" onclick="openExport()">Download for management review</button></div></div>
    ${cSheetNotice()}
    <div class="c-periodbar"><div class="c-seg" role="group" aria-label="Period">${seg('month', 'This month')}${seg('last', 'Last month')}${seg('year', 'This year')}${seg('all', 'Everything')}</div>
      <label class="c-date">From <input type="date" value="${esc(from || '')}" onchange="cReportDates(this.value, RPT.to || '${esc(to || '')}')"></label>
      <label class="c-date">To <input type="date" value="${esc(to || '')}" onchange="cReportDates(RPT.from || '${esc(from || '')}', this.value)"></label></div>
    <div class="kpage">
    <div class="kstrip c-five">
      <div class="khero"><span>New leads</span><b>${s.newLeads ?? 0}</b><small>first contact in these days</small></div>
      <div><span>Applications</span><b>${s.applications ?? 0}</b><small>reached Application or beyond</small></div>
      <div><span>Admitted</span><b>${s.admitted ?? 0}</b><small>in these days</small></div>
      <div><span>Conversion</span><b>${s.conversionPct == null ? '-' : s.conversionPct + '%'}</b><small>${s.conversionA ?? 0} / ${s.conversionB ?? 0} who arrived</small></div>
      <div><span>Median time to admission</span><b>${s.medianDaysToAdmission == null ? '-' : s.medianDaysToAdmission} <em>days</em></b><small>first contact to admission</small></div>
    </div>
    <a class="c-nowbar" href="#/next">
      <span><b>${s.activeApplicants ?? 0}</b>open</span>
      <span class="${s.overdue ? 'is-late' : ''}"><b>${s.overdue ?? 0}</b>overdue</span>
      <span class="${s.noNextAction ? 'is-late' : ''}"><b>${s.noNextAction ?? 0}</b>no next step</span>
    </a>
    <section class="ksec"><div class="ksh"><h2>Twelve months</h2><ul class="klegend inline"><li><i style="background:var(--v-adm)"></i><span>Admitted</span></li><li><i class="ln" style="background:var(--v-lead)"></i><span>New leads</span></li></ul></div>
      ${cMonthChart(months, to ? to.slice(0, 4) : '')}
      <details class="kdet"><summary>Show as a table</summary><table class="ktable"><thead><tr><th>Month</th><th>Admitted</th><th>New leads</th></tr></thead><tbody>${months.map((m) => `<tr><td>${esc(m.month)}</td><td>${m.admitted}</td><td>${m.newLeads}</td></tr>`).join('')}</tbody></table></details></section>
    <section class="ksec"><div class="ksh"><h2>By programme</h2><span class="kt2">the programmes the KPI sheet reports on</span></div>
      ${cProgBars(r.programmes || [])}</section>
    <div class="c-rgrid">
      ${sect('source', 'Where they came from', 'people who arrived')}
      ${sect('programme', 'Programme', 'people who arrived')}
      ${sect('studyForm', 'Study form', 'people who arrived')}
      ${sect('education', 'Education', `recorded for ${cov.education?.filled ?? 0} of ${cov.education?.of ?? 0}`)}
      ${sect('nationality', 'Nationality', `recorded for ${cov.nationality?.filled ?? 0} of ${cov.nationality?.of ?? 0}`)}
      ${sect('stage', 'Stage right now', 'everybody, not only these days')}
      ${sect('lost', 'Why people did not proceed', 'all time')}
      <section class="ksec"><div class="ksh"><h2>From a maritime school</h2></div><p class="c-num">${s.maritimeGraduates ?? 0}</p><p class="c-sub">${cov.education?.filled ?? 0} / ${cov.education?.of ?? 0} have an education recorded</p></section>
    </div>
    <div class="ktip" role="status" aria-live="polite"></div></div>`;
  cWireCharts();
}

let BUSY = 0, BUSY_TIMER = null;
function busy(delta) {
  BUSY = Math.max(0, BUSY + delta);
  if (BUSY && !BUSY_TIMER) {
    // nothing is shown for a request that answers straight away
    BUSY_TIMER = setTimeout(() => {
      if (!BUSY) return;
      if (!document.querySelector('#loadbar')) {
        const el = document.createElement('div');
        el.id = 'loadbar'; el.className = 'loading';
        document.body.appendChild(el);
      }
    }, 200);
  }
  if (!BUSY) {
    clearTimeout(BUSY_TIMER); BUSY_TIMER = null;
    const el = document.querySelector('#loadbar');
    if (el) el.remove();
  }
}

const api = async (path, opts) => {
  // every request says who is asking, so an admin-only screen does not have to
  // remember to add it to the query string and quietly get refused
  const o = { ...(opts || {}) };
  o.headers = { ...(o.headers || {}), 'x-acting-as': ACTOR };
  busy(1);
  try {
    const r = await fetch(path, o);
    // A signed-in session that has expired, or been invalidated because somebody
    // was disabled, must put the login back rather than show a broken screen.
    if (r.status === 401 && AUTH.on) { drawLogin('Your session has ended. Sign in again.'); throw new Error('signed out'); }
    if (!r.ok) {
      const e = await r.json().catch(() => ({ error: r.statusText }));
      const err = new Error(e.error || 'request failed');
      err.detail = e;          // the duplicate list, the reasons, whatever was refused with
      throw err;
    }
    return await r.json();
  } finally { busy(-1); }
};

// The animated sea, exactly as the kit wrote it, wrapped in a function so it runs
// when the gate is drawn rather than at load. NOTE: in a hidden browser pane rAF
// never fires, so the canvas simply stays on the gradient underneath - which is
// why the card is legible without it.
const LOGIN_SEA = () => {
  // The Client Hub sea, reused without retuning its wave parameters or colours.
  // It draws on a small canvas and lets CSS upscale it, keeping the login light.
  (() => {
    const cv = document.getElementById('login-sea');
    if (!cv?.getContext) return;
    const ctx = cv.getContext('2d', { alpha: false });
    if (!ctx) return;
  
    const TAU = Math.PI * 2;
    const OCT = [
      { ax: .9, ay: 3.3, amp: .46, spd: .24, sl: .05 },
      { ax: -2.2, ay: 6.9, amp: .40, spd: .46, sl: .28 },
      { ax: 4.1, ay: 12.7, amp: .33, spd: .76, sl: .85 },
      { ax: -7.3, ay: 22.3, amp: .23, spd: 1.14, sl: 1.20 },
      { ax: 12.9, ay: 37.1, amp: .14, spd: 1.63, sl: 1 },
      { ax: 19.7, ay: 8.3, amp: .11, spd: .62, sl: .30 },
    ];
    const AMPSUM = 1.42, REF = 1 / 420;
    let W = 0, H = 0, img, buf, quality = 1, raf = 0, last = 0, acc = 0, time = 0, cost = 0, samples = 0;
    const sA = [], cA = [], sB = [], cB = [];
    let vigX, vigY;
    const motion = matchMedia?.('(prefers-reduced-motion: reduce)');
  
    function allocate() {
      const vw = cv.clientWidth || 1, vh = cv.clientHeight || 1;
      const budget = (vw < 700 ? 105000 : 155000) * quality;
      W = Math.max(150, Math.round(Math.sqrt(budget * vw / vh)));
      H = Math.max(130, Math.round(budget / W));
      cv.width = W; cv.height = H; img = ctx.createImageData(W, H); buf = img.data;
      OCT.forEach((_, k) => { sA[k] = new Float32Array(W); cA[k] = new Float32Array(W); sB[k] = new Float32Array(H); cB[k] = new Float32Array(H); });
      vigX = new Float32Array(W); vigY = new Float32Array(H);
      for (let x = 0; x < W; x++) { const u = x / W - .5; vigX[x] = u * u * 1.35; }
      for (let y = 0; y < H; y++) { const v = y / H - .5; vigY[y] = v * v * .95; }
    }
  
    function render(t) {
      OCT.forEach((o, k) => {
        const ph = o.spd * t, kx = TAU * o.ax, ky = TAU * o.ay;
        for (let x = 0; x < W; x++) { const a = kx * x * REF + ph; sA[k][x] = Math.sin(a); cA[k][x] = Math.cos(a); }
        for (let y = 0; y < H; y++) { const b = ky * y * REF; sB[k][y] = Math.sin(b); cB[k][y] = Math.cos(b); }
      });
      let i = 0;
      for (let y = 0; y < H; y++) {
        const depth = .88 + .18 * y / H;
        for (let x = 0; x < W; x++) {
          const w = OCT.map((_, k) => sA[k][x] * cB[k][y] + cA[k][x] * sB[k][y]);
          const env = .52 + .48 * (w[0] * .5 + .5);
          const h = OCT[0].amp*w[0] + OCT[1].amp*w[1] + env*(OCT[2].amp*w[2] + OCT[3].amp*w[3] + OCT[4].amp*w[4] + OCT[5].amp*w[5]);
          let g = 0;
          OCT.forEach((o, k) => { const slope = cA[k][x]*cB[k][y] - sA[k][x]*sB[k][y]; g += o.amp*o.ay*o.sl*slope*(k < 2 ? 1 : env); });
          let p = h / AMPSUM * .5 + .5, q = p*p*(3-2*p); q = q*q*(3-2*q); p = p*.45 + q*.55;
          let r, green, blue;
          if (p < .52) { const f=p/.52; r=9+21*f; green=34+61*f; blue=68+82*f; }
          else { const f=(p-.52)/.48; r=30+102*f; green=95+108*f; blue=150+88*f; }
          if (p > .88) { let f=(p-.88)/.12; f=f*f*.9; r+=(243-r)*f; green+=(251-green)*f; blue+=(255-blue)*f; }
          let sparkle=g*.05; if (sparkle > 0) { sparkle=Math.min(1,sparkle); sparkle=sparkle*sparkle*sparkle*104; r+=sparkle; green+=sparkle*1.02; blue+=sparkle*.92; }
          const shade=depth*(1-(vigX[x]+vigY[y])*.58);
          buf[i]=Math.max(0,Math.min(255,r*shade)); buf[i+1]=Math.max(0,Math.min(255,green*shade)); buf[i+2]=Math.max(0,Math.min(255,blue*shade)); buf[i+3]=255; i+=4;
        }
      }
      ctx.putImageData(img,0,0);
    }
  
    function loop(now) {
      raf=requestAnimationFrame(loop); if (!last) { last=now; return; }
      let dt=Math.min(200,now-last); last=now; acc+=dt; if (acc < 33) return; acc=0; time+=dt/1000;
      const start=performance.now(); render(time); const spent=performance.now()-start;
      samples++; if (samples > 15) { cost+=spent; if (samples === 55) { if (cost/40 > 11 && quality > .55) { quality=.55; allocate(); } cost=0; samples=0; } }
    }
    function apply() {
      cancelAnimationFrame(raf);
      if (!cv.clientWidth || !cv.clientHeight) return;
      allocate();
      if (motion?.matches || document.hidden) render(6.2); else { last=0; acc=0; raf=requestAnimationFrame(loop); }
    }
    let resizeTimer;
    addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(apply,180)});
    document.addEventListener('visibilitychange',apply);
    motion?.addEventListener?.('change',apply);
    window.loginSeaApply=apply;
    apply();
  })();
  
};

/**
 * What the browser was told on the way back from Google, and it is deliberately
 * almost nothing: ?auth=google means a sign-in happened, ?error=not_authorised
 * means one did not. ONE sentence covers every cause - no account, wrong domain,
 * disabled, a bad token - because telling somebody which one they tripped is
 * telling them how to try again differently.
 *
 * Both are stripped from the address bar immediately, so a reload does not
 * re-show a message about something that already finished.
 */
function readReturnFromGoogle() {
  const q = new URLSearchParams(location.search);
  const error = q.get('error');
  const ok = q.get('auth') === 'google';
  if (error || ok) {
    history.replaceState(null, '', location.pathname + location.hash);
  }
  return { refused: error === 'not_authorised', signedIn: ok };
}

async function loadAuth() {
  // The server answers { auth, user }. This reads it into { on, user } - and the
  // two names not matching is exactly how the login screen silently never appeared
  // the first time this was opened, with CRM_AUTH=1 and the dropdown still there.
  try {
    const d = await (await fetch('/api/auth/me')).json();
    // The WHOLE answer is kept, with `on` added as an alias for `auth`. Listing
    // the fields by hand dropped one twice: first `auth` itself, so the login
    // never appeared, then `google`, so the button never appeared although the
    // server said it was configured. Nothing is transcribed field by field now.
    AUTH = { ...d, on: Boolean(d.auth), user: d.user || null };
  } catch { AUTH = { on: false, user: null }; }
  if (AUTH.user) ACTOR = AUTH.user.name;
  const picker = $('#actorBlock');
  const who = $('#whoBlock');
  if (AUTH.on && AUTH.user) {
    if (picker) picker.style.display = 'none';
    if (who) {
      who.style.display = '';
      $('#whoName').textContent = AUTH.user.name;
      $('#whoRole').textContent = AUTH.user.role;
    }
  } else if (picker) {
    picker.style.display = '';
    if (who) who.style.display = 'none';
  }
  const link = $('#navChannels');
  if (link) link.style.display = isAdmin() ? '' : 'none';
  return AUTH;
}

// ---------------------------------------------------------------- routing --
async function route() {
  const hash = location.hash || '#/today';
  drawIcons();
  const here = hash.split('/').slice(0, 2).join('/');
  // Only the two renames. The technical screens are not in the navigation at all,
  // so nothing needs to light up for them.
  const ALIAS = { '#/car': '#/inbox', '#/pipeline': '#/admissions' };
  const lit = ALIAS[here] || here;
  document.querySelectorAll('nav a.item').forEach(a => a.classList.toggle('on', a.getAttribute('href') === lit));
  const [, page, arg] = hash.split('/');
  fbClose();                       // the help panel never survives a move to another screen
  try {
    // Concept C is the main UI: its router draws every screen, borrowing the classic
    // ones where C has not replaced them yet. ?ui=classic skips this entirely.
    if (UI === 'c') { markCNav(page); await routeC(page, arg); refreshBadge(); drawFeedbackBadge(); return; }
    // The names people use. The old ones still resolve so a link in a note,
    // a feedback report or somebody's bookmark does not break.
    // The Console is a separate page at /console and is deliberately unreachable
    // from here. The CRM is the product; it carries no way into our tooling.
    if (page === 'admissions' || page === 'pipeline') await viewAdmissions();
    else if (page === 'feedback') await viewFeedback();
    else if (page === 'people') await viewPeople();
    else if (page === 'inbox' || page === 'car') await viewInbox();
    else if (page === 'funnel' || page === 'metrics') await viewReports();
    else if (page === 'history') await viewHistory();
    else if (page === 'person') await viewPerson(arg);
    else if (page === 'followup') await viewFollowup();
    // Channel research, the event inspector, the raw intake screens and the privacy
    // notes are OUR tooling. They are not routed here at all: the product has no
    // path to them, by design. They live with the Console.
    else if (page === 'metrics') await viewReports();
    else if (page === 'channels') await viewChannels(arg);
    else if (page === 'privacy') await viewPrivacy();
    else if (page === 'reports') await viewReports();
    else await viewToday();
  } catch (e) {
    // 'not found' usually means the page in front of somebody is older than the
    // database behind it. Saying so is more use than the word 'failed'.
    $('#view').innerHTML = e.message === 'not found'
      ? `<h1>Not here any more</h1>
         <div class="prov">This record is not in the database any more. This page may have been
         open since before the data changed. Going back to Today will reload it.</div>
         <button class="btn" onclick="location.hash='#/today'">Back to Today</button>`
      : `<div class="err">Failed to load: ${esc(e.message)}</div>`;
  }
  refreshBadge();
  drawFeedbackBadge();
}

// Empty, real or synthetic, switched as often as a demo needs.
// Next action is never a free text box and never optional: it comes from the
// list, and every option drives towards a visit, an application or payment.

// What to put at the top of the list. It is a SUGGESTION: the whole grouped list
// stays underneath and anything can be picked. The rules live in config, because
// the right first move is Admissions business and not a decision for this file.
function suggestNextAction(item, interest) {
  const rules = CFG.suggestedNextAction || {};
  const idOf = (id) => {
    for (const g of (CFG.nextActions || [])) for (const i of g.items) if (i.id === id) return i.label;
    return null;
  };
  const question = (item.fields || []).find(f => f.field === 'question');
  const byQ = question && (rules.byQuestion || {})[String(question.value)];
  if (byQ) return { label: idOf(byQ), why: `they asked about ${question.value}` };
  const byC = (rules.byChannel || {})[item.channel];
  if (byC) return { label: idOf(byC), why: `it came in by ${channelLabel(item.channel)}` };
  if (interest) return { label: idOf(rules.whenProgrammeKnown), why: 'we know what they want to study' };
  return { label: idOf(rules.whenNothingKnown), why: 'nobody can tell what they want yet' };
}

// The suggestion sits at the top, already chosen, above the full list.
function nextActionOptionsWithSuggestion(suggested) {
  const rest = nextActionOptions(null);
  if (!suggested || !suggested.label) return rest;
  return `<optgroup label="Suggested">
      <option value="${esc(suggested.label)}" selected>${esc(suggested.label)}</option>
    </optgroup>` + rest;
}

function nextActionOptions(selectedLabel) {
  const groups = CFG.nextActions || [];
  const opts = groups.map(g => `<optgroup label="${esc(g.group)}">` +
    g.items.map(i => `<option value="${esc(i.label)}" data-days="${i.days}" data-drives="${esc(i.drives)}"
      ${i.label === selectedLabel ? 'selected' : ''}>${esc(i.label)}</option>`).join('') + '</optgroup>').join('');
  return opts;
}
function daysForAction(label) {
  for (const g of (CFG.nextActions || [])) for (const i of g.items) if (i.label === label) return i.days;
  return 2;
}
function drivesFor(label) {
  for (const g of (CFG.nextActions || [])) for (const i of g.items) if (i.label === label) return i.drives;
  return null;
}
const DRIVES_LABEL = { visit: 'drives towards a visit', application: 'drives towards the application and documents', payment: 'drives towards payment', info: 'information' };

function todayOrder(serverOrder) {

// What this one person needs, said in one line, with one button that does it.
function todayCard(g, item) {
  // One queue, two reasons for being in it. The row says which, because a step we
  // planned is marked done and a message they sent is answered.
  if (g.id === 'waiting') {
    const wrote = item.why === 'reply' || item.why === 'both';
    const planned = item.why === 'step' || item.why === 'both';
    const tag = (text, title) => `<span class="why" title="${esc(title)}">${esc(text)}</span>`;
    return {
      name: item.name,
      line: (planned ? esc(item.label) : esc(String(item.subject || 'They wrote to us')))
        + ' ' + (item.why === 'both'
          ? tag('they also wrote', 'A step is due AND they have written since. Both are waiting on us.')
          : wrote ? tag('they wrote', 'They sent this and nothing has gone back yet.')
          : tag('we planned this', 'A next step somebody planned, now due.')),
      meta: planned ? dueText(item.due_at)
        : `${channelLabel(item.channel || item.source_channel)} &middot; ${fmtDateTime(item.occurred_at)}`,
      open: `#/person/${item.person_id}`,
      action: planned
        ? `<button class="btn" onclick="event.stopPropagation();openComplete(${item.taskId},'${esc(item.label)}')">Mark done</button>`
        : `<button class="btn" onclick="event.stopPropagation();openNote('${item.person_id}','note')">Write what happened</button>`,
    };
  }
  if (g.id === 'new_leads') {
    return {
      name: item.name,
      line: item.programme ? `Wants ${esc(item.programme)}` : 'Has not said what they want yet',
      meta: `${channelLabel(item.source_channel)} &middot; arrived ${fmtDate(item.created_at)}`,
      open: `#/person/${item.id}`,
      action: `<button class="btn" onclick="event.stopPropagation();openNote('${item.id}','call')">Log a call</button>`,
    };
  }
  return {
    name: item.name,
    line: 'Nobody has planned the next step',
    meta: `${esc(item.status || '')} &middot; ${channelLabel(item.source_channel)}`,
    open: `#/person/${item.id}`,
    action: `<button class="btn" onclick="event.stopPropagation();openNewTask('${item.id}')">Plan the next step</button>`,
  };
}

// Today has two views of the same queue. The table is the one people work in,
// because a manager wants the overview and not a card at a time; the card view
// is kept because it is the better shape on a phone and some people prefer it.
let TODAY_VIEW = 'table';
try { TODAY_VIEW = localStorage.getItem('crmTodayView') || 'table'; } catch {}
function setTodayView(v) {
  TODAY_VIEW = v;
  try { localStorage.setItem('crmTodayView', v); } catch {}
  viewToday();
}

// Whose day is this? Today names one person at the top, so by default it shows
// that person's work. It used to show everybody's under that heading, which is
// why the sidebar said one number and this screen said a bigger one.
let TODAY_SCOPE = 'mine';
try { TODAY_SCOPE = localStorage.getItem('crmTodayScope') || 'mine'; } catch {}
function setTodayScope(v) {
  TODAY_SCOPE = v;
  try { localStorage.setItem('crmTodayScope', v); } catch {}
  TODAY_ITEM = 0;
  viewToday();
}

async function viewToday() {
  const t = await api('/api/today' + (TODAY_SCOPE === 'all' ? '?scope=all' : ''));
  await refreshBadge();          // so the heading and the sidebar cannot disagree
  const order = todayOrder(t.order);
  const byId = Object.fromEntries(t.groups.map(g => [g.id, g]));
  const groups = order.map(id => byId[id]).filter(Boolean);

  if (TODAY_AT === 0) {
    try { const saved = Number(localStorage.getItem('crmTodayQueue')); if (saved >= 0 && saved < groups.length) TODAY_AT = saved; } catch {}
  }
  if (TODAY_AT >= groups.length) TODAY_AT = 0;
  const g = groups[TODAY_AT];
  const items = g.rows;
  if (TODAY_ITEM >= items.length) TODAY_ITEM = 0;

  const picker = groups.map((x, i) => `<button class="dot ${i === TODAY_AT ? 'on' : ''}"
    onclick="todayPickQueue(${i})"><span>${esc(x.label)}</span>${
      (t.marks || {})[x.id] ? `<span class="tabmark">${esc(t.marks[x.id])}</span>` : ''
    }${x.open ? `<b>${x.open}</b>` : ''}</button>`).join('');

  const empty = `<div class="card deck"><div class="done">
      <div class="tick-big">&#10003;</div>
      ${g.done ? `All ${g.total} done today.` : 'Nothing waiting here.'}
      <div class="sub" style="margin-top:6px">${esc(t.descriptions[g.id] || '')}</div>
    </div></div>`;

  let body;
  if (!items.length) {
    body = empty;
  } else if (TODAY_VIEW === 'table') {
    body = `<div class="card"><table class="cartable"><thead><tr>
        <th>Who</th><th>What they need</th><th>When</th><th></th></tr></thead>
      <tbody>${items.map((item) => {
        const c = todayCard(g, item);
        return `<tr class="row" tabindex="0" onclick="location.hash='${c.open}'">
          <td><b>${esc(c.name)}</b></td>
          <td>${c.line}</td>
          <td>${c.meta}</td>
          <td class="act">${c.action}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  } else {
    const item = items[TODAY_ITEM];
    const c = todayCard(g, item);
    body = `<div class="card deck" id="deck">
      <div class="deckhead">
        <button class="nav" onclick="todayStep(-1,${items.length})" title="previous" ${items.length < 2 ? 'disabled' : ''}>&#8249;</button>
        <div class="counter">${TODAY_ITEM + 1} of ${items.length}</div>
        <button class="nav" onclick="todayStep(1,${items.length})" title="next" ${items.length < 2 ? 'disabled' : ''}>&#8250;</button>
      </div>
      <div class="one" onclick="location.hash='${c.open}'">
        <h2>${esc(c.name)}</h2>
        <p class="oneline">${c.line}</p>
        <p class="onemeta">${c.meta}</p>
      </div>
      <div class="oneact">
        ${c.action}
        <a class="tilelink" href="${c.open}">Open the record &rarr;</a>
      </div>
    </div>`;
  }

  $('#view').innerHTML = `
  <div class="todayhead">
    <div><h1 style="margin:0">Today${OVERDUE ? ` &middot; ${OVERDUE} overdue` : ''}</h1></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      ${t.role ? `<div class="viewswitch" title="Whose work to show. The sidebar count follows the same choice.">
        <button class="${TODAY_SCOPE === 'mine' ? 'on' : ''}" onclick="setTodayScope('mine')">${esc(t.role)}</button>
        <button class="${TODAY_SCOPE === 'all' ? 'on' : ''}" onclick="setTodayScope('all')">Everyone</button>
      </div>` : ''}
      <button class="btn sm ghost" onclick="setTodayView('${TODAY_VIEW === 'table' ? 'card' : 'table'}')"
        title="Switch how this list is laid out">${TODAY_VIEW === 'table' ? 'One at a time' : 'Table'}</button>
    </div>
  </div>
  <div class="swipe">${picker}</div>
  ${body}`;

  const deck = document.querySelector('#deck');
  if (deck && items.length > 1) {
    let x0 = null;
    deck.addEventListener('touchstart', (e) => { x0 = e.changedTouches[0].clientX; }, { passive: true });
    deck.addEventListener('touchend', (e) => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 50) todayStep(dx < 0 ? 1 : -1, items.length);
      x0 = null;
    }, { passive: true });
  }
}

function funnelHtml(byStage) {
  const map = Object.fromEntries(byStage.map(r => [r.status, r.n]));
  const max = Math.max(1, ...byStage.map(r => r.n));
  return (CFG.stages || []).map(st => {
    const n = map[st.id] || 0;
    return `<div style="display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin-bottom:6px">
      <div style="font-size:13px">${esc(st.label)}</div>
      <div class="bar"><i style="width:${Math.round(n / max * 100)}%;background:${st.colour}"></i></div>
      <div style="font-size:13px;text-align:right">${n}</div></div>`;
  }).join('');
}

// Every filter carries the name of what it filters. They used to be four boxes
// all saying 'all', and none of them was wired to anything at all.
let QUICK_EDIT = null;        // the id of the row opened for editing, if any

async function viewPeople() {

  // controls were announced as unlabelled - visually captioned, programmatically

      <a class="tilelink" href="#/person/${esc(r.id)}">Open the full record &rarr;</a>

    </div></td></tr>`;

  $('#view').innerHTML = `

    <div><h1 style="margin:0">People &middot; ${data.count}</h1></div>
    <a class="tilelink" href="#/admissions">Open Admissions &rarr;</a>
  </div>
  <div class="filters">
    ${field('Search', `<input id="fq" placeholder="name, email, phone, programme, source, id" value="${esc(STATE.q)}" style="min-width:290px">`)}
    ${field('Stage', `<select id="fstatus" onchange="setFilter('status', this.value)">${opt((CFG.stages || []).map(s => s.id), STATE.status)}</select>`)}
    ${field('Next step', `<select id="fdue" onchange="setFilter('due', this.value)">
      <option value="">all</option>
      <option value="overdue" ${STATE.due === 'overdue' ? 'selected' : ''}>overdue</option>
      <option value="none" ${STATE.due === 'none' ? 'selected' : ''}>without a next step</option></select>`)}
    <div class="flab"><span></span><button class="btn ghost" onclick="setMoreFilters(${MORE_FILTERS ? 'false' : 'true'})">${

    ${field('Came from', `<select id="fsource" onchange="setFilter('source', this.value)">${

function setFilter(key, value) { STATE[key] = value; QUICK_EDIT = null; viewPeople(); }
function setQuickEdit(id) { QUICK_EDIT = QUICK_EDIT === id ? null : id; viewPeople(); }

// Saved exactly as the person page saves it, so the same field policy applies and
// the same history entries are written. Only the screen is different.
async function quickSave(id) {
  const patch = {};
  for (const [key] of EDIT_FIELDS) {
    const el = document.querySelector('#q_' + key);
    if (el) patch[key] = el.value;
  }
  const note = (document.querySelector('#q_note') || {}).value || '';
  try {
    await post(`/api/people/${id}/edit`, patch);
    if (note.trim()) await post(`/api/people/${id}/note`, { kind: 'note', body: note.trim() });
    QUICK_EDIT = null;
    viewPeople();
  } catch (err) {
    const box = document.querySelector('#qeErr');
    if (box) box.innerHTML = `<div class="err" style="margin-top:10px">${esc(err.message)}</div>`;
  }
}

function sortBy(k) { if (STATE.sort === k) STATE.dir = STATE.dir === 'asc' ? 'desc' : 'asc'; else { STATE.sort = k; STATE.dir = 'asc'; } viewPeople(); }
function clearFilters() { Object.assign(STATE, { q: '', status: '', programme: '', owner: '', source: '', nationality: '', due: '' }); QUICK_EDIT = null; MORE_FILTERS = false; viewPeople(); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function latestConsents(rows) {
  const seen = new Map();
  for (const r of rows) if (!seen.has(r.purpose)) seen.set(r.purpose, r);  // rows arrive newest first
  return [...seen.values()];
}

async function doSisHandoff(id) {
  try { await post(`/api/people/${id}/sis`, {}); viewPerson(id); }
  catch (e) { alert(e.message); }
}

async function changeStatus(id, status) {
  if (status === 'Not proceeding') return openCloseReason(id);
  await post(`/api/people/${id}/status`, { status });
  viewPerson(id);
}

// Decision 8: nobody is closed without a reason, and "Other" is not a reason.
function openCloseReason(id) {
  const reasons = CFG.closedReasons || [];
  modal('Stop working with this person', `
    <label>Reason</label>
    <select id="clReason" onchange="onCloseReason()">${reasons.map(r => `<option>${esc(r)}</option>`).join('')}</select>
    <label id="clNoteLabel" style="margin-top:10px">Explanation</label>
    <textarea id="clNote" rows="2" placeholder="What actually happened"></textarea>
    <div id="clErr"></div>
    <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="doClose('${id}')">Save</button>
      <button class="btn ghost" onclick="closeModal();viewPerson('${id}')">Cancel</button></div>
    <div class="prov" style="margin-top:12px">These reasons are provisional until Admissions validates
      them. The status only ever stops here by somebody deciding it - it never happens automatically.</div>`);
  onCloseReason();
}
function onCloseReason() {
  const needs = (CFG.closedReasonNeedsNote || []).includes(document.querySelector('#clReason').value);
  const label = document.querySelector('#clNoteLabel');
  if (label) label.textContent = needs ? 'Explanation (required)' : 'Explanation';
}
async function doClose(id) {
  try {

// ONE work queue. the review: the queue holds only what still needs looking at - the
// Inbox is leads to be processed and nothing else. There were three boards here
// (To look at, Done, Not relevant) and "Done" was a second place a person could
// sit and be forgotten, which is the fault he actually reported: "sanak es
// izdaru 2 solus bet nekas nenotiek".
//
// Nothing is lost by removing them. A qualified person is in Admissions and in
// People, where the work continues. An archived item stays in the database and
// is readable from the Console, which is our tooling and not the product.
// What replaces the Done board is LAST_RESULT below: after qualifying, the Inbox
// says where the person went and what happens next, instead of the row silently
// disappearing.
let LAST_RESULT = null;

async function viewInbox() {
  const d = await api('/api/intake?state=new');
  const val = (r, field) => {
    const f = r.fields.find(x => x.field === field);
    return f ? fieldCell(f) : '<span class="muted">-</span>';
  };

  // The whole row opens it. A single small button at the far right made people aim
  // for a target the width of two words, when the obvious thing to click is the
  // person's name.
  const row = (r) => `<tr class="row ${r.aged ? 'aged' : ''} clicky" tabindex="0"
      onclick="openQualify(${r.id})" title="Open it and decide what it is">
    <td><b>${esc(r.contact_name || r.contact_handle || 'Unknown')}</b>
      <div class="sub2">${esc(r.contact_handle || r.contact_phone || r.contact_email || '')}</div></td>

  </tr>`;

  // What used to be the Done board. It answers the three things the review could not
  // see - where they went, what they want, what happens next - and then clears,
  // because it is a receipt and not a place.
  const banner = () => {
    const L = LAST_RESULT; LAST_RESULT = null;
    if (!L) return '';
    if (L.archived) {
      return `<div class="done-strip">Marked not relevant: <b>${esc(L.who)}</b>${
        L.reason ? ' &middot; ' + esc(L.reason) : ''}</div>`;
    }
    const due = L.dueAt ? fmtDate(L.dueAt) : null;
    return `<div class="done-strip ok">
      <b>${esc(L.name)}</b> is now in Admissions${L.status ? ' &middot; ' + esc(L.status) : ''}${
        L.programme ? ' &middot; ' + esc(L.programme) : ''}.
      ${L.next ? `Next: ${esc(L.next)}${due ? ' by ' + due : ''}.` : ''}
      <a href="#/person/${esc(L.id)}">Open</a></div>`;
  };

  $('#view').innerHTML = `
  <div class="todayhead">
    <div><h1 style="margin:0">Inbox${d.rows.length ? ' &middot; ' + d.rows.length : ''}</h1></div>
    <a class="tilelink" href="#/admissions">Go to Admissions &rarr;</a>
  </div>

  ${banner()}

  <div class="card">
  ${d.rows.length ? `<table class="cartable"><thead><tr>
      <th>Who</th><th>Where from</th><th>Wants to study</th><th>Asked about</th>
      <th>Arrived</th></tr></thead>
    <tbody>${d.rows.map(row).join('')}</tbody></table>`
  : '<div class="empty">Nothing waiting. This queue is clear.</div>'}
  </div>`;
}

async function doQualify(id, opts = {}) {
  const confirmFields = [...document.querySelectorAll('.qConfirm:checked')].map(c => c.value);
  const interest = (document.querySelector('#qInterest') || {}).value || '';
  const nextAction = (document.querySelector('#qNext') || {}).value || '';
  const qualification = interest ? 'lead' : 'unclear';
  const note = (document.querySelector('#qNote') || {}).value || '';
  const body = { qualification, createPerson: true, note, confirmFields, nextAction,
    stated: interest ? { interest } : {}, ...opts };
  try {
    const r = await post(`/api/intake/${id}/qualify`, body);
    closeModal();
    if (r.handoverGap) alert(`${r.handoverGap.problem}\n\n${r.handoverGap.action}`);
    LAST_RESULT = r.landed || null;      // the Inbox shows where they went
    viewInbox();
  } catch (e) {
    // a refused save keeps everything typed, and a duplicate answers with names
    if (e.detail && e.detail.duplicate) return showDuplicate(id, e.detail, { interest, nextAction, note, confirmFields });
    $('#qErr').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

// Periods are Riga calendar days, and the server reads them as Riga days too.
function monthStartISO(d = new Date()) { return fmtDate(d).slice(0, 7) + '-01'; }
function setPeriod(from, to) { RPT = { from, to }; viewReports(); }
async function setPeriodPreset(which) {
  const now = new Date();
  const [y, m] = todayStr().split('-').map(Number);
  if (which === 'month') return setPeriod(monthStartISO(now), '');
  if (which === 'last') {
    // calendar arithmetic on the Riga year and month; Date.UTC only does the rollover
    const s = new Date(Date.UTC(y, m - 2, 1)).toISOString().slice(0, 10);
    const e = new Date(Date.UTC(y, m - 1, 0)).toISOString().slice(0, 10);
    return setPeriod(s, e);
  }
  if (which === 'year') return setPeriod(y + '-01-01', '');
  // Everything: from the earliest date the data holds. It used to send no dates, and the
  // server reads no dates as THIS MONTH, so "Everything" showed one month (28.09.2026).
  const rows = ((await api('/api/people')) || {}).rows || [];
  const days = rows.flatMap((p) => [p.created_at, p.admitted_at]).filter(Boolean).map((d) => fmtDate(d)).filter(Boolean).sort();
  return setPeriod(days[0] || todayStr(), '');
}

async function runSim(channelId, scenario) {
  try {
    const r = await post('/api/sim/' + channelId + '/run', { scenario });
    LASTRUN[channelId] = r;
    SIM = null; SIMSEL = channelId;
    await viewIntegrations(channelId);
  } catch (e) { alert('Failed: ' + e.message); }
}

async function runOut(channelId) {
  const last = LASTRUN[channelId];
  if (!last || !last.personId) return alert('Run an inbound test first, so there is something to reply to.');
  try {
    const r = await post('/api/sim/' + channelId + '/outbound', { personId: last.personId });
    LASTRUN[channelId] = Object.assign({}, r, { personId: last.personId });
    SIM = null;
    await viewIntegrations(channelId);
  } catch (e) { alert('Failed: ' + e.message); }
}

// ================================================================ privacy ==
// ------------------------------------------------------------ admin: channels --
//
// Four questions and nothing else: what channels exist, what is missing, what is
// working, what is broken.
//
// Everything on this screen comes from the server. Nothing is computed here, and
// in particular NOTHING here decides that a channel is connected - that word is
// the server's to use, and it uses it only when a provider has really arrived.
//
// No secret value is ever on this screen. The NAME of a setting is, and the word
// OK or MISSING. There is a test that greps the module's payload for the values,
// and another that greps the response the browser actually receives.

const chClass = (state) => 's-' + String(state).toLowerCase().replace(/[^a-z]/g, '');

function chSettings(list) {
  if (!list || !list.length) return '<span class="prov">Nothing to set up.</span>';
  return list.map(x => `<span class="setting ${x.present ? '' : 'miss'}">${esc(x.name)} ${x.present ? 'OK' : 'MISSING'}</span>`).join('');
}

const chStep = (st) => `<li>${st.ok ? '<span class="ok-tick">OK</span>' : '<span class="no-tick">FAILED</span>'}
  ${esc(st.name)} <span class="prov">${esc(st.note || '')}</span></li>`;

// ONE WORD PER CHANNEL, on one axis: can a lead reach us through this? It is the
// same four-state model the server already computes - only the words changed,
// because a screen that needs a table to explain its own vocabulary has the wrong
// vocabulary, and that table is gone.
//
// "Receiving" still means exactly what CONNECTED meant: the PROVIDER reached us.
// Our own check passing cannot earn it, and neither can a run in test mode, which
// is stored as `simulated` on purpose - so a channel can be bringing things in
// today and still read Ready, with the count beside it saying so.
const CH_WORD = {
  'ERROR':          { word: 'Failed',     cls: 's-error' },
  'CONNECTED':      { word: 'Receiving',  cls: 's-connected' },
  'CONFIGURED':     { word: 'Ready',      cls: 's-configured' },
  'NOT CONFIGURED': { word: 'Not set up', cls: 's-notconfigured' },
};
const chWord = (c) => (c.direction === 'manual'
  ? { word: 'By hand', cls: 's-manual' }
  : CH_WORD[c.state] || CH_WORD['NOT CONFIGURED']);
const CH_RANK = ['Failed', 'Receiving', 'Ready', 'By hand', 'Not set up'];

// Test mode belongs next to ON, not hidden: a channel switched on in test is not
// live, and everything it brings in is stored as simulated.
const chOn = (c) => (c.direction === 'manual' ? '<span class="c-gap">-</span>'
  : c.live ? 'ON' + (c.mode === 'test' ? ' <span class="ch-test">&middot; test</span>' : '')
  : '<span class="c-gap">off</span>');

// What actually arrived. For the two scheduled jobs that is the last run; for a
// webhook channel it is what a provider has sent, else what is still missing.
// Data, never an explanation.
function chActivity(c, run) {
  const plural = (n, one) => n + ' ' + (n === 1 ? one : one + 's');
  if (run && run.at) {
    const x = run.detail || {};
    const bits = [];
    if (c.channel === 'sis' && x.stored != null) bits.push(plural(x.stored, 'applicant'));
    if (c.channel !== 'sis' && x.kept != null) bits.push(plural(x.kept, 'call'));
    if (x.inbox) bits.push(x.inbox + ' to New Leads');
    return esc((bits.join(' \u00b7 ') || 'ran') + ' \u00b7 ' + fmtDate(run.at));
  }
  if (c.events) return esc(plural(c.events, 'message') + ' \u00b7 ' + fmtDate(c.lastEventAt));
  if ((c.missingSettings || []).length) return esc(plural(c.missingSettings.length, 'setting') + ' missing');
  return '<span class="c-gap">-</span>';
}

    $('#view').innerHTML = `<h1>Channels</h1>
      <div class="prov">Admins only.</div>`;
    return;
  }
  if (which) return viewChannel(which);

  const d = await api('/api/admin/channels');
  const runs = d.runs || {};
  const rows = [...d.channels].sort((a, b) =>
    CH_RANK.indexOf(chWord(a).word) - CH_RANK.indexOf(chWord(b).word) || a.label.localeCompare(b.label));

  $('#view').innerHTML = `
    <h1>Channels</h1>
    <div class="tablewrap"><table class="cartable">
      <thead><tr><th>Channel</th><th>Status</th><th>On</th><th>Last activity</th></tr></thead>
      <tbody>
      ${rows.map(c => `
        <tr class="row" tabindex="0" style="cursor:pointer" onclick="location.hash='#/channels/${esc(c.channel)}'">
          <td><b>${esc(c.label)}</b></td>
          <td><span class="chstate ${chWord(c).cls}">${esc(chWord(c).word)}</span></td>
          <td>${chOn(c)}</td>
          <td>${chActivity(c, runs[c.channel])}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
}


async function viewChannel(id) {
  const c = await api('/api/admin/channels/' + encodeURIComponent(id));
  const d = await api('/api/admin/channels');
  const run = (d.runs || {})[c.channel] || null;
  const canSwitchOn = c.allSettingsPresent && (!c.canTest || c.lastCheckOk === true);
  const row = (k, v) => `<div class="kv"><div>${esc(k)}</div><div>${v}</div></div>`;

  $('#view').innerHTML = `
    <a class="btn ghost" href="#/channels">&larr; All channels</a>
    <h1 style="margin-top:12px">${esc(c.label)}</h1>
    ${row('Status', `<span class="chstate ${chWord(c).cls}">${esc(chWord(c).word)}</span>`)}
    ${row('On', chOn(c))}
    ${run && run.at ? row('Last run', esc(fmtDate(run.at))) : ''}
    ${run && run.at ? row('Came in', chActivity(c, run)) : ''}
    ${row('Settings', chSettings(c.settings))}
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      ${c.canTest ? `<button class="btn ghost" id="chCheck" onclick="runChannelCheck('${esc(c.channel)}')">Check</button>` : ''}
      ${c.live
        ? `<button class="btn ghost" onclick="setChannelMode('${esc(c.channel)}','off')">Switch off</button>`
        : `<button class="btn" ${canSwitchOn ? '' : 'disabled'} onclick="setChannelMode('${esc(c.channel)}','live')">Switch on</button>`}
    </div>
    <div id="chResult" style="margin-top:10px"></div>
    <div id="chMode" style="margin-top:8px"></div>`;
}


async function runChannelCheck(id) {
  const btn = $('#chCheck');
  const out = $('#chResult');
  btn.disabled = true; btn.textContent = 'Checking...';
  try {
    const r = await post('/api/admin/channels/' + encodeURIComponent(id) + '/check');
    if (r.skipped) { out.innerHTML = `<div class="prov">${esc(r.why)}</div>`; return; }
    out.innerHTML = `
      <span class="${r.ok ? 'pill ok' : 'pill warn'}">${r.ok ? 'Every step passed' : 'It failed'}</span>
      <ul class="steps">${(r.steps || []).map(chStep).join('')}</ul>
      ${r.ok ? `<div class="footnote" style="margin-top:6px">This proves ${esc(r.proves || '')}.
        It does NOT prove ${esc(r.doesNotProve || '')}.</div>` : ''}`;
  } catch (e) {
    out.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = 'Run the check'; }
}

async function setChannelMode(id, mode) {
  const out = $('#chMode');
  if (mode !== 'off' && !confirm(
      'Switch ' + id + ' ON?\n\nIt will start accepting real events from the provider.')) return;
  try {
    await post('/api/admin/channels/' + encodeURIComponent(id) + '/mode', { mode });
    await viewChannel(id);
  } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

// Backlog 9. The locked fields are shown, greyed, with the reason - so the rule
// is visible on the screen instead of living only in the server.
const EDIT_FIELDS = [
  ['name', 'Full name', 'text'],
  ['email', 'Email', 'text'],
  ['phone', 'Phone', 'text'],
  ['programme', 'Programme', 'programme'],
  ['study_form', 'Study form', 'studyForm'],
  ['education', 'Education', 'education'],
  ['nationality', 'Nationality', 'nationality'],
  ['owner', 'Owner', 'owner'],
  ['notes', 'Notes', 'textarea'],
];

function selectFor(kind, value) {
  const list = kind === 'programme' ? (CFG.programmes || [])
    : kind === 'studyForm' ? (CFG.studyForms || [])
    : kind === 'education' ? (CFG.education || [])
    : kind === 'nationality' ? (CFG.nationalities || [])
    : (CFG.owners || []);
  // A value from the old sheet that is not in the list ("NOT DECIDED", "FULL TIME") is
  // kept as its own option. Left out, the select showed "-", and saving the Edit dialog
  // for ANY reason erased it - found 28.09.2026 on a copy of the real data.
  const cur = String(value || '');
  const all = cur && !list.includes(cur) ? list.concat([cur]) : list;
  return ['<option value="">-</option>'].concat(all.map(v =>
    `<option ${cur === v ? 'selected' : ''}>${esc(v)}</option>`)).join('');
}

async function openEdit(id) {
  const p = await api('/api/people/' + id);
  const policy = await api('/api/people/fields');
  const row = ([key, label, kind]) => {
    const v = p[key] == null ? '' : String(p[key]);
    const input = kind === 'textarea'
      ? `<textarea id="e_${key}" rows="2">${esc(v)}</textarea>`
      : kind === 'text'
        ? `<input id="e_${key}" value="${esc(v)}">`
        : `<select id="e_${key}">${selectFor(kind, v)}</select>`;
    return `<div><label>${esc(label)}</label>${input}</div>`;
  };
  const locked = Object.entries(policy.immutable).filter(([k]) =>
    ['source_channel', 'source_campaign', 'created_at'].includes(k));
  modal('Edit record', `
    <div class="grid2">${EDIT_FIELDS.map(row).join('')}</div>
    <div class="prov" style="margin-top:12px"><b>Locked, and not editable here:</b><br>
      ${locked.map(([k, why]) => `${esc(k)} - ${esc(why)}`).join('<br>')}<br>
      Owner decision of 23.09.2026. Every change below is written to the history with the old
      value, the new value and who made it.</div>
    <div id="eErr" class="err" style="display:none;margin-top:10px"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn" onclick="saveEdit('${p.id}')">Save</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
    </div>
    <div class="prov" style="margin-top:10px">Saving as <b>${esc(ACTOR)}</b>. ${AUTH.user
      ? 'That is the account signed in, and it is the name the history will carry.'
      : 'There is no login, so this is the name the history will carry, not a verified identity.'}</div>`);
}

async function saveEdit(id) {
  const patch = {};
  for (const [key] of EDIT_FIELDS) {
    const el = document.querySelector('#e_' + key);
    if (el) patch[key] = el.value;
  }
  try {
    const r = await post(`/api/people/${id}/edit`, patch);
    closeModal();
    if (!r.changes.length) return viewPerson(id);
    viewPerson(id);
  } catch (err) {
    const box = $('#eErr');
    if (box) { box.style.display = ''; box.textContent = err.message; }
  }
}
