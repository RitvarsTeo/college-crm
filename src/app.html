<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novikontas College CRM - prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Spectral:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------------------
   Palette taken from the reference: the Client Hub preview artifact.
   Light is the authored identity; dark is its own theme, not an inversion.
   Amber means a human has to act. Petrol means data, state and structure.
   Only values live here. No structure, no class names and no screens changed.
   --------------------------------------------------------------------------- */
:root {
  --paper:#F7F6F3; --surface:#FCFBF9; --ink:#111C21;
  --t2:rgba(17,28,33,.78); --t3:rgba(17,28,33,.62); --t4:rgba(17,28,33,.48);
  --rule:rgba(17,28,33,.16); --rule2:rgba(17,28,33,.10);
  --pet:#1F7688; --petink:#155C6B; --amb:#D98A1E; --ambink:#8A5410;
  --lift:0 1px 2px rgba(17,28,33,.07), 0 6px 14px -8px rgba(17,28,33,.12);
  --lift-hover:0 1px 2px rgba(17,28,33,.10), 0 10px 22px -10px rgba(17,28,33,.20);
  --serif:'Spectral', Georgia, serif;
  --sans:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* the names the rest of the stylesheet already uses, re-pointed */
  --navy:var(--ink); --navy-soft:var(--petink); --muted:var(--t3);
  --line:var(--rule); --bg:var(--paper); --card:var(--surface);
  --brand-blue:var(--pet);
  --late:var(--ambink); --late-bg:rgba(217,138,30,.14);
  --ok:var(--petink); --ok-bg:rgba(31,118,136,.11);
  --warn:var(--ambink); --warn-bg:rgba(217,138,30,.14);
  --radius:10px; --shadow:var(--lift);
  --shell:#F1EFE9; --shell-ink:var(--ink); --shell-line:var(--rule2);
  --surface-2:#EFEDE7; --field:#FFFFFF;
  --on-navy:#FCFBF9; --btn-bg:#111C21; --btn-ink:#FCFBF9;
  --control-line:rgba(17,28,33,.30); --focus:var(--petink); --accent-ink:var(--petink);
  --dur-quick:120ms; --dur-tap:80ms; --ease-standard:cubic-bezier(.2,.7,.2,1);
}
/* Dark is authored, not inverted: petrol ground, amber as light. */
:root[data-theme="dark"] {
  --paper:#05070A; --surface:rgba(255,255,255,.055); --ink:#EFEBE3;
  --t2:rgba(239,235,227,.84); --t3:rgba(239,235,227,.72); --t4:rgba(239,235,227,.52);
  --rule:rgba(239,235,227,.16); --rule2:rgba(239,235,227,.10);
  --pet:#5FC4D8; --petink:#A9E2ED; --amb:#E3A63F; --ambink:#E9B361;
  --lift:0 1px 2px rgba(0,0,0,.4), 0 10px 22px -12px rgba(0,0,0,.7);
  --lift-hover:0 1px 2px rgba(0,0,0,.5), 0 14px 28px -12px rgba(0,0,0,.8);
  --navy:#0B2C38; --navy-soft:var(--petink); --muted:var(--t3);
  --line:var(--rule); --bg:var(--paper); --card:rgba(255,255,255,.055);
  --brand-blue:var(--pet);
  --late:var(--ambink); --late-bg:rgba(227,166,63,.18);
  --ok:var(--petink); --ok-bg:rgba(95,196,216,.16);
  --warn:var(--ambink); --warn-bg:rgba(227,166,63,.18);
  --shadow:var(--lift);
  --shell:#0A161C; --shell-ink:var(--ink); --shell-line:var(--rule2);
  --surface-2:rgba(255,255,255,.08); --field:rgba(255,255,255,.06);
  --on-navy:#EFEBE3; --btn-bg:#0B2C38; --btn-ink:#EFEBE3;
  --control-line:rgba(239,235,227,.34); --focus:var(--pet); --accent-ink:var(--petink);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);
     background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
a{color:var(--navy-soft)}
button{font:inherit;cursor:pointer}
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}

/* Navigation: tinted ground, muted labels, the active item marked by an edge
   rather than a filled pill. */
nav{background:var(--shell);color:var(--shell-ink);padding:18px 0;display:flex;flex-direction:column;
    border-right:1px solid var(--shell-line)}
nav .brand{padding:0 20px 18px;font-weight:700;font-size:16px;line-height:1.25;color:var(--shell-ink)}
nav .brand span{display:block;font-size:10px;font-weight:600;color:var(--petink);letter-spacing:1.4px;
    text-transform:uppercase;margin-top:5px}
nav a.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 20px;
    color:var(--t2);text-decoration:none;font-size:14px;border-left:3px solid transparent;
    transition:background-color var(--dur-quick) var(--ease-standard),color var(--dur-quick) var(--ease-standard)}
nav a.item:hover{color:var(--ink);background:rgba(17,28,33,.05)}
nav a.item.on{color:var(--ink);border-left-color:var(--amb);background:rgba(217,138,30,.10);font-weight:600}
nav .dataset{margin-top:8px;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;
  padding:3px 8px;border-radius:4px;display:inline-block;line-height:1.35;white-space:normal}
nav .dataset.real{background:rgba(217,138,30,.16);color:var(--ambink);border:1px solid rgba(217,138,30,.45)}
nav .dataset.empty{background:var(--surface-2);color:var(--t3);border:1px dashed var(--rule)}
nav .dataset.synthetic{background:var(--surface-2);color:var(--t3);border:1px solid var(--rule2)}
nav .navgroup{padding:4px 20px 6px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--t4);
  display:flex;align-items:center;gap:8px}
nav .navgroup.demo{color:var(--t3)}
nav .navgroup .pill{font-size:9px;padding:1px 7px}
nav .navsplit{margin:14px 20px 10px;border-top:1px solid var(--rule)}
nav a.item.demo{font-size:13.5px;color:var(--t3)}
nav a.item.demo.on{color:var(--ink)}
nav .add{margin:16px 20px 0}
nav .themes{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--shell-line)}
nav .themes label{color:var(--t3);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;margin:0 0 6px}
nav .themes select{background:var(--field);color:var(--ink);border:1px solid var(--control-line)}
main{padding:22px 26px 60px;max-width:1320px}
h1{font-family:var(--serif);font-weight:500;font-size:27px;letter-spacing:-.01em;margin:0 0 2px;color:var(--ink)}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}

/* A container is a signal, not a layout device. */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
      padding:18px;margin-bottom:18px}
.card h3{font-family:var(--serif);font-weight:500;margin:0 0 10px;font-size:18px;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.stat.alarm b{color:var(--ambink)}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--rule2);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--rule)}
td{font-size:13.5px}
tr.row{cursor:pointer}
tr.row:hover td{background:rgba(31,118,136,.06)}
tr.row:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill.late{background:var(--late-bg);color:var(--late);border-color:rgba(217,138,30,.45)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:rgba(31,118,136,.45)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(217,138,30,.45)}
.pill.calm{background:var(--surface-2);color:var(--t2);border-color:var(--rule2)}
.pill.accent{background:var(--ok-bg);color:var(--petink);border-color:rgba(31,118,136,.45)}

.due{font-weight:600;font-variant-numeric:tabular-nums}
.due.over{color:var(--ambink)}.due.today{color:var(--ambink)}

.btn{background:var(--btn-bg);color:var(--btn-ink);border:0;border-left:3px solid var(--amb);border-radius:8px;padding:9px 15px 9px 13px;font-weight:500;
   box-shadow:var(--shadow);
   transition:transform var(--dur-tap) var(--ease-standard),box-shadow var(--dur-quick) var(--ease-standard)}
.btn:hover{box-shadow:var(--lift-hover)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--petink);border:1px solid var(--rule);border-left:1px solid var(--rule);padding:9px 15px}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--control-line);border-radius:8px;
   background:var(--field);color:var(--ink);width:100%}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{width:auto;min-width:140px}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.kv{display:grid;grid-template-columns:132px 1fr;gap:6px 12px;font-size:13.5px}
.kv div:nth-child(odd){color:var(--muted)}

.tl{border-left:1px solid var(--line);padding-left:14px;margin-left:4px}
.tl .ev{position:relative;padding:0 0 14px}
.tl .ev:before{content:'';position:absolute;left:-16px;top:6px;width:3px;height:13px;background:var(--pet)}
.tl .ev.note:before{background:var(--muted)}
.tl .ev.status:before{background:var(--navy-soft)}
.tl .ev.call:before{background:var(--amb)}
.tl .when{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

.modal{position:fixed;inset:0;background:rgba(1,17,17,.5);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:20}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;width:100%;max-width:560px;
   max-height:80vh;overflow:auto;box-shadow:var(--shadow)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warn-box{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px}
.todayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  flex-wrap:wrap;margin-bottom:16px}
.tilelink{font-size:13px;text-decoration:none;color:var(--t3)}
.tilelink:hover{color:var(--ink)}
.exports{display:flex;gap:6px;flex-wrap:wrap}

/* Today: one queue at a time */
.swipe{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dot{display:flex;align-items:center;gap:7px;background:none;border:1px solid var(--rule);
  border-radius:20px;padding:5px 13px;font:inherit;font-size:12.5px;color:var(--t3);cursor:pointer}
.dot:hover{border-color:var(--rule2);color:var(--ink)}
.dot.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.dot b{font-size:11px;background:var(--surface-2);border-radius:10px;padding:1px 7px}
.deck{padding-top:14px}
.deckhead{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:10px;margin-bottom:6px}
.deckhead .counter{text-align:center;font-size:12px;color:var(--t4);letter-spacing:.4px}
.deckhead .nav:disabled{opacity:.3;cursor:default}
.one{padding:22px 4px 20px;cursor:pointer;border-radius:6px}
.one:hover{background:var(--surface-2)}
.one h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.2px}
.one .oneline{margin:6px 0 0;font-size:15px}
.one .onemeta{margin:4px 0 0;font-size:12.5px;color:var(--t3)}
.oneact{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  border-top:1px solid var(--rule);padding-top:14px}
.tick-big{font-size:30px;color:var(--ok,#0a7d3c);margin-bottom:8px}
.deckhead .nav{background:none;border:1px solid var(--rule);border-radius:50%;width:32px;height:32px;
  font-size:19px;line-height:1;color:var(--t3);cursor:pointer}
.deckhead .nav:hover{border-color:var(--rule2);color:var(--ink)}
.deckfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px}
.done{padding:26px 0;text-align:center;color:var(--t3);font-size:14px}

/* CAR */
.cartable td{vertical-align:top}
.sub2{font-size:11.5px;color:var(--t4);margin-top:2px}
.sub2.late{color:var(--late,#b4483c);font-weight:600}
tr.aged td:first-child{box-shadow:inset 3px 0 0 var(--amb,#d98a1e)}
.fv{display:inline-block;font-size:12.5px}
.fv.extracted{border-bottom:1px dotted var(--rule2);color:var(--t3)}
.fv.confirmed,.fv.provider,.fv.operator,.fv.typed{color:var(--ink)}
.act{white-space:nowrap}
.tick{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:5px 0;cursor:pointer}
.tick input{width:auto;margin-top:2px}
.footnote{font-size:11.5px;color:var(--t4);margin-top:12px;cursor:help;
  border-bottom:1px dotted var(--rule2);display:inline-block;padding-bottom:1px}

/* Reports */
.frow{display:grid;grid-template-columns:200px 1fr 46px;gap:12px;align-items:center;
  padding:5px 0;text-decoration:none;color:inherit;border-radius:4px}
.frow:hover{background:var(--surface-2)}
.frow .flabel{font-size:13px}
.frow b{font-size:14px;text-align:right}

nav a.item{gap:10px}
.ico{width:17px;height:17px;flex:0 0 17px;opacity:.75}
nav a.item.on .ico{opacity:1}
nav a.item span:first-of-type{flex:1}
.waiting{margin-top:8px}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;
  font-size:12px;color:var(--t3);text-decoration:none}
.wrow:hover{color:var(--ink)}
.wrow b{font-size:12.5px}
.wrow b.late{color:var(--late,#b4483c)}
.wrow.big{font-size:13px;color:var(--ink)}
.whint{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--t4);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--rule);
  border-radius:8px;padding:14px 16px;transition:border-color .12s,transform .12s}
.tile:hover{border-color:var(--rule2);transform:translateY(-1px)}
.tile b{display:block;font-size:26px;line-height:1.1;font-weight:600}
.tile span{display:block;font-size:12px;color:var(--t3);margin-top:3px}
.tile.alarm b{color:var(--late,#b4483c)}
.msg{margin-top:10px;padding:10px 12px;background:var(--surface-2);border-left:3px solid var(--rule2);
  border-radius:4px;font-size:13.5px;white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipf{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 8px;border-radius:12px;
  background:var(--surface-2)}
.chipf i{font-style:normal;opacity:.6;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.card.aged{border-left:3px solid var(--amb,#d98a1e)}
.diff{margin-top:4px;font-size:12px}
.diff .was{text-decoration:line-through;color:var(--t3)}
.diff .now{font-weight:600}
.prov{background:var(--surface-2);border-left:3px solid var(--pet);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.empty{color:var(--muted);padding:26px 2px;text-align:center}
.bar{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:10px;background:var(--pet)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--surface);color:var(--accent-ink);border:1px solid var(--line);border-radius:8px;padding:7px 13px}
.tabs button.on{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.err{background:rgba(165,52,43,.10);border:1px solid rgba(165,52,43,.45);color:#8E2E26;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.simwrap{display:grid;grid-template-columns:240px 1fr;gap:16px}
.simlist{display:flex;flex-direction:column;gap:6px}
.simitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;
  background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13.5px}
.simitem.on{border-color:var(--accent-ink);box-shadow:var(--lift-hover)}
.flow{display:flex;flex-direction:column}
.fstep{position:relative;padding:8px 0 8px 22px;border-left:2px solid var(--rule);font-size:13.5px}
.fstep:before{content:'';position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--pet)}
.fstep.bad{border-left-color:var(--amb)}
.fstep.bad:before{background:var(--amb)}
.fstep b{display:inline-block;min-width:130px;text-transform:uppercase;font-size:11px;letter-spacing:.5px;color:var(--muted)}
pre{background:var(--surface-2);border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:320px;white-space:pre-wrap}
code{font-size:12.5px}
.trace{border-left:3px solid var(--brand-blue);padding-left:10px;margin:4px 0;font-size:13.5px}
.trace.bad{border-left-color:var(--late)}
@media(max-width:900px){.simwrap{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <nav>
    <div class="brand">Novikontas<br>College CRM<span id="ver">virtual prototype</span></div>
    <div class="navgroup">Daily work</div>
    <a class="item" href="#/today" data-icon="today"><span>Today</span><span class="pill late" id="navOverdue" style="display:none"></span></a>
    <a class="item" href="#/car" data-icon="car" title="Channel Automation Results: everything the channels brought in"><span>CAR</span><span class="pill warn" id="navIntake" style="display:none"></span></a>
    <a class="item" href="#/people" data-icon="people"><span>People</span></a>
    <a class="item" href="#/followup" data-icon="clock"><span>Follow-ups</span></a>
    <a class="item" href="#/reports" data-icon="chart"><span>Reports</span></a>
    <div class="add"><button class="btn" style="width:100%" onclick="openAdd()">+ Add person</button></div>

    <div class="navsplit"></div>
    <div class="themes" style="border-top:none;padding-top:0">
      <label for="actor">Acting as <span class="pill warn" style="font-size:8.5px">NO LOGIN</span></label>
      <select id="actor" onchange="setActor(this.value)"></select>
      <div id="waiting" class="waiting"></div>
    </div>

    <div class="navsplit"></div>
    <div class="navgroup demo">DEV CONTROL</div>
    <a class="item demo" href="#/integrations" data-icon="plug"><span>Channels</span></a>
    <a class="item demo" href="#/history" data-icon="history"><span>History</span></a>
    <a class="item demo" href="#/privacy" data-icon="shield"><span>Privacy</span></a>
    <div class="add" style="margin-top:8px"><button class="btn ghost" style="width:100%" onclick="loadScenario()">Load demo data</button></div>
    <div class="add" style="margin-top:6px"><button class="btn ghost" style="width:100%" onclick="resetDb()">Clear everything</button></div>
    <div class="themes" style="border-top:none;padding-top:0;margin-top:10px"><label for="theme">Theme</label>
      <select id="theme" onchange="setTheme(this.value)">
        <option value="light">Light</option><option value="dark">Dark</option>
      </select></div>
  </nav>
  <main id="view"><div class="empty">Loading...</div></main>
</div>
<div id="modal"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);

// One small line drawing per tab. Plain shapes, no brand, no decoration.
const svg = (d) => `<svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor"
  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  today: svg('<rect x="3" y="4.5" width="14" height="12" rx="2"/><path d="M3 8h14M7 3v3M13 3v3"/>'),
  car: svg('<path d="M3 12.5h14M4.5 12.5V10l1.8-3.2a1.5 1.5 0 0 1 1.3-.8h4.8a1.5 1.5 0 0 1 1.3.8L15.5 10v2.5"/><circle cx="6.5" cy="13.9" r="1.3"/><circle cx="13.5" cy="13.9" r="1.3"/>'),

// Notifications. Not a bell that pings: a short line saying what is waiting for
// whoever you are, and for an admin, what is waiting for everybody.
async function drawWaiting() {
  const box = document.querySelector('#waiting');
  if (!box) return;
  try {
    const w = await api('/api/waiting?as=' + encodeURIComponent(ACTOR));
    if (w.isAdmin) {
      box.innerHTML = w.byRole.map(r => `<a href="${r.role === 'Marketing' ? '#/car' : '#/today'}"
        class="wrow"><span>${esc(r.role)}</span><b class="${r.overdue || r.aged ? 'late' : ''}">${r.total}</b></a>`).join('')
        + '<div class="whint">waiting, per role</div>';
    } else if (w.mine.total) {
      box.innerHTML = `<a href="${w.mine.intake ? '#/car' : '#/today'}" class="wrow big">
        <span>waiting for you</span><b class="${w.mine.overdue || w.mine.aged ? 'late' : ''}">${w.mine.total}</b></a>`;
    } else {
      box.innerHTML = '<div class="whint">nothing waiting for you</div>';
    }
  } catch { box.innerHTML = ''; }
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Times are stored as UTC instants and shown where the college actually is, so
// the 09:00 ageing rule reads as 09:00 on the screen and not as 06:00.
const TZ = 'Europe/Riga';
const fmtDate = (s) => {
  if (!s) return '';
  try { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(s)); }
  catch { return String(s).slice(0, 10); }
};
const fmtDateTime = (s) => {
  if (!s) return '';
  try {
    return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit',
      day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(s)).replace(',', '');
  } catch { return String(s).slice(0, 16).replace('T', ' '); }
};
const todayStr = () => new Date().toISOString().slice(0, 10);
let CFG = {}, STATE = { q: '', status: '', programme: '', owner: '', source: '', due: '', sort: 'created_at', dir: 'desc', fuTab: 'overdue' };

const api = async (path, opts) => {
  const r = await fetch(path, opts);
  if (!r.ok) { const e = await r.json().catch(() => ({ error: r.statusText })); throw new Error(e.error || 'request failed'); }
  return r.json();
};
const post = (path, data) => api(path, { method: 'POST',
  headers: { 'content-type': 'application/json', 'x-acting-as': ACTOR },
  body: JSON.stringify({ by: ACTOR, ...(data || {}) }) });

const STAGE_PILL = { 'New': 'accent', 'Contacted': 'accent', 'Follow-up': 'warn', 'Application': 'warn',
  'Contract': 'ok', 'Admitted': 'ok', 'Not proceeding': 'calm' };
const stageChip = (s) => `<span class="pill ${STAGE_PILL[s] || 'calm'}">${esc(s)}</span>`;
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('crmTheme', t); } catch {} }
const channelLabel = (c) => (CFG.channels && CFG.channels[c]) || c || '-';

// -------------------------------------------------------------- acting as --
// There is no authentication. This is a setting, and every screen that depends
// on it says so out loud rather than looking like a permission check.

function setActor(who) {

  const sel = document.querySelector('#actor');

function drawActorPicker() {
  const sel = document.querySelector('#actor');
  if (!sel) return;
  // A ROLE is not a PERSON. You act as a person; a record is owned by a role.
  const users = (CFG.users || []).map(u =>
    `<option value="${esc(u.name)}">${esc(u.name)} - ${esc(u.title || u.role)}</option>`).join('');
  const admins = (CFG.admins || []).map(a => `<option value="${esc(a)}">${esc(a)} - admin</option>`).join('');
  sel.innerHTML = `<optgroup label="CRM users">${users}</optgroup><optgroup label="Admins">${admins}</optgroup>`;

}
const myRole = () => ((CFG.users || []).find(u => u.name === ACTOR) || {}).role || null;
const withActor = (data) => ({ ...(data || {}), by: ACTOR });
const dueClass = (d) => {
  if (!d) return '';
  const day = todayStr();
  return d.slice(0, 10) < day ? 'over' : d.slice(0, 10) === day ? 'today' : '';
};
const dueText = (d) => {
  if (!d) return '<span class="pill calm">none</span>';
  const diff = Math.round((Date.parse(d.slice(0,10)) - Date.parse(todayStr())) / 86400000);
  const label = diff === 0 ? 'today' : diff < 0 ? `${-diff} d. overdue` : `in ${diff} d.`;
  return `<span class="due ${dueClass(d)}">${fmtDate(d)} <span style="font-weight:400">(${label})</span></span>`;
};


// ---------------------------------------------------------------- routing --
async function route() {
  const hash = location.hash || '#/today';
  drawIcons();
  document.querySelectorAll('nav a.item').forEach(a => a.classList.toggle('on', a.getAttribute('href') === hash.split('/').slice(0,2).join('/')));
  const [, page, arg] = hash.split('/');
  try {
    if (page === 'people') await viewPeople();
    else if (page === 'car' || page === 'inbox') await viewInbox();
    else if (page === 'funnel' || page === 'metrics') await viewReports();
    else if (page === 'history') await viewHistory();
    else if (page === 'person') await viewPerson(arg);
    else if (page === 'followup') await viewFollowup();
    else if (page === 'intake') await viewIntake(arg);
    else if (page === 'opendays') { INTAKE_TAB = 'opendays'; await viewIntake('opendays'); }
    else if (page === 'integrations') await viewIntegrations(arg);
    else if (page === 'inspector') await viewInspector(arg);
    else if (page === 'metrics') await viewMetrics();
    else if (page === 'privacy') await viewPrivacy();
    else if (page === 'reports') await viewReports();
    else await viewToday();
  } catch (e) {
    $('#view').innerHTML = `<div class="err">Failed to load: ${esc(e.message)}</div>`;
  }
  refreshBadge();
}
async function refreshBadge() {
  try {
    const s = await api('/api/summary');
    const el = $('#navOverdue');
    if (s.overdue.length) { el.textContent = s.overdue.length; el.style.display = ''; } else el.style.display = 'none';
  } catch {}
  try {
    const i = await api('/api/intake');
    const el = $('#navIntake');
    // The count is a nudge, and a nudge belongs to whoever owns the queue.
    // Ieva can still open CAR and look - nothing is hidden - but the intake is
    // Marketing's work and must not sit in her sidebar asking to be done.
    const ownsIntake = myRole() === (CFG.routing || {}).unclear || (CFG.admins || []).includes(ACTOR);
    if (i.counts.new && ownsIntake) {
      el.textContent = i.counts.new;
      el.className = 'pill ' + (i.counts.aged ? 'late' : 'warn');
      el.title = i.counts.aged ? `${i.counts.aged} waiting since yesterday` : 'waiting to be looked at';
      el.style.display = '';
    } else el.style.display = 'none';
  } catch {}
  drawWaiting();
}

// ------------------------------------------------------------- the database --
// Empty, real or synthetic, switched as often as a demo needs.
// Next action is never a free text box and never optional: it comes from the
// list, and every option drives towards a visit, an application or payment.
function nextActionOptions(selectedLabel) {
  const groups = CFG.nextActions || [];
  const opts = groups.map(g => `<optgroup label="${esc(g.group)}">` +
    g.items.map(i => `<option value="${esc(i.label)}" data-days="${i.days}" data-drives="${esc(i.drives)}"
      ${i.label === selectedLabel ? 'selected' : ''}>${esc(i.label)}</option>`).join('') + '</optgroup>').join('');
  return opts;
}
function daysForAction(label) {
  for (const g of (CFG.nextActions || [])) for (const i of g.items) if (i.label === label) return i.days;
  return 2;
}
function drivesFor(label) {
  for (const g of (CFG.nextActions || [])) for (const i of g.items) if (i.label === label) return i.drives;
  return null;
}
const DRIVES_LABEL = { visit: 'drives towards a visit', application: 'drives towards the application and documents', payment: 'drives towards payment', info: 'information' };
function onNextActionChange(selId, dateId, hintId) {
  const sel = document.querySelector('#' + selId);
  const label = sel.value;
  const d = new Date(Date.now() + daysForAction(label) * 86400000);
  const date = document.querySelector('#' + dateId);
  if (date) date.value = d.toISOString().slice(0, 10);
  const hint = document.querySelector('#' + hintId);
  if (hint) hint.textContent = DRIVES_LABEL[drivesFor(label)] || '';
}

function drawDatasetBadge(ds) {
  const brand = document.querySelector('nav .brand');
  if (!brand) return;
  const old = brand.querySelector('.dataset');
  if (old) old.remove();
  const badge = document.createElement('div');
  const kind = (ds && ds.dataset) || 'empty';
  badge.className = 'dataset ' + kind;
  badge.textContent = kind === 'real' ? 'REAL DATA - ' + ds.people + ' people'
    : kind === 'synthetic' ? 'SYNTHETIC DATA - ' + ds.people + ' people'
    : kind === 'demo' ? 'V1 DEMO DATA - ' + ds.people + ' people'

  badge.title = (ds && ds.selection) || '';

}

// Today is a work queue, not a dashboard. You pick which queue you are working,
// then you go through it ONE PERSON AT A TIME. Next, previous, swipe, act.
// Nothing else is on the screen, because everything else is somewhere else.
let TODAY_ORDER = null;
let TODAY_AT = 0;      // which queue
let TODAY_ITEM = 0;    // which person inside it

function todayOrder(serverOrder) {
  if (TODAY_ORDER) return TODAY_ORDER;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('crmTodayOrder') || 'null'); } catch {}
  const ok = Array.isArray(saved) && saved.length === serverOrder.length
    && serverOrder.every(id => saved.includes(id));
  TODAY_ORDER = ok ? saved : serverOrder.slice();
  return TODAY_ORDER;
}

function todayPickQueue(i) {
  TODAY_AT = i; TODAY_ITEM = 0;
  try { localStorage.setItem('crmTodayQueue', String(i)); } catch {}
  viewToday();
}
function todayStep(delta, count) {
  if (!count) return;
  TODAY_ITEM = (TODAY_ITEM + delta + count) % count;
  viewToday();
}

// What this one person needs, said in one line, with one button that does it.
function todayCard(g, item) {
  if (g.id === 'follow_ups') {
    return {
      name: item.name,
      line: item.label,
      meta: dueText(item.due_at),
      open: `#/person/${item.person_id}`,
      action: `<button class="btn" onclick="event.stopPropagation();openComplete(${item.id},'${esc(item.label)}')">Mark done</button>`,
    };
  }
  if (g.id === 'replies') {
    return {
      name: item.name,
      line: esc(String(item.subject || 'They wrote to us')),
      meta: `${channelLabel(item.channel || item.source_channel)} &middot; ${fmtDateTime(item.occurred_at)}`,
      open: `#/person/${item.id}`,
      action: `<button class="btn" onclick="event.stopPropagation();openNote('${item.id}','note')">Write what happened</button>`,
    };
  }
  if (g.id === 'new_leads') {
    return {
      name: item.name,
      line: item.programme ? `Wants ${esc(item.programme)}` : 'Has not said what they want yet',
      meta: `${channelLabel(item.source_channel)} &middot; arrived ${fmtDate(item.created_at)}`,
      open: `#/person/${item.id}`,
      action: `<button class="btn" onclick="event.stopPropagation();openNote('${item.id}','call')">Log a call</button>`,
    };
  }
  return {
    name: item.name,
    line: 'Nobody has planned the next step',
    meta: `${esc(item.status || '')} &middot; ${channelLabel(item.source_channel)}`,
    open: `#/person/${item.id}`,
    action: `<button class="btn" onclick="event.stopPropagation();openNewTask('${item.id}')">Plan the next step</button>`,
  };
}

async function viewToday() {
  const t = await api('/api/today');
  const order = todayOrder(t.order);
  const byId = Object.fromEntries(t.groups.map(g => [g.id, g]));
  const groups = order.map(id => byId[id]).filter(Boolean);

  if (TODAY_AT === 0) {
    try { const saved = Number(localStorage.getItem('crmTodayQueue')); if (saved >= 0 && saved < groups.length) TODAY_AT = saved; } catch {}
  }
  if (TODAY_AT >= groups.length) TODAY_AT = 0;
  const g = groups[TODAY_AT];
  const items = g.rows;
  if (TODAY_ITEM >= items.length) TODAY_ITEM = 0;

  const picker = groups.map((x, i) => `<button class="dot ${i === TODAY_AT ? 'on' : ''}"
    onclick="todayPickQueue(${i})"><span>${esc(x.label)}</span>${x.open ? `<b>${x.open}</b>` : ''}</button>`).join('');

  let body;
  if (!items.length) {
    body = `<div class="card deck"><div class="done">
      <div class="tick-big">&#10003;</div>
      ${g.done ? `All ${g.total} done today.` : 'Nothing waiting here.'}
      <div class="sub" style="margin-top:6px">${esc(t.descriptions[g.id] || '')}</div>
    </div></div>`;
  } else {
    const item = items[TODAY_ITEM];
    const c = todayCard(g, item);
    body = `<div class="card deck" id="deck">
      <div class="deckhead">
        <button class="nav" onclick="todayStep(-1,${items.length})" title="previous" ${items.length < 2 ? 'disabled' : ''}>&#8249;</button>
        <div class="counter">${TODAY_ITEM + 1} of ${items.length}</div>
        <button class="nav" onclick="todayStep(1,${items.length})" title="next" ${items.length < 2 ? 'disabled' : ''}>&#8250;</button>
      </div>
      <div class="one" onclick="location.hash='${c.open}'">
        <h2>${esc(c.name)}</h2>
        <p class="oneline">${c.line}</p>
        <p class="onemeta">${c.meta}</p>
      </div>
      <div class="oneact">
        ${c.action}
        <a class="tilelink" href="${c.open}">Open the record &rarr;</a>
      </div>
    </div>`;
  }

  $('#view').innerHTML = `
  <div class="todayhead">
    <div><h1 style="margin:0">Today</h1>
      <p class="sub" style="margin:2px 0 0">${esc(ACTOR)}${myRole() ? ' &middot; ' + esc(myRole()) : ''}</p></div>
  </div>
  <div class="swipe">${picker}</div>
  ${body}`;

  const deck = document.querySelector('#deck');
  if (deck && items.length > 1) {
    let x0 = null;
    deck.addEventListener('touchstart', (e) => { x0 = e.changedTouches[0].clientX; }, { passive: true });
    deck.addEventListener('touchend', (e) => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 50) todayStep(dx < 0 ? 1 : -1, items.length);
      x0 = null;
    }, { passive: true });
  }
}

function funnelHtml(byStage) {
  const map = Object.fromEntries(byStage.map(r => [r.status, r.n]));
  const max = Math.max(1, ...byStage.map(r => r.n));
  return (CFG.stages || []).map(st => {
    const n = map[st.id] || 0;
    return `<div style="display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin-bottom:6px">
      <div style="font-size:13px">${esc(st.label)}</div>
      <div class="bar"><i style="width:${Math.round(n / max * 100)}%;background:${st.colour}"></i></div>
      <div style="font-size:13px;text-align:right">${n}</div></div>`;
  }).join('');
}

// ----------------------------------------------------------------- people --
async function viewPeople() {
  const qs = new URLSearchParams({ q: STATE.q, status: STATE.status, programme: STATE.programme, owner: STATE.owner,
    source_channel: STATE.source, due: STATE.due, sort: STATE.sort, dir: STATE.dir });
  const data = await api('/api/people?' + qs);
  const opt = (arr, cur) => ['<option value="">all</option>'].concat(arr.map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`)).join('');
  const th = (key, label) => `<th onclick="sortBy('${key}')">${label}${STATE.sort === key ? (STATE.dir === 'asc' ? ' ▲' : ' ▼') : ''}</th>`;
  $('#view').innerHTML = `
  <h1>People</h1><p class="sub">${data.count} records</p>
  <div class="filters">
    <input id="fq" placeholder="Search name, email, phone, programme, source, id" value="${esc(STATE.q)}" style="min-width:300px">
    <select id="fstatus">${opt((CFG.stages || []).map(s => s.id), STATE.status)}</select>
    <select id="fprog">${opt(CFG.programmes || [], STATE.programme)}</select>
    <select id="fsource">${opt(Object.keys(CFG.channels || {}), STATE.source)}</select>
    <select id="fdue"><option value="">due: all</option><option value="overdue" ${STATE.due==='overdue'?'selected':''}>overdue</option><option value="none" ${STATE.due==='none'?'selected':''}>without a next step</option></select>
    <button class="btn ghost" onclick="clearFilters()">Clear</button>
  </div>
  <div class="card">
  ${data.rows.length ? `<table><thead><tr>${th('name','Name')}${th('programme','Programme')}${th('source_channel','Source')}${th('status','Status')}${th('owner','Owner')}${th('last_contact_at','Last contact')}<th>Next step</th></tr></thead>
  <tbody>${data.rows.map(r => `<tr class="row" tabindex="0" onclick="location.hash='#/person/${r.id}'">
    <td><b>${esc(r.name)}</b><div style="color:var(--steel);font-size:12px">${esc(r.email || '')}</div></td>
    <td>${esc(r.programme || '')}<div style="color:var(--steel);font-size:12px">${esc(r.education || '')}</div></td>
    <td>${esc(channelLabel(r.source_channel))}<div style="color:var(--steel);font-size:12px">${esc(r.source_campaign || '')}</div></td>
    <td>${stageChip(r.status)}</td><td>${esc(r.owner || '')}</td><td>${fmtDate(r.last_contact_at)}</td>
    <td>${r.next_action ? esc(r.next_action) + '<br>' + dueText(r.next_action_at) : '<span class="pill calm">none</span>'}</td></tr>`).join('')}</tbody></table>`
  : '<div class="empty">No record matches the filters. <a href="#" onclick="clearFilters();return false">Clear the filters</a></div>'}
  </div>`;
  $('#fq').oninput = debounce(e => { STATE.q = e.target.value; viewPeople(); }, 250);
}
function sortBy(k) { if (STATE.sort === k) STATE.dir = STATE.dir === 'asc' ? 'desc' : 'asc'; else { STATE.sort = k; STATE.dir = 'asc'; } viewPeople(); }
function clearFilters() { Object.assign(STATE, { q: '', status: '', programme: '', owner: '', source: '', due: '' }); viewPeople(); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function latestConsents(rows) {
  const seen = new Map();
  for (const r of rows) if (!seen.has(r.purpose)) seen.set(r.purpose, r);  // rows arrive newest first
  return [...seen.values()];
}

// The routing rule, shown as it will actually apply. Confirming an interest is
// what sends it to Admissions, so the operator sees that before they save.
function updateRoutePreview() {
  const box = document.querySelector('#qRoute');
  if (!box) return;
  const hasInterest = [...document.querySelectorAll('.qConfirm:checked')].some(c => c.value === 'interest');
  const level = hasInterest ? 'lead' : 'unclear';
  const owner = (CFG.routing || {})[level];
  box.innerHTML = hasInterest
    ? `They told us what they want to study, so this goes to <b>${esc(owner)}</b>.`
    : `Nobody can tell what they want yet, so this stays with <b>${esc(owner)}</b>.`;
}

async function doQualify(id) {
  const confirmFields = [...document.querySelectorAll('.qConfirm:checked')].map(c => c.value);
  const qualification = confirmFields.includes('interest') ? 'lead' : 'unclear';
  try {
    const r = await post(`/api/intake/${id}/qualify`, {
      qualification, createPerson: true,
      note: document.querySelector('#qNote').value, confirmFields,
    });
    closeModal();
    if (r.handoverGap) alert(`${r.handoverGap.problem}\n\n${r.handoverGap.action}`);
    viewInbox();
  } catch (e) { $('#qErr').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

function flowHtml(steps) {
  return `<div class="flow">${(steps || []).map(s => `<div class="fstep ${s.ok === false ? 'bad' : ''}">

  const dec = r.decision || '';
  const cls = dec === 'created' || dec.startsWith('matched') || dec === 'sent' ? 'ok'

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h3 style="margin:0">Result</h3>
      <span class="pill ${cls}">${esc(dec)}</span>
    </div>
    <h3 style="margin-top:12px">The path through the system</h3>
    ${flowHtml(r.steps)}
    ${r.personId ? `<div style="margin-top:10px"><a href="#/person/${esc(r.personId)}">Open person ${esc(r.personId)}</a></div>` : ''}
    ${r.crmResult && r.crmResult.note ? `<div class="prov" style="margin-top:10px">${esc(r.crmResult.note)}</div>` : ''}
    ${r.mapping && r.mapping.length ? `<h3 style="margin-top:14px">Field mapping</h3>
      <table><thead><tr><th>From the provider</th><th></th><th>CRM field</th><th>Value</th></tr></thead><tbody>
      ${r.mapping.map(m => `<tr><td><code>${esc(m.from)}</code></td><td>&rarr;</td><td><code>${esc(m.to)}</code></td><td>${esc(m.value)}</td></tr>`).join('')}

    ${r.identity ? `<h3 style="margin-top:14px">Identity</h3>

      <div>Found</div><div>${r.identity.hits && r.identity.hits.length ? r.identity.hits.map(h => esc(h.key + ' -> ' + h.id)).join(', ') : 'nothing'}</div>

    <pre>${esc(JSON.stringify(r.raw, null, 2))}</pre>
    ${r.signature ? `<div class="muted" style="font-size:12px">X-Hub-Signature-256: <code>${esc(r.signature)}</code></div>` : ''}

async function runSim(channelId, scenario) {
  try {
    const r = await post('/api/sim/' + channelId + '/run', { scenario });
    LASTRUN[channelId] = r;
    SIM = null; SIMSEL = channelId;
    await viewIntegrations(channelId);
  } catch (e) { alert('Failed: ' + e.message); }
}

async function runOut(channelId) {
  const last = LASTRUN[channelId];
  if (!last || !last.personId) return alert('Run an inbound test first, so there is something to reply to.');
  try {
    const r = await post('/api/sim/' + channelId + '/outbound', { personId: last.personId });
    LASTRUN[channelId] = Object.assign({}, r, { personId: last.personId });
    SIM = null;
    await viewIntegrations(channelId);
  } catch (e) { alert('Failed: ' + e.message); }
}

      <button class="btn ghost" onclick="closeModal()">Cancel</button>
    </div>
    <div class="prov" style="margin-top:10px">Saving as <b>${esc(ACTOR)}</b>. There is no login, so this is
      the name the history will carry, not a verified identity.</div>`);
}

async function saveEdit(id) {
  const patch = {};
  for (const [key] of EDIT_FIELDS) {
    const el = document.querySelector('#e_' + key);
    if (el) patch[key] = el.value;
  }
  try {
    const r = await post(`/api/people/${id}/edit`, patch);
    closeModal();
    if (!r.changes.length) return viewPerson(id);
    viewPerson(id);
  } catch (err) {
    const box = $('#eErr');
    if (box) { box.style.display = ''; box.textContent = err.message; }
  }
}

// --------------------------------------------------------------- history --
// Backlog 10, 11, 12: one log, automatic and manual side by side, admins only.
const originChip = (o) => o === 'automatic'
  ? '<span class="pill calm">automatic</span>'
  : '<span class="pill accent">manual</span>';

let HISTORY_FILTER = '';
function setHistoryFilter(v) { HISTORY_FILTER = v; viewHistory(); }

async function viewHistory() {
  let data;
  try {
    data = await api('/api/history?as=' + encodeURIComponent(ACTOR)
      + (HISTORY_FILTER ? '&origin=' + HISTORY_FILTER : ''));
  } catch (err) {
    return renderHistoryRefusal(err.message);
  }
  const mine = !data.isAdmin;
  const line = (r, mine) => `<tr class="row" ${r.personId ? `tabindex="0" onclick="location.hash='#/person/${r.personId}'"` : ''}>
    <td>${esc(String(r.at).slice(0, 16).replace('T', ' '))}</td>
    <td>${originChip(r.origin)}</td>
    <td>${esc(r.kind)}</td>
    <td>${r.personName ? esc(r.personName) : '<span class="muted">-</span>'}</td>
    <td><b>${esc(r.subject || '')}</b>${r.body && !r.field ? `<div style="color:var(--steel);font-size:12px">${esc(r.body)}</div>` : ''}
      ${r.field ? `<div class="diff"><span class="was">${esc(r.oldValue ?? '(empty)')}</span> &rarr; <span class="now">${esc(r.newValue ?? '(empty)')}</span></div>` : ''}</td>
    ${mine ? '' : `<td>${esc(r.actor || '-')}</td>`}</tr>`;
  const tab = (v, label) => `<button class="btn sm ${HISTORY_FILTER === v ? '' : 'ghost'}" onclick="setHistoryFilter('${v}')">${label}</button>`;
  $('#view').innerHTML = `
  <h1>${mine ? 'My history' : 'History'}</h1>
  <p class="sub">${mine
    ? 'What you have done. One list, in the order it happened.'
    : 'One log. What the system did and what somebody did by hand, in the same list.'}</p>
  <p class="footnote" title="${esc([data.scopeNote, data.roleWarning, data.honesty].filter(Boolean).join(' '))}">
    ${mine ? 'Only your own actions are listed.' : 'Everything, because you are an admin.'}
    There is no login yet.</p>
  <div class="filters">${mine ? '' : tab('', 'Everything') + ' ' + tab('manual', 'Manual only') + ' ' + tab('automatic', 'Automatic only')}
    <span class="muted" style="align-self:center">${data.count} entries</span></div>
  <div class="card">
  ${data.rows.length ? `<table><thead><tr><th>Time</th><th>Origin</th><th>Kind</th><th>Person</th><th>What happened</th>${mine ? '' : '<th>By</th>'}</tr></thead>
    <tbody>${data.rows.map((r) => line(r, mine)).join('')}</tbody></table>`
  : `<div class="empty">${mine
      ? 'You have not done anything yet. Add somebody, log a call, or correct a record.'
      : 'Nothing has happened yet. Add somebody, or run the channel demo.'}</div>`}
  </div>`;
}

function renderHistoryRefusal(message) {
  $('#view').innerHTML = `
  <h1>History</h1>
  <p class="sub">One log. What the system did and what somebody did by hand, in the same list.</p>
  <div class="card">
    <h3 style="margin:0 0 8px">${esc(message)}</h3>
    <p>You are acting as <b>${esc(ACTOR)}</b>. The admins are
      <b>${esc((CFG.admins || []).join(', '))}</b>. Nobody in the admissions roles is an admin.</p>
    <div class="prov"><b>This is not security.</b> ${esc(CFG.historyHonesty || '')}
      The rule is shown here so it can be judged before authentication is built.</div>
    <div class="prov" style="margin-top:10px"><b>Still open:</b> does an ordinary user see no history at all,
      or only their own actions? Nobody has decided, so the prototype shows nothing.</div>
  </div>`;
}

function openAdd() {
  const d = CFG.quickAddDefaults || {};
  ADD_CONFIRMED_NEW = false;
  modal('Add person', `
    <div class="row2">
      <div><label>Full name *</label><input id="aName" oninput="checkDup()"></div>
      <div><label>Phone</label><input id="aPhone" oninput="checkDup()"></div>
    </div>
    <div class="row2">
      <div><label>Email</label><input id="aEmail" oninput="checkDup()"></div>
      <div><label>Programme</label><select id="aProg"><option value=""></option>${(CFG.programmes||[]).map(p=>`<option>${esc(p)}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div><label>Source</label><select id="aSource">${Object.entries(CFG.channels||{}).map(([k,v])=>`<option value="${esc(k)}" ${k===d.source_channel?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
      <div><label>Owner (a role, not a person)</label><select id="aOwner">${(CFG.owners||[]).map(o=>`<option ${o===d.owner?'selected':''}>${esc(o)}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div><label>Next step (required)</label>
        <select id="aNext" onchange="document.querySelector('#aDays').value = daysForAction(this.value)">${nextActionOptions(d.nextAction)}</select></div>
      <div><label>In how many days</label><input id="aDays" type="number" value="${d.nextActionDays ?? 1}"></div>
    </div>
    <label>Note</label><textarea id="aNote" rows="2"></textarea>
    <div id="dup"></div>
    <div id="addErr"></div>
    <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="saveAdd()">Save</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button></div>
    <div class="prov" style="margin-top:12px">For a walk-in the source defaults to Walk-in, because no digital event arrives - a member of staff types it in.</div>`);
}
async function checkDup() {
  ADD_CONFIRMED_NEW = false;
  const q = new URLSearchParams({ name: $('#aName').value, email: $('#aEmail').value, phone: $('#aPhone').value });
  const r = await api('/api/people/check?' + q);
  if (!r.matches.length) { $('#dup').innerHTML = ''; return; }
  showDuplicateBlock({ error: 'This person may already be in the CRM.', matches: r.matches });
}
let ADD_CONFIRMED_NEW = false;
async function saveAdd() {
  const payload = {
    name: $('#aName').value.trim(), email: $('#aEmail').value.trim(), phone: $('#aPhone').value.trim(),
    programme: $('#aProg').value, source_channel: $('#aSource').value, owner: $('#aOwner').value,
    nextAction: $('#aNext').value, nextActionDays: Number($('#aDays').value), notes: $('#aNote').value,
    confirmedNotDuplicate: ADD_CONFIRMED_NEW,
  };
  const r = await fetch('/api/people', { method: 'POST',
    headers: { 'content-type': 'application/json', 'x-acting-as': ACTOR },
    body: JSON.stringify({ by: ACTOR, ...payload }) });
  const data = await r.json().catch(() => ({ error: r.statusText }));
  if (r.status === 409) return showDuplicateBlock(data);
  if (!r.ok) return void ($('#addErr').innerHTML = `<div class="err">${esc(data.error || 'failed')}</div>`);
  ADD_CONFIRMED_NEW = false;
  closeModal(); location.hash = '#/person/' + data.id;
}

// Decision 9: the save stops. The operator opens the existing record, or says in
// as many words that this is somebody else.
function showDuplicateBlock(data) {
  $('#dup').innerHTML = `<div class="warn-box">
    <b>${esc(data.error)}</b>
    <div style="margin-top:8px">${(data.matches || []).map(m => `
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:4px 0">
        <div><b>${esc(m.name)}</b> <span class="muted">${esc(m.email || '')} ${esc(m.phone || '')}</span>
          <div style="font-size:12px;color:var(--steel)">same ${esc((m.matchedOn || []).join(' and '))} &middot;
            added ${esc(String(m.created_at).slice(0, 10))} &middot; ${esc(m.status)}</div></div>
        <button class="btn sm ghost" onclick="closeModal();location.hash='#/person/${esc(m.id)}'">Open</button>
      </div>`).join('')}</div>
    <div style="margin-top:10px"><label style="display:flex;gap:8px;align-items:center;font-size:13px">
      <input type="checkbox" id="dupOk" onchange="ADD_CONFIRMED_NEW = this.checked" style="width:auto">
      This is a different person, not the record above</label></div>
  </div>`;
  $('#addErr').innerHTML = '';
}

function openComplete(taskId, label) {
  modal('Complete: ' + label, `
    <label>Outcome</label>
    <select id="cOut">${(CFG.callOutcomes || ['Done']).map(o => `<option>${esc(o)}</option>`).join('')}</select>
    <label>Note</label><textarea id="cNote" rows="2"></textarea>
    <div class="row2">
      <div><label>Next step (required)</label>
        <select id="cNext" onchange="onNextActionChange('cNext','cDate','cHint')">${nextActionOptions()}</select>
        <div class="muted" id="cHint" style="font-size:12px;margin-top:4px"></div></div>
      <div><label>When</label><input id="cDate" type="date" value="${todayStr()}"></div>
    </div>
    <div class="prov" style="margin-top:10px">Every person always keeps a next step. It leads either to a visit on site, or to an application in SIS with documents, and on to payment.</div>
    <div id="cErr"></div>
    <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="doComplete(${taskId})">Save</button>
    <button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
  onNextActionChange('cNext', 'cDate', 'cHint');
}
async function doComplete(id) {
  const nextLabel = $('#cNext').value;
  if (!nextLabel) { $('#cErr').innerHTML = '<div class="err">The next step is required.</div>'; return; }
  try {
    await post(`/api/tasks/${id}/complete`, { outcome: $('#cOut').value, note: $('#cNote').value,
      nextLabel, nextDate: $('#cDate').value });
    closeModal(); route();
  } catch (e) { $('#cErr').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function openReschedule(id) {
  modal('Reschedule the action', `<label>New date</label><input id="rDate" type="date" value="${todayStr()}">
    <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="doReschedule(${id})">Reschedule</button>
    <button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
async function doReschedule(id) { await post(`/api/tasks/${id}/reschedule`, { due: $('#rDate').value }); closeModal(); route(); }

function openNewTask(personId) {
  modal('Add an action', `<label>Next step</label>
    <select id="tLabel" onchange="onNextActionChange('tLabel','tDate','tHint')">${nextActionOptions()}</select>
    <div class="muted" id="tHint" style="font-size:12px;margin-top:4px"></div>
    <label>Due</label><input id="tDate" type="date" value="${todayStr()}">
    <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="doNewTask('${personId}')">Save</button>
    <button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
async function doNewTask(personId) {
  await post(`/api/people/${personId}/task`, { label: $('#tLabel').value, due: $('#tDate').value });
  closeModal(); viewPerson(personId);
}

// A note carries a type so it can be read and reported on, and it stays in the
// same single history as everything else. No separate note screens.
function openNote(personId, kind) {
  const types = CFG.noteTypes || [{ id: 'other', label: 'Note' }];
  const preset = kind === 'call' ? 'call' : 'other';
  modal(kind === 'call' ? 'Log a call' : 'Add a note', `
    <div class="row2">
      <div><label>Type</label><select id="nType" onchange="onNoteType()">
        ${types.map(t => `<option value="${esc(t.id)}" ${t.id === preset ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}
      </select></div>
      <div id="nOutcomeBox"><label>Outcome</label><select id="nOutcome">
        ${(CFG.callOutcomes || []).map(o => `<option>${esc(o)}</option>`).join('')}</select></div>
    </div>
    <label>What happened</label><textarea id="nBody" rows="3" placeholder="What did they want, what was discussed, what happens next"></textarea>
    <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="doNote('${personId}')">Save</button>
    <button class="btn ghost" onclick="closeModal()">Cancel</button></div>
    <div class="prov" style="margin-top:12px">Saved as <b>${esc(ACTOR)}</b>. Every note type lands in the
      same history for this person - the type is a label, not a separate place.</div>`);
  onNoteType();
}
function onNoteType() {
  const t = document.querySelector('#nType');
  const box = document.querySelector('#nOutcomeBox');
  if (t && box) box.style.display = t.value === 'call' ? '' : 'none';
}
async function doNote(personId) {
  const type = $('#nType').value;
  const types = CFG.noteTypes || [];
  const label = (types.find(t => t.id === type) || {}).label || 'Note';
  const subject = type === 'call' ? `Call: ${$('#nOutcome').value}` : label;
  await post(`/api/people/${personId}/note`, { kind: type === 'call' ? 'call' : 'note',
    noteType: type, subject, body: $('#nBody').value });
  closeModal(); viewPerson(personId);
}

// ------------------------------------------------------------------ boot --
(async () => {
  CFG = await api('/api/config');
  $('#ver').textContent = CFG.version || 'prototype';
  drawDatasetBadge(CFG.dataset || {});
  document.addEventListener('keydown', (e) => {
    // a clickable row is a control, so it answers Enter and Space
    const el = document.activeElement;
    if ((e.key === 'Enter' || e.key === ' ') && el && el.classList && el.classList.contains('row')) {
      e.preventDefault(); el.click();
    }
  });
  let saved = 'light';
  try { saved = localStorage.getItem('crmTheme') || 'light'; } catch {}
  if (!['light', 'dark'].includes(saved)) saved = 'light';
  setTheme(saved);
  const themeSel = document.querySelector('#theme');
  if (themeSel) themeSel.value = saved;
  try { ACTOR = localStorage.getItem('crmActor') || ''; } catch {}
  const known = (CFG.users || []).map(u => u.name).concat(CFG.admins || []);
  if (!known.includes(ACTOR)) ACTOR = known[0] || '';
  drawActorPicker();
  window.addEventListener('hashchange', route);
  await route();
})();
</script>
</body>
</html>
