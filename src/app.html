// ================================================================ privacy ==
// ------------------------------------------------------------ admin: channels --
//
// Four questions and nothing else: what channels exist, what is missing, what is
// working, what is broken.
//
// Everything on this screen comes from the server. Nothing is computed here, and
// in particular NOTHING here decides that a channel is connected - that word is
// the server's to use, and it uses it only when a provider has really arrived.
//
// No secret value is ever on this screen. The NAME of a setting is, and the word
// OK or MISSING. There is a test that greps the module's payload for the values,
// and another that greps the response the browser actually receives.

const chClass = (state) => 's-' + String(state).toLowerCase().replace(/[^a-z]/g, '');

function chSettings(list) {
  if (!list || !list.length) return '<span class="prov">Nothing to set up.</span>';
  return list.map(x => `<span class="setting ${x.present ? '' : 'miss'}">${esc(x.name)} ${x.present ? 'OK' : 'MISSING'}</span>`).join('');
}

const chStep = (st) => `<li>${st.ok ? '<span class="ok-tick">OK</span>' : '<span class="no-tick">FAILED</span>'}
  ${esc(st.name)} <span class="prov">${esc(st.note || '')}</span></li>`;

// ONE WORD PER CHANNEL, on one axis: can a lead reach us through this? It is the
// same four-state model the server already computes - only the words changed,
// because a screen that needs a table to explain its own vocabulary has the wrong
// vocabulary, and that table is gone.
//
// "Receiving" still means exactly what CONNECTED meant: the PROVIDER reached us.
// Our own check passing cannot earn it, and neither can a run in test mode, which
// is stored as `simulated` on purpose - so a channel can be bringing things in
// today and still read Ready, with the count beside it saying so.
const CH_WORD = {
  'ERROR':          { word: 'Failed',     cls: 's-error' },
  'CONNECTED':      { word: 'Receiving',  cls: 's-connected' },
  'CONFIGURED':     { word: 'Ready',      cls: 's-configured' },
  'NOT CONFIGURED': { word: 'Not set up', cls: 's-notconfigured' },
};
const chWord = (c) => (c.direction === 'manual'
  ? { word: 'By hand', cls: 's-manual' }
  : CH_WORD[c.state] || CH_WORD['NOT CONFIGURED']);
const CH_RANK = ['Failed', 'Receiving', 'Ready', 'By hand', 'Not set up'];

// Test mode belongs next to ON, not hidden: a channel switched on in test is not
// live, and everything it brings in is stored as simulated.
const chOn = (c) => (c.direction === 'manual' ? '<span class="c-gap">-</span>'
  : c.live ? 'ON' + (c.mode === 'test' ? ' <span class="ch-test">&middot; test</span>' : '')
  : '<span class="c-gap">off</span>');

// What actually arrived. For the two scheduled jobs that is the last run; for a
// webhook channel it is what a provider has sent, else what is still missing.
// Data, never an explanation.
function chActivity(c, run) {
  const plural = (n, one) => n + ' ' + (n === 1 ? one : one + 's');
  if (run && run.at) {
    const x = run.detail || {};
    const bits = [];
    if (c.channel === 'sis' && x.stored != null) bits.push(plural(x.stored, 'applicant'));
    if (c.channel !== 'sis' && x.kept != null) bits.push(plural(x.kept, 'call'));
    if (x.inbox) bits.push(x.inbox + ' to the Inbox');
    // a number already waiting that rang again: no new row, and the run says so
    if (x.again) bits.push(x.again + ' rang again');
    return esc((bits.join(' \u00b7 ') || 'ran') + ' \u00b7 ' + fmtDate(run.at));
  }
  if (c.events) return esc(plural(c.events, 'message') + ' \u00b7 ' + fmtDate(c.lastEventAt));
  if ((c.missingSettings || []).length) return esc(plural(c.missingSettings.length, 'setting') + ' missing');
  return '<span class="c-gap">-</span>';
}

// WHOSE TURN IS IT (01.10.2026). config/channels.json has carried ownerPerson,
// ownerAction and externalBlocker all along, and the API has been sending all three.
// The screen showed a status word and a last-run line, so an operator could see that
// nine channels were not receiving and not who was holding each one, or why.
//
// Nothing invented: every word here is the config's own. A channel with no owner
// recorded says SO, because "nobody is named" is the finding, not a blank cell.
// ============================================ CHANNEL MODEL (Session 3, 02.10) ==
// Every channel carries a RECORD (config/channels.json -> record) of what was last seen about
// it. It is DATA: it drives one state word per channel and is never printed (KB 08 P5, 04.10).
// Live means a row a real provider sent: on production the screen reads it from the rows;
// anywhere else it takes the record. A missing local credential is never a blocker.
const chLife = (c) => c.lifecycle || 'active';
const chActive = (rows) => rows.filter((c) => chLife(c) === 'active' && !c.isIntegration);
const chRec = (c) => c.record || {};

// LIVE VERIFIED. On production the rows answer, and they settle a recorded conflict
// either way. Anywhere else the local rows say nothing about production, so the
// record is shown with its date, and a conflict stays a conflict.
function chLiveOf(c, env) {
  if (c.direction === 'manual') return { state: 'not_applicable', observed: false };
  if (env && env.isProduction) {
    return (c.events || 0) > 0
      ? { state: 'yes', observed: true, seen: c.lastEventAt || null, detail: c.events + ' from the provider' }
      : { state: 'no', observed: true, detail: 'No row from a real provider in production' };
  }
  const r = chRec(c).liveVerified;
  return r ? { ...r, observed: false } : { state: 'unknown', observed: false };
}

function chKind(c, env) {
  const life = chLife(c);
  if (life === 'dropped' || life === 'parked') return life;
  if (c.direction === 'manual') return 'hand';
  // The owner's word is the record (the owner, 05.10.2026, in record.ownerSays). It outranks a
  // provider-row count that has not caught up yet; the count stays in liveVerified as data.
  const says = chRec(c).ownerSays;
  if (says && says.state === 'live') return 'live';
  if (chLiveOf(c, env).state === 'yes') return 'live';
  const b = chRec(c).blocker;
  if (b && b.side === 'external') return 'provider';
  const pc = chRec(c).productionConfigured;
  if ((pc && pc.state === 'yes') || (env && env.isProduction && c.allSettingsPresent)) return 'configured';
  if (chRec(c).nextAction || b) return 'owner';
  return 'none';
}

// A blocker is only ever what the record says, and only whole: without a dependency
// and a side it is not shown as a blocker at all.
function chBlocker(c) {
  const b = chRec(c).blocker;
  return b && b.dependency && (b.side === 'internal' || b.side === 'external') ? b : null;
}
const chAction = (c) => (chLife(c) === 'active' ? chRec(c).nextAction || null : null);
const chWhoActs = (c) => {
  if (chLife(c) !== 'active') return null;
  const a = chAction(c);
  if (a) return a.owner || null;
  const b = chBlocker(c);
  return b ? (b.owner || null) : null;
};

// The four evidence steps, each with ONE honest answer and the date it was seen.
// ------------------------------------------------------------- the screen --
// KB 08 P5 "Apps are work tools" (04.10.2026, the owner on the live screen: "This is for work, not
// to play around and leave notes in places I must go and search!"). ONE line per active channel:
// its name and one state word. The click opens Settings and check. The record above drives the
// word and is never printed. Parked and dropped are not shown; notes live in docs/.
function chState(c, env) {
  const k = chKind(c, env);
  if (k === 'live') return { word: 'Live', cls: 'k-live' };
  if (k === 'configured') return { word: 'Configured', cls: 'k-conf' };
  if (k === 'hand') return { word: 'By hand', cls: 'k-hand' };
  // Blocked means an outside party SAID NO, and only that (Q24, 05.10.2026: "why some channels
  // show blocked, when they are not???"). Waiting on an outside answer is waiting, named by the
  // party the record gives; nobody named and nothing outside is not decided.
  if (k === 'provider') {
    const b = chRec(c).blocker;
    if (b.refused === true) return { word: 'Blocked', cls: 'k-prov' };
    const party = b.party || b.owner;
    return party ? { word: 'Waiting on ' + party, cls: 'k-owner' } : { word: 'Not decided', cls: 'k-none' };
  }
  const who = chWhoActs(c);
  return who ? { word: 'Waiting on ' + who, cls: 'k-owner' } : { word: 'Not decided', cls: 'k-none' };
}

// ------------------------------------------------------- the figures (Q27) --
// The owner, 05.10.2026, asked for the SIS status apart from the channels and its link to apply,
// and for the filtering and the pull frequency on the cards: figures and short labels, never
// paragraphs. On production they come from the rows and the run record; anywhere else from the
// record's snapshot, which carries its own date. Picked 05.10: A, and "Every should become a
// uncovering tab :)": closed, a line is the name and one word; open, its figures.
const CH_ZONE = 'Europe/Riga';
function chRiga(cron, day = new Date()) {
  const m = /^(\d{1,2}) (\d{1,2}) \* \* \*$/.exec(String(cron || '').trim());
  if (!m) return null;
  const at = new Date(Date.UTC(day.getUTCFullYear(), day.getUTCMonth(), day.getUTCDate(), Number(m[2]), Number(m[1])));
  return new Intl.DateTimeFormat('en-GB', { timeZone: CH_ZONE, hour: '2-digit', minute: '2-digit', hour12: false }).format(at);
}
function chWhen(iso) {
  const t = Date.parse(iso || '');
  if (!t) return null;
  const f = new Intl.DateTimeFormat('en-GB', { timeZone: CH_ZONE, day: '2-digit', month: '2-digit', hour: '2-digit',
    minute: '2-digit', hour12: false }).formatToParts(new Date(t)).reduce((o, x) => ({ ...o, [x.type]: x.value }), {});
  return `${f.day}.${f.month} ${f.hour}:${f.minute}`;
}
const chDay = (d) => (/^\d{4}-(\d{2})-(\d{2})/.exec(d || '') || []).slice(1).reverse().join('.') || null;
// the phone's daily catch-up writes pbx_until; the older 'pbx' row is the first manual run
const CH_RUN = { phone: ['pbx_until', 'phone'], gmail: ['gmail'], sis: ['sis'] };
function chFacts(c, env, ctx = {}) {
  const prod = Boolean(env && env.isProduction);
  const sched = ctx.schedule || {};
  const rec = chRec(c);
  const at = chRiga(sched[c.channel]);
  const pull = c.direction === 'manual' ? 'By hand'
    : c.direction === 'inbound_poll' ? (at ? 'Daily ' + at : 'Polled') : 'Instant';
  let counts = null;
  if (c.direction !== 'manual') {
    if (prod) counts = { received: c.events || 0, filtered: c.filtered || 0, asOf: null };
    else if (rec.counts) counts = { received: rec.counts.received || 0, filtered: rec.counts.filtered || 0, asOf: rec.counts.asOf || null };
  }
  if (counts) counts.inbox = Math.max(0, counts.received - counts.filtered);
  let last = null;
  if (c.direction === 'inbound_poll') {
    const runs = ctx.runs || {};
    const run = prod ? (CH_RUN[c.channel] || []).map((k) => runs[k]).find(Boolean) : rec.lastPull;
    last = run && run.at ? chWhen(run.at) : null;
  }
  const pullSub = c.direction === 'manual' ? null : c.direction === 'inbound_poll' ? (last ? 'last ' + last : 'pull') : 'on arrival';
  return { pull, pullSub, counts, last, filters: c.filters || [] };
}
function chSisFacts(rows, env, ctx = {}) {
  const prod = Boolean(env && env.isProduction);
  const row = (rows || []).find((r) => r.isIntegration && r.channel === 'sis') || {};
  const sis = ctx.sis || {};
  const rec = sis.record || {};
  const run = prod ? (ctx.runs || {}).sis : rec.lastPull;
  const fresh = Boolean(run && run.at && (Date.now() - Date.parse(run.at)) < 26 * 3600e3);
  const ok = prod
    ? Boolean(row.allSettingsPresent && row.mode !== 'off' && fresh && !(run.detail && run.detail.ok === false))
    : Boolean(run && run.ok);
  const map = {};
  for (const [from, to] of Object.entries(sis.stages || {})) (map[to] = map[to] || []).push(from);
  const at = chRiga((ctx.schedule || {}).sis);
  return {
    chain: ['apply.novikontas.org', 'SIS', 'Intake'],
    map: Object.entries(map).map(([to, from]) => ({ to, from })),
    pull: at ? 'Daily ' + at : null,
    last: run && run.at ? chWhen(run.at) : null,
    received: prod ? (sis.events || 0) : ((rec.counts || {}).received ?? null),
    asOf: prod ? null : ((rec.counts || {}).asOf || null),
    ok,
  };
}
const chFig = (n, label, cls = '') => `<span class="chfig ${cls}"><b>${esc(String(n))}</b><i>${esc(label)}</i></span>`;
const chTags = (list) => (list.length ? `<span class="chtags">${list.map((x) => `<span>${esc(x)}</span>`).join('')}</span>` : '');
const chOpen = (summary, inner) => `<li><details><summary>${summary}</summary><div class="chcard-in">${inner}</div></details></li>`;

// One line per active channel: closed, its name and one word; open, what it brought in, how often it
// is pulled, what a rule sets aside on it, and the way to its settings.
function chListHtml(rows, env, ctx = {}) {
  const act = [...chActive(rows)].sort((a, b) => a.label.localeCompare(b.label));
  return `<ul class="chlist">${act.map((c) => {
    const st = chState(c, env); const f = chFacts(c, env, ctx);
    const figs = f.counts ? chFig(f.counts.received, 'received', 'is-in') + chFig(f.counts.inbox, 'to the Inbox')
      + chFig(f.counts.filtered, 'set aside', 'is-out') : '';
    const asOf = f.counts && f.counts.asOf ? `<span class="chasof">${esc(chDay(f.counts.asOf))}</span>` : '';
    const rules = c.direction === 'manual' ? f.filters : [...f.filters, ...(ctx.filtersAll || [])];
    return chOpen(`<b>${esc(c.label)}</b><span class="chk ${st.cls}">${esc(st.word)}</span>`,
      `<span class="chfigs">${figs}${f.pullSub ? chFig(f.pull, f.pullSub, 'is-pull') : ''}${asOf}</span>${chTags(rules)}
      <a href="#/channels/${esc(c.channel)}" class="chgo">Settings and check &rsaquo;</a>`);
  }).join('')}</ul>`;
}

// SIS is not a channel (02.10): its own card, one line that uncovers the chain to apply, how its
// statuses map onto the journey, and its pull.
function chSisHtml(f) {
  const word = f.ok ? '<span class="chk k-live">All good</span>' : '<span class="chk k-owner">Check</span>';
  const chain = `<span class="chchain">${f.chain.map((x) => `<b>${esc(x)}</b>`).join('<i aria-hidden="true">&rarr;</i>')}</span>`;
  const map = `<span class="chmap">${f.map.map((m) => `<span><em>${m.from.map(esc).join(' &middot; ')}</em><i aria-hidden="true">&rarr;</i><b>${esc(m.to)}</b></span>`).join('')}</span>`;
  const figs = `<span class="chfigs">${f.received != null ? chFig(f.received, 'real rows', 'is-in') : ''}${f.pull ? chFig(f.pull, 'pull', 'is-pull') : ''}${f.last ? chFig(f.last, 'last pull', 'is-pull') : ''}${f.asOf ? `<span class="chasof">${esc(chDay(f.asOf))}</span>` : ''}</span>`;
  return `<div class="c-sheet c-chcard chinfo chsis"><ul class="chlist">${chOpen(`<b>SIS</b>${word}`, chain + map + figs)}</ul></div>`;
}

// Q31 (05.10.2026): the filter over what already waits in the Inbox. One line that uncovers two
// steps: "Check waiting rows" says how many it WOULD move and why, and moves nothing; only "Move N"
// moves them, and only those. Admins only (the server refuses everyone else).
function chFilterHtml() {
  return `<div class="c-sheet c-chcard chinfo chfilter"><ul class="chlist">${chOpen('<b>Inbox filter</b><span class="chk k-hand">Waiting rows</span>',
    '<div id="chFilterOut"></div><button class="btn ghost" type="button" onclick="chFilterCheck()">Check waiting rows</button>')}</ul></div>`;
}
function chFilterResult(r) {
  const why = Object.entries(r.byReason || {}).map(([k, n]) => chFig(n, k, 'is-out')).join('');
  return `<span class="chfigs">${chFig(r.checked, 'waiting', 'is-in')}${why}${chFig(r.left, 'stay')}</span>`;
}
async function chFilterCheck() {
  const box = document.querySelector('#chFilterOut');
  const r = await api('/api/admin/inbox/refilter');
  const btn = box.parentElement.querySelector('button');
  box.innerHTML = chFilterResult(r);
  if (r.wouldMove > 0) {
    btn.textContent = 'Move ' + r.wouldMove;
    btn.className = 'btn';
    btn.onclick = () => chFilterMove(r.wouldMove);
  } else {
    btn.textContent = 'Nothing to move';
    btn.disabled = true;
  }
}
async function chFilterMove(n) {
  const box = document.querySelector('#chFilterOut');
  const btn = box.parentElement.querySelector('button');
  btn.disabled = true;
  const r = await api('/api/admin/inbox/refilter', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ apply: true }) });
  box.innerHTML = chFilterResult({ ...r, byReason: {} }) + `<span class="chfigs">${chFig(r.moved, 'moved', 'is-out')}</span>`;
  btn.textContent = r.moved === n ? 'Done' : 'Moved ' + r.moved;
}

async function viewChannel(id) {

  const d = await api('/api/admin/channels');
  const run = (d.runs || {})[c.channel] || null;
  const canSwitchOn = c.allSettingsPresent && (!c.canTest || c.lastCheckOk === true);
  const row = (k, v) => `<div class="kv"><div>${esc(k)}</div><div>${v}</div></div>`;

  $('#view').innerHTML = `
    <a class="btn ghost" href="#/channels">&larr; All channels</a>

    ${row('On', chOn(c))}
    ${run && run.at ? row('Last run', esc(fmtDate(run.at))) : ''}
    ${run && run.at ? row('Came in', chActivity(c, run)) : ''}
    ${row('Settings', chSettings(c.settings))}
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">

      ${c.live
        ? `<button class="btn ghost" onclick="setChannelMode('${esc(c.channel)}','off')">Switch off</button>`
        : `<button class="btn" ${canSwitchOn ? '' : 'disabled'} onclick="setChannelMode('${esc(c.channel)}','live')">Switch on</button>`}
    </div>

    <div id="chMode" style="margin-top:8px"></div>`;
}


async function runChannelCheck(id) {
  const btn = $('#chCheck');
  const out = $('#chResult');
  btn.disabled = true; btn.textContent = 'Checking...';
  try {
    const r = await post('/api/admin/channels/' + encodeURIComponent(id) + '/check');
    if (r.skipped) { out.innerHTML = `<div class="prov">${esc(r.why)}</div>`; return; }
    out.innerHTML = `
      <span class="${r.ok ? 'pill ok' : 'pill warn'}">${r.ok ? 'Every step passed' : 'It failed'}</span>
      <ul class="steps">${(r.steps || []).map(chStep).join('')}</ul>
      ${r.ok ? `<div class="footnote" style="margin-top:6px">This proves ${esc(r.proves || '')}.
        It does NOT prove ${esc(r.doesNotProve || '')}.</div>` : ''}`;
  } catch (e) {
    out.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = 'Run the check'; }
}

async function setChannelMode(id, mode) {
  const out = $('#chMode');
  if (mode !== 'off' && !confirm(
      'Switch ' + id + ' ON?\n\nIt will start accepting real events from the provider.')) return;
  try {
    await post('/api/admin/channels/' + encodeURIComponent(id) + '/mode', { mode });
    await viewChannel(id);
  } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

const EDIT_FIELDS = [
  ['name', 'Full name', 'text'],
  ['email', 'Email', 'text'],
  ['phone', 'Phone', 'text'],
  ['programme', 'Programme', 'programme'],
  ['study_form', 'Study form', 'studyForm'],
  ['education', 'Education', 'education'],
  ['nationality', 'Nationality', 'nationality'],
  ['owner', 'Owner', 'owner'],
  ['notes', 'Notes', 'textarea'],

function selectFor(kind, value) {
  const list = kind === 'programme' ? (CFG.programmes || [])
    : kind === 'studyForm' ? (CFG.studyForms || [])
    : kind === 'education' ? (CFG.education || [])
    : kind === 'nationality' ? (CFG.nationalities || [])
    : (CFG.owners || []);
  // A value from the old sheet that is not in the list ("NOT DECIDED", "FULL TIME") is
  // kept as its own option. Left out, the select showed "-", and saving the Edit dialog
  // for ANY reason erased it - found 28.09.2026 on a copy of the real data.
  const cur = String(value || '');
  const all = cur && !list.includes(cur) ? list.concat([cur]) : list;
  return ['<option value="">-</option>'].concat(all.map(v =>
    `<option ${cur === v ? 'selected' : ''}>${esc(v)}</option>`)).join('');
}

async function openEdit(id) {

async function saveEdit(id) {
  const patch = {};
  for (const [key] of EDIT_FIELDS) {
    const el = document.querySelector('#e_' + key);

}

// ------------------------------------------------------------- pipeline -----
// The board CAR feeds into. Columns are the configured stages and nothing here
// invents a new one: the stage vocabulary is still provisional until Admissions
// has walked their real process, so this reads config and never a literal list.
//
// A drop is a real stage change. It is saved the same way the person page saves
// one, so it lands in the history with who moved it and where from.

let DRAG_ID = null;

async function viewAdmissions() {
  const data = await api('/api/people?' + new URLSearchParams({ sort: 'last_contact_at', dir: 'desc' }));
  const stages = (CFG.stages || []);
  const byStage = {};
  for (const st of stages) byStage[st.id] = [];
  for (const r of data.rows) (byStage[r.status] ||= []).push(r);

  const card = (r) => `<div class="pcard" draggable="true" data-id="${esc(r.id)}"
      ondragstart="pDragStart(event,'${esc(r.id)}')" ondragend="pDragEnd(event)"
      onclick="location.hash='#/person/${esc(r.id)}'">
    <div class="pname">${esc(r.name)}</div>
    ${r.programme ? `<div class="pmeta">${esc(r.programme)}</div>` : ''}
    ${r.next_action ? `<div class="pnext">${esc(r.next_action)} &middot; ${dueText(r.next_action_at)}</div>`
      : '<div class="pnext none">no next step</div>'}
    ${r.owner && r.owner !== CFG.admissionsOwner ? `<div class="powner">${esc(r.owner)}</div>` : ''}
  </div>`;

  const column = (st) => {
    const rows = byStage[st.id] || [];
    return `<div class="pcol" data-stage="${esc(st.id)}"
        ondragover="pDragOver(event)" ondragleave="pDragLeave(event)" ondrop="pDrop(event,'${esc(st.id)}')">
      <div class="pcolhead">
        <span class="pdot" style="background:${esc(st.colour)}"></span>
        <span class="pcolname" title="${esc(st.label)}">${esc(st.label)}</span>
        <span class="pcount">${rows.length}</span>
      </div>
      <div class="pcolbody">${rows.map(card).join('') || '<div class="pempty">empty</div>'}</div>
    </div>`;
  };

  $('#view').innerHTML = `
  <div class="todayhead">
    <div><h1 style="margin:0">Admissions &middot; ${data.count}</h1></div>
    <a class="tilelink" href="#/inbox">Back to Inbox &rarr;</a>
  </div>
  <div class="board">${stages.map(column).join('')}</div>`;
}

function pDragStart(e, id) {
  DRAG_ID = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  e.target.classList.add('dragging');
}
function pDragEnd(e) { e.target.classList.remove('dragging'); DRAG_ID = null; }
function pDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('over'); }
function pDragLeave(e) { e.currentTarget.classList.remove('over'); }

async function pDrop(e, stage) {
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  const id = DRAG_ID || e.dataTransfer.getData('text/plain');
  if (!id) return;
  const row = e.currentTarget.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (row) return;                       // dropped back where it came from
  // Stopping work on somebody still needs a reason. The board does not get to
  // skip that just because the move was a drag.
  if (stage === (CFG.stageRoles || {}).closed) {
    DRAG_ID = null;
    return openCloseReason(id);
  }
  try {
    const ask = await cAskMoveNote(id, C_STAGE_OF.get(id), stage);
    if (ask) await post(`/api/people/${id}/status`, cMoveBody(stage, ask));
  } catch (err) {
    alert(err.message);
  }
  DRAG_ID = null;
  viewAdmissions();
}

// tried in order until the result fits
const FB_LADDER = [[1600, 0.85], [1600, 0.7], [1200, 0.7], [1000, 0.6]];

let FB = { open: false, view: 'menu', kind: 'BUG', shot: null, busy: false };

function fbSupportsWebp() {
  const c = document.createElement('canvas');
  c.width = c.height = 1;
  // asking for webp on a browser that has none quietly hands back a PNG, so the
  // answer has to be read off the result rather than trusted
  return c.toDataURL('image/webp').startsWith('data:image/webp');
}

function fbClose() {
  FB.open = false; FB.view = 'menu'; FB.shot = null; FB.busy = false;
  const el = document.querySelector('#helpPanel');
  if (el) el.remove();
}

function fbToggle() {
  if (FB.open) return fbClose();
  FB.open = true; FB.view = 'menu'; FB.shot = null;   // always reopens on the menu
  fbDraw();
}

function fbDraw() {
  let el = document.querySelector('#helpPanel');
  if (!el) {
    el = document.createElement('div');
    el.id = 'helpPanel';
    el.className = 'helppanel';
    document.body.appendChild(el);
  }
  el.innerHTML = FB.view === 'menu' ? fbMenuHtml() : fbFormHtml();
  if (FB.view === 'form') {
    const ta = el.querySelector('#fbText');
    if (ta) { ta.focus(); ta.oninput = fbSync; }
    fbSync();
  }
}

function fbMenuHtml() {
  return `<h4>Feedback</h4>
    <button class="helpitem" onclick="fbOpenForm()">Send feedback
      <span>Something broken, an idea or a question.</span></button>
    ${mayReadFeedback() ? `<button class="helpitem" onclick="fbClose();location.hash='#/feedback'">Feedback inbox
</button>` : ''}`;
}

function fbOpenForm() { FB.view = 'form'; fbDraw(); }
// Straight into the box on a given kind (dev kit part 3): "Report a problem" opens it on Something
// broken, the Help center's "Ask a question" on A question with what was searched already in it.
function fbOpen(kind, text) {
  FB.open = true; FB.view = 'form'; FB.shot = null;
  if (['BUG', 'IDEA', 'QUESTION'].includes(kind)) FB.kind = kind;
  if (text) FB.text = text;
  fbDraw();
}
const FB_KIND_LABEL = { BUG: 'Something broken', IDEA: 'An idea', QUESTION: 'A question' };
function fbSetKind(k) { FB.kind = k; fbDraw(); }

function fbFormHtml() {
  const placeholder = FB.kind === 'BUG' ? 'What did you expect, and what happened instead?'
    : FB.kind === 'QUESTION' ? 'What would you like to know?' : 'What would make this easier to use?';
  const text = FB.text || '';
  return `<h4>Send feedback</h4>
    <div class="kindtoggle">
      <button class="${FB.kind === 'IDEA' ? 'on' : ''}" onclick="fbSetKind('IDEA')">An idea</button>
      <button class="${FB.kind === 'BUG' ? 'on' : ''}" onclick="fbSetKind('BUG')">Something broken</button>
      <button class="${FB.kind === 'QUESTION' ? 'on' : ''}" onclick="fbSetKind('QUESTION')">A question</button>
    </div>
    <textarea id="fbText" rows="4" maxlength="2000" placeholder="${esc(placeholder)}">${esc(text)}</textarea>
    <div id="fbShot">${fbShotHtml()}</div>
    <div id="fbErr"></div>
    <div class="goeshint">Goes to ${esc(fbReaders())}.</div>
    <div class="sendrow">
      <div class="pathstamp" title="the screen this will be filed against">${esc(fbPath())}</div>
      <div style="display:flex;gap:6px">
        <button class="btn sm ghost" onclick="fbClose()">Cancel</button>
        <button class="btn sm" id="fbSend" onclick="fbSend()" disabled>Send</button>
      </div>
    </div>`;
}

function fbShotHtml() {
  if (FB.busy) return '<div class="shothint">Preparing the screenshot...</div>';
  if (!FB.shot) {
    return `<button class="btn sm ghost" onclick="document.querySelector('#fbFile').click()">Attach a screenshot</button>
      <input type="file" id="fbFile" accept="image/png,image/jpeg,image/webp" style="display:none"
        onchange="fbPick(this.files[0]); this.value='';">
      <div class="shothint">Optional. Or press Ctrl+V to paste one.</div>`;
  }
  const kb = Math.round(FB.shot.bytes / 1024);
  return `<div class="shotrow">
      <img src="${FB.shot.url}" alt="">
      <div class="shotmeta">${FB.shot.w} by ${FB.shot.h}, ${kb} KB</div>
      <button class="xbtn" title="remove" onclick="fbRemoveShot()">&times;</button>
    </div>`;
}

function fbRemoveShot() { FB.shot = null; fbRedrawShot(); }

// Only this part of the panel is redrawn, so a half-written message is never lost.
function fbRedrawShot() {
  const box = document.querySelector('#fbShot');
  if (box) box.innerHTML = fbShotHtml();
  fbSync();
}

function fbSync() {
  const ta = document.querySelector('#fbText');
  if (ta) FB.text = ta.value;
  const send = document.querySelector('#fbSend');
  if (send) send.disabled = FB.busy || FB.sending || (FB.text || '').trim().length < 4;
}

const fbPath = () => location.hash || START();   // feedback is filed against the page actually shown
// Named, not implied. Somebody about to report a problem should know who reads it.
// The page a feedback came from, as a link only when it is an address INSIDE the app.
// Anything else is shown as text: a planted "javascript:" must never become a link
// in an admin's inbox. The server keeps only in-app addresses too (readPath).
const fbPathLink = (p) => (/^(#\/|\/(?!\/))/.test(String(p || '')) ? `<a href="${esc(p)}">${esc(p)}</a>` : `<span>${esc(p)}</span>`);
// What the screen SAYS about who reads feedback. It names nobody (the owner, 28.09.2026: "Anonymize!",
// when the box named its two readers). WHO may read it is still decided by CFG.feedbackReaders in
// mayReadFeedback(); only the words shown changed.
const fbReaders = () => 'the people who build Intake';

async function fbPick(file) {
  if (!file) return;
  const err = document.querySelector('#fbErr');
  if (err) err.innerHTML = '';
  if (!file.type || !file.type.startsWith('image/')) {
    return fbShotError('That file is not an image.');
  }
  FB.busy = true; fbRedrawShot();
  try {
    FB.shot = await fbShrink(file);
  } catch (e) {
    FB.shot = null;
    FB.busy = false;
    return fbShotError(e.message);
  }
  FB.busy = false;
  fbRedrawShot();
}

// The typed message is never touched by an image failure.
function fbShotError(message) {
  FB.busy = false;
  fbRedrawShot();
  const err = document.querySelector('#fbErr');
  if (err) err.innerHTML = `<div class="err" style="margin:10px 0 0">${esc(message)}</div>`;
}

function fbLoadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That image could not be opened.')); };
    img.src = url;
  });
}

async function fbShrink(file) {
  const img = await fbLoadImage(file);
  // WebP if the browser really makes WebP, JPEG otherwise. Never PNG: a screenshot
  // of a whole page as PNG is several megabytes for no gain.
  const type = fbSupportsWebp() ? 'image/webp' : 'image/jpeg';
  for (const [edge, quality] of FB_LADDER) {
    const scale = Math.min(1, edge / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    // a transparent PNG would come out black without this
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    // re-encoding through a canvas drops EXIF, so GPS and camera data never travel
    const url = c.toDataURL(type, quality);
    const bytes = Math.round((url.length - url.indexOf(',') - 1) * 3 / 4);
    if (bytes <= FB_TARGET_BYTES) return { url, bytes, w, h };
  }
  throw new Error('That image is too detailed, crop it to the part that matters and try again.');
}

async function fbSend() {
  fbSync();
  if (FB.sending) return;
  FB.sending = true;
  const send = document.querySelector('#fbSend');
  if (send) send.disabled = true;
  try {
    await post('/api/feedback', {
      kind: FB.kind, body: FB.text, path: fbPath(),
      screenshot: FB.shot ? FB.shot.url : null,
    });
    FB.sending = false;
    const el = document.querySelector('#helpPanel');
    if (el) el.innerHTML = '<div class="fbthanks"><div class="tick-big">&#10003;</div>Thank you.</div>';
    FB.text = '';
    drawFeedbackBadge();          // the count moves the moment something is sent
    setTimeout(fbClose, 1600);
  } catch (e) {
    FB.sending = false;
    const err = document.querySelector('#fbErr');
    if (err) err.innerHTML = `<div class="err" style="margin:10px 0 0">${esc(e.message)}</div>`;
    fbSync();
  }
}

// Paste is listened for on the document, because the focus sits inside the panel
// rather than on the textarea when somebody hits Ctrl+V straight after a capture.
document.addEventListener('paste', (e) => {
  if (!FB.open || FB.view !== 'form') return;
  const items = [...((e.clipboardData && e.clipboardData.items) || [])];
  const item = items.find(i => i.kind === 'file' && String(i.type).startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  fbPick(item.getAsFile());
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && FB.open) fbClose(); });
// mousedown, not click: a click that starts inside the panel and ends outside
// must not count as leaving it
document.addEventListener('mousedown', (e) => {
  if (!FB.open) return;
  if (e.target.closest('#helpPanel') || e.target.closest('#helpBtn')) return;
  fbClose();
});

// ------------------------------------------------------- the feedback inbox --
async function viewFeedback() {
  if (!mayReadFeedback()) {
    $('#view').innerHTML = `<h1>Feedback</h1>
      <div class="prov">This inbox is read by <b>${esc(fbReaders())}</b> and by nobody else.
      You are acting as <b>${esc(ACTOR)}</b>, so it is not shown. Being an admin is not enough:
      feedback has its own shorter list.</div>`;
    return;
  }
  const d = await api('/api/admin/feedback');
  const open = d.rows.filter(r => !r.handledAt).length;
  const row = (r) => `<div class="fbrow ${r.handledAt ? 'handled' : ''}">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
      <div><span class="pill ${r.kind === 'BUG' ? 'warn' : 'calm'}">${FB_KIND_LABEL[r.kind] || 'An idea'}</span></div>
      <button class="btn sm ghost" onclick="fbHandle(${r.id}, ${r.handledAt ? 'false' : 'true'})">
        ${r.handledAt ? 'Reopen' : 'Mark handled'}</button>
    </div>
    <div class="fbbody">${esc(r.body)}</div>
    ${r.screenshot ? `<img class="shot" src="/api/admin/feedback/${r.id}/screenshot?as=${encodeURIComponent(ACTOR)}"
      alt="screenshot" onclick="fbZoom(${r.id})">` : ''}
    <div class="fbmeta">
      <span>${esc(r.author || 'unknown')}</span>
      <span>${fmtDateTime(r.createdAt)}</span>
      ${r.path ? fbPathLink(r.path) : '<span>no page recorded</span>'}
      ${r.handledAt ? `<span>handled ${fmtDateTime(r.handledAt)}</span>` : ''}
    </div>
  </div>`;
  $('#view').innerHTML = `
  <div class="todayhead"><div><h1 style="margin:0">Feedback</h1>
    <p class="sub" style="margin:2px 0 0">${open} open, ${d.rows.length} in total &middot;
      for ${esc(fbReaders())}</p></div></div>
  <div class="prov">Everything here was typed by somebody using the app. It is stored in this
    Intake's own database and has never been sent anywhere.${AUTH.user ? '' : ' There is no login yet, so this screen is restricted to the Admin seat rather than to those two people by name.'}</div>
  ${d.rows.length ? d.rows.map(row).join('') : '<div class="card"><div class="empty">Nothing has been sent yet.</div></div>'}`;
}

async function fbHandle(id, handled) {
  await api(`/api/admin/feedback/${id}?as=${encodeURIComponent(ACTOR)}`, {
    method: 'PATCH', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ handled, by: ACTOR }),
  });
  viewFeedback();
  drawFeedbackBadge();
}

function fbZoom(id) {
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = `<img src="/api/admin/feedback/${id}/screenshot?as=${encodeURIComponent(ACTOR)}" alt="">`;
  box.onclick = () => box.remove();
  document.body.appendChild(box);
}

// ===================================================== THE CALL POP-UP (Q6) ==
// 04.10.2026, first said 30.09. When the phone rings, whoever answers sees who is calling and is
// one click from the comment thread on the person page. Call events reach Intake by push from the
// phone system, or by the TeleGroup pull; the open, signed-in app asks /api/calls/events for the
// ones newer than the last it saw (our database, never TeleGroup).
//
// DECIDED by the owner 04.10, after seeing both live: "Corner card without the underlines pls, if
// no app is open. If app is open, than to the page. BUT i mean by open if its directly on the
// desktop, not somewhere in background." So:
//   Intake ON SCREEN (the visible tab of a focused window)
//     - the colleague who answered: the caller's page opens
//     - a ring nobody has answered yet, or a caller with no page: the corner card
//   Intake NOT on screen (minimised, a background tab, a window behind another)
//     - a desktop notification in the corner of the screen; clicking it opens the page
//
// NEW EVENTS ONLY. The first ask after the app opens returns the newest id and no events, so a load
// or a reload pops nothing. One call pops once. The app asks every 3 s only while the server says
// calls can arrive at all; otherwise it looks again every 5 minutes.
const CP_EVERY_MS = 3000;
const CP_IDLE_MS = 5 * 60 * 1000;
let CP_TIMER = null;
let CP_LAST = null;
let CP_ENABLED = false;
const CP_SHOWN = new Set();

function callPopStart() {
  if (CP_TIMER) return;
  cpTick();
}

function cpSchedule() {
  clearTimeout(CP_TIMER);
  CP_TIMER = setTimeout(cpTick, CP_ENABLED ? CP_EVERY_MS : CP_IDLE_MS);
}

async function cpTick() {
  let d = null;
  try {
    // not api(): a poll every few seconds must not flash the busy bar or throw the login up
    const q = CP_LAST === null ? '' : '?after=' + encodeURIComponent(CP_LAST);
    const r = await fetch('/api/calls/events' + q, { headers: { 'x-acting-as': ACTOR } });
    if (r.ok) d = await r.json();
  } catch (e) { d = null; }
  if (d) {
    const was = CP_ENABLED;
    CP_ENABLED = Boolean(d.enabled);
    if (CP_ENABLED && !was) cpAskOnce();
    const baseline = CP_LAST === null;
    CP_LAST = d.last;
    if (!baseline) for (const ev of d.events || []) cpHandle(ev);
  }
  cpSchedule();
}

// Is Intake on this person's screen right now? Visible AND the window has focus: a tab that is
// shown but behind another window does not count (the owner: "directly on the desktop").
function cpOnScreen() {
  try { return document.visibilityState === 'visible' && document.hasFocus(); } catch (e) { return false; }
}

// What one event does. Returns what it did, so it can be tested on its own.
function cpHandle(ev) {
  const box = document.querySelector('#callpop');
  const open = box && box.dataset.call;
  if (ev.taken) {                       // a colleague answered it: their call, not ours
    if (open === ev.callId) cpClose();
    return 'closed';
  }
  if (ev.event === 'ringing') {
    if (CP_SHOWN.has(ev.callId)) return 'already';
    CP_SHOWN.add(ev.callId);
    return cpShow(ev);
  }
  if (ev.event === 'answered' && (ev.forYou || !CP_SHOWN.has(ev.callId))) {
    const first = !CP_SHOWN.has(ev.callId);
    CP_SHOWN.add(ev.callId);
    return cpShow({ ...ev, answered: true }, { notifyAgain: first });
  }
  return 'ignored';                     // "ended", or an answer that is not ours to act on
}

const cpWho = (w) => w.kind === 'person' ? (w.name || 'A person in Intake')
  : w.kind === 'lead' ? (w.name || 'A lead waiting in the Inbox')
  : 'New caller' + (w.last4 ? ' ···' + w.last4 : '');
const cpWhere = (w) => w.kind === 'person' ? '#/person/' + encodeURIComponent(w.id) : w.kind === 'lead' ? '#/inbox' : null;
const cpTag = (w) => w.kind === 'person' ? 'Existing' + (w.status ? ' · ' + w.status : '') : 'New';

function cpShow(call, { notifyAgain = true } = {}) {
  const w = call.who || {};
  const href = cpWhere(w);
  if (!cpOnScreen()) {
    if (notifyAgain) cpNotify(call);
    return 'notified';
  }
  if (call.forYou && href) {            // on screen, and you answered: the page itself
    cpClose();
    if (location.hash !== href) location.hash = href;
    return 'page';
  }
  let box = document.querySelector('#callpop');
  if (!box) { box = document.createElement('div'); box.id = 'callpop'; document.body.appendChild(box); }
  box.dataset.call = call.callId || '';
  box.innerHTML = cpCardHtml(call);
  return 'card';
}

// The card: name, new or existing, last note, next step, Open. Nothing more (KB 08 P5). A missing
// note or step is left out, not announced. No underlines.
function cpCardHtml(call) {
  const w = call.who || {};
  const href = cpWhere(w);
  return `<div class="cp-card" role="dialog" aria-live="assertive" aria-label="Incoming call">
    <header><span class="cp-dot" aria-hidden="true"></span><b class="cp-name">${esc(cpWho(w))}</b>
      <button class="cp-x" onclick="cpClose()" aria-label="Close">&times;</button></header>
    <span class="cp-tag ${w.isNew ? 'new' : 'old'}">${esc(cpTag(w))}</span>
    ${w.lastNote || w.nextStep ? `<dl>
      ${w.lastNote ? `<div><dt>Last note</dt><dd>${esc(w.lastNote)}</dd></div>` : ''}
      ${w.nextStep ? `<div><dt>Next step</dt><dd>${esc(w.nextStep)}${w.nextStepAt ? ' · ' + esc(fmtDate(w.nextStepAt)) : ''}</dd></div>` : ''}
    </dl>` : ''}
    ${href ? `<footer><a class="btn sm" href="${href}" onclick="cpClose()">Open</a></footer>` : ''}
  </div>`;
}
function cpClose() { const box = document.querySelector('#callpop'); if (box) { box.innerHTML = ''; box.dataset.call = ''; } }

// The text of the desktop notification: the same four things as the card.
function cpNoteText(call) {
  const w = call.who || {};
  const lines = [cpTag(w)];
  if (w.lastNote) lines.push('Last note: ' + w.lastNote);
  if (w.nextStep) lines.push('Next step: ' + w.nextStep);
  return { title: cpWho(w), body: lines.join('\n') };
}

// A desktop notification in the corner of the screen. Clicking it brings Intake forward on the
// caller. Shown by the service worker when there is one (it survives the tab being in the
// background), otherwise by the page.
function cpNotify(call) {
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return false;
  const t = cpNoteText(call);
  const href = cpWhere(call.who || {});
  const opts = { body: t.body, tag: 'call-' + (call.callId || ''), requireInteraction: true,
    icon: '/assets/icon-192.png', data: { href: href || '#/inbox' } };
  try {
    const n = new Notification(t.title, opts);
    n.onclick = () => { try { window.focus(); } catch (e) { /* nothing to focus */ } if (href) location.hash = href; n.close(); };
    return true;
  } catch (e) { return false; }
}

// The browser asks each colleague ONCE whether Intake may show notifications. Browsers only allow
// the question after a click, so it is asked on the first click once calls can arrive.
function cpAskOnce() {
  if (typeof Notification === 'undefined') return;
  if (Notification.permission === 'granted') { cpPushSetup(); return; }
  if (Notification.permission !== 'default') return;
  const ask = async () => {
    try { if ((await Notification.requestPermission()) === 'granted') cpPushSetup(); } catch (e) { /* older browser */ }
  };
  document.addEventListener('click', ask, { once: true });
}

// So the notification also reaches a colleague whose Intake is CLOSED: the browser subscribes to
// Intake's push once (src/sw.js shows the notification). Only when the server has push keys.
let CP_PUSH = false;
async function cpPushSetup() {
  if (CP_PUSH || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
  CP_PUSH = true;
  try {
    const k = await fetch('/api/push/key', { headers: { 'x-acting-as': ACTOR } }).then((r) => r.json());
    if (!k.publicKey) return;
    const reg = await navigator.serviceWorker.register('/sw.js');
    const b = k.publicKey.replace(/-/g, '+').replace(/_/g, '/');
    const key = Uint8Array.from(atob(b + '='.repeat((4 - b.length % 4) % 4)), (c) => c.charCodeAt(0));
    const sub = (await reg.pushManager.getSubscription())
      || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    await fetch('/api/push/subscribe', { method: 'POST',
      headers: { 'content-type': 'application/json', 'x-acting-as': ACTOR }, body: JSON.stringify({ endpoint: sub.endpoint }) });
  } catch (e) { CP_PUSH = false; }
}

(async () => {
  // WHO ARE YOU, BEFORE ANYTHING ELSE IS FETCHED.
  //
  // This used to load /api/config first and ask afterwards. The comment below
  // said the CRM "is not drawn at all" for somebody not signed in, and that was
  // not true: 34KB of configuration - every colleague's name, every settled
  // decision, every channel blocker - had already been pulled into the page
  // before the login screen appeared. The order is the whole control.
  const back = readReturnFromGoogle();
  await loadAuth();
  // Registered BEFORE the login check. Returning early here left no hashchange
  // listener at all, so after signing in every link in the navigation changed the
  // address bar and nothing on screen moved.
  if (UI === 'c') installCNav();
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', (e) => {
    // A clickable row is a control, so it answers Enter and Space. So is a
    // sortable column header: tabindex alone makes it focusable but not
    // activatable, which is the worse of the two states - it takes a tab stop
    // and then does nothing.
    const el = document.activeElement;
    if (!el || (e.key !== 'Enter' && e.key !== ' ')) return;
    const isRow = el.classList && el.classList.contains('row');
    const isSortHeader = el.tagName === 'TH' && el.hasAttribute('onclick');
    if (isRow || isSortHeader) { e.preventDefault(); el.click(); }
  });
  if (AUTH.on && !AUTH.user) {
    drawLogin(back.refused
      ? 'That Google account cannot sign in to Intake. Ask an admin to set an account up for you.'
      : '');
    return;
  }
  await startShell();
})();

/**
 * Everything the shell needs once somebody is known.
 *
 * CALLED FROM BOTH THE FIRST LOAD AND A SUCCESSFUL SIGN-IN, and that is the
 * whole point. Signing in used to call route() straight after loadAuth(), while
 * the configuration fetch sat in the boot block below the early return - so
 * after signing in through the form, CFG was an empty object. The Admissions
 * board builds its columns from CFG.stages, so it rendered a heading saying
 * "Admissions - 12" above an empty board. Today rendered almost nothing.
 *
 * It healed on the next reload, which is exactly why it survived a manual pass.
 */
async function startShell() {
  CFG = await api('/api/config');
  $('#ver').innerHTML = 'Intake &middot; ' + (CFG.version || 'prototype');
  drawDatasetBadge(CFG.dataset || {});
  let saved = 'light';
  try { saved = localStorage.getItem('crmTheme') || 'light'; } catch {}
  if (!['light', 'dark', 'system'].includes(saved)) saved = 'light';
  setTheme(saved);
  const themeSel = document.querySelector('#theme');
  if (themeSel) themeSel.value = saved;
  try { ACTOR = localStorage.getItem('crmActor') || ''; } catch {}
  const known = (CFG.users || []).map(u => u.name).concat(CFG.admins || []);
  if (!known.includes(ACTOR)) ACTOR = known[0] || '';
  ACTOR = cActorSide(ACTOR);   // only two choices on a test copy; sign-in below overrides it
  // With sign-in ON, loadAuth already set ACTOR from the proved identity, and the
  // dropdown above is not on screen. This line only matters on a copy with
  // sign-in off, where who you are is still a setting.
  if (AUTH.user) ACTOR = AUTH.user.name;
  drawActorPicker();
  callPopStart();   // Q6: whoever answers the phone sees who is calling
  await route();
}
</script>
