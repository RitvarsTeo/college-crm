// ---------------------------------------------------- FULL REPORT, ONE LEVEL DEEPER (Q35)
// The owner, 05.10.2026: "we have the same metrics that are in the home. Lets not be redundant ok, but smartly make it
// obvious that full report page is going deeper on the metrics that are on home". Two ways were built behind a switch
// (A: chapters stacked under a sticky index; B: one tab per Home figure); he PICKED B, 05.10.2026, and A, the switch
// and the earlier report are gone. The tab row is Home's cards in miniature.
// One chapter per Home figure, in Home's order. A chapter opens with the SAME figure and label as its Home card (the
// one allowed echo: it is the link back), then only the breakdowns that say where it comes from. No figure twice.
// EVERY FIGURE IS A PATH TO ITS PEOPLE (the owner, 05.10.2026: "path to path to path", KB 08 P5): every count opens
// exactly the people it counts in People (or Outcomes), and the count on arrival is the figure. The cohorts are built
// here from the same people rows People lists, so the two cannot disagree. Open / overdue / no next step are Today's
// and are not repeated here; why people did not proceed is Outcomes' and is one click from Not proceeding.
let C_REP_CH = null;          // the open tab: a Home card, #/reports/<chapter> or a click chose it
let C_REP_COH = {};           // q-key -> { name, label, ids }, the people behind every figure on the page
const C_REP_CHAPTERS = [['admitted', 'Admitted'], ['leads', 'Leads'], ['conversion', 'Conversion'],
  ['median', 'Median time to admission'], ['now', 'Where everyone is now'], ['applications', 'Applications']];
const C_REP_SPREAD = [[0, 14], [15, 30], [31, 60], [61, 90], [91, 180], [181, Infinity]];

// The period in words, for the basis labels: a calendar year (or This year, to date) is "2026", as on Home; a
// calendar month is "Oct 2026".
function cRepPeriodWord(label, today = '') {
  const [a, b] = String(label || '').split(' to ');
  if (!a || !b) return '';
  const d = (x) => `${Number(x.slice(8))} ${C_MONTHS[Number(x.slice(5, 7)) - 1]}`;
  const last = new Date(Date.UTC(Number(b.slice(0, 4)), Number(b.slice(5, 7)), 0)).getUTCDate();
  if (a.slice(5) === '01-01' && a.slice(0, 4) === b.slice(0, 4) && (b.slice(5) === '12-31' || (today && b >= today))) return a.slice(0, 4);
  if (a.slice(0, 7) === b.slice(0, 7) && a.slice(8) === '01' && Number(b.slice(8)) === last) return `${C_MONTHS[Number(a.slice(5, 7)) - 1]} ${a.slice(0, 4)}`;
  return a.slice(0, 4) === b.slice(0, 4) ? `${d(a)} to ${d(b)} ${b.slice(0, 4)}` : `${d(a)} ${a.slice(0, 4)} to ${d(b)} ${b.slice(0, 4)}`;
}

// THE TIME AXIS FOLLOWS THE PERIOD (MASTER CONTROL, 05.10.2026: the header said 2026 and the chart Nov 2025 to Oct
// 2026). Up to 31 days: days; up to 92: weeks (Monday to Sunday); longer: months. Never past today. Every bucket is
// cut to the period, so the buckets add up to the period's figure.
function cRepBuckets(label, today) {
  const [a, b0] = String(label || '').split(' to ');
  if (!a || !b0) return { grain: 'month', list: [] };
  const b = b0 < today ? b0 : today;
  const ms = (d) => Date.UTC(Number(d.slice(0, 4)), Number(d.slice(5, 7)) - 1, Number(d.slice(8, 10)));
  const iso = (t) => new Date(t).toISOString().slice(0, 10);
  const word = (d, y = true) => `${Number(d.slice(8, 10))} ${C_MONTHS[Number(d.slice(5, 7)) - 1]}${y ? ' ' + d.slice(0, 4) : ''}`;
  const span = Math.round((ms(b0) - ms(a)) / 86400000) + 1;
  const list = [];
  if (b < a) return { grain: span <= 31 ? 'day' : span <= 92 ? 'week' : 'month', list };
  if (span <= 31) {
    for (let t = ms(a); t <= ms(b); t += 86400000) { const d = iso(t); list.push({ key: d, from: d, to: d, short: String(Number(d.slice(8))), tip: word(d) }); }
    return { grain: 'day', list };
  }
  if (span <= 92) {
    for (let t = ms(a); t <= ms(b);) {
      const dow = (new Date(t).getUTCDay() + 6) % 7, end = Math.min(t + (6 - dow) * 86400000, ms(b));
      const f = iso(t); list.push({ key: f, from: f, to: iso(end), short: word(f, false), tip: `${word(f)} to ${word(iso(end))}` });
      t = end + 86400000;
    }
    return { grain: 'week', list };
  }
  for (let y = Number(a.slice(0, 4)), m = Number(a.slice(5, 7)); `${y}-${String(m).padStart(2, '0')}` <= b.slice(0, 7); m === 12 ? (y += 1, m = 1) : (m += 1)) {
    const key = `${y}-${String(m).padStart(2, '0')}`, f = key + '-01', l = iso(Date.UTC(y, m, 0));
    list.push({ key, from: f > a ? f : a, to: l < b ? l : b, short: C_MONTHS[m - 1], tip: `${C_MONTHS[m - 1]} ${y}` });
  }
  return { grain: 'month', list };
}

// THE MODEL: every figure on the page, each with the people it counts. Pure: the report r (/api/report, for the
// period and the twelve months), the people rows, the config, today. Definitions are the report's own (src/reports.js)
// except Admitted, which is Home's card: admitted people with an admission date in the period.
function cRepModel(r, people, cfg, today) {
  // the period's ranges (Q59: a set of years can be 2024 + 2026, two ranges), the axis over its span cut to them
  const R = (r.period.ranges || [[r.period.from, r.period.to]]).map(([a, b]) => [Date.parse(a), Date.parse(b)]);
  const inP = (d) => { const t = d ? Date.parse(d) : NaN; return R.some(([a, b]) => t >= a && t < b); };
  const span = r.period.span || r.period.label;
  const pw = r.period.years && r.period.years.length > 1 ? r.period.years.join(', ') : cRepPeriodWord(span, today);
  const coh = {}; let seq = 0;
  const fig = (name, label, list) => { const k = 'q' + (++seq); coh[k] = { name, label, ids: list.map((p) => p.id) }; return { k, n: list.length }; };
  const val = (v) => (v == null || String(v).trim() === '' ? '(not recorded)' : String(v).trim());
  const said = (v) => (v === '(not recorded)' ? 'not recorded' : v);
  const groups = (list, keyOf) => { const m = new Map(); list.forEach((p) => { const k = keyOf(p); if (!m.has(k)) m.set(k, []); m.get(k).push(p); }); return m; };
  // a breakdown: one row per value, biggest first; `keep` lists values that stay even at zero (the programmes)
  const rows = (name, what, list, keyOf, keep = []) => {
    const m = groups(list, keyOf);
    keep.forEach((k) => { if (!m.has(k)) m.set(k, []); });
    return [...m.entries()].sort((x, y) => y[1].length - x[1].length || (keep.indexOf(x[0]) + 1 || 99) - (keep.indexOf(y[0]) + 1 || 99))
      .map(([value, ps]) => ({ value, ...fig(`${name}:${value}`, `${what} · ${said(value)}`, ps) }));
  };
  const progs = cfg.programmes || [];
  // the buckets over the span, kept only where they meet a chosen range (2024 + 2026 has no 2025 months)
  const T0 = cRepBuckets(span, today);
  const days = R.map(([a, b]) => [cDay(new Date(a).toISOString()), cDay(new Date(b - 1).toISOString())]);   // Riga days
  const T = { ...T0, list: T0.list.filter((x) => days.some(([d0, d1]) => x.to >= d0 && x.from <= d1)) };
  const inB = (iso, x) => { const d = cDay(iso); return !!d && d >= x.from && d <= x.to; };

  // 1 ADMITTED (Home's card: admitted, with the admission date in the period)
  const adm = people.filter((p) => p.status === 'Admitted' && inP(p.admitted_at));
  const yr = /^\d{4}$/.test(pw) ? pw : null;
  const t = yr && cfg.targets && cfg.targets[yr];
  const offP = t && Array.isArray(t.officerProgrammes) ? t.officerProgrammes : [];
  const admitted = {
    all: fig('admitted', `Admitted · ${pw}`, adm),
    undated: fig('admitted:undated', 'Admitted · no admission date', people.filter((p) => p.status === 'Admitted' && !p.admitted_at)),
    target: t && Number(t.admitted) > 0 ? { goal: Number(t.admitted),
      off: offP.length && Number(t.officerPct) > 0 ? { label: offP.join(' + '), goal: Math.round(Number(t.admitted) * Number(t.officerPct) / 100),
        ...fig('admitted:officer', `Admitted · ${pw} · ${offP.join(' + ')}`, adm.filter((p) => offP.includes(p.programme))) } : null } : null,
    byTime: T.list.map((x) => ({ ...x, ...fig(`admitted:${T.grain}:${x.key}`, `Admitted · ${x.tip}`,
      people.filter((p) => p.status === 'Admitted' && inB(p.admitted_at, x))) })),
    byProgramme: rows('admitted:programme', `Admitted · ${pw}`, adm, (p) => val(p.programme), progs),
    byChannel: rows('admitted:channel', `Admitted · ${pw} · came from`, adm, (p) => val(p.source_channel)),
  };

  // 2 LEADS (a lead is a PERSON added to Intake in the period, never an Inbox row)
  const arr = people.filter((p) => inP(p.created_at));
  const sea = cfg.maritimeEducations || [];
  const leads = {
    all: fig('leads', `Leads · ${pw} · people added`, arr),
    byTime: T.list.map((x) => ({ ...x, ...fig(`leads:${T.grain}:${x.key}`, `Leads · people added · ${x.tip}`,
      people.filter((p) => inB(p.created_at, x))) })),
    byChannel: rows('leads:channel', `Leads · ${pw} · came from`, arr, (p) => val(p.source_channel)),
    byProgramme: rows('leads:programme', `Leads · ${pw}`, arr, (p) => val(p.programme), progs),
    byStudyForm: rows('leads:studyForm', `Leads · ${pw}`, arr, (p) => val(p.study_form)),
    byEducation: rows('leads:education', `Leads · ${pw}`, arr, (p) => val(p.education)),
    byNationality: rows('leads:nationality', `Leads · ${pw}`, arr, (p) => val(p.nationality)),
    eduRecorded: fig('leads:education:recorded', `Leads · ${pw} · education recorded`, arr.filter((p) => val(p.education) !== '(not recorded)')),
    natRecorded: fig('leads:nationality:recorded', `Leads · ${pw} · nationality recorded`, arr.filter((p) => val(p.nationality) !== '(not recorded)')),
    maritime: fig('leads:maritime', `Leads · ${pw} · from a maritime school`, arr.filter((p) => sea.includes(p.education))),
  };

  // 3 CONVERSION, MATURED (the owner, 05.10.2026): admitted / the people who arrived in the period at least N days
  // before its end. The rule is the server's ONE definition (src/reports.js maturedConversion): this screen only takes
  // its cutoff, so Home's card, this tab and the export can never disagree on who counts.
  const S = r.summary || {};
  const cut = S.conversionCutoff ? Date.parse(S.conversionCutoff) : -Infinity;
  const ripe = arr.filter((p) => Date.parse(p.created_at) < cut);
  const who = S.conversionWho || 'who arrived';
  const won = ripe.filter((p) => p.admitted_at);
  const pct = (a, b) => (b ? Math.round((a / b) * 1000) / 10 : null);
  const rate = (name, what, list, keyOf) => [...groups(list, keyOf).entries()].map(([value, ps]) => { const w = ps.filter((p) => p.admitted_at);
    return { value, pct: pct(w.length, ps.length), a: w.length, b: ps.length, ...fig(`${name}:${value}`, `${what} · ${said(value)} · admitted`, w) }; })
    .sort((x, y) => y.pct - x.pct || y.b - x.b);
  const stops = (cfg.stages || []).map((s) => s.id).filter((id) => id !== 'Admitted');
  const conversion = {
    pct: pct(won.length, ripe.length), who, days: S.conversionDays,
    won: fig('conversion:admitted', `Leads · ${pw} · ${who} · admitted`, won), base: fig('conversion:matured', `Leads · ${pw} · ${who}`, ripe),
    stoppedAt: stops.map((id) => ({ value: id, ...fig(`conversion:now:${id}`, `Leads · ${pw} · now ${cStage(id)}`, arr.filter((p) => p.status === id && !p.admitted_at)) })).filter((x) => x.n),
    byProgramme: rate('conversion:programme', `Leads · ${pw} · ${who}`, ripe, (p) => val(p.programme)),
    byChannel: rate('conversion:channel', `Leads · ${pw} · ${who} · came from`, ripe, (p) => val(p.source_channel)),
    // BENCHMARKS (variant A, the owner 06.10.2026). Each row is a config.benchmarks row WITH its source, set against the
    // server's matured step rate (src/reports.js maturedSteps): the dot is the server's figure, and the dot and the
    // working open exactly the ids the server counted. A row without a source, or without its step, is never drawn.
    bench: cRepBenchRows(r.steps, cfg.benchmarks).map(({ b, s, few }) => ({ b, few, pct: s.pct,
      base: fig(`conversion:step:${b.step}:of`, `Leads · ${pw} · ${who}${s.from === 'Lead' ? '' : ' · reached ' + cStage(s.from)}`, s.ofIds.map((id) => ({ id }))),
      won: fig(`conversion:step:${b.step}:reached`, `Leads · ${pw} · ${who} · reached ${cStage(s.to)}`, s.reachedIds.map((id) => ({ id }))) })),
  };

  // 4 MEDIAN TIME TO ADMISSION (first contact to admitted, for the people admitted in the period)
  const durs = people.filter((p) => p.admitted_at && inP(p.admitted_at))
    .map((p) => ({ p, d: Math.round((Date.parse(p.admitted_at) - Date.parse(p.created_at)) / 86400000) }))
    .filter((x) => Number.isFinite(x.d) && x.d >= 0).sort((a, b) => a.d - b.d);
  const med = (xs) => (xs.length ? xs[Math.floor(xs.length / 2)].d : null);
  const median = {
    days: med(durs), over: fig('median', `Admitted · ${pw} · with both dates`, durs.map((x) => x.p)),
    spread: C_REP_SPREAD.map(([lo, hi]) => ({ lo, hi, ...fig(`median:spread:${lo}`, `Admitted · ${pw} · ${hi === Infinity ? lo + '+ days' : lo + '-' + hi + ' days'} to admission`,
      durs.filter((x) => x.d >= lo && x.d <= hi).map((x) => x.p)) })),
    byProgramme: [...groups(durs, (x) => val(x.p.programme)).entries()].map(([value, xs]) => ({ value, days: med(xs), people: xs.length,
      ...fig(`median:programme:${value}`, `Admitted · ${pw} · ${said(value)} · with both dates`, xs.map((x) => x.p)) }))
      .sort((a, b) => a.days - b.days),
  };

  // 5 WHERE EVERYONE IS NOW (everybody, whatever the period: Home's donut, then stage by programme)
  const open = people.filter((p) => !C_TERMINAL.includes(p.status));
  const stages = (cfg.stages || []).map((s) => s.id);
  const cols = [...progs, ...[...new Set(people.map((p) => val(p.programme)))].filter((v) => !progs.includes(v))]
    .filter((c) => people.some((p) => val(p.programme) === c));
  const now = {
    everyone: fig('now', 'Everybody', people),
    open: fig('now:open', 'Open', open),
    admitted: { n: people.filter((p) => p.status === 'Admitted').length, go: 'outcome|Admitted' },
    closed: { n: people.filter((p) => p.status === 'Not proceeding').length, go: 'outcome|Not proceeding' },
    cols,
    grid: stages.map((st) => ({ stage: st, cells: cols.map((c) => { const ps = people.filter((p) => p.status === st && val(p.programme) === c);
      return ps.length ? { col: c, ...fig(`now:${st}:${c}`, `${cStage(st)} · ${c === '(not recorded)' ? 'programme not recorded' : c}`, ps) } : { col: c, n: 0 }; }) })),
  };
  return { pw, grain: T.grain, coh, admitted, leads, conversion, median, now };
}

// The benchmark rows that may be drawn: in config, with every provenance field, and with the server's step present.
const C_BENCH_NEEDS = ['definition', 'source', 'url', 'year', 'region', 'confidence'];
function cRepBenchRows(steps, bench) {
  const minN = Number((bench || {}).minN) || 20;
  return ((bench || {}).rows || []).filter((b) => C_BENCH_NEEDS.every((f) => b[f] != null && String(b[f]).trim() !== '') && steps && steps[b.step])
    .map((b) => ({ b, s: steps[b.step], few: steps[b.step].of < minN }));
}
// Variant A: one bullet row per benchmark. Name and the working (a -> b, both open their people) on the left; the
// hairline 0..100% with the grey band, its label and source under it, and our dot with the value above. The whole
// track is ONE click: it opens the people the dot counts (a benchmark opens our people, never its source).
function cRepBench(rows) {
  if (!rows || !rows.length) return '';
  const clamp = (n) => Math.max(0, Math.min(100, Number(n)));
  return `<section class="bm" aria-label="Benchmarks">${rows.map((x) => { const b = x.b;
    const lo = clamp(b.show === 'tick' ? b.value : b.low), hi = Math.max(lo, clamp(b.show === 'tick' ? b.value : b.high));
    const band = b.show === 'tick' ? `${lo}%` : `${lo}-${hi}%`;
    const val = x.pct == null ? null : `${x.few ? '~' : ''}${x.pct}%`;
    return `<div class="bm-row" data-bench="${esc(b.id)}"><div class="bm-name"><b>${esc(b.name)}</b><small>${cRepGo(x.base)} &rarr; ${cRepGo(x.won)}</small></div>
      <div class="bm-trackbox" tabindex="0" role="button" data-coh="${x.won.k}" data-kgo="cohort|${x.won.k}" data-tip="${esc(b.name)}|${val == null ? '-' : esc(val)}|${band} ${esc(b.label || 'typical')} · ${esc(b.sourceLabel || b.source)}"><span class="bm-track"></span><span class="bm-end bm-0">0</span><span class="bm-end bm-100">100%</span>
        <span class="bm-band" style="left:${lo}%;width:${hi - lo}%"></span>
        <span class="bm-bandl" style="left:${(lo + hi) / 2}%">${band} ${esc(b.label || 'typical')}<small>${esc(b.sourceLabel || b.source)}</small></span>
        ${val == null ? '' : `<span class="bm-dot${x.few ? ' few' : ''}" style="left:${clamp(x.pct)}%" data-v="${esc(val)}"><b>${esc(val)}</b><i></i></span>`}
      </div></div>`; }).join('')}</section>`;
}
// One figure, drawn as the click to its people. `v` is shown instead of the count when the figure is a value
// (a share, a median) computed over those people. An Outcomes figure (`go`) opens Outcomes on that outcome.
const cRepGo = (f, v) => (f.go ? `<a class="rp-go" href="#/outcomes" data-n="${f.n}" data-kgo="${f.go}" onclick="cChartGo('${f.go}');return false">${f.n}</a>`
  : `<a class="rp-go" href="#/people" ${v === undefined ? `data-n="${f.n}"` : `data-v="${esc(v)}"`} data-coh="${f.k}" onclick="cGoCohort('${f.k}');return false">${v === undefined ? f.n : v}</a>`);
// A label for a breakdown value: [what it reads, a gap?, why]. A gap reads slate; why is on hover, never in the label.
function cRepLabel(kind, v) {
  if (v === '(not recorded)') return ['not recorded', true, ''];
  if (kind === 'channel') { const [l, why] = cChannel(v); return [l, !!why, why || '']; }
  if (kind === 'stage') return [cStage(v), false, ''];
  if (kind === 'programme' && (CFG.programmes || []).length && !(CFG.programmes || []).includes(v)) return [v, true, 'not one of the list'];
  return [v, false, ''];
}
// Bars on ONE scale per block, each row the click to its people.
function cRepBars(rows, kind, basis) {
  const list = rows.filter((x) => x.n || kind === 'programme' || kind === 'spread');
  if (!list.length) return '<p class="c-empty rp-none">Nobody in this period.</p>';
  const max = Math.max(1, ...list.map((x) => x.n));
  return `<div class="kbars">${list.map((x) => { const [l, gap, why] = cRepLabel(kind, x.value);
    return `<div class="kbar" tabindex="0" role="button" data-n="${x.n}" data-coh="${x.k}" data-tip="${esc(l)}|${x.n} people|${esc(basis)}${why ? ' · ' + esc(why) : ''}" data-kgo="cohort|${x.k}"><span class="kbl">${gap ? `<span class="c-gap">${esc(l)}</span>` : esc(l)}</span><span class="kbt"><i style="width:${x.n ? Math.max(3, (x.n / max) * 100) : 0}%" class="${gap ? 'gap' : ''}"></i></span><b>${x.n}</b></div>`; }).join('')}</div>`;
}
// Shares on one 0-100% scale, in the data mustard (a rate, never a count). The share opens the admitted ones.
function cRepRates(rows, kind) {
  if (!rows.length) return '<p class="c-empty rp-none">Nobody in this period.</p>';
  return `<div class="kbars">${rows.map((x) => { const [l, gap] = cRepLabel(kind, x.value);
    return `<div class="kbar rp-rate" tabindex="0" role="button" data-v="${x.pct}" data-coh="${x.k}" data-tip="${esc(l)}|${x.pct}%|${x.a} of ${x.b} admitted" data-kgo="cohort|${x.k}"><span class="kbl">${gap ? `<span class="c-gap">${esc(l)}</span>` : esc(l)}</span><span class="kbt"><i style="width:${x.pct}%"></i></span><b>${x.pct}%</b></div>`; }).join('')}</div>`;
}
// The period's days, weeks or months as columns on one scale; every column opens its people, its figure on hover (as
// on Home). Many columns keep about twelve printed names, always the last one; every column keeps its own label.
function cRepCols(rows, what) {
  if (!rows.length) return '<p class="c-empty rp-none">Nothing yet.</p>';
  const max = Math.max(1, ...rows.map((x) => x.n));
  const every = rows.length > 16 ? Math.ceil(rows.length / 12) : 1;
  return `<div class="rp-cols">${rows.map((x, i) => `<div class="rp-col" tabindex="0" role="button" aria-label="${esc(x.tip)}: ${x.n} ${what}" data-n="${x.n}" data-coh="${x.k}" data-tip="${esc(x.tip)}|${x.n} ${what}" data-kgo="cohort|${x.k}"><span class="rp-colt"><i style="height:${x.n ? Math.max(2, (x.n / max) * 100) : 0}%"></i></span><small>${(rows.length - 1 - i) % every === 0 ? esc(x.short) : ''}</small></div>`).join('')}</div>
    <details class="kdet"><summary>Show as a table</summary><table class="ktable"><tbody>${rows.map((x) => `<tr><td>${esc(x.tip)}</td><td>${cRepGo(x)}</td></tr>`).join('')}</tbody></table></details>`;
}
const cRepBlock = (title, basis, body, extra = '') => `<section class="ksec rp-block"><div class="ksh"><h2>${title}</h2><span class="kt2">${basis}</span>${extra}</div>${body}</section>`;

// THE ECHO: the Home card, the same label and figure, as the chapter's head (and in B, the tab).
function cRepEcho(id, M) {
  const A = M.admitted, L = M.leads, C = M.conversion, D = M.median, N = M.now;
  const meter = (n, goal, label, cls, f) => `<div class="ktgt ${cls}" role="img" aria-label="${n} admitted${label ? ' in ' + esc(label) : ''} of the ${goal} target">
    <div class="ktgt-track"><i style="width:${Math.min(100, (n / goal) * 100).toFixed(2)}%"></i><s></s></div>
    <div class="ktgt-n">${label ? `<span class="ktgt-who">${esc(label)}</span> <strong>${cRepGo(f)}</strong> · ` : ''}<strong>${cRepGo(f, Math.round((n / goal) * 100) + '%')}</strong> of <strong class="ktgt-goal">${goal}</strong></div></div>`;
  if (id === 'admitted') return { label: 'Admitted', fig: cRepGo(A.all), small: `${esc(M.pw)} · admission date${A.undated.n ? ` · +${cRepGo(A.undated)} undated` : ''}`,
    more: A.target ? meter(A.all.n, A.target.goal, '', 'all', A.all) + (A.target.off ? meter(A.target.off.n, A.target.off.goal, A.target.off.label, 'off', A.target.off) : '') : '' };
  if (id === 'leads') return { label: 'Leads', fig: cRepGo(L.all), small: `${esc(M.pw)} · people added` };
  if (id === 'conversion') return { label: 'Conversion', fig: C.pct == null ? '-' : cRepGo(C.won, C.pct + '%'), small: `${cRepGo(C.won)} / ${cRepGo(C.base)} ${esc(C.who)}` };
  if (id === 'median') return { label: 'Median time to admission', fig: D.days == null ? '-' : `${cRepGo(D.over, D.days)} <em>days</em>`, small: 'first contact to admission' };
  if (id === 'now') return { label: 'Where everyone is now', fig: `${cRepGo(N.everyone)} <em>people</em>`,
    small: `<span class="rp-split"><i class="o"></i>Open ${cRepGo(N.open)}</span><span class="rp-split"><i class="a"></i>Admitted ${cRepGo(N.admitted)}</span><span class="rp-split"><i class="n"></i>Not proceeding ${cRepGo(N.closed)}</span>` };
  return { label: 'Applications', fig: '', small: 'Academy Application form → SIS' };
}

// THE DEPTH: only the breakdowns that say where the chapter's figure comes from.
function cRepBody(id, M) {
  const A = M.admitted, L = M.leads, C = M.conversion, D = M.median, N = M.now, pw = esc(M.pw);
  const by = { day: 'By day', week: 'By week', month: 'By month' }[M.grain];
  if (id === 'admitted') return `${cRepBlock(by, `${pw} · admission date`, cRepCols(A.byTime, 'admitted'))}
    <div class="c-rgrid">${cRepBlock('By programme', `${pw} · admission date`, cRepBars(A.byProgramme, 'programme', 'admitted ' + M.pw))}
    ${cRepBlock('By channel', `${pw} · where they came from`, cRepBars(A.byChannel, 'channel', 'admitted ' + M.pw))}</div>`;
  if (id === 'leads') return `${cRepBlock(by, `${pw} · people added`, cRepCols(L.byTime, 'people added'))}
    <div class="c-rgrid">${cRepBlock('By channel', `${pw} · people added`, cRepBars(L.byChannel, 'channel', 'added ' + M.pw))}
    ${cRepBlock('By programme', `${pw} · people added`, cRepBars(L.byProgramme, 'programme', 'added ' + M.pw))}
    ${cRepBlock('Study form', `${pw} · people added`, cRepBars(L.byStudyForm, 'studyForm', 'added ' + M.pw))}
    ${cRepBlock('Education', `${pw} · ${cRepGo(L.eduRecorded)} recorded`, cRepBars(L.byEducation, 'education', 'added ' + M.pw), `<span class="rp-chip">maritime school ${cRepGo(L.maritime)}</span>`)}
    ${cRepBlock('Nationality', `${pw} · ${cRepGo(L.natRecorded)} recorded`, cRepBars(L.byNationality, 'nationality', 'added ' + M.pw))}</div>`;
  if (id === 'conversion') {
    // "Reached - Application or beyond" (everyone added, by where they are NOW) is gone: the matured Lead to application
    // row above is the one figure for it (the owner's rule, "Nothing should be duplicated. Its confusing", 06.10.2026).
    return `${cRepBench(C.bench)}<div class="c-rgrid">${cRepBlock('Where the rest are now', `people added · ${pw}`, cRepBars(C.stoppedAt, 'stage', 'added ' + M.pw))}
      ${cRepBlock('By programme', `admitted · ${esc(C.who)} · ${pw}`, cRepRates(C.byProgramme, 'programme'))}
      ${cRepBlock('By channel', `admitted · ${esc(C.who)} · ${pw}`, cRepRates(C.byChannel, 'channel'))}</div>`;
  }
  if (id === 'median') {
    const rows = D.spread.map((x) => ({ value: x.hi === Infinity ? `${x.lo}+ days` : `${x.lo}-${x.hi} days`, k: x.k, n: x.n }));
    const top = Math.max(1, ...D.byProgramme.map((x) => x.days));
    const prog = D.byProgramme.length ? `<div class="kbars">${D.byProgramme.map((x) => { const [l, gap] = cRepLabel('programme', x.value);
      return `<div class="kbar rp-rate" tabindex="0" role="button" data-v="${x.days}" data-coh="${x.k}" data-tip="${esc(l)}|${x.days} days|median of ${x.people}" data-kgo="cohort|${x.k}"><span class="kbl">${gap ? `<span class="c-gap">${esc(l)}</span>` : esc(l)}</span><span class="kbt"><i style="width:${Math.max(3, (x.days / top) * 100)}%"></i></span><b>${x.days}</b></div>`; }).join('')}</div>` : '<p class="c-empty rp-none">Nobody in this period.</p>';
    return `<div class="c-rgrid">${cRepBlock('Spread', `days to admission · admitted ${pw}`, cRepBars(rows, 'spread', 'admitted ' + M.pw))}
      ${cRepBlock('By programme', `median days · admitted ${pw}`, prog)}</div>`;
  }
  if (id === 'now') {
    const max = Math.max(1, ...N.grid.flatMap((r) => r.cells.map((c) => c.n)));
    return cRepBlock('Stage by programme', 'everybody · today', `<div class="c-ftable"><table class="ktable rp-grid"><thead><tr><th></th>${N.cols.map((c) => `<th>${c === '(not recorded)' ? '<span class="c-gap">not recorded</span>' : esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${N.grid.map((r) => `<tr><th scope="row">${esc(cStage(r.stage))}</th>${r.cells.map((c) => (c.n
        ? `<td tabindex="0" role="button" data-n="${c.n}" data-coh="${c.k}" data-tip="${esc(cStage(r.stage))} · ${esc(c.col)}|${c.n} people|everybody, today" data-kgo="cohort|${c.k}"><span class="rp-cell"><i style="width:${((c.n / max) * 100).toFixed(1)}%"></i><b>${c.n}</b></span></td>` : '<td></td>')).join('')}</tr>`).join('')}</tbody></table></div>`);
  }
  return `<section class="c-apps" id="applications" aria-labelledby="cAppsH">
      <div class="c-apps-head"><h2 id="cAppsH">Applications</h2><span class="c-apps-path">Academy Application form <i aria-hidden="true">&rarr;</i> SIS</span></div>
      <div id="cAppState" class="c-appstate"></div>
      <section class="ksec" id="cWeb" hidden></section>
      <section class="ksec" id="cSis" hidden></section>
    </section>`;
}

// The page: the period presets and the download, then the tab row and the open chapter.
function cRepHtml(M, from, to) {
  // NO PERIOD BAR (Q45, decided A 05.10.2026; the owner: "Nothing should be duplicated. Its confusing."): the years
  // are the corner's; inside them, "Whole year" or one month is chosen here (Q59). The download follows it (RPT).
  const P = typeof C_REP_MONTH !== 'undefined' && C_REP_MONTH ? `${C_MONTHS_LONG[Number(C_REP_MONTH.slice(5)) - 1]} ${C_REP_MONTH.slice(0, 4)}` : cScopeWord();
  const head = `<div class="c-head"><div><h1>Reports</h1><p>${esc(P)} · ${esc(from || '')} to ${esc(to || '')}</p></div>
      <div class="act">${cRepMonthHtml()}<button class="btn" onclick="openExport()">Download for management review</button></div></div>
    ${cSheetNotice()}`;
  const card = (id) => { const e = cRepEcho(id, M);
    return `<span>${esc(e.label)}</span><b${e.fig ? '' : ' class="rp-nofig"'}>${e.fig}</b><small>${e.small}</small>`; };
  const cur = C_REP_CHAPTERS.some(([id]) => id === C_REP_CH) ? C_REP_CH : 'admitted';
  return `${head}<div class="kpage rp rp-b">
    <div class="kstrip rp-tabs" role="tablist" aria-label="Chapters">${C_REP_CHAPTERS.map(([id]) => `<div class="rp-tab" role="tab" id="rep-tab-${id}" tabindex="0" aria-selected="${id === cur}" aria-controls="rep-${id}" onclick="cRepTab('${id}')" onkeydown="if(event.key==='Enter'){cRepTab('${id}')}">${card(id)}</div>`).join('')}</div>
    ${C_REP_CHAPTERS.map(([id]) => { const e = cRepEcho(id, M);
      return `<section class="rp-ch" id="rep-${id}" role="tabpanel" aria-labelledby="rep-tab-${id}" data-ch="${id}"${id === cur ? '' : ' hidden'}>${id === 'applications' ? cRepBody(id, M)
        : `<div class="c-sheet rp-sheet">${e.more ? `<div class="rp-more">${e.more}</div>` : ''}${cRepBody(id, M)}</div>`}</section>`; }).join('')}

// THE PERIOD, IN ONE PLACE: the app-wide year scope (Q45), the Year and Period in the corner, read here and nowhere
// else. RPT follows it, so the download for management review is the same period as the page.
// Q59: the chosen years, whole; or ONE month of them, chosen here on Reports only ("inside this year we can in app
// choose the periods we need"). The month goes when its year is no longer chosen.
let C_REP_MONTH = '';   // '' = the whole of the chosen years; 'YYYY-MM' = one month inside them
// The months of the chosen years that have begun, newest first.
function cRepMonths() {
  const l = cScopeList(), now = cTodayIso().slice(0, 7);
  const ys = l === 'all' ? cScopeAllYears() : [...l].sort((a, b) => b - a);
  return ys.flatMap((y) => C_MONTHS_LONG.map((n, k) => `${y}-${String(k + 1).padStart(2, '0')}`).filter((ym) => ym <= now).reverse());
}
function cRepPeriod() {
  if (C_REP_MONTH && !cRepMonths().includes(C_REP_MONTH)) C_REP_MONTH = '';
  if (C_REP_MONTH) {
    const [y, m] = C_REP_MONTH.split('-').map(Number);
    const from = `${C_REP_MONTH}-01`, to = cTodayIso().startsWith(C_REP_MONTH) ? '' : `${C_REP_MONTH}-${new Date(Date.UTC(y, m, 0)).getUTCDate()}`;
    RPT = { from, to, years: [] };
    return { from, to, month: C_REP_MONTH, word: `${C_MONTHS_LONG[m - 1]} ${y}` };
  }
  const l = cScopeList();
  if (l === 'all') { const from = Math.min(cNowYear(), ...C_SCOPE_YEARS) + '-01-01'; RPT = { from, to: '', years: [] }; return { from, to: '', word: cScopeWord() }; }
  RPT = { from: '', to: '', years: [...l] };
  return { years: [...l], word: cScopeWord() };
}
// The in-page choice: "Whole year" or one month of the chosen years. Reports only; the download follows it.
function cRepMonthHtml() {
  const l = cScopeList(), several = l === 'all' || l.length > 1;
  const byYear = new Map(); cRepMonths().forEach((ym) => { const y = ym.slice(0, 4); if (!byYear.has(y)) byYear.set(y, []); byYear.get(y).push(ym); });
  return `<label class="c-jf rp-month"><select aria-label="Month" onchange="cRepPickMonth(this.value)"><option value=""${C_REP_MONTH ? '' : ' selected'}>${several ? 'Whole years' : 'Whole year'}</option>${
    [...byYear.entries()].map(([y, ms]) => `<optgroup label="${y}">${ms.map((ym) => `<option value="${ym}"${ym === C_REP_MONTH ? ' selected' : ''}>${C_MONTHS_LONG[Number(ym.slice(5)) - 1]} ${y}</option>`).join('')}</optgroup>`).join('')}</select></label>`;
}
function cRepPickMonth(v) { C_REP_MONTH = cRepMonths().includes(v) ? v : ''; viewReportsC(); }
async function viewReportsC() {
  const P = cRepPeriod();
  const qs = new URLSearchParams();
  if (P.years) qs.set('years', P.years.join(','));
  if (P.from) qs.set('from', P.from);
  if (P.to) qs.set('to', P.to);

// apply.novikontas.org, from the SIS's web-stats (the owner's popup A, 01.10.2026: a section on Reports).
// Real counts only. A value the SIS did not send is not drawn; search appears only once it is connected.
let C_WEB_RANGE = '30d';
async function cWebStats(range) {
  if (range) C_WEB_RANGE = range;
  const el = $('#cWeb');
  if (!el) return;
  let d;
  try { d = await api('/api/web-stats?range=' + encodeURIComponent(C_WEB_RANGE)); } catch { d = { ok: false }; }
  if (!document.body.contains(el)) return;
  el.hidden = false;
  const seg = ['7d', '30d', '90d'].map((k) => `<button aria-pressed="${C_WEB_RANGE === k}" onclick="cWebStats('${k}')">${k.replace('d', ' days')}</button>`).join('');
  const head = `<div class="ksh"><h2>Academy Application form</h2><div class="c-seg" role="group" aria-label="Days">${seg}</div></div>`;
  if (!d.ok) { el.innerHTML = head + `<p class="c-empty" style="padding:6px 0">The SIS did not answer${d.status ? ' (' + Number(d.status) + ')' : ''}.</p>`; return; }
  const n = (v) => (typeof v === 'number' ? v.toLocaleString('en-GB') : null);
  const tileW = (label, v, prev, unit) => v == null ? '' : `<div><span>${label}</span><b>${n(v)}</b>${prev == null ? '' : `<small>${n(prev)} the ${unit} before</small>`}</div>`;
  const days = (d.daily || []).filter((x) => typeof x.visits === 'number');
  const maxV = Math.max(1, ...days.map((x) => x.visits));
  const chart = days.length ? `<div class="c-webdays" style="display:flex;align-items:flex-end;gap:2px;height:96px;margin:8px 0 4px">${days.map((x) =>
    `<i title="${esc(x.day)}: ${x.visits} visits${x.pageViews == null ? '' : ', ' + x.pageViews + ' page views'}" style="flex:1;min-width:2px;height:${Math.max(2, (x.visits / maxV) * 100)}%;background:var(--v-web);border-radius:2px 2px 0 0"></i>`).join('')}</div>
    <p class="c-sub">${esc(days[0].day)} to ${esc(days[days.length - 1].day)}</p>` : '';
  const list = (title, rows, valueKey, sub) => {
    const r = (rows || []).filter((x) => typeof x[valueKey] === 'number').slice(0, 6);

  };
  const t = d.totals || {}; const pr = d.previous || {};
  const unit = C_WEB_RANGE.replace('d', ' days');
  const sr = d.search;
  el.innerHTML = head + `<div class="kstrip">${tileW('Visits', t.visits, pr.visits, unit)}${tileW('Page views', t.pageViews, pr.pageViews, unit)}</div>
    ${chart}
    <div class="c-rgrid">${list('Came from', d.referrers, 'visitors', 'visitors')}${list('Campaign links', d.campaigns, 'visitors', 'visitors')}${list('Device', d.devices, 'visitors', 'visitors')}${list('Pages', d.pages, 'visitors', 'visitors')}</div>
    ${sr ? `<div class="kstrip">${tileW('Google clicks', sr.totals && sr.totals.clicks, sr.previous && sr.previous.clicks, unit)}${tileW('Google impressions', sr.totals && sr.totals.impressions, sr.previous && sr.previous.impressions, unit)}</div>
    <div class="c-rgrid">${list('Searched for', sr.queries, 'clicks', 'clicks')}</div>` : ''}`;
}

// Applications: the SIS funnel by REGISTRATION WEEK (popup A, 01.10.2026; src/applications.js).
// The SIS sends each application's CURRENT status and no history, so a week is a cohort: who
// registered then, and where they stand now. No week is drawn that nobody registered in, a value
// the SIS did not send is not drawn, and the six team tests a person set aside are not counted.
// the steps the applicant takes on apply.novikontas.org; the rest are the college's, in the SIS
const C_APP_SITE = ['registered', 'started', 'submitted'];
const C_APP_WORD = { 'off': 'Off', 'no-run': 'No run yet', 'no-real-applicant': 'No real applicant yet', 'test': 'Test', 'live': 'Live' };
async function cApplications() {
  const box = $('#cSis'); const st = $('#cAppState');
  if (!box || !st) return;
  let d;
  try { d = await api('/api/applications'); } catch { d = null; }
  if (!document.body.contains(box)) return;
  box.hidden = false;
  if (!d) { st.innerHTML = `<span class="c-appchip is-off">SIS</span><span>Intake did not answer</span>`; box.innerHTML = ''; return; }
  const L = d.labels || {}; const F = d.funnel || []; const A = d.apart || [];
  const run = d.feed && d.feed.lastRun;
  const live = d.state === 'live';
  st.innerHTML = `<span class="c-appchip${live ? ' is-live' : d.state === 'test' ? '' : ' is-off'}">SIS &middot; ${esc(C_APP_WORD[d.state] || d.state)}</span>
    <span>feed <b>${esc(d.feed.mode)}</b></span>
    <span>${run ? `last run <b>${esc(fmtDateTime(run.at))}</b>` : 'no run recorded'}</span>
    <span><b>${d.feed.references}</b> in the SIS store</span>
    ${d.setAside ? `<span><b>${d.setAside}</b> set aside in the Inbox</span>` : ''}
    <span><b>${d.people}</b> counted</span>`;
  const head = `<div class="ksh"><h2>SIS funnel</h2><span class="kt2">registered that week, current status now</span></div>`;
  if (!d.people) {
    box.innerHTML = head + `<p class="c-empty c-appempty">${d.state === 'off' ? 'The SIS feed is off.' : d.state === 'no-run' ? 'The SIS feed has not run yet.'
      : `No real applicant yet.${d.setAside ? ` The SIS holds ${d.setAside} ${d.setAside === 1 ? 'record' : 'records'} a person set aside.` : ''}`}</p>`;
    return;
  }
  const R = d.reached || {}; const top = Math.max(1, R[F[0]] || 0);
  const linkPeople = d.linked ? ` onclick="cAppPeople()" role="link" tabindex="0" title="Open the people the SIS sent"` : '';
  // Two groups, as apply.novikontas.org itself describes the journey (the owner, 02.10.2026):
  // the applicant's own steps on the site, then the college's decision in the SIS. One scale for
  // all five bars, so a bar in one group compares honestly with a bar in the other.
  const step = (k, i) => `<div class="c-fstep" style="--i:${i}"><span>${esc(L[k] || k)}</span>
      <span class="c-fbar"><i style="width:${(R[k] / top) * 100}%"></i></span><b>${R[k]}</b></div>`;
  const group = (title, keys) => `<div class="c-fgroup"><h3>${title}</h3>${keys.map((k) => step(k, F.indexOf(k))).join('')}</div>`;
  const steps = `<div class="c-fsteps"${linkPeople}>${group('On the website', C_APP_SITE)}${group('Academy decision', F.filter((k) => !C_APP_SITE.includes(k)))}</div>
    <div class="c-fapart">${A.map((k) => `<span><b>${d.now[k]}</b> ${esc((L[k] || k).toLowerCase())}</span>`).join('')}${d.undatedRegistration ? `<span><b>${d.undatedRegistration}</b> no registration date sent</span>` : ''}</div>`;
  const cols = [...F, 'apart'];
  const cell = (row, k, base) => {
    const v = k === 'apart' ? A.reduce((a, x) => a + row.now[x], 0) : row.reached[k];
    const w = base ? (v / base) * 100 : 0;
    return `<td title="${esc(k === 'apart' ? 'Rejected or withdrawn' : L[k] || k)}: ${v} of ${base}"><span class="c-fcell"><i class="${k === 'apart' ? 'np' : ''}" style="width:${w}%"></i></span><b>${v}</b></td>`;
  };
  const thead = `<thead><tr class="c-fghead"><th></th><th colspan="${C_APP_SITE.length}">On the website</th><th colspan="${F.length - C_APP_SITE.length}">Academy decision</th><th></th></tr><tr><th></th>${cols.map((k) => `<th>${esc(k === 'apart' ? 'Rejected / withdrawn' : L[k] || k)}</th>`).join('')}</tr></thead>`;
  const weekRows = (d.weeks || []).map((w) => `<tr><th scope="row">${esc(w.week.slice(5))}<small>from ${esc(w.monday)}</small></th>${cols.map((k) => cell(w, k, w.reached[F[0]])).join('')}</tr>`).join('');
  const progRows = (d.programmes || []).map((p) => `<tr><th scope="row">${p.code ? esc(p.code) : '<span class="c-gap">no programme sent</span>'}</th>${cols.map((k) => cell(p, k, p.reached[F[0]])).join('')}</tr>`).join('');
  box.innerHTML = head + steps
    + `<div class="c-ftable"><table class="ktable c-fgrid"><caption>People, by the week they registered</caption>${thead}<tbody>${weekRows}</tbody></table></div>`
    + (progRows ? `<div class="c-ftable"><table class="ktable c-fgrid"><caption>Applications, by programme</caption>${thead}<tbody>${progRows}</tbody></table></div>` : '');
  cAppScene();
}
function cAppPeople() { C_PF = { ...C_PF_EMPTY(), source: 'sis' }; C_PQ = ''; C_PTAB = 'all'; location.hash = '#/people/all'; }
// The one scene of this chapter: the step bars draw once when the chapter comes into view.
// The marks end at their exact widths; nothing else on the report moves.
function cAppScene() {
  const el = $('#applications');
  if (!el || el.classList.contains('is-in')) return;
  if (!('IntersectionObserver' in window)) { el.classList.add('is-in'); return; }
  const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { el.classList.add('is-in'); io.disconnect(); } }, { threshold: 0.2 });
  io.observe(el);
}

function busy(delta) {
  BUSY = Math.max(0, BUSY + delta);
  if (BUSY && !BUSY_TIMER) {
    // nothing is shown for a request that answers straight away
    BUSY_TIMER = setTimeout(() => {
      if (!BUSY) return;

        const el = document.createElement('div');
        el.id = 'loadbar'; el.className = 'loading';

  if (!BUSY) {
    clearTimeout(BUSY_TIMER); BUSY_TIMER = null;

}

const api = async (path, opts) => {
  // every request says who is asking, so an admin-only screen does not have to
  // remember to add it to the query string and quietly get refused
  const o = { ...(opts || {}) };
  o.headers = { ...(o.headers || {}), 'x-acting-as': ACTOR };
  const scoped = o.scope !== false && !(o.method && o.method !== 'GET');
  delete o.scope;
  if (scoped) path = cScoped(path);   // the year scope (Q45): one filter on every list and count
  busy(1);
  try {
    const r = await fetch(path, o);
    // A signed-in session that has expired, or been invalidated because somebody
    // was disabled, must put the login back rather than show a broken screen.
    if (r.status === 401 && AUTH.on) { drawLogin('Your session has ended. Sign in again.'); throw new Error('signed out'); }
    if (!r.ok) {
      const e = await r.json().catch(() => ({ error: r.statusText }));
      const err = new Error(e.error || 'request failed');
      err.detail = e;          // the duplicate list, the reasons, whatever was refused with
      throw err;
    }

  } finally { busy(-1); }
};

// The animated sea, exactly as the kit wrote it, wrapped in a function so it runs
// when the gate is drawn rather than at load. NOTE: in a hidden browser pane rAF
// never fires, so the canvas simply stays on the gradient underneath - which is
// why the card is legible without it.
const LOGIN_SEA = () => {
  // The Client Hub sea, reused without retuning its wave parameters or colours.
  // It draws on a small canvas and lets CSS upscale it, keeping the login light.
  (() => {
    const cv = document.getElementById('login-sea');
    if (!cv?.getContext) return;
    const ctx = cv.getContext('2d', { alpha: false });
    if (!ctx) return;
  
    const TAU = Math.PI * 2;
    const OCT = [
      { ax: .9, ay: 3.3, amp: .46, spd: .24, sl: .05 },
      { ax: -2.2, ay: 6.9, amp: .40, spd: .46, sl: .28 },
      { ax: 4.1, ay: 12.7, amp: .33, spd: .76, sl: .85 },
      { ax: -7.3, ay: 22.3, amp: .23, spd: 1.14, sl: 1.20 },
      { ax: 12.9, ay: 37.1, amp: .14, spd: 1.63, sl: 1 },
      { ax: 19.7, ay: 8.3, amp: .11, spd: .62, sl: .30 },
    ];
    const AMPSUM = 1.42, REF = 1 / 420;
    let W = 0, H = 0, img, buf, quality = 1, raf = 0, last = 0, acc = 0, time = 0, cost = 0, samples = 0;
    const sA = [], cA = [], sB = [], cB = [];
    let vigX, vigY;
    const motion = matchMedia?.('(prefers-reduced-motion: reduce)');
  
    function allocate() {
      const vw = cv.clientWidth || 1, vh = cv.clientHeight || 1;
      const budget = (vw < 700 ? 105000 : 155000) * quality;
      W = Math.max(150, Math.round(Math.sqrt(budget * vw / vh)));
      H = Math.max(130, Math.round(budget / W));
      cv.width = W; cv.height = H; img = ctx.createImageData(W, H); buf = img.data;
      OCT.forEach((_, k) => { sA[k] = new Float32Array(W); cA[k] = new Float32Array(W); sB[k] = new Float32Array(H); cB[k] = new Float32Array(H); });
      vigX = new Float32Array(W); vigY = new Float32Array(H);
      for (let x = 0; x < W; x++) { const u = x / W - .5; vigX[x] = u * u * 1.35; }
      for (let y = 0; y < H; y++) { const v = y / H - .5; vigY[y] = v * v * .95; }
    }
  
    function render(t) {
      OCT.forEach((o, k) => {
        const ph = o.spd * t, kx = TAU * o.ax, ky = TAU * o.ay;
        for (let x = 0; x < W; x++) { const a = kx * x * REF + ph; sA[k][x] = Math.sin(a); cA[k][x] = Math.cos(a); }
        for (let y = 0; y < H; y++) { const b = ky * y * REF; sB[k][y] = Math.sin(b); cB[k][y] = Math.cos(b); }
      });
      let i = 0;
      for (let y = 0; y < H; y++) {
        const depth = .88 + .18 * y / H;
        for (let x = 0; x < W; x++) {
          const w = OCT.map((_, k) => sA[k][x] * cB[k][y] + cA[k][x] * sB[k][y]);
          const env = .52 + .48 * (w[0] * .5 + .5);
          const h = OCT[0].amp*w[0] + OCT[1].amp*w[1] + env*(OCT[2].amp*w[2] + OCT[3].amp*w[3] + OCT[4].amp*w[4] + OCT[5].amp*w[5]);
          let g = 0;
          OCT.forEach((o, k) => { const slope = cA[k][x]*cB[k][y] - sA[k][x]*sB[k][y]; g += o.amp*o.ay*o.sl*slope*(k < 2 ? 1 : env); });
          let p = h / AMPSUM * .5 + .5, q = p*p*(3-2*p); q = q*q*(3-2*q); p = p*.45 + q*.55;
          let r, green, blue;
          if (p < .52) { const f=p/.52; r=9+21*f; green=34+61*f; blue=68+82*f; }
          else { const f=(p-.52)/.48; r=30+102*f; green=95+108*f; blue=150+88*f; }
          if (p > .88) { let f=(p-.88)/.12; f=f*f*.9; r+=(243-r)*f; green+=(251-green)*f; blue+=(255-blue)*f; }
          let sparkle=g*.05; if (sparkle > 0) { sparkle=Math.min(1,sparkle); sparkle=sparkle*sparkle*sparkle*104; r+=sparkle; green+=sparkle*1.02; blue+=sparkle*.92; }
          const shade=depth*(1-(vigX[x]+vigY[y])*.58);
          buf[i]=Math.max(0,Math.min(255,r*shade)); buf[i+1]=Math.max(0,Math.min(255,green*shade)); buf[i+2]=Math.max(0,Math.min(255,blue*shade)); buf[i+3]=255; i+=4;
        }
      }
      ctx.putImageData(img,0,0);
    }
  
    function loop(now) {
      raf=requestAnimationFrame(loop); if (!last) { last=now; return; }
      let dt=Math.min(200,now-last); last=now; acc+=dt; if (acc < 33) return; acc=0; time+=dt/1000;
      const start=performance.now(); render(time); const spent=performance.now()-start;
      samples++; if (samples > 15) { cost+=spent; if (samples === 55) { if (cost/40 > 11 && quality > .55) { quality=.55; allocate(); } cost=0; samples=0; } }
    }
    function apply() {
      cancelAnimationFrame(raf);
      if (!cv.clientWidth || !cv.clientHeight) return;
      allocate();
      if (motion?.matches || document.hidden) render(6.2); else { last=0; acc=0; raf=requestAnimationFrame(loop); }
    }
    let resizeTimer;
    addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(apply,180)});
    document.addEventListener('visibilitychange',apply);
    motion?.addEventListener?.('change',apply);
    window.loginSeaApply=apply;
    apply();
  })();
  
};

/**
 * What the browser was told on the way back from Google, and it is deliberately
 * almost nothing: ?auth=google means a sign-in happened, ?error=not_authorised
 * means one did not. ONE sentence covers every cause - no account, wrong domain,
 * disabled, a bad token - because telling somebody which one they tripped is
 * telling them how to try again differently.
 *
 * Both are stripped from the address bar immediately, so a reload does not
 * re-show a message about something that already finished.
 */
function readReturnFromGoogle() {
  const q = new URLSearchParams(location.search);
  const error = q.get('error');
  const ok = q.get('auth') === 'google';
  if (error || ok) {
    history.replaceState(history.state, '', location.pathname + location.hash);
  }
  return { refused: error === 'not_authorised', signedIn: ok };
}

// so Alt+Left, the mouse's back button and a phone's back gesture return to exactly that view. A change inside a page
// replaces the address (no extra steps to click through); moving to another page is a step. A page reached through a
// link (not the menu) says where it came from: "<- Home", a click is Back. Not in the address: the year, which is
// the Period dropdown's (its own lane).
let C_STATE_FROM_HASH = false;
let C_VIA_MENU = false;
const cHashIs = (path) => (location.hash || '').split('?')[0] === path;
const cList = (v) => (v ? String(v).split(',').filter(Boolean) : []);
// A Reports figure's people are a list of ids: kept in this tab under a short token, so the address stays short
function cCohortToken(c) {
  if (!c) return '';
  if (!c.tok) { c.tok = 'c' + Date.now().toString(36);
    try { sessionStorage.setItem('crmCoh:' + c.tok, JSON.stringify({ label: c.label, ids: [...c.ids] })); } catch {} }
  return c.tok;
}
function cCohortFrom(tok) {
  if (!tok) return null;
  try { const c = JSON.parse(sessionStorage.getItem('crmCoh:' + tok) || 'null'); return c ? { label: c.label, ids: new Set(c.ids), tok } : null; } catch { return null; }
}
// What the page in front of you shows, as words for the address. Only what differs from a fresh view is written.
function cViewState(place) {
  const q = new URLSearchParams();
  const put = (k, v) => { if (v !== undefined && v !== null && v !== '' && !(Array.isArray(v) && !v.length)) q.set(k, Array.isArray(v) ? v.join(',') : String(v)); };
  if (place === 'people') {
    put('v', C_JP.view);
    put('col', C_JP.col);
    for (const k of ['stage', 'programme', 'due', 'owner', 'source']) put('j' + k[0] + (k === 'source' ? 'r' : ''), C_JF[k]);
    for (const k of ['programme', 'due', 'owner', 'source', 'data', 'arrived', 'stage']) put('p_' + k, C_PF[k]);
    put('q', C_PQ); put('tag', C_OUT_TAG); put('reason', C_OUT_REASON);
    if (C_OUT_FILTER) put('of', [C_OUT_FILTER.kind, C_OUT_FILTER.key, C_OUT_FILTER.label].join('|'));
    put('coh', cCohortToken(C_PCOHORT));
  } else if (place === 'today') {
    put('card', C_TP.col); put('prog', C_TP.programme); put('stage', C_TP.stage); put('src', C_TP.source); if (C_TP.upOpen) put('up', 1);
  } else if (place === 'leads') {
    put('age', C_IP.col); put('src', C_IP.channel); put('kind', C_IP.kind); if (C_IP.show !== 'new') put('show', C_IP.show);
  }

}
// The other way: an address with a '?' names the whole view; anything it does not say is the fresh view's value.
function cApplyViewState(place, q) {
  const g = (k) => q.get(k) || '';

    C_JP.view = g('v') === 'list' ? 'list' : 'board';
    C_JP.col = g('col') || null;
    C_JF = { ...C_JF_EMPTY(), stage: cList(g('js')), programme: cList(g('jp')), due: cList(g('jd')), owner: cList(g('jo')), source: cList(g('jsr')) };
    C_PF = { ...C_PF_EMPTY() };
    for (const k of ['programme', 'due', 'owner', 'source', 'data', 'arrived', 'stage']) C_PF[k] = g('p_' + k);
    C_PQ = g('q'); C_OUT_TAG = g('tag') || null; C_OUT_REASON = g('reason') || null;
    const of = g('of').split('|'); C_OUT_FILTER = of[0] ? { kind: of[0], key: of[1] || '', label: of.slice(2).join('|') } : null;
    C_PCOHORT = cCohortFrom(g('coh'));

    C_STATE_FROM_HASH = true;
  } else if (place === 'today') {
    C_TP = { ...C_TP, col: g('card') || null, programme: g('prog'), stage: g('stage'), source: g('src'), upOpen: g('up') === '1', pick: null };
  } else if (place === 'leads') {

// The page part of the address for the view on screen (the old names land on their page: #/people is the Journey).
function cViewPath(place, path) {
  return ({ people: '#/journey', today: '#/due', leads: '#/leads', home: '#/home' })[place]
    || (place === 'reports' ? '#/reports' + (C_REP_CH ? '/' + C_REP_CH : '') : path);
}
const cPageLabel = () => { const h = document.querySelector('#view h1'); return h ? h.textContent.trim().slice(0, 40) : ''; };
function cRouteState(path, qs) {
  const page = path.split('/')[1] || '';
  const place = cPlace(page);
  if (qs !== undefined) cApplyViewState(place, new URLSearchParams(qs));
  // a new step (not Back or Forward, which carry their own record): remember where it came from, unless the menu
  // or a G shortcut took it there - a menu is not a link inside a page
  if (!history.state) {
    const from = C_VIA_MENU ? '' : (C_LAST_PATH && C_LAST_PATH !== path ? C_LAST_LABEL : '');
    history.replaceState({ from }, '', location.href);
  }

}
let C_LAST_PATH = '', C_LAST_LABEL = '';
// After every draw: the address says the view (replaced, never a new step) and the "<- origin" link is on top.
function cSyncView() {
  const full = location.hash || '';
  const [path] = full.split('?');
  const page = path.split('/')[1] || '';
  const place = cPlace(page);
  if (!place || page === 'person') { C_LAST_PATH = path; C_LAST_LABEL = cPageLabel(); cBackLink(); return; }
  const qs = cViewState(place).toString();
  const want = cViewPath(place, path) + (['people', 'today', 'leads'].includes(place) && qs ? '?' + qs : '');   // no bare '?' on a fresh view
  if (want !== full) history.replaceState(history.state, '', location.pathname + location.search + want);
  C_LAST_PATH = want.split('?')[0]; C_LAST_LABEL = cPageLabel();

}
function cBackLink() {
  const view = document.querySelector('#view');
  const from = history.state && history.state.from;
  if (!view || !from || view.querySelector('.c-back')) return;
  view.insertAdjacentHTML('afterbegin', `<p class="c-back"><a href="#" onclick="history.back();return false" title="Back one step (Alt+Left)">← ${esc(from)}</a></p>`);
}
function installCViewState() {
  const view = document.querySelector('#view');
  if (!view || view.dataset.state) return;
  view.dataset.state = '1';
  let queued = false;
  new MutationObserver(() => { if (queued) return; queued = true; queueMicrotask(() => { queued = false; cSyncView(); }); })
    .observe(view, { childList: true });
  // the menu and the tab bar: a way in, not a link inside a page; the current page again is not a new step
  document.addEventListener('click', (e) => {
    const a = e.target && e.target.closest ? e.target.closest('a[href^="#/"]') : null;
    if (!a) return;
    if (a.closest('.cnav, .ctabs, .cmore, .shell > nav')) C_VIA_MENU = true;
    const href = a.getAttribute('href');
    if (!href.includes('?') && cHashIs(href) && !e.defaultPrevented) { e.preventDefault(); C_VIA_MENU = false; }
  }, true);
  document.addEventListener('keydown', cShortcut);
}

// ---------------------------------------------------------------- SHORTCUTS (Q61)
// Ignored while typing in a field. G then a letter goes to a place; "/" puts the cursor in the page's search; Esc
// closes the open dialog or editor; "?" lists them. Alt+Left is the browser's own Back, which now lands exactly.
const C_KEYS = [['Alt + ←', 'Back one step, to the view you came from'], ['G then H', 'Home'], ['G then I', 'Inbox'],
  ['G then D', 'Due'], ['G then J', 'Journey'], ['G then R', 'Reports'], ['/', 'Search on this page'],
  ['Esc', 'Close the open dialog or editor'], ['?', 'This list']];
const C_GO = { h: '#/home', i: '#/leads', d: '#/due', j: '#/journey', r: '#/reports' };
let C_G_AT = 0;
const cTyping = (el) => Boolean(el && el.closest && el.closest('input, textarea, select, [contenteditable=""], [contenteditable="true"]'));
function cShortcut(e) {
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || cTyping(e.target)) return;
  const k = e.key;
  if (document.querySelector('dialog[open]')) return;   // a dialog takes the keys (Esc closes it, natively)
  if (k === 'Escape') { if (cEscClose()) e.preventDefault(); return; }
  if (k === '?') { e.preventDefault(); return cKeysOpen(); }
  if (k === '/') {
    const box = document.querySelector('#cPQ, #view input.c-search, #helpFaq input, #view input[type="search"]');
    if (box) { e.preventDefault(); box.focus(); box.select && box.select(); }
    return;
  }
  const low = k.toLowerCase();
  if (low === 'g') { C_G_AT = Date.now(); return; }
  if (C_G_AT && Date.now() - C_G_AT < 1500 && C_GO[low]) {
    e.preventDefault(); C_G_AT = 0;
    if (cHashIs(C_GO[low])) return;
    C_VIA_MENU = true; location.hash = C_GO[low];
    return;
  }
  C_G_AT = 0;
}
// Esc: whatever is open on the page, one thing at a time. The board's own card and filter menus keep their own Esc.
function cEscClose() {

}
function cKeysRows() {

      <button type="button" class="btn sm ghost" onclick="this.closest('dialog').close()">Close</button></div><div class="c-sheet c-set">${cKeysRows()}</div></dialog>`);

async function route() {
  const full = location.hash || START();
  const [hash, qs] = full.split('?');
  if (UI === 'c') cRouteState(hash, qs);   // Q61: the view comes back exactly as it was left
  drawIcons();
  const here = hash.split('/').slice(0, 2).join('/');
  // Only the two renames. The technical screens are not in the navigation at all,
  // so nothing needs to light up for them.
  const ALIAS = { '#/car': '#/inbox', '#/pipeline': '#/admissions' };
  const lit = ALIAS[here] || here;
  document.querySelectorAll('nav a.item').forEach(a => a.classList.toggle('on', a.getAttribute('href') === lit));
  const [, page, arg] = hash.split('/');
  fbClose();                       // the help panel never survives a move to another screen
  try {
    // Concept C is the main UI: its router draws every screen, borrowing the classic
    // ones where C has not replaced them yet. ?ui=classic skips this entirely.
    if (UI === 'c') { markCNav(page); await routeC(page, arg); cOpenView(); refreshBadge(); drawFeedbackBadge(); return; }
    // The names people use. The old ones still resolve so a link in a note,
    // a feedback report or somebody's bookmark does not break.
    // The Console is a separate page at /console and is deliberately unreachable
    // from here. The CRM is the product; it carries no way into our tooling.
    if (page === 'admissions' || page === 'pipeline') await viewAdmissions();
    else if (page === 'feedback') await viewFeedback();
    else if (page === 'people') await viewPeople();
    else if (page === 'inbox' || page === 'car') await viewInbox();
    else if (page === 'funnel' || page === 'metrics') await viewReports();
    else if (page === 'history') await viewHistory();
    else if (page === 'person') await viewPerson(arg);
    else if (page === 'followup') await viewFollowup();
    // Channel research, the event inspector, the raw intake screens and the privacy
    // notes are OUR tooling. They are not routed here at all: the product has no
    // path to them, by design. They live with the Console.
    else if (page === 'metrics') await viewReports();
    else if (page === 'channels') await viewChannels(arg);
    else if (page === 'privacy') await viewPrivacy();
    else if (page === 'reports') await viewReports();
    else await viewToday();
  } catch (e) {
    // 'not found' usually means the page in front of somebody is older than the
    // database behind it. Saying so is more use than the word 'failed'.
    $('#view').innerHTML = e.message === 'not found'
      ? `<h1>Not here any more</h1>
         <div class="prov">This record is not in the database any more. This page may have been
         open since before the data changed. Going back to Due will reload it.</div>
         <button class="btn" onclick="location.hash='#/due'">Back to Due</button>`
      : `<div class="err">Failed to load: ${esc(e.message)}</div>`;
  }
  refreshBadge();
  drawFeedbackBadge();
}

// Empty, real or synthetic, switched as often as a demo needs.
// Next action is never a free text box and never optional: it comes from the
// list, and every option drives towards a visit, an application or payment.

// What to put at the top of the list. It is a SUGGESTION: the whole grouped list
// stays underneath and anything can be picked. The rules live in config, because
// the right first move is Admissions business and not a decision for this file.
function suggestNextAction(item, interest) {
  const rules = CFG.suggestedNextAction || {};
  const idOf = (id) => {
    for (const g of (CFG.nextActions || [])) for (const i of g.items) if (i.id === id) return i.label;
    return null;
  };
  const question = (item.fields || []).find(f => f.field === 'question');
  const byQ = question && (rules.byQuestion || {})[String(question.value)];
  if (byQ) return { label: idOf(byQ), why: `they asked about ${question.value}` };
  const byC = (rules.byChannel || {})[item.channel];
  if (byC) return { label: idOf(byC), why: `it came in by ${channelLabel(item.channel)}` };
  if (interest) return { label: idOf(rules.whenProgrammeKnown), why: 'we know what they want to study' };
  return { label: idOf(rules.whenNothingKnown), why: 'nobody can tell what they want yet' };
}

// The suggestion sits at the top, already chosen, above the full list.
function nextActionOptionsWithSuggestion(suggested) {
  const rest = nextActionOptions(null);
  if (!suggested || !suggested.label) return rest;
  return `<optgroup label="Suggested">
      <option value="${esc(suggested.label)}" selected>${esc(suggested.label)}</option>
    </optgroup>` + rest;
}

// THE STEPS FOLLOW THE STAGE (the owner, 02.10.2026: "an algorithm that depends on at what stage the
// lead is ... shorter list ... the impossible are not shown"). config.stepGroupsByStage names the
// groups that fit each open stage; anyStage steps fit all; no stage known = everything, as before.
function stepsForStage(stage) {
  const fit = stage && (CFG.stepGroupsByStage || {})[stage];
  return (CFG.nextActions || []).map((g) => ({ group: g.group,
    items: g.items.filter((i) => !fit || fit.includes(g.group) || i.anyStage) })).filter((g) => g.items.length);
}
function nextActionOptions(selectedLabel, stage) {
  const groups = stepsForStage(stage);
  // the step already planned is never hidden, whatever the stage says
  const shown = new Set(groups.flatMap((g) => g.items.map((i) => i.label)));
  const keep = selectedLabel && !shown.has(selectedLabel)
    ? (CFG.nextActions || []).flatMap((g) => g.items).filter((i) => i.label === selectedLabel) : [];
  if (keep.length) groups.unshift({ group: 'Planned now', items: keep });
  const opts = groups.map(g => `<optgroup label="${esc(g.group)}">` +
    g.items.map(i => `<option value="${esc(i.label)}" data-days="${i.days}" data-drives="${esc(i.drives)}"
      ${i.label === selectedLabel ? 'selected' : ''}>${esc(i.label)}</option>`).join('') + '</optgroup>').join('');
  return opts;
}
function daysForAction(label) {
  for (const g of (CFG.nextActions || [])) for (const i of g.items) if (i.label === label) return i.days;
  return 2;
}
function drivesFor(label) {
  for (const g of (CFG.nextActions || [])) for (const i of g.items) if (i.label === label) return i.drives;
  return null;
}
const DRIVES_LABEL = { visit: 'drives towards a visit', application: 'drives towards the application and documents', payment: 'drives towards payment', info: 'information' };
function onNextActionChange(selId, dateId, hintId) {
  const sel = document.querySelector('#' + selId);
  const label = sel.value;
  const d = new Date(Date.now() + daysForAction(label) * 86400000);
  const date = document.querySelector('#' + dateId);
  if (date) date.value = fmtDate(d);                 // the Riga day, like todayStr()
  const hint = document.querySelector('#' + hintId);
  if (hint) hint.textContent = DRIVES_LABEL[drivesFor(label)] || '';
}

// Today is a work queue, not a dashboard. You pick which queue you are working,
// then you go through it ONE PERSON AT A TIME. Next, previous, swipe, act.
// Nothing else is on the screen, because everything else is somewhere else.
let TODAY_ORDER = null;
let TODAY_AT = 0;      // which queue
let TODAY_ITEM = 0;    // which person inside it

function todayOrder(serverOrder) {
  if (TODAY_ORDER) return TODAY_ORDER;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('crmTodayOrder') || 'null'); } catch {}
  const ok = Array.isArray(saved) && saved.length === serverOrder.length
    && serverOrder.every(id => saved.includes(id));
  TODAY_ORDER = ok ? saved : serverOrder.slice();
  return TODAY_ORDER;
}

function todayPickQueue(i) {
  TODAY_AT = i; TODAY_ITEM = 0;
  try { localStorage.setItem('crmTodayQueue', String(i)); } catch {}
  viewToday();
}
function todayStep(delta, count) {
  if (!count) return;
  TODAY_ITEM = (TODAY_ITEM + delta + count) % count;
  viewToday();
}

// What this one person needs, said in one line, with one button that does it.
function todayCard(g, item) {
  // One queue, two reasons for being in it. The row says which, because a step we
  // planned is marked done and a message they sent is answered.
  if (g.id === 'waiting') {
    const wrote = item.why === 'reply' || item.why === 'both';
    const planned = item.why === 'step' || item.why === 'both';
    const tag = (text, title) => `<span class="why" title="${esc(title)}">${esc(text)}</span>`;
    return {
      name: item.name,
      line: (planned ? esc(item.label) : esc(String(item.subject || 'They wrote to us')))
        + ' ' + (item.why === 'both'
          ? tag('they also wrote', 'A step is due AND they have written since. Both are waiting on us.')
          : wrote ? tag('they wrote', 'They sent this and nothing has gone back yet.')
          : tag('we planned this', 'A next step somebody planned, now due.')),
      meta: planned ? dueText(item.due_at)
        : `${channelLabel(item.channel || item.source_channel)} &middot; ${fmtDateTime(item.occurred_at)}`,
      open: `#/person/${item.person_id}`,
      action: planned
        ? `<button class="btn" onclick="event.stopPropagation();openComplete(${item.taskId},'${esc(item.label)}')">Mark done</button>`
        : `<button class="btn" onclick="event.stopPropagation();openNote('${item.person_id}','note')">Write what happened</button>`,
    };
  }
  if (g.id === 'new_leads') {
    return {
      name: item.name,
      line: item.programme ? `Wants ${esc(item.programme)}` : 'Has not said what they want yet',
      meta: `${channelLabel(item.source_channel)} &middot; arrived ${fmtDate(item.created_at)}`,
      open: `#/person/${item.id}`,
      action: `<button class="btn" onclick="event.stopPropagation();openNote('${item.id}','call')">Log a call</button>`,
    };
  }
  return {
    name: item.name,
    line: 'Nobody has planned the next step',
    meta: `${esc(item.status || '')} &middot; ${channelLabel(item.source_channel)}`,
    open: `#/person/${item.id}`,
    action: `<button class="btn" onclick="event.stopPropagation();openNewTask('${item.id}')">Plan the next step</button>`,
  };
}

async function viewToday() {
  const t = await api('/api/today' + (TODAY_SCOPE === 'all' ? '?scope=all' : ''));
  await refreshBadge();          // so the heading and the sidebar cannot disagree
  const order = todayOrder(t.order);
  const byId = Object.fromEntries(t.groups.map(g => [g.id, g]));
  const groups = order.map(id => byId[id]).filter(Boolean);

  if (TODAY_AT === 0) {
    try { const saved = Number(localStorage.getItem('crmTodayQueue')); if (saved >= 0 && saved < groups.length) TODAY_AT = saved; } catch {}
  }
  if (TODAY_AT >= groups.length) TODAY_AT = 0;
  const g = groups[TODAY_AT];
  const items = g.rows;
  if (TODAY_ITEM >= items.length) TODAY_ITEM = 0;

  const picker = groups.map((x, i) => `<button class="dot ${i === TODAY_AT ? 'on' : ''}"
    onclick="todayPickQueue(${i})"><span>${esc(x.label)}</span>${
      (t.marks || {})[x.id] ? `<span class="tabmark">${esc(t.marks[x.id])}</span>` : ''
    }${x.open ? `<b>${x.open}</b>` : ''}</button>`).join('');

  const empty = `<div class="card deck"><div class="done">
      <div class="tick-big">&#10003;</div>
      ${g.done ? `All ${g.total} done today.` : 'Nothing waiting here.'}
      <div class="sub" style="margin-top:6px">${esc(t.descriptions[g.id] || '')}</div>
    </div></div>`;

  let body;
  if (!items.length) {
    body = empty;
  } else if (TODAY_VIEW === 'table') {
    body = `<div class="card"><table class="cartable"><thead><tr>
        <th>Who</th><th>What they need</th><th>When</th><th></th></tr></thead>
      <tbody>${items.map((item) => {
        const c = todayCard(g, item);
        return `<tr class="row" tabindex="0" onclick="location.hash='${c.open}'">
          <td><b>${esc(c.name)}</b></td>
          <td>${c.line}</td>
          <td>${c.meta}</td>
          <td class="act">${c.action}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  } else {
    const item = items[TODAY_ITEM];
    const c = todayCard(g, item);
    body = `<div class="card deck" id="deck">
      <div class="deckhead">
        <button class="nav" onclick="todayStep(-1,${items.length})" title="previous" ${items.length < 2 ? 'disabled' : ''}>&#8249;</button>
        <div class="counter">${TODAY_ITEM + 1} of ${items.length}</div>
        <button class="nav" onclick="todayStep(1,${items.length})" title="next" ${items.length < 2 ? 'disabled' : ''}>&#8250;</button>
      </div>
      <div class="one" onclick="location.hash='${c.open}'">
        <h2>${esc(c.name)}</h2>
        <p class="oneline">${c.line}</p>
        <p class="onemeta">${c.meta}</p>
      </div>
      <div class="oneact">
        ${c.action}
        <a class="tilelink" href="${c.open}">Open the record &rarr;</a>
      </div>
    </div>`;
  }

  $('#view').innerHTML = `
  <div class="todayhead">
    <div><h1 style="margin:0">Today${OVERDUE ? ` &middot; ${OVERDUE} overdue` : ''}</h1></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      ${t.role ? `<div class="viewswitch" title="Whose work to show. The sidebar count follows the same choice.">
        <button class="${TODAY_SCOPE === 'mine' ? 'on' : ''}" onclick="setTodayScope('mine')">${esc(t.role)}</button>
        <button class="${TODAY_SCOPE === 'all' ? 'on' : ''}" onclick="setTodayScope('all')">Everyone</button>
      </div>` : ''}
      <button class="btn sm ghost" onclick="setTodayView('${TODAY_VIEW === 'table' ? 'card' : 'table'}')"
        title="Switch how this list is laid out">${TODAY_VIEW === 'table' ? 'One at a time' : 'Table'}</button>
    </div>
  </div>
  <div class="swipe">${picker}</div>
  ${body}`;

  const deck = document.querySelector('#deck');
  if (deck && items.length > 1) {
    let x0 = null;
    deck.addEventListener('touchstart', (e) => { x0 = e.changedTouches[0].clientX; }, { passive: true });
    deck.addEventListener('touchend', (e) => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 50) todayStep(dx < 0 ? 1 : -1, items.length);
      x0 = null;
    }, { passive: true });
  }
}

function funnelHtml(byStage) {
  const map = Object.fromEntries(byStage.map(r => [r.status, r.n]));
  const max = Math.max(1, ...byStage.map(r => r.n));
  return (CFG.stages || []).map(st => {
    const n = map[st.id] || 0;
    return `<div style="display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin-bottom:6px">
      <div style="font-size:13px">${esc(st.label)}</div>
      <div class="bar"><i style="width:${Math.round(n / max * 100)}%;background:${st.colour}"></i></div>
      <div style="font-size:13px;text-align:right">${n}</div></div>`;
  }).join('');
}

// Saved exactly as the person page saves it, so the same field policy applies and
// the same history entries are written. Only the screen is different.
async function quickSave(id) {
  const patch = {};
  for (const [key] of EDIT_FIELDS) {
    const el = document.querySelector('#q_' + key);
    if (el) patch[key] = el.value;
  }
  const note = (document.querySelector('#q_note') || {}).value || '';
  try {
    await post(`/api/people/${id}/edit`, patch);
    if (note.trim()) await post(`/api/people/${id}/note`, { kind: 'note', body: note.trim() });
    QUICK_EDIT = null;
    viewPeople();
  } catch (err) {
    const box = document.querySelector('#qeErr');
    if (box) box.innerHTML = `<div class="err" style="margin-top:10px">${esc(err.message)}</div>`;
  }
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

// A NOTE ON EVERY STAGE MOVE (Q15, the owner 05.10.2026): "Going back and in overall moving stages
// should be documented, so notes box its for this." A move back is not saved without a note; a move
// forward asks and can be skipped; a note or logged call in the last few minutes counts (the server
// says so through /move-check, and refuses a back move without one: config.stageMoveNote.enforce).
// The form is the small dialog (the owner picked B of an A/B on 05.10.2026; the inline line A is gone).
// The same on the Journey drag, the People quick edit, the person page and the old board.
// src/stagemove.js holds the server's copy of cMoveDir(); test/stage_move_note.test.js keeps them the same.
function cMoveDir(from, to) {
  const closed = (CFG.stageRoles || {}).closed || 'Not proceeding';
  if (!to || from === to) return 'none';
  if (to === closed) return 'close';
  if (from === closed) return 'back';
  const order = (CFG.stages || []).map((s) => s.id).filter((s) => s !== closed);
  const a = order.indexOf(from); const b = order.indexOf(to);
  if (a < 0 || b < 0) return 'forward';
  return b < a ? 'back' : 'forward';
}
const cMoveQ = (dir, to) => (dir === 'back' ? `Why back to ${to}?` : `Why on to ${to}?`);
const cMoveReasons = (dir) => (((CFG.stageMoveNote || {}).reasons || {})[dir] || []);
const cMoveText = (reason, typed) => [reason, String(typed || '').trim()].filter(Boolean).join(' - ');
// What to post for a move. A null ask means a back move was cancelled: post nothing.
const cMoveBody = (to, ask) => ({ status: to, ...(ask && ask.note ? { note: ask.note } : {}) });

// Resolves to { note } to save with ('' = skipped or already covered), or null when a back move was cancelled.
async function cAskMoveNote(id, from, to) {
  const dir = cMoveDir(from, to);
  if (dir !== 'back' && dir !== 'forward') return { note: '' };
  let chk = null;
  try { chk = await api(`/api/people/${encodeURIComponent(id)}/move-check?to=${encodeURIComponent(to)}`); } catch {}
  if (chk && chk.covered) return { note: '' };
  const note = await cMoveDialog(dir, to);
  return note === null ? null : { note };
}

// B: the small dialog, built like modal() so it looks like the Not proceeding one.
function cMoveDialog(dir, to) {
  return new Promise((resolve) => {
    const root = $('#modal');
    const out = dir === 'back' ? 'Cancel' : 'Skip';
    root.innerHTML = `<div class="modal"><div class="box" role="dialog" aria-modal="true" aria-label="${esc(cMoveQ(dir, to))}">
      <h3 style="margin:0">${esc(cMoveQ(dir, to))}</h3>
      <div class="c-mvbox"><span class="c-mvchips">${cMoveReasons(dir).map((r) => `<button type="button" data-r="${esc(r)}">${esc(r)}</button>`).join('')}</span>
      <textarea rows="2" aria-label="Note" placeholder="Note"></textarea>
      <div class="c-mvacts"><button class="btn" data-ok="1">Save</button><button class="btn ghost" data-x="1">${out}</button></div></div></div></div>`;
    const box = root.querySelector('.modal'); const ta = root.querySelector('textarea');
    let done = false;
    const key = (e) => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); skip(); } };
    const finish = (v) => { if (done) return; done = true; document.removeEventListener('keydown', key, true); root.innerHTML = ''; resolve(v); };
    const skip = () => finish(dir === 'back' ? null : '');
    document.addEventListener('keydown', key, true);
    box.addEventListener('click', (e) => { if (e.target === box) skip(); });
    root.querySelectorAll('[data-x]').forEach((b) => b.addEventListener('click', skip));
    root.querySelectorAll('button[data-r]').forEach((b) => b.addEventListener('click', () => finish(cMoveText(b.dataset.r, ta.value))));
    root.querySelector('[data-ok]').addEventListener('click', () => {
      if (ta.value.trim()) finish(ta.value.trim());
      else if (dir === 'back') ta.setAttribute('aria-invalid', 'true');
      else finish('');
    });
    ta.addEventListener('input', () => ta.removeAttribute('aria-invalid'));
    ta.focus();
  });
}

    return `<div class="done-strip ok">
      <b>${esc(L.name)}</b> is now in Admissions${L.status ? ' &middot; ' + esc(L.status) : ''}${
        L.programme ? ' &middot; ' + esc(L.programme) : ''}.

  $('#view').innerHTML = `

      <th>Arrived</th></tr></thead>

  </div>`;
}

async function doQualify(id, opts = {}) {
  const confirmFields = [...document.querySelectorAll('.qConfirm:checked')].map(c => c.value);
  const interest = (document.querySelector('#qInterest') || {}).value || '';
  const nextAction = (document.querySelector('#qNext') || {}).value || '';
  const qualification = interest ? 'lead' : 'unclear';
  const note = (document.querySelector('#qNote') || {}).value || '';
  const body = { qualification, createPerson: true, note, confirmFields, nextAction,
    stated: interest ? { interest } : {}, ...opts };
  try {
    const r = await post(`/api/intake/${id}/qualify`, body);
    closeModal();
    if (r.handoverGap) alert(`${r.handoverGap.problem}\n\n${r.handoverGap.action}`);
    LAST_RESULT = r.landed || null;      // the Inbox shows where they went
    viewInbox();
  } catch (e) {
    // a refused save keeps everything typed, and a duplicate answers with names
    if (e.detail && e.detail.duplicate) return showDuplicate(id, e.detail, { interest, nextAction, note, confirmFields });
    $('#qErr').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function doExport(fmt = 'csv') {
  const picked = [...document.querySelectorAll('.xsec:checked')].map(c => c.value);
  if (!picked.length) { const e = $('#xErr'); if (e) e.innerHTML = '<div class="err">Tick at least one section.</div>'; return; }
  RPT_PICK = new Set(picked);
  const qs = new URLSearchParams();
  if (RPT.years && RPT.years.length) qs.set('years', RPT.years.join(','));   // the chosen years (Q59), else a run of days
  if (RPT.from) qs.set('from', RPT.from);
  if (RPT.to) qs.set('to', RPT.to);
  qs.set('sections', picked.join(','));
  closeModal();
  const ext = { xlsx: 'xlsx', gsheet: 'gsheet' }[fmt] || 'csv';
  if (ext === 'gsheet') { window.open('/api/report.gsheet?' + qs, '_blank', 'noopener'); return; }
  window.location.href = `/api/report.${ext}?` + qs;
}

// Periods are Riga calendar days, and the server reads them as Riga days too.
function monthStartISO(d = new Date()) { return fmtDate(d).slice(0, 7) + '-01'; }
function setPeriod(from, to) { RPT = { from, to }; viewReports(); }
async function setPeriodPreset(which) {
  const now = new Date();
  const [y, m] = todayStr().split('-').map(Number);
  if (which === 'month') return setPeriod(monthStartISO(now), '');
  if (which === 'last') {
    // calendar arithmetic on the Riga year and month; Date.UTC only does the rollover
    const s = new Date(Date.UTC(y, m - 2, 1)).toISOString().slice(0, 10);
    const e = new Date(Date.UTC(y, m - 1, 0)).toISOString().slice(0, 10);
    return setPeriod(s, e);
  }
  if (which === 'year') return setPeriod(y + '-01-01', '');
  // Everything: from the earliest date the data holds. It used to send no dates, and the
  // server reads no dates as THIS MONTH, so "Everything" showed one month (28.09.2026).
  const rows = ((await api('/api/people')) || {}).rows || [];
  const days = rows.flatMap((p) => [p.created_at, p.admitted_at]).filter(Boolean).map((d) => fmtDate(d)).filter(Boolean).sort();
  return setPeriod(days[0] || todayStr(), '');
}

async function runSim(channelId, scenario) {
  try {
    const r = await post('/api/sim/' + channelId + '/run', { scenario });
    LASTRUN[channelId] = r;
    SIM = null; SIMSEL = channelId;
    await viewIntegrations(channelId);
  } catch (e) { alert('Failed: ' + e.message); }
}

async function runOut(channelId) {
  const last = LASTRUN[channelId];
  if (!last || !last.personId) return alert('Run an inbound test first, so there is something to reply to.');
  try {
    const r = await post('/api/sim/' + channelId + '/outbound', { personId: last.personId });
    LASTRUN[channelId] = Object.assign({}, r, { personId: last.personId });
    SIM = null;
    await viewIntegrations(channelId);
  } catch (e) { alert('Failed: ' + e.message); }
}
