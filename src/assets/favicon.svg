  <!-- The Academy symbol (brandbook shapes, unchanged) filling 84% of a tile.
       LIGHT: black letters on a white tile, the A's leg Novikontas blue. Ritvars' pick, 28.09.2026.
       DARK:  the letters turn white and the tile goes with them, so the mark reads on a dark tab
              strip instead of showing as a white square. The blue leg stays blue in both
              (Ritvars, 30.09.2026: "turn the text into white and let the logo stay colourful").
       The brandbook shapes are untouched; only the two fills change. -->
  <style>
    .tile { fill: #ffffff; stroke: #c9d2de }
    .mark { fill: #011111 }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #08182e; stroke: #1d4266 }
      .mark { fill: #ffffff }
    }
  </style>
