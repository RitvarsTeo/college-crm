<!--
  NOT AN AUTHORISED BRAND FILE.

  This is NoAca_logo_darkhor.svg with its fill changed from the official navy
  #022367 to Pitch Black #011111. The geometry is untouched; only the colour
  differs. The Novikontas brandbook lists recolouring among its nine don'ts, and
  no official black variant exists.

  It is here because Ritvars decided on 24.09.2026 to use black on the light
  theme, overriding that rule for this prototype. Recorded in docs/BACKLOG.md.
  If an official black file ever appears, replace this and delete it.
-->
